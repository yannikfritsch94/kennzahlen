/* ============================================================
   9. KANAL Interaktiver Liniennetzplan
   Quelle: AWStats-Monatsberichte (PDF) im fileadmin.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/ilnp/
   Dateiname:    statistik_fuer_netzplan-dortmund.de_01.26.pdf
   Im Code stehen bewusst keine Monatswerte.
   ============================================================ */
let DATA_NETZ = {};

const NETZ_QUELLE = {
  ordner:      "/fileadmin/user_upload/17_kennzahlen/ilnp/",
  basis:       "statistik_fuer_netzplan-dortmund.de_",
  maxBerichte: 30,
  probeMonate: 24
};
function netzDatei(mm, jahr){
  return NETZ_QUELLE.ordner + encodeURIComponent(
    NETZ_QUELLE.basis + mm + "." + String(jahr).slice(2) + ".pdf");
}
/* „…_01.26.pdf" → „2026-01" */
function netzMonatAusName(url){
  const m = /_(\d{2})\.(\d{2})\.pdf$/i.exec(decodeURIComponent(String(url || "")));
  return m ? "20" + m[2] + "-" + m[1] : null;
}

/* AWStats mischt zwei Zahlenformate: Anzahlen mit Tausendpunkt
   („109.622") und Verhältnisse mit Dezimalpunkt („15.91"). Genau drei
   Ziffern hinter dem letzten Punkt heißen Tausender. */
function awZahl(s){
  const t = String(s === undefined || s === null ? "" : s).trim();
  if(!t) return null;
  if(/^\d{1,3}(\.\d{3})+$/.test(t)) return parseInt(t.replace(/\./g,""), 10);
  const n = parseFloat(t.replace(",", "."));
  return isFinite(n) ? n : null;
}
const BYTE_FAKTOR = {bytes:1/1048576, kb:1/1024, mb:1, gb:1024, tb:1048576};
function awMB(wert, einheit){
  const n = awZahl(wert);
  if(n === null) return null;
  return n * (BYTE_FAKTOR[String(einheit || "mb").toLowerCase()] || 1);
}

/* Abschnitte des Berichts. Die Überschrift wird nicht verworfen: In
   manchen PDFs klebt die erste Datenzeile daran. */
const AW_ABSCHNITTE = [
  ["historie",   "Monatliche Historie"],
  ["tage",       "Tage im Monat"],
  ["wochentage", "Wochentage"],
  ["stunden",    "Stunden (Serverzeit)"],
  ["domains",    "Domains/Länder"],
  ["rechner",    "Rechner (Top"],
  ["robots",     "Robots/Spiders"],
  ["dauer",      "Aufenthaltsdauer"],
  ["dateitypen", "Datei-Typen"],
  ["downloads",  "Downloads (Top"],
  ["os",         "Betriebssysteme (Top"],
  ["browser",    "Browser (Top"],
  ["herkunft",   "Woher die Besucher kamen"],
  ["suche",      "Suchausdrücke"],
  ["begriffe",   "Suchbegriffe (Top"],
  ["sonstiges",  "Verschiedenes"]
];
function awAbschnitte(zeilen){
  const out = {};
  let aktuell = null;
  zeilen.forEach(function(roh){
    const z = String(roh || "").trim();
    if(!z) return;
    for(let i = 0; i < AW_ABSCHNITTE.length; i++){
      if(z.indexOf(AW_ABSCHNITTE[i][1]) === 0){
        aktuell = AW_ABSCHNITTE[i][0];
        if(!out[aktuell]) out[aktuell] = [];
        out[aktuell].push(z.slice(AW_ABSCHNITTE[i][1].length));
        return;
      }
    }
    if(aktuell) out[aktuell].push(z);
  });
  const text = {};
  Object.keys(out).forEach(function(k){ text[k] = out[k].join(" ").replace(/\s+/g," "); });
  return text;
}

/* Fehlt ein Abschnitt, weil die Überschrift im Textlayer anders
   aussieht als erwartet, wird ersatzweise der ganze Bericht durchsucht.
   Die Muster sind eng genug, dass das in der Regel trägt. */
function awQuelle(ab, name, alles){ return ab[name] || alles; }

/* Alle Treffer eines globalen Ausdrucks einsammeln */
function awTreffer(text, re){
  const out = [];
  let m;
  re.lastIndex = 0;
  while((m = re.exec(text || ""))) out.push(m);
  return out;
}

/* Betriebssysteme und Browser stehen in AWStats als feste Namensliste.
   Kommt ein neuer dazu, wird er hier ergänzt — sonst würde die
   Kopfzeile der Tabelle als Name gelesen. Längere Namen zuerst, damit
   „Windows Phone" nicht als „Windows" durchgeht. */
const NETZ_OS = ["Unknown Unix system","Windows Phone","Chrome OS","Macintosh","Windows",
                 "Android","Symbian","Linux","iOS","BSD","Unbekannt"];
const NETZ_BROWSER = ["IPhone (PDA/Phone browser)","Internet Explorer","Samsung Internet",
                      "Google Chrome","Microsoft Edge","Netscape","Firefox","Safari","Mozilla",
                      "Opera","Edge","Unbekannt"];
function reEscape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function awListe(text, namen, mitGrabber){
  const muster = new RegExp("(" + namen.map(reEscape).join("|") + ")" +
    (mitGrabber ? "(?:\\s+(?:Nein|Ja|\\?))?" : "") +
    "\\s+([\\d.]+)\\s+([\\d.,]+)\\s*%", "g");
  const out = [], gesehen = {};
  awTreffer(text, muster).forEach(function(m){
    if(gesehen[m[1]]) return;
    gesehen[m[1]] = 1;
    const wert = awZahl(m[2]);
    if(wert === null || wert <= 0) return;
    out.push([m[1], wert]);
  });
  return out.sort(function(a,b){ return b[1] - a[1]; });
}

const AW_MONATE = ["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];
const AW_KURZ = {};
MONATSNAMEN.forEach(function(n,i){ AW_KURZ[monatsSchluessel(n).slice(0,3)] = i+1; });
/* „März" steht im Textlayer je nach Schrift als März, Marz oder Maerz */
function awMonatMuster(nr){ return reEscape(AW_MONATE[nr-1]).replace(/ä/g, "[äa]e?"); }

const AW_DAUER = ["0s-30s","30s-2mn","2mn-5mn","5mn-15mn","15mn-30mn","30mn-1h","1h+","Unbekannt"];
const AW_WOCHENTAGE = ["Mo","Di","Mi","Do","Fr","Sa","So"];

function parseNetzBericht(zeilen, url){
  const ab = awAbschnitte(zeilen);
  const alles = zeilen.join(" ").replace(/\s+/g," ");

  /* Der Dateiname bestimmt den Monat; steht darin keiner, springt die
     Zeitspanne aus dem Kopf des Berichts ein. */
  let key = netzMonatAusName(url);
  if(!key){
    const m = /Zeitraum[:\s]+(?:Monthly\s+)?([A-Za-zÄÖÜäöü]{3,10})\.?\s+(\d{4})/.exec(alles);
    const nr = m ? AW_KURZ[monatsSchluessel(m[1]).slice(0,3)] : null;
    if(nr) key = m[2] + "-" + String(nr).padStart(2,"0");
  }
  if(!key) throw new Error("Zeitraum nicht erkannt");

  const jahr = key.slice(0,4), nr = +key.slice(5,7);

  /* Sicherster Anker sind die Jahreszeilen der „Monatlichen Historie":
     Monat, Besucher, Besuche, Seiten, Zugriffe, Bytes. */
  const hist = new RegExp(awMonatMuster(nr) + "\\s+" + jahr +
    "\\s+([\\d.]+)\\s+([\\d.]+)\\s+([\\d.]+)\\s+([\\d.]+)\\s+([\\d.,]+)\\s*(Bytes|KB|MB|GB|TB)")
    .exec(alles);

  /* Ersatzweise die Summenzeile der Tagestabelle und die Kopfzeile der
     Aufenthaltsdauer. */
  const summe = /Total\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/.exec(awQuelle(ab, "tage", alles) || "");
  const dauerKopf = /Anzahl der Besuche:\s*([\d.]+)\s*-\s*Durchschnitt:\s*([\d.,]+)\s*s/.exec(alles);
  const besucherRoh = /([\d.]+)\s+Unterschiedliche Besucher/.exec(alles);
  const bpb = /\(([\d.,]+)\s*Besuche\/Besucher\)/.exec(alles);
  const spb = /\(([\d.,]+)\s*Seiten\/Besuch\)/.exec(alles);

  const kpi = {
    visitors: hist ? awZahl(hist[1]) : (besucherRoh ? awZahl(besucherRoh[1]) : null),
    visits:   hist ? awZahl(hist[2]) : (summe ? awZahl(summe[1]) : (dauerKopf ? awZahl(dauerKopf[1]) : null)),
    pages:    hist ? awZahl(hist[3]) : (summe ? awZahl(summe[2]) : null),
    hits:     hist ? awZahl(hist[4]) : (summe ? awZahl(summe[3]) : null),
    bytes:    hist ? awMB(hist[5], hist[6]) : (summe ? awMB(summe[4], summe[5]) : null),
    avgTime:  dauerKopf ? awZahl(dauerKopf[2]) : null
  };
  if(!kpi.visits) throw new Error("Keine Besuche im Bericht");

  kpi.pagesPerVisit  = spb ? awZahl(spb[1]) : (kpi.pages && kpi.visits ? kpi.pages / kpi.visits : null);
  kpi.visitsPerUser  = bpb ? awZahl(bpb[1]) : (kpi.visits && kpi.visitors ? kpi.visits / kpi.visitors : null);

  /* Tage: Datum, Besuche, Seiten, Zugriffe, Bytes */
  const tage = awTreffer(awQuelle(ab, "tage", alles),
    /(\d{2})\.(\d{2})\.(\d{4})\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/g)
    .map(function(m){
      return {tag:m[1], datum:m[1] + "." + m[2] + ".", besuche:awZahl(m[4]),
              seiten:awZahl(m[5]), bytes:awMB(m[7], m[8])};
    });

  /* Stunden: 00–23, Seiten und Zugriffe */
  const stunden = [];
  const gesehen = {};
  awTreffer(awQuelle(ab, "stunden", alles), /(?:^|\s)([01]\d|2[0-3])\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/g)
    .forEach(function(m){
      if(gesehen[m[1]]) return;
      gesehen[m[1]] = 1;
      stunden.push({stunde:m[1], seiten:awZahl(m[2])});
    });
  stunden.sort(function(a,b){ return a.stunde < b.stunde ? -1 : 1; });

  /* Wochentage: Seiten je Tag */
  const wochenRoh = {};
  awTreffer(awQuelle(ab, "wochentage", alles), /(?:^|\s)(Mo|Di|Mi|Do|Fr|Sa|So)\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/g)
    .forEach(function(m){ if(wochenRoh[m[1]] === undefined) wochenRoh[m[1]] = awZahl(m[2]); });
  const wochentage = AW_WOCHENTAGE.map(function(t){ return {tag:t, seiten: wochenRoh[t] === undefined ? null : wochenRoh[t]}; });

  /* Aufenthaltsdauer je Klasse */
  const dauerRoh = {};
  awTreffer(awQuelle(ab, "dauer", alles), new RegExp("(" + AW_DAUER.map(reEscape).join("|") + ")\\s+([\\d.]+)\\s+([\\d.,]+)\\s*%", "g"))
    .forEach(function(m){ if(dauerRoh[m[1]] === undefined) dauerRoh[m[1]] = awZahl(m[2]); });
  const dauer = AW_DAUER.filter(function(d){ return dauerRoh[d] > 0; })
                        .map(function(d){ return [d, dauerRoh[d]]; });

  return {key:key, monat:{
    label: monatsName(key),
    kpi: kpi,
    os: awListe(awQuelle(ab, "os", alles), NETZ_OS, false),
    browser: awListe(awQuelle(ab, "browser", alles), NETZ_BROWSER, true),
    tage: tage, stunden: stunden, wochentage: wochentage,
    dauer: dauer
  }};
}

function renderNetz(){
  const cur = DATA_NETZ[state.monthNetz];
  const v = vergleich("netz"), cmp = v.cmp, cmpLabel = v.label;

  /* AWStats listet auch Systeme mit einer Handvoll Aufrufen. In der
     Legende stünden die mit „0 %" und lenken vom Wesentlichen ab —
     deshalb die fünf größten, der Rest wandert in „Sonstige". */
  function topFuenf(liste){
    const alle = liste || [];
    if(alle.length <= 6) return alle;
    const rest = alle.slice(5).reduce(function(a,e){ return a + e[1]; }, 0);
    return alle.slice(0,5).concat(rest > 0 ? [["Sonstige", rest]] : []);
  }

  const osHTML = verteilung({
    klasse:"split first", titel:"Betriebssysteme", note:"Anteil der Seitenaufrufe",
    eintraege: topFuenf(cur.os), farben: CH_COLORS,
    leerText:"Dieser Bericht enthält keine Aufschlüsselung nach Betriebssystemen."
  });
  const browserHTML = verteilung({
    klasse:"split", titel:"Browser", note:"Anteil der Seitenaufrufe",
    eintraege: topFuenf(cur.browser), farben: DEV_COLORS,
    leerText:"Dieser Bericht enthält keine Aufschlüsselung nach Browsern."
  });
  const dauerHTML = verteilung({
    klasse:"split", titel:"Aufenthaltsdauer", note:"Besuche je Zeitspanne",
    eintraege: cur.dauer, farben: CH_COLORS,
    hinweis: hatWert(cur.kpi.avgTime)
      ? "Im Schnitt " + dur(cur.kpi.avgTime) + " je Besuch."
      : "",
    leerText:"Dieser Bericht enthält keine Verteilung der Aufenthaltsdauer."
  });

  const tageHTML = balkenReihe({
    klasse:"full", titel:"Besuche im Monatsverlauf", note:(cur.tage || []).length + " Tage",
    punkte:(cur.tage || []).map(function(t){
      return {label:t.tag, wert:t.besuche, tipp:t.datum};
    }),
    hinweis:"Anzahl der Besuche je Tag. Der Balken zeigt den Abstand zum stärksten Tag des Monats.",
    leerText:"Dieser Bericht enthält keine Tagestabelle."
  });

  const stundenHTML = balkenReihe({
    titel:"Tageszeit", note:"Seitenaufrufe je Stunde",
    punkte:(cur.stunden || []).map(function(h){
      return {label:h.stunde, wert:h.seiten, tipp:h.stunde + " Uhr"};
    }),
    hinweis:"Serverzeit. Zeigt, wann der Netzplan tatsächlich benutzt wird.",
    leerText:"Dieser Bericht enthält keine Stundentabelle."
  });

  const wochenHTML = balkenReihe({
    klasse:"rechts", titel:"Wochentage", note:"Seitenaufrufe je Wochentag",
    punkte:(cur.wochentage || []).map(function(w){
      return {label:w.tag, wert:w.seiten, tipp:w.tag};
    }),
    hinweis:"Summe über alle Wochen des Monats.",
    leerText:"Dieser Bericht enthält keine Wochentagstabelle."
  });

  /* Reihenfolge bestimmt die Rasterplatzierung: oben KPI-Kacheln und
     Jahresverlauf nebeneinander, dann die drei Verteilungen, der
     Monatsverlauf über die volle Breite, unten Tageszeit und
     Wochentage nebeneinander. */
  return '<div class="grid">' +
    kpiRaster("netz", cur, cmp, cmpLabel) + jahresChart("netz") +
    auffaelligkeiten("netz", cur, cmp, cmpLabel) +
    osHTML + browserHTML + dauerHTML +
    tageHTML + stundenHTML + wochenHTML +
  '</div>';
}

function netzHolen(melde){
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[]};
  const next = {};

  function dateiname(url){
    try{ return decodeURIComponent(String(url).split("/").pop()); }catch(e){ return String(url); }
  }
  function uebernehmen(lib, puffer, url){
    return pdfAuswerten(lib, puffer, function(zeilen){ return parseNetzBericht(zeilen, url); })
      .then(function(r){
        next[r.key] = r.monat;
        bilanz.gelesen++;
        melde(r.monat.label + " gelesen …");
      }).catch(function(){
        bilanz.fehler++;
        if(bilanz.fehlerNamen.length < 4) bilanz.fehlerNamen.push(dateiname(url));
      });
  }

  melde("Ordner wird durchsucht …");
  return ladePdfJs().then(function(lib){
    return ordnerListing(NETZ_QUELLE.ordner, "pdf").then(function(urls){

      /* Weg A: Der Server listet den Ordner auf. */
      if(urls.length){
        let kette = Promise.resolve();
        const genutzt = urls.slice(0, NETZ_QUELLE.maxBerichte);
        genutzt.forEach(function(url, i){
          kette = kette.then(function(){
            melde("Bericht " + (i+1) + " von " + genutzt.length + " wird gelesen …");
            return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
          });
        });
        return kette;
      }

      /* Weg B: Kein Listing – der Dateiname steht fest, also direkt
         Monat für Monat anfragen. */
      let kette = Promise.resolve();
      letzteMonate(NETZ_QUELLE.probeMonate).forEach(function(m){
        kette = kette.then(function(){
          if(bilanz.gelesen >= NETZ_QUELLE.maxBerichte) return;
          melde("Suche " + m.monat + " " + m.jahr + " …");
          const url = netzDatei(m.mm, m.jahr);
          return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
        });
      });
      return kette;
    });
  }).then(function(){
    if(!Object.keys(next).length){
      throw new Error("Kein Bericht gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. " + NETZ_QUELLE.basis + "01.26.pdf");
    }
    DATA_NETZ = next;
    return bilanz;
  });
}

function blattNetz(keys){
  const os      = ["Windows","Android","Macintosh","iOS","Linux"];
  const browser = ["Google Chrome","Safari","Firefox","Opera"];
  const kopf = ["Monat","Unterschiedliche Besucher","Anzahl der Besuche","Seitenaufrufe","Zugriffe",
                "Datenvolumen (MB)","Ø Aufenthaltsdauer (Sek.)","Seiten pro Besuch","Besuche pro Besucher"]
    .concat(os.map(function(n){ return n + " (%)"; }))
    .concat(browser.map(function(n){ return n + " (%)"; }))
    .concat(AW_DAUER.slice(0,7).map(function(n){ return "Besuche " + n; }));

  const zeilen = keys.map(function(k){
    const d = DATA_NETZ[k], kpi = d.kpi;
    const leer = function(x){ return hatWert(x) ? x : ""; };
    const anteilAus = function(liste){
      const summe = liste.reduce(function(a,e){ return a + e[1]; }, 0);
      return function(name){
        const t = liste.find(function(e){ return e[0] === name; });
        return (t && summe > 0) ? Math.round(t[1] / summe * 1000) / 10 : "";
      };
    };
    const osAnteil = anteilAus(d.os || []), brAnteil = anteilAus(d.browser || []);
    const dauerMap = {};
    (d.dauer || []).forEach(function(e){ dauerMap[e[0]] = e[1]; });

    return [d.label, leer(kpi.visitors), leer(kpi.visits), leer(kpi.pages), leer(kpi.hits),
            hatWert(kpi.bytes) ? Math.round(kpi.bytes * 100) / 100 : "",
            leer(kpi.avgTime),
            hatWert(kpi.pagesPerVisit) ? Math.round(kpi.pagesPerVisit * 100) / 100 : "",
            hatWert(kpi.visitsPerUser) ? Math.round(kpi.visitsPerUser * 100) / 100 : ""]
      .concat(os.map(osAnteil))
      .concat(browser.map(brAnteil))
      .concat(AW_DAUER.slice(0,7).map(function(n){ return dauerMap[n] === undefined ? "" : dauerMap[n]; }));
  });
  return [kopf].concat(zeilen);
}

/* ============================================================
   10. KANAL Bus-WLAN
   Quelle: Monatsberichte des Fahrgast-WLAN (PDF) im fileadmin.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/bus-wlan/
   Dateiname:    2025-08_fahrgastwlan_bericht_mit_nutzungsstatistiken.pdf

   Besonderheit: Der Bericht besteht fast nur aus Grafiken. Zahlen
   stehen im Fließtext über den Grafiken und in zwei Tabellen. Alles,
   was ausschließlich als Kurve gezeichnet ist — etwa die
   durchschnittliche Sitzungsdauer — lässt sich aus dem PDF nicht
   auslesen und taucht deshalb hier nicht auf.
   ============================================================ */
let DATA_WLAN = {};

const WLAN_QUELLE = {
  ordner:      "/fileadmin/user_upload/17_kennzahlen/bus-wlan/",
  endung:      "_fahrgastwlan_bericht_mit_nutzungsstatistiken.pdf",
  maxBerichte: 30,
  probeMonate: 24
};
function wlanDatei(jahr, mm){
  return WLAN_QUELLE.ordner + encodeURIComponent(jahr + "-" + mm + WLAN_QUELLE.endung);
}
/* „2025-08_fahrgastwlan…pdf" → „2025-08" */
function wlanMonatAusName(url){
  const m = /(\d{4})-(\d{2})_/.exec(decodeURIComponent(String(url || "")).split("/").pop());
  return m ? m[1] + "-" + m[2] : null;
}

/* Zeilen der beiden Tabellen: Label, Wert, Prozentsatz.
   Die Label sind nicht immer Wörter („1click", „bus9383"), deshalb
   wird alles ohne Leerzeichen als Label akzeptiert und rein
   numerisches hinterher aussortiert. */
function wlanTabelle(text){
  const out = [], gesehen = {};
  awTreffer(text, /([^\s]+)\s+(\d[\d.]*)\s+([\d.,]+)\s*%/g).forEach(function(m){
    const name = m[1];
    if(/^[\d.,]+$/.test(name) || gesehen[name]) return;
    const wert = awZahl(m[2]);
    if(!hatWert(wert) || wert <= 0) return;
    gesehen[name] = 1;
    out.push([name, wert, awZahl(m[3])]);
  });
  return out.sort(function(a,b){ return b[1] - a[1]; });
}

function parseWlanBericht(zeilen, url){
  const alles = zeilen.join(" ").replace(/\s+/g," ");

  /* Der Bericht enthält denselben Aufbau zweimal: erst den Monat, dann
     die letzten zwölf Monate. Alles ab der Jahresübersicht wird
     abgeschnitten, sonst mischen sich Monats- und Jahreszahlen. */
  const schnitt = alles.indexOf("Die letzten 12 Monate");
  const monatText = schnitt > -1 ? alles.slice(0, schnitt) : alles;

  let key = wlanMonatAusName(url);
  if(!key){
    const m = /Der Monat\s+([A-Za-zÄÖÜäöü]+)\s+(\d{4})/.exec(monatText);
    const nr = m ? AW_KURZ[monatsSchluessel(m[1]).slice(0,3)] : null;
    if(nr) key = m[2] + "-" + String(nr).padStart(2,"0");
  }
  if(!key) throw new Error("Zeitraum nicht erkannt");

  /* Kennzahlen aus den Erläuterungen über den Grafiken */
  const gleich  = /gleichzeitig verbundener Geräte[^.]*?beträgt\s*(\d[\d.]*)/.exec(monatText);
  const lizenz  = /Dies sind\s*([\d.,]+)\s*%\s*der installierten Lizenz\s*\(\s*(\d[\d.]*)/.exec(monatText);
  const aktiv   = /Maximum aktiver Sitzungen[^.]*?beträgt\s*(\d[\d.]*)/.exec(monatText);
  const geraete = /Geräte in dieser Zeit ist\s*(\d[\d.]*)\s*\(MAC[^)]*\)\s*et\s*(\d[\d.]*)/.exec(monatText);

  /* Die beiden Tabellen: Sitzungen je Benutzerprofil und je Fahrzeug */
  const pStart = monatText.indexOf("Sitzungen nach Profil");
  const sStart = monatText.indexOf("Sitzungen nach Eingangssubnetz");
  const profile = pStart > -1
    ? wlanTabelle(monatText.slice(pStart, sStart > pStart ? sStart : undefined)) : [];
  const fahrzeuge = sStart > -1 ? wlanTabelle(monatText.slice(sStart)) : [];

  /* Die Gesamtzahl der Sitzungen steht nirgends als eine Zahl — sie
     ergibt sich aus der Aufteilung nach Profil, die den ganzen Monat
     abdeckt. */
  const sessions = profile.reduce(function(a,p){ return a + p[1]; }, 0);
  const devices  = geraete ? awZahl(geraete[1]) : null;
  if(!sessions) throw new Error("Keine Sitzungen im Bericht");

  const kpi = {
    sessions:      sessions,
    logins:        geraete ? awZahl(geraete[2]) : null,
    devices:       devices,
    maxConcurrent: gleich ? awZahl(gleich[1]) : null,
    maxActive:     aktiv ? awZahl(aktiv[1]) : null,
    licensePct:    lizenz ? awZahl(lizenz[1]) : null,
    sessionsPerDevice: (devices > 0) ? sessions / devices : null
  };

  return {key:key, monat:{
    label: monatsName(key),
    kpi: kpi,
    lizenz: lizenz ? awZahl(lizenz[2]) : null,
    profile: profile,
    fahrzeuge: fahrzeuge
  }};
}

function renderWlan(){
  const cur = DATA_WLAN[state.monthWlan];
  const v = vergleich("wlan"), cmp = v.cmp, cmpLabel = v.label;

  const profilHTML = verteilung({
    klasse:"split wide", titel:"Sitzungen nach Benutzerprofil",
    note: fmt(cur.kpi.sessions) + " Sitzungen",
    eintraege: (cur.profile || []).map(function(p){ return [p[0], p[1]]; }),
    farben: CH_COLORS, nachkomma: true,   /* „intern" liegt unter 1 % und wäre sonst 0 % */
    hinweis:"1click ist die Anmeldung ohne Konto, DSW-MOPADS die dienstliche Nutzung.",
    leerText:"Dieser Bericht enthält keine Aufteilung nach Profilen."
  });

  /* Jedes Fahrzeug meldet sich mit einem eigenen Eingangssubnetz. */
  const top = (cur.fahrzeuge || []).slice(0,8);
  const fzMax = maxOf(top.map(function(f){ return f[1]; }));
  const fahrzeugHTML = rangKachel({
    klasse:"rank", titel:"Meistgenutzte Fahrzeuge", note:"Sitzungen je Fahrzeug",
    legende:"Jedes Fahrzeug meldet sich mit einem eigenen Netz. Der Bericht listet nur die " +
            "stärksten davon auf, die Anteile beziehen sich auf alle Sitzungen des Monats.",
    leerText:"Dieser Bericht enthält keine Aufteilung nach Fahrzeugen.",
    zeilen: top.map(function(f){
      return {name:f[0], text:fmt(f[1]), anteil:f[1] / fzMax * 100,
              meta: hatWert(f[2]) ? pct(f[2]) + " der Sitzungen" : ""};
    })
  });

  /* Reihenfolge bestimmt die Rasterplatzierung: oben KPI-Kacheln und
     Jahresverlauf nebeneinander, darunter Profile und Fahrzeuge. */
  return '<div class="grid">' +
    kpiRaster("wlan", cur, cmp, cmpLabel) + jahresChart("wlan") +
    auffaelligkeiten("wlan", cur, cmp, cmpLabel) +
    profilHTML + fahrzeugHTML +
  '</div>';
}

function wlanHolen(melde){
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[]};
  const next = {};

  function dateiname(url){
    try{ return decodeURIComponent(String(url).split("/").pop()); }catch(e){ return String(url); }
  }
  function uebernehmen(lib, puffer, url){
    return pdfAuswerten(lib, puffer, function(zeilen){ return parseWlanBericht(zeilen, url); })
      .then(function(r){
        next[r.key] = r.monat;
        bilanz.gelesen++;
        melde(r.monat.label + " gelesen …");
      }).catch(function(){
        bilanz.fehler++;
        if(bilanz.fehlerNamen.length < 4) bilanz.fehlerNamen.push(dateiname(url));
      });
  }

  melde("Ordner wird durchsucht …");
  return ladePdfJs().then(function(lib){
    return ordnerListing(WLAN_QUELLE.ordner, "pdf").then(function(urls){

      /* Weg A: Der Server listet den Ordner auf. */
      if(urls.length){
        let kette = Promise.resolve();
        const genutzt = urls.slice(0, WLAN_QUELLE.maxBerichte);
        genutzt.forEach(function(url, i){
          kette = kette.then(function(){
            melde("Bericht " + (i+1) + " von " + genutzt.length + " wird gelesen …");
            return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
          });
        });
        return kette;
      }

      /* Weg B: Kein Listing – der Dateiname steht fest. */
      let kette = Promise.resolve();
      letzteMonate(WLAN_QUELLE.probeMonate).forEach(function(m){
        kette = kette.then(function(){
          if(bilanz.gelesen >= WLAN_QUELLE.maxBerichte) return;
          melde("Suche " + m.monat + " " + m.jahr + " …");
          const url = wlanDatei(m.jahr, m.mm);
          return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
        });
      });
      return kette;
    });
  }).then(function(){
    if(!Object.keys(next).length){
      throw new Error("Kein Bericht gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. 2025-08" + WLAN_QUELLE.endung);
    }
    DATA_WLAN = next;
    return bilanz;
  });
}

function blattWlan(keys){
  /* Profilspalten aus allen gewählten Monaten, stärkstes zuerst. */
  const summen = {};
  keys.forEach(function(k){
    (DATA_WLAN[k].profile || []).forEach(function(p){ summen[p[0]] = (summen[p[0]] || 0) + p[1]; });
  });
  const namen = Object.keys(summen).sort(function(a,b){ return summen[b] - summen[a]; });
  const kopf = ["Monat","Sitzungen","Eindeutige Logins","Verschiedene Geräte (MAC)",
                "Max. gleichzeitige Nutzer","Max. aktive Sitzungen","Auslastung der Lizenz (%)",
                "Sitzungen je Gerät"]
    .concat(namen.map(function(n){ return "Profil " + n; }));

  const zeilen = keys.map(function(k){
    const d = DATA_WLAN[k], kpi = d.kpi;
    const leer = function(x){ return hatWert(x) ? x : ""; };
    const profil = {};
    (d.profile || []).forEach(function(p){ profil[p[0]] = p[1]; });
    return [d.label, leer(kpi.sessions), leer(kpi.logins), leer(kpi.devices),
            leer(kpi.maxConcurrent), leer(kpi.maxActive), leer(kpi.licensePct),
            hatWert(kpi.sessionsPerDevice) ? Math.round(kpi.sessionsPerDevice * 100) / 100 : ""]
      .concat(namen.map(function(n){ return profil[n] === undefined ? "" : profil[n]; }));
  });
  return [kopf].concat(zeilen);
}

/* ============================================================
   11. KANAL Chatbot
   Quelle: Excel-Datei im fileadmin.
   Ablage: fileadmin/user_upload/17_kennzahlen/chatbot/chatbot.xlsx
   Gelesen werden zwei Blaetter: "nur Anfragen" (Anfrage x Kategorie-
   Treffer) und "ohne ID-Duplikate" (eine Zeile je Konversation).
   Die beiden Pivot-Blaetter bleiben bewusst unberuehrt: alles daraus
   wird hier selbst gerechnet, damit ein Umbau der Pivots den Kanal
   nicht bricht. Im Code stehen bewusst keine Monatswerte.
   ============================================================ */
let DATA_CHAT = {};

const CHAT_QUELLE = {
  datei: "/fileadmin/user_upload/17_kennzahlen/chatbot/chatbot.xlsx",
  /* Blattnamen werden tolerant gesucht: Reihenfolge = Priorität. */
  blattAnfragen:     ["nur anfragen", "anfragen"],
  blattKonversation: ["ohne id-duplikate", "ohne id duplikate", "konversationen"],
  beispiele: 8,             /* so viele Beispielanfragen je Monat */
  beispielMinZeichen: 30    /* kürzere Zeilen sind meist Tests oder Floskeln */
};

const WOCHENTAGE = ["Mo","Di","Mi","Do","Fr","Sa","So"];

/* Blatt anhand seines Namens finden — unabhängig von Groß- und
   Kleinschreibung und von Bindestrich oder Leerzeichen. */
function chatBlatt(wb, kandidaten){
  const norm = function(s){ return String(s||"").toLowerCase().replace(/[\s\-_]+/g," ").trim(); };
  for(let i = 0; i < kandidaten.length; i++){
    const treffer = wb.SheetNames.find(function(n){ return norm(n) === norm(kandidaten[i]); });
    if(treffer) return wb.Sheets[treffer];
  }
  return null;
}

/* Datumsspalte: Date-Objekt, "20.05.2026" oder "5/20/26". */
function chatDatum(value){
  if(value instanceof Date && !isNaN(value)) return value;
  const s = String(value || "").trim();
  if(!s) return null;
  let m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/.exec(s);
  if(m){
    const jahr = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    return new Date(jahr, m[2] - 1, +m[1], 12);
  }
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);
  if(m){
    const jahr = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    return new Date(jahr, m[1] - 1, +m[2], 12);   /* US-Schreibweise: Monat zuerst */
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* Stunde aus der Zeitspalte. Excel liefert Uhrzeiten je nach Zelle als
   Date (mit Ersatzdatum 1899), als Bruchteil eines Tages oder als Text.
   Angabe ist Ortszeit und wird deshalb nicht umgerechnet. */
function chatStunde(value){
  if(value instanceof Date && !isNaN(value)) return value.getHours();
  if(typeof value === "number" && value >= 0 && value < 1) return Math.floor(value * 24);
  const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i.exec(String(value || "").trim());
  if(!m) return null;
  let h = +m[1];
  const suffix = (m[4] || "").toUpperCase();
  if(suffix === "PM" && h < 12) h += 12;
  if(suffix === "AM" && h === 12) h = 0;
  return h >= 0 && h < 24 ? h : null;
}

const chatKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const chatTag = d => chatKey(d) + "-" + String(d.getDate()).padStart(2, "0");

/* Leere Kategoriezellen heißen im Pivot „(Leer)" — hier ausgeschrieben,
   damit in der Rangliste keine namenlose Zeile steht. */
const CHAT_OHNE = "Ohne Unterkategorie";

/* ---------- Auswertung eines Monats aufbauen ---------- */
function chatMonatLeer(key){
  return {
    label: monatsName(key),
    kpi: {anfragen:0, konversationen:null, proKonversation:null,
          proTag:null, peakTag:null, themen:0},
    /* Hauptthema = erster Kategorie-Treffer einer Anfrage. Die weiteren
       Treffer derselben Anfrage sind nachrangige Vorschläge und werden
       getrennt gezählt, damit beide Sichten lesbar bleiben. */
    primaer: {},        /* Kategorie -> Anfragen mit dieser Erstzuordnung */
    treffer: {},        /* Kategorie -> alle Treffer */
    unter:   {},        /* Kategorie -> {Unterkategorie -> Treffer} */
    stunden: new Array(24).fill(0),
    wochentage: new Array(7).fill(0),
    tage: {},           /* Tagesschlüssel -> Anfragen */
    beispiele: [],
    peakLabel: null
  };
}

function chatZaehl(obj, name, wert){
  if(!name) return;
  obj[name] = (obj[name] || 0) + (wert === undefined ? 1 : wert);
}

/* Aus den Rohzeilen die Monate rechnen. */
function chatAuswerten(zeilenAnfragen, zeilenKonversationen){
  const monate = {};
  const hol = function(key){
    if(!monate[key]) monate[key] = chatMonatLeer(key);
    return monate[key];
  };

  /* 1. Blatt „nur Anfragen": je Anfrage mehrere Kategorie-Treffer.
        Gruppiert wird über System ID + Anfragetext + Zeitpunkt. */
  const gesehen = {};
  zeilenAnfragen.forEach(function(row){
    const datum = chatDatum(row["Datum"]);
    if(!datum) return;
    const key = chatKey(datum), m = hol(key);
    const text = String(row["Anfrage"] || "").trim();
    /* Leere Kategoriezeilen werden wie im Pivot als eigene Kategorie
       „(Leer)" geführt, damit die Summe exakt dem Gesamtergebnis des
       Blatts „Nutzung Kategorien" entspricht. */
    const kategorie = String(row["Kategorie"] || "").trim() || "(Leer)";
    const unter = String(row["Unterkategorie"] || "").trim() || CHAT_OHNE;
    const stunde = chatStunde(row["Zeit"]);
    const id = String(row["System ID"] || "") + "|" + text + "|" +
               chatTag(datum) + "|" + String(row["Zeit"] || "");

    chatZaehl(m.treffer, kategorie);
    if(kategorie){
      if(!m.unter[kategorie]) m.unter[kategorie] = {};
      chatZaehl(m.unter[kategorie], unter);
    }

    /* Erste Zeile einer Anfrage: sie zählt als die Anfrage selbst. */
    if(gesehen[id]) return;
    gesehen[id] = true;
    m.kpi.anfragen++;
    chatZaehl(m.primaer, kategorie);
    chatZaehl(m.tage, chatTag(datum));
    if(stunde !== null) m.stunden[stunde]++;
    m.wochentage[(datum.getDay() + 6) % 7]++;
    if(text.length >= CHAT_QUELLE.beispielMinZeichen) m.beispiele.push({text:text, tag:datum});
  });

  /* 2. Blatt „ohne ID-Duplikate": Konversationen je Monat. */
  const konvIds = {};
  (zeilenKonversationen || []).forEach(function(row){
    const datum = chatDatum(row["Datum"]);
    if(!datum) return;
    const key = chatKey(datum);
    if(!konvIds[key]) konvIds[key] = {};
    konvIds[key][String(row["System ID"] || "") + "|" + String(row["Zeit"] || "")] = true;
  });

  /* 3. Abgeleitete Kennzahlen. */
  Object.keys(monate).forEach(function(key){
    const m = monate[key];
    const konv = konvIds[key] ? Object.keys(konvIds[key]).length : null;
    m.kpi.konversationen = konv;
    m.kpi.proKonversation = (konv && konv > 0) ? m.kpi.anfragen / konv : null;

    const tage = Object.keys(m.tage);
    m.kpi.proTag = tage.length ? m.kpi.anfragen / tage.length : null;
    const stärkster = tage.sort(function(a,b){ return m.tage[b] - m.tage[a]; })[0];
    m.kpi.peakTag = stärkster ? m.tage[stärkster] : null;
    m.peakLabel = stärkster
      ? new Date(stärkster + "T12:00:00").toLocaleDateString("de-DE",
          {weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"})
      : null;

    /* Anzahl verschiedener Kategorien wie im Pivot; „(Leer)" ist eine
       eigene Kategorie und wird mitgezählt, wenn sie vorhanden ist. */
    m.kpi.themen = Object.keys(m.treffer).length;

    /* Beispiele gleichmäßig über den Monat streuen statt die ersten
       Zeilen zu nehmen — sonst zeigt die Liste immer den Monatsanfang. */
    const alle = m.beispiele;
    const anzahl = Math.min(CHAT_QUELLE.beispiele, alle.length);
    const schritt = anzahl ? alle.length / anzahl : 0;
    const auswahl = [];
    for(let i = 0; i < anzahl; i++){
      const b = alle[Math.floor(i * schritt)];
      auswahl.push({text: b.text, datum: b.tag.toLocaleDateString("de-DE")});
    }
    m.beispiele = auswahl;
  });

  return monate;
}

/* ---------- Kacheln ---------- */

/* Rangliste der Themen in der Zählweise des Blatts „Nutzung Kategorien". */
function chatThemen(cur, cmp, cmpLabel){
  /* Diese Zählung folgt exakt dem Blatt „Nutzung Kategorien": Jede
     Zeile aus „nur Anfragen" zählt als eine Kategorie-Zuordnung.
     Mehrere gleichlautende Zeilen derselben Anfrage werden deshalb
     nicht dedupliziert. */
  const namen = Object.keys(cur.treffer).sort(function(a,b){ return cur.treffer[b] - cur.treffer[a]; });
  const top = namen.slice(0, 10);
  const max = maxOf(top.map(function(n){ return cur.treffer[n]; }));
  return rangKachel({
    klasse: "rank pages-rank", titel: "Häufigste Themen", note: "Kategorie-Zuordnungen",
    legende: "Zählung wie im Blatt Nutzung Kategorien: Jede Kategorie-Zeile aus nur Anfragen zählt.",
    leerText: "Für diesen Monat enthält das Blatt nur Anfragen keine Kategorien.",
    zeilen: top.map(function(n){
      const wert = cur.treffer[n] || 0;
      return {
        name: n,
        text: fmt(wert),
        anteil: wert / max * 100,
        hover: n + " — " + fmt(wert) + " Kategorie-Zuordnungen",
        meta: (cmp && cmp.treffer && cmp.treffer[n] !== undefined)
                ? deltaHTML("themen", wert, cmp.treffer[n], cmpLabel)
                : '<span class="delta flat"><em>kein Vergleich</em></span>'
      };
    })
  });
}

/* Tagesverlauf über 24 Stunden. */
function chatStundenKachel(cur){
  const summe = cur.stunden.reduce(function(a,b){ return a + b; }, 0);
  if(!summe) return leereKachel("chart full", "Tagesverlauf",
    "Für diesen Monat enthält die Spalte Zeit keine auswertbaren Uhrzeiten.");
  const spitze = cur.stunden.indexOf(maxOf(cur.stunden));
  return balkenReihe({
    klasse: "full", titel: "Tagesverlauf", note: "Anfragen je Stunde",
    punkte: cur.stunden.map(function(v, h){
      return {label: String(h), wert: v, tipp: String(h).padStart(2,"0") + ":00 bis " +
              String(h).padStart(2,"0") + ":59 Uhr"};
    }),
    hinweis: "Ortszeit. Stärkste Stunde: " + String(spitze).padStart(2,"0") + ":00 Uhr mit " +
             fmt(cur.stunden[spitze]) + " Anfragen — das sind " +
             pct(cur.stunden[spitze] / summe * 100) + " des Monats."
  });
}

/* Wochentage als Balkenreihe: Werktag und Wochenende sind hier die
   eigentliche Aussage, deshalb steht der Vergleich im Hinweis. */
function chatWochentage(cur){
  const summe = cur.wochentage.reduce(function(a,b){ return a + b; }, 0);
  if(!summe) return leereKachel("chart", "Wochentage",
    "Für diesen Monat liegen keine datierten Anfragen vor.");
  const wochenende = cur.wochentage[5] + cur.wochentage[6];
  return balkenReihe({
    klasse: "", titel: "Wochentage", note: "Anfragen je Wochentag",
    punkte: cur.wochentage.map(function(v, i){
      return {label: WOCHENTAGE[i], wert: v, tipp: WOCHENTAGE[i]};
    }),
    hinweis: "Samstag und Sonntag zusammen: " + fmt(wochenende) + " Anfragen, " +
             pct(wochenende / summe * 100) + " des Monats."
  });
}

/* Beispielanfragen. Bewusst als ruhige Liste ohne Balken: hier zählt
   der Wortlaut, nicht die Größe. */
function chatBeispiele(cur){
  if(!cur.beispiele.length){
    return leereKachel("split right", "Beispielanfragen",

  return '<div class="card split right">' +

    'Personenbezogene Angaben sind in der Quelle bereits durch # ersetzt.</p></div>';
}

/* Detailtabelle in derselben Zählweise wie „Nutzung Kategorien":
   Kategoriezeilen und Unterkategoriezeilen aus „nur Anfragen". */
function chatTabelle(cur){
  const namen = Object.keys(cur.treffer).filter(function(n){ return n; })
    .sort(function(a,b){ return cur.treffer[b] - cur.treffer[a]; });
  if(!namen.length){
    return leereKachel("detail-card full", "Themen im Detail",
      "Für diesen Monat enthält das Blatt nur Anfragen keine Kategorien.");
  }
  const max = maxOf(namen.map(function(n){ return cur.treffer[n]; }));
  const summe = namen.reduce(function(a,n){ return a + cur.treffer[n]; }, 0);

  const zeilen = namen.map(function(n, i){
    const unter = cur.unter[n] || {};
    const unterNamen = Object.keys(unter).sort(function(a,b){ return unter[b] - unter[a]; });
    const stärkste = unterNamen[0];
    const kürzel = n.replace(/[^A-Za-zÄÖÜäöü]/g, "").slice(0, 2);
    return '<tr>' +
      '<td><div class="cell-name"><span class="rankno">' + (i+1) + '</span>' +
        '<span class="favchip">' + esc(kürzel) + '</span>' +
        '<span class="tname" title="' + esc(n) + '">' + esc(n) + '</span></div></td>' +
      '<td><div class="cell-num"><b>' + fmt(cur.treffer[n]) + '</b>' +
        '<span class="minibar"><span data-w="' + (cur.treffer[n] / max * 100) + '"></span></span></div></td>' +
      '<td><span class="pill' + (cur.treffer[n] / summe >= 0.15 ? " blue" : "") + '">' +
        pct(cur.treffer[n] / summe * 100) + '</span></td>' +
      '<td style="text-align:left">' + (stärkste
          ? esc(stärkste) + ' <span class="pill">' + fmt(unter[stärkste]) + '</span>'
          : '—') + '</td>' +
    '</tr>';
  }).join("");

  return '<div class="card detail-card full">' +
      '<div class="card-head"><h2>Themen im Detail</h2>' +
      '<span class="card-note">Beide Zählweisen je Kategorie</span></div>' +
      '<div class="tablewrap"><table><thead><tr>' +
        '<th>Kategorie</th><th>Kategorie-Zuordnungen</th>' +
        '<th>Anteil</th><th style="text-align:left">Stärkste Unterkategorie</th>' +
      '</tr></thead><tbody>' + zeilen + '</tbody></table></div>' +
      '<p class="tfoot-note">Die Werte entsprechen dem Blatt „Nutzung Kategorien": Jede Kategorie-Zeile aus „nur Anfragen" zählt einmal. Die Summe aller Kategorie-Zuordnungen kann deshalb über der Zahl der Anfragen liegen.</p>' +
    '</div>';
}

function renderChat(){
  const cur = DATA_CHAT[state.monthChat];
  const v = vergleich("chat"), cmp = v.cmp, cmpLabel = v.label;
  return '<div class="grid">' +
    kpiRaster("chat", cur, cmp, cmpLabel) +
    chatThemen(cur, cmp, cmpLabel) +
    jahresChart("chat") +
    auffaelligkeiten("chat", cur, cmp, cmpLabel) +
    chatStundenKachel(cur) +
    chatWochentage(cur) +
    chatBeispiele(cur) +
    chatTabelle(cur) +
  '</div>';
}

/* ---------- Laden ---------- */
function chatHolen(melde){
  melde("Excel-Datei wird gelesen …");
  return ladeXlsx().then(function(XLSX){
    return fetch(CHAT_QUELLE.datei, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("Excel-Datei nicht gefunden · " + CHAT_QUELLE.datei);
      return r.arrayBuffer();
    }).then(function(buf){
      melde("Anfragen werden ausgewertet …");
      const wb = XLSX.read(buf, {type:"array", cellDates:true});
      const wsA = chatBlatt(wb, CHAT_QUELLE.blattAnfragen);
      if(!wsA) throw new Error('Blatt „nur Anfragen" fehlt in der Excel-Datei');
      const wsK = chatBlatt(wb, CHAT_QUELLE.blattKonversation);

      const zeilenA = XLSX.utils.sheet_to_json(wsA, {defval:"", raw:false, cellDates:true});
      const zeilenK = wsK ? XLSX.utils.sheet_to_json(wsK, {defval:"", raw:false, cellDates:true}) : [];

      const next = chatAuswerten(zeilenA, zeilenK);
      const keys = Object.keys(next);
      if(!keys.length) throw new Error("Keine datierten Anfragen in der Excel-Datei");

      DATA_CHAT = next;
      const hinweise = [];
      if(!wsK) hinweise.push('Blatt „ohne ID-Duplikate" fehlt · Konversationen ohne Wert');
      return {gelesen: keys.length, fehler: 0, fehlerNamen: [], hinweise: hinweise};
    });
  });
}

function blattChat(keys){
  /* Spalten der Kategorien über alle gewählten Monate, stärkste zuerst. */
  const summen = {};
  keys.forEach(function(k){
    const t = DATA_CHAT[k].treffer || {};
    Object.keys(t).forEach(function(n){ if(n) summen[n] = (summen[n] || 0) + t[n]; });
  });
  const namen = Object.keys(summen).sort(function(a,b){ return summen[b] - summen[a]; });

  const kopf = ["Monat","Anfragen","Konversationen","Anfragen je Konversation",
                "Anfragen je Tag","Stärkster Tag (Anfragen)","Stärkster Tag (Datum)",
                "Verschiedene Themen"]
    .concat(namen.map(function(n){ return n + " (Kategorie-Zuordnungen)"; }));

  const zeilen = keys.map(function(k){
    const d = DATA_CHAT[k], kpi = d.kpi;
    const leer = function(v){ return hatWert(v) ? v : ""; };
    return [d.label, leer(kpi.anfragen), leer(kpi.konversationen),
            hatWert(kpi.proKonversation) ? Math.round(kpi.proKonversation * 100) / 100 : "",
            hatWert(kpi.proTag) ? Math.round(kpi.proTag * 10) / 10 : "",
            leer(kpi.peakTag), d.peakLabel || "", leer(kpi.themen)]
      .concat(namen.map(function(n){ return d.treffer[n] === undefined ? "" : d.treffer[n]; }));
  });
  return [kopf].concat(zeilen);
}

/* ============================================================
   12. ERGÄNZUNGSMODULE
   Auffälligkeiten, Datenstand, Übersicht und PDF-Ausgabe. Alle
   Bausteine arbeiten nur über das Kanal-Register, kennen also
   keinen Kanal namentlich.
   ============================================================ */

/* ---------- Ladezeitpunkte je Kanal ---------- */
const GELADEN = {};
function standNotiz(id){
  const g = GELADEN[id];
  if(!g) return "noch nicht geladen";
  const d = new Date(g.zeit), heute = new Date();
  const gestern = new Date(heute.getTime() - 86400000);
  let wann;
  if(d.toDateString() === heute.toDateString())        wann = "heute, " + uhrzeit(g.zeit);
  else if(d.toDateString() === gestern.toDateString()) wann = "gestern, " + uhrzeit(g.zeit);
  else wann = "am " + d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
  return (g.quelle === "cache" ? "aus dem Zwischenspeicher, " : "eingelesen ") + wann;
}
/* Berichte kommen meist in den ersten Tagen des Folgemonats. Bis zum
   KARENZ_TAGE. eines Monats gilt deshalb noch der Vorvormonat als
   fällig — sonst stünde am Monatsersten jeder Kanal auf „fehlt". */
const KARENZ_TAGE = 10;
function erwarteterMonat(){
  const d = new Date();
  const jetzt = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0");
  return monatMinus(jetzt, d.getDate() <= KARENZ_TAGE ? 2 : 1);
}
/* Aktuell heißt: der jüngste Bericht reicht bis zum fälligen Monat.
   Kanäle mit unregelmäßigem Rhythmus (Newsletter) bekommen über
   „toleranz" zusätzliche Monate zugestanden. */
function standInfo(id){
  const k = KANAELE[id], ord = ordnung(id);
  if(!ord.length){
    const laedt = STATUS[id] && STATUS[id].kind === "loading";
    return {art:"leer", letzter:null,
            kurz: laedt ? "wird geladen" : "keine Daten",
            text: laedt ? "Wird gerade geladen …" : "Noch kein Bericht im fileadmin"};
  }
  const letzter = ord[ord.length-1];
  const ok = letzter >= monatMinus(erwarteterMonat(), k.toleranz || 0);
  const zeile = monatsName(letzter) + (ok ? "" : ", neuerer Bericht fehlt");
  return {art: ok ? "ok" : "warn", letzter: letzter, kurz: kurzMonat(letzter),
          zeile: zeile, text: zeile + " · " + standNotiz(id)};
}

/* ---------- Auffälligkeiten ---------- */
const AUFFAELLIG_SCHWELLE = 15;

/* Alle Kennzahlen eines Kanals, die um mehr als die Schwelle vom
   Vergleichswert abweichen — die stärksten zuerst. */
function abweichungen(id, cur, cmp, schwelle){
  const grenze = schwelle === undefined ? AUFFAELLIG_SCHWELLE : schwelle;
  const k = kanal(id), funde = [];
  if(!k || !cur || !cur.kpi || !cmp || !cmp.kpi) return funde;
  k.kpis.forEach(function(def){
    const jetzt = cur.kpi[def.key], vorher = cmp.kpi[def.key];
    if(!hatWert(jetzt) || !hatWert(vorher) || vorher === 0) return;
    const diff = ((jetzt - vorher) / vorher) * 100;
    if(Math.abs(diff) < grenze || Math.abs(diff) < 0.05) return;
    const steigt = diff > 0;
    const out = FORMATTERS[def.kind || "num"] || fmt;
    funde.push({
      key: def.key,
      diff: diff,
      gut: LOWER_IS_BETTER.has(def.key) ? !steigt : steigt,
      label: def.label,
      richtung: steigt ? "steigt" : "sinkt",
      betrag: nf.format(Math.round(Math.abs(diff) * 10) / 10) + " %",
      von: out(vorher), auf: out(jetzt)
    });
  });
  return funde.sort(function(a,b){ return Math.abs(b.diff) - Math.abs(a.diff); });
}

function auffaelligkeiten(id, cur, cmp, cmpLabel){
  const k = kanal(id);
  if(!k || !cur || !cur.kpi) return "";
  const kopf = '<div class="card insight bmk-full">' +
    '<div class="card-head"><h2>Das ist diesen Monat passiert</h2>';
  if(!cmp || !cmp.kpi){
    return kopf + '<span class="card-note">Ohne Vergleichsmonat</span></div>' +
      '<p class="ruhig">Für diesen Monat liegt kein Vergleichswert vor. Sobald ein Vormonat ' +
      'hinterlegt ist, werden auffällige Abweichungen hier automatisch benannt.</p></div>';
  }
  const funde = abweichungen(id, cur, cmp);
  const kopf2 = kopf + '<span class="card-note">Abweichungen über ' + AUFFAELLIG_SCHWELLE +
    ' % vs. ' + esc(cmpLabel) + '</span></div>';
  if(!funde.length){
    return kopf2 + '<p class="ruhig">Ein ruhiger Monat: Keine Kennzahl weicht um mehr als ' +
      AUFFAELLIG_SCHWELLE + ' % vom ' + esc(cmpLabel) + ' ab.</p></div>';
  }
  const liste = funde.slice(0,5).map(function(f){
    return '<li class="' + (f.gut ? "pos" : "neg") + '">' +
      '<span class="ico">' + (f.diff > 0 ? "▲" : "▼") + '</span>' +
      '<span><b>' + esc(f.label) + '</b> ' + f.richtung + ' um <span class="zahl">' +
      f.betrag + '</span> — von ' + esc(f.von) + ' auf ' + esc(f.auf) + '</span></li>';
  }).join("");
  const mehr = funde.length > 5
    ? '<p class="ruhig" style="margin-top:10px">Weitere ' + (funde.length - 5) +
      ' Kennzahlen weichen ebenfalls deutlich ab — die Kacheln oben zeigen alle Werte.</p>' : "";
  return kopf2 + '<ul>' + liste + '</ul>' + mehr + '</div>';
}

/* Kurzer Name wie in der Seitenleiste („Liniennetzplan" statt

  const text = nav ? nav.textContent.replace(/\s+/g, " ").trim() : "";

function kanalIcon(id, klasse){

const PFEIL_AUF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/></svg>';

/* Vergleich für die Übersicht: immer die Standardart des Kanals
   (Vormonat bzw. vorheriger Versand). */
function ovVergleich(id, monat){
  const k = KANAELE[id], d = k.daten();
  const art = vergleichArten(id)[0];
  const key = k.vergleichsMonat ? k.vergleichsMonat(monat, art.v) : prevKey(monat, art.v);
  const cmp = (key && d[key]) || null;
  return {cmp: cmp, label: k.vergleichLabel ? k.vergleichLabel(cmp, art) : art.kurz};
}

/* Leitkennzahlen eines Kanals: die drei, die er selbst benennt —
   sonst die ersten drei Kacheln. */
function leitDefs(id){
  const k = KANAELE[id];
  const keys = k.leitKpis || k.kpis.map(function(d){ return d.key; });
  return keys.map(function(key){ return k.kpis.find(function(d){ return d.key === key; }); })
             .filter(Boolean).slice(0,3);
}
function kpiWert(id, monat, key){
  const d = datensatz(id)[monat];
  const v = d && d.kpi ? d.kpi[key] : null;
  return hatWert(v) ? v : null;
}

/* Alle Veränderungen im jeweils jüngsten Bericht, ohne Schwelle.
   Daraus lesen sowohl die Kachel „Stärkster Anstieg / Rückgang" als
   auch die Liste der deutlichen Bewegungen. */
function ovAbweichungen(infos){
  const alle = [];
  infos.forEach(function(i){
    if(!i.s.letzter) return;
    const v = ovVergleich(i.id, i.s.letzter);
    abweichungen(i.id, datensatz(i.id)[i.s.letzter], v.cmp, 0).forEach(function(f){
      f.id = i.id; f.monat = i.s.letzter; f.cmpLabel = v.label; alle.push(f);
    });
  });
  return {
    alle: alle,
    auf: alle.filter(f => f.diff > 0).sort((a,b) => b.diff - a.diff)[0] || null,
    ab:  alle.filter(f => f.diff < 0).sort((a,b) => a.diff - b.diff)[0] || null
  };
}

/* ---------- Kachel: stärkster Anstieg und Rückgang ---------- */
function ovExtreme(abw){
  function block(f, titel, klasse, pfeil, leer){
    if(!f) return '<div class="block"><span class="klein-titel">' + titel + '</span>' +
      '<span class="gross">—</span><p>' + leer + '</p></div>';

      '<span class="gross">' + pfeil + f.betrag + '</span>' +
      '<p><b>' + esc(f.label) + '</b> bei ' + esc(kurzName(f.id)) + ', von ' + esc(f.von) +
      ' auf ' + esc(f.auf) + ' (' + esc(kurzMonat(f.monat)) + ' vs. ' + esc(f.cmpLabel) + ')</p></div>';
  }
  return '<div class="card ov-extrem ov-oben">' +
    block(abw.auf, "Stärkster Anstieg", "auf", PFEIL_AUF, "Im jeweils letzten Bericht ist keine Kennzahl gestiegen.") +
    '<div class="trenner"></div>' +
    block(abw.ab, "Stärkster Rückgang", "ab", PFEIL_AB, "Im jeweils letzten Bericht ist keine Kennzahl gesunken.") +
  '</div>';
}

/* ---------- Kachel: Niveau zum 12-Monats-Hoch ---------- */
function ovNiveau(infos){
  const zeilen = infos.map(function(i){
    const def = i.s.letzter ? leitDefs(i.id)[0] : null;
    let wert = null, hoch = null;
    if(def){
      wert = kpiWert(i.id, i.s.letzter, def.key);
      for(let n = 0; n < 12; n++){
        const v = kpiWert(i.id, monatMinus(i.s.letzter, n), def.key);
        if(v !== null && (hoch === null || v > hoch)) hoch = v;
      }
    }
    if(wert === null || !hoch){
      return '<li class="leer">' + kanalIcon(i.id, "aus") +
        '<span class="n">' + esc(kurzName(i.id)) + '</span><span class="p">—</span>' +
        '<span class="bahn"><span data-w="0"></span></span></li>';
    }
    const anteil = Math.round(wert / hoch * 100);
    return '<li title="' + esc(def.label + ": " + (FORMATTERS[def.kind || "num"] || fmt)(wert) +
        " im " + monatsName(i.s.letzter) + ", " + anteil + " % des Höchstwerts der letzten 12 Monate") + '">' +
      kanalIcon(i.id) +
      '<span class="n">' + esc(kurzName(i.id)) + '</span><span class="p">' + anteil + ' %</span>' +
      '<span class="bahn"><span data-w="' + anteil + '"></span></span></li>';
  }).join("");
  return '<div class="card ov-niveau ov-oben">' +
    '<div class="card-head"><h2>Niveau</h2><span class="card-note">Anteil am 12-Monats-Hoch</span></div>' +
    '<ul>' + zeilen + '</ul></div>';
}

  const fehlt = infos.filter(i => i.s.art !== "ok");
  const laedt = !!Object.keys(laufend).length;
  const text = !fehlt.length
    ? 'Alle Kanäle sind auf dem aktuellen Stand.'
    : 'Es fehlt noch: ' + fehlt.map(function(i){
        return '<b>' + esc(kurzName(i.id)) + '</b> (' + esc(i.s.letzter ? "zuletzt " + kurzMonat(i.s.letzter) : i.s.kurz) + ')';
      }).join(", ") + '.';
  return '<div class="card ov-ring ov-oben">' +
    '<div class="card-head"><h2>Datenstand</h2><span class="card-note">fällig bis ' + esc(kurzMonat(erwarteterMonat())) + '</span></div>' +
    '<div class="ring">' +
      '<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="bmk-ring-verlauf" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#9db8ff"/><stop offset="1" stop-color="#1b59f8"/></linearGradient></defs>' +
        '<circle class="bg" cx="60" cy="60" r="52"/>' +
        '<circle class="fg" cx="60" cy="60" r="52" style="stroke-dasharray:' + umfang.toFixed(1) +
          ';stroke-dashoffset:' + offen.toFixed(1) + ';--umfang:' + umfang.toFixed(1) + '"/>' +
      '</svg>' +
      '<div class="mitte"><b>' + aktuell + '/' + gesamt + '</b><span>Kanäle aktuell</span></div>' +
    '</div>' +
    '<p>' + text + '</p>' +
    '<button type="button" class="ov-knopf' + (laedt ? " laeuft" : "") + '" data-aktion="neu">' +

      (laedt ? "Wird eingelesen …" : "Alle Kanäle neu einlesen") + '</button>' +
  '</div>';
}

/* ---------- Kachel: Jahresvergleich ---------- */

/* Weiche Kurve ohne Überschwinger (monotone kubische Interpolation):
   Die Linie bleibt zwischen zwei Monatswerten und sackt nie unter null. */
function glattPfad(p){
  const n = p.length;
  if(n < 2) return "";
  if(n === 2) return "M" + p[0][0] + " " + p[0][1] + " L" + p[1][0] + " " + p[1][1];
  const dx = [], m = [], t = [];
  for(let i = 0; i < n - 1; i++){
    dx[i] = p[i+1][0] - p[i][0];
    m[i] = (p[i+1][1] - p[i][1]) / dx[i];
  }
  t[0] = m[0]; t[n-1] = m[n-2];
  for(let i = 1; i < n - 1; i++) t[i] = (m[i-1] * m[i] <= 0) ? 0 : (m[i-1] + m[i]) / 2;
  for(let i = 0; i < n - 1; i++){
    if(m[i] === 0){ t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i] / m[i], b = t[i+1] / m[i], h = a*a + b*b;
    if(h > 9){ const s = 3 / Math.sqrt(h); t[i] = s * a * m[i]; t[i+1] = s * b * m[i]; }
  }
  const f = x => x.toFixed(2);
  let d = "M" + f(p[0][0]) + " " + f(p[0][1]);
  for(let i = 0; i < n - 1; i++){
    const h = dx[i] / 3;
    d += " C" + f(p[i][0] + h) + " " + f(p[i][1] + t[i] * h) + " " +
         f(p[i+1][0] - h) + " " + f(p[i+1][1] - t[i+1] * h) + " " + f(p[i+1][0]) + " " + f(p[i+1][1]);
  }
  return d;
}
/* Runde Achsenschritte: 1, 2, 2,5, 5 oder 10 mal einer Zehnerpotenz */
function schoenerSchritt(roh){
  if(!(roh > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(roh)));
  const n = roh / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

function ovVerlauf(infos){
  const mitDaten = infos.filter(i => i.s.letzter);
  if(!mitDaten.length){
    return '<div class="card ov-verlauf ov-s8"><div class="card-head"><h2>Jahresvergleich</h2></div>' +
      '<p class="ruhig">Sobald Kennzahlen eingelesen sind, erscheint hier der Verlauf über zwölf Monate.</p></div>';
  }
  if(!mitDaten.some(i => i.id === state.ovKanal)) state.ovKanal = mitDaten[0].id;
  const id = state.ovKanal, k = KANAELE[id];
  const letzter = mitDaten.find(i => i.id === id).s.letzter;
  const defs = leitDefs(id);
  if(!defs.some(d => d.key === state.ovMetrik)) state.ovMetrik = defs[0].key;
  const def = defs.find(d => d.key === state.ovMetrik);
  const out = FORMATTERS[def.kind || "num"] || fmt;

  const keys = [];
  for(let n = 11; n >= 0; n--) keys.push(monatMinus(letzter, n));
  const akt = keys.map(key => kpiWert(id, key, def.key));
  const vor = keys.map(key => kpiWert(id, monatMinus(key, 12), def.key));
  const hatVor = vor.some(v => v !== null);

  const alleWerte = akt.concat(vor).filter(v => v !== null);
  const schritt = schoenerSchritt(Math.max.apply(null, alleWerte.concat([0])) / 4);
  let oben = schritt;
  while(oben < Math.max.apply(null, alleWerte.concat([0]))) oben += schritt;
  const x = i => i / 11 * 100;
  const y = v => 100 - v / oben * 100;

  function punkte(reihe){
    return reihe.map((v,i) => v === null ? null : [x(i), y(v), v, i]).filter(Boolean);
  }
  const pa = punkte(akt), pv = punkte(vor);
  const linieA = glattPfad(pa), linieV = glattPfad(pv);
  const flaeche = pa.length > 1
    ? linieA + " L" + pa[pa.length-1][0].toFixed(2) + " 100 L" + pa[0][0].toFixed(2) + " 100 Z" : "";

  const gitter = [], yLabels = [];
  for(let w = 0; w <= oben + schritt / 1000; w += schritt){
    const top = y(w).toFixed(2);
    gitter.push('<span class="vl-gitter" style="top:' + top + '%"></span>');
    yLabels.push('<span class="vl-y" style="top:' + top + '%">' + out(w) + '</span>');
  }
  const xLabels = keys.map(function(key, i){
    return '<span class="vl-x' + ((11 - i) % 2 ? " jeder2" : "") + '" style="left:' + x(i).toFixed(2) + '%">' + MONTH_SHORT[+key.slice(5,7) - 1] + '</span>';
  }).join("");
  function kreise(pts, klasse, versatz){
    return pts.map(function(p, n){
      const key = monatMinus(keys[p[3]], versatz);
      const cur = klasse === "" && n === pts.length - 1 ? " cur" : "";
      const rand = p[3] >= 10 ? " rand-r" : p[3] <= 1 ? " rand-l" : "";
      return '<span class="vp ' + klasse + cur + rand + '" style="left:' + p[0].toFixed(2) + '%;top:' + p[1].toFixed(2) + '%">' +
        '<i></i><span class="tip">' + esc(kurzMonat(key)) + ': ' + out(p[2]) + '</span></span>';
    }).join("");
  }

  /* Fazit nur über Monate, die in beiden Zeiträumen einen Wert haben —
     sonst verglichen wir unterschiedlich viele Monate miteinander.
     Gezeigt wird der Monatsschnitt: Summen wären bei eindeutigen
     Besuchern oder gleichzeitigen Nutzern schlicht falsch. */
  let fazit = "";
  const paare = akt.map((v,i) => [v, vor[i]]).filter(p => p[0] !== null && p[1] !== null);
  if(paare.length){
    const a = paare.reduce((s,p) => s + p[0], 0) / paare.length;
    const b = paare.reduce((s,p) => s + p[1], 0) / paare.length;
    if(b > 0){
      const diff = (a - b) / b * 100;
      const rund = Math.round(diff * 10) / 10;
      const gut = LOWER_IS_BETTER.has(def.key) ? rund < 0 : rund > 0;
      const farbe = rund === 0 ? "flat" : gut ? "up" : "down";
      fazit = '<p class="vl-fazit">Im Schnitt <b>' + out(a) + '</b> je Monat, <b class="' + farbe + '">' +
        (rund > 0 ? "+" : rund < 0 ? "−" : "±") + nf.format(Math.abs(rund)) + ' %</b> gegenüber ' +
        (paare.length === 12 ? "den 12 Monaten davor" : "denselben " + paare.length +
          (paare.length === 1 ? " Monat" : " Monaten") + " im Vorjahr") + '.</p>';
    }
  }
  if(!fazit && !hatVor){
    fazit = '<p class="vl-fazit">Für den Vorjahreszeitraum liegen noch keine Werte vor.</p>';
  }

  const kanalKnoepfe = infos.map(function(i){
    return '<button type="button" data-ovkanal="' + esc(i.id) + '" title="' + esc(i.k.titel) + '" aria-label="' +
      esc(i.k.titel) + '" aria-pressed="' + (i.id === id) + '"' + (i.s.letzter ? "" : " disabled") + '>' +
      iconSvg(i.id) + '</button>';
  }).join("");
  const metrikKnoepfe = defs.map(function(d){
    return '<button type="button" data-ovmetrik="' + esc(d.key) + '" aria-pressed="' + (d.key === def.key) + '">' +
      esc(d.label) + '</button>';
  }).join("");

  return '<div class="card ov-verlauf ov-s8">' +
    '<div class="card-head"><h2>Jahresvergleich</h2><div class="kwahl">' + kanalKnoepfe + '</div></div>' +
    '<div class="vl-zeile">' +
      '<span class="wer"><b>' + esc(k.titel) + '</b>, 12 Monate bis ' + esc(kurzMonat(letzter)) + '</span>' +
      '<div class="segmented">' + metrikKnoepfe + '</div>' +
    '</div>' +
    '<div class="vl">' + gitter.join("") + yLabels.join("") + xLabels +
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
        '<defs><linearGradient id="bmk-vl-flaeche" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#1b59f8" stop-opacity=".16"/>' +
          '<stop offset="1" stop-color="#1b59f8" stop-opacity="0"/></linearGradient></defs>' +
        (flaeche ? '<path class="f-akt" d="' + flaeche + '"/>' : '') +
        (linieV ? '<path class="l-vor" d="' + linieV + '" vector-effect="non-scaling-stroke"/>' : '') +
        (linieA ? '<path class="l-akt" d="' + linieA + '" vector-effect="non-scaling-stroke"/>' : '') +
      '</svg>' +
      kreise(pv, "o", 12) + kreise(pa, "", 0) +
    '</div>' +
    '<div class="vl-legende"><span><i></i>' + esc(def.label) + ', letzte 12 Monate</span>' +
      '<span><i class="o"></i>Vorjahreszeitraum</span></div>' +
    fazit +
  '</div>';
}

/* ---------- Kachel: weitere deutliche Bewegungen ----------
   Alles über der Schwelle — außer den beiden Werten, die oben schon
   groß als stärkster Anstieg und Rückgang stehen. */
function ovBewegungen(abw){
  const liste = abw.alle.filter(function(f){
    return Math.abs(f.diff) >= AUFFAELLIG_SCHWELLE && f !== abw.auf && f !== abw.ab;
  }).sort(function(a,b){ return Math.abs(b.diff) - Math.abs(a.diff); });
  const zeilen = liste.slice(0,6).map(function(f){
    return '<li class="' + (f.gut ? "pos" : "neg") + '">' +
      '<button type="button" data-go="' + esc(f.id) + '" title="' + esc(KANAELE[f.id].titel) + ' öffnen">' +
        kanalIcon(f.id) +
        '<span class="satz"><b>' + esc(f.label) + '</b><span>' + esc(kurzName(f.id)) + ' · ' +
          esc(f.von) + ' → ' + esc(f.auf) + '</span></span>' +
        '<span class="wert">' + (f.diff > 0 ? "▲ " : "▼ ") + f.betrag + '</span>' +
      '</button></li>';
  }).join("");
  return '<div class="card ov-aus ov-s4">' +
    '<div class="card-head"><h2>Weitere Bewegungen</h2>' +
    '<span class="card-note">über ' + AUFFAELLIG_SCHWELLE + ' % zum Vergleich</span></div>' +
    (zeilen
      ? '<ul>' + zeilen + '</ul>' +
        (liste.length > 6 ? '<p class="ruhig mehr">' + (liste.length - 6) +
          ' weitere stehen in den einzelnen Kanälen.</p>' : '')
      : '<p class="ruhig">Außer den beiden Werten links oben weicht keine Kennzahl um mehr als ' +
        AUFFAELLIG_SCHWELLE + ' % vom Vergleich ab.</p>') +
  '</div>';
}

/* ---------- Tafel: Kanäle im Vergleich ---------- */

/* Trendlinie über zwölf Kalendermonate bis zum jüngsten Bericht, mit
   einem Punkt je Monat, der beim Überfahren den Wert zeigt. Skaliert
   zwischen Minimum und Maximum, damit Bewegung sichtbar wird. */
function ovSpark(id, def, monat){
  const punkte = [];
  for(let i = 11; i >= 0; i--){
    const key = monatMinus(monat, i);
    const v = kpiWert(id, key, def.key);
    if(v !== null) punkte.push({x: (11 - i) / 11 * 100, v: v, key: key});
  }
  if(punkte.length < 2){
    return '<span class="ov-spark"><span class="kurz">Noch zu wenige Monate für einen Trend</span></span>';
  }
  const werte = punkte.map(p => p.v);
  const min = Math.min.apply(null, werte), max = Math.max.apply(null, werte);
  const spanne = max - min || 1;
  const y = v => 40 - (v - min) / spanne * 34;      /* 6 … 40 von 46 */
  const linie = "M" + punkte.map(p => p.x.toFixed(2) + " " + y(p.v).toFixed(2)).join(" L");
  const flaeche = linie + " L " + punkte[punkte.length-1].x.toFixed(2) + " 46 L " + punkte[0].x.toFixed(2) + " 46 Z";
  const out = FORMATTERS[def.kind || "num"] || fmt;
  const kreise = punkte.map(function(p, n){
    return '<span class="op' + (n === punkte.length - 1 ? " cur" : n === 0 ? " erst" : "") + '" style="left:' + p.x.toFixed(2) +
      '%;top:' + (y(p.v) / 46 * 100).toFixed(2) + '%"><i></i>' +
      '<span class="tip">' + esc(kurzMonat(p.key)) + ': ' + out(p.v) + '</span></span>';
  }).join("");
  const label = def.label + " von " + kurzMonat(punkte[0].key) + " bis " + kurzMonat(punkte[punkte.length-1].key);
  return '<span class="ov-spark">' +
      '<svg viewBox="0 0 100 46" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
        '<path class="area" d="' + flaeche + '"></path>' +
        '<path class="line" d="' + linie + '" vector-effect="non-scaling-stroke"></path>' +
      '</svg>' + kreise +
    '</span>';
}

function ovWert(def, cur, v, klasse){
  const w = cur && cur.kpi ? cur.kpi[def.key] : null;
  const out = FORMATTERS[def.kind || "num"] || fmt;
  const delta = (hatWert(w) && v.cmp)
    ? deltaHTML(def.key, w, v.cmp.kpi ? v.cmp.kpi[def.key] : null, v.label)
    : '<span class="delta flat"><em>kein Vergleich</em></span>';
  return '<span class="ov-wert ' + klasse + '">' +
    '<span class="l">' + esc(def.label) + '</span>' +
    '<span class="v">' + (hatWert(w) ? out(w) : "—") + '</span>' + delta + '</span>';
}

function ovTafel(infos){
  const zeilen = infos.map(function(i){
    const id = i.id, s = i.s;
    const kanalZelle =
      '<span class="ov-kanal">' + kanalIcon(id, s.letzter ? "" : "aus") +
        '<span class="t"><b>' + esc(i.k.titel) + '</b>' +
        '<small class="' + (s.art === "warn" ? "warn" : "") + '" title="' + esc(s.text) + '">' +
          esc(s.zeile || s.text) + '</small></span>' +
      '</span>';
    if(!s.letzter){
      return '<button type="button" class="ov-row" data-go="' + esc(id) + '">' + kanalZelle +
        '<span class="ov-leer">' + (s.kurz === "wird geladen"
          ? "Die Kennzahlen werden gerade eingelesen."
          : "Sobald ein Bericht im fileadmin liegt, erscheinen hier die Leitkennzahlen.") + '</span>' +
        '<span class="ov-pfeil"></span></button>';
    }
    const cur = datensatz(id)[s.letzter];
    const v = ovVergleich(id, s.letzter);
    const defs = leitDefs(id);
    return '<button type="button" class="ov-row" data-go="' + esc(id) + '">' +
      kanalZelle +
      ovWert(defs[0], cur, v, "ov-lead") +
      ovSpark(id, defs[0], s.letzter) +
      (defs[1] ? ovWert(defs[1], cur, v, "ov-neben n2") : '<span></span>') +
      (defs[2] ? ovWert(defs[2], cur, v, "ov-neben n3") : '<span></span>') +
      '<span class="ov-pfeil"></span>' +
    '</button>';
  }).join("");
  return '<div class="card ov-board ov-s12">' +
    '<div class="card-head"><h2>Kanäle im Vergleich</h2>' +
    '<span class="card-note">jeweils jüngster Bericht</span></div>' +
    '<div class="ov-kopf"><span>Kanal</span><span>Leitkennzahl</span>' +
      '<span>Letzte 12 Monate</span><span>Weitere Kennzahlen</span><span></span><span></span></div>' +
    zeilen +
  '</div>';
}

function ovInfos(){
  return kanalListe().map(function(id){ return {id:id, k:KANAELE[id], s:standInfo(id)}; });
}
function renderUebersicht(){
  const infos = ovInfos();
  const abw = ovAbweichungen(infos);
  return '<div class="ov">' +
    ovExtreme(abw) + ovNiveau(infos) + ovRing(infos) +
    ovVerlauf(infos) + ovBewegungen(abw) +
    ovTafel(infos) +
  '</div>';
}

/* Einzelne Kachel austauschen, ohne die ganze Übersicht neu aufzubauen
   (sonst liefe jedes Mal die Aufbau-Animation aller Kacheln). */
function ovErsetzen(selektor, html){
  const alt = document.querySelector("#views " + selektor);
  if(!alt) return;
  const t = document.createElement("div");
  t.innerHTML = html;
  const neu = t.firstElementChild;
  neu.style.animation = "none";
  neu.classList.add("still");
  alt.replaceWith(neu);
  animate(neu);
}

/* ---------- PDF ---------- */
function alsPdf(){
  const zeile = document.getElementById("pdf-stand");
  const k = kanalInfo();
  if(zeile){
    const teile = ["Kennzahlen BMK", k ? k.titel : "Alle Kanäle"];
    if(k && state[k.monatFeld]) teile.push(monatsName(state[k.monatFeld]));
    teile.push("Stand " + new Date().toLocaleDateString("de-DE",
      {day:"2-digit", month:"long", year:"numeric"}));
    zeile.textContent = teile.join(" · ");
  }
  window.print();
}

/* ============================================================
   14. RENDERING UND BEDIENUNG
   ============================================================ */
function animate(scope){
  requestAnimationFrame(function(){
    scope.querySelectorAll(".fill").forEach(el => { el.style.height = el.dataset.h + "%"; });
    scope.querySelectorAll(".barline span, .minibar span, .bahn span").forEach(el => { el.style.width = el.dataset.w + "%"; });
  });
  scope.querySelectorAll("[data-count]").forEach(countUp);
}

/* still = true: nach dem Nachladen ohne erneute Aufbau-Animation */
function render(still){
  const k = kanalInfo();
  const istUebersicht = state.view === "overview";
  document.getElementById("view-title").textContent =
    istUebersicht ? "Alle Kanäle" : (k ? k.titel : "");
  document.getElementById("view-sub").textContent =
    istUebersicht ? "Leitkennzahlen und Datenstand im Überblick" : (k ? k.untertitel : "");

  /* Filterleiste nur bei Kanälen mit Zeitreihe. Neue angebundene Kanäle
     tragen sich in KANAELE ein und erhalten sie damit automatisch. */
  const hatDaten = !!(k && k.ordnung().length && state[k.monatFeld]);
  document.getElementById("filters").classList.toggle("aus", !hatDaten);
  if(k){
    /* Jeder Kanal bringt seine eigenen Vergleichsarten mit. */
    const arten = vergleichArten(state.view);
    state.compare[state.view] = vergleichArt(state.view).v;
    compareCombo.setOptions(arten.map(a => ({v:a.v, t:a.t})), state.compare[state.view]);
  }
  if(hatDaten){
    const monat = state[k.monatFeld], jahr = monat.slice(0,4);
    yearCombo.setOptions(jahreListe().map(j => ({v:j, t:j})), jahr);
    monthCombo.setOptions(monateImJahr(jahr).map(x => ({v:x, t:monatsLabel(x)})), monat);
  }

  const box = document.getElementById("views");
  box.classList.toggle("still", !!still);
  if(istUebersicht)  box.innerHTML = renderUebersicht();
  else if(k)         box.innerHTML = hatDaten ? k.zeichnen() : leerHinweis(k.leerTitel, k.leerText);
  else               box.innerHTML = "";

  zeigeStatus();
  animate(box);
  bindChartSwitch(box);
  bindUebersicht(box);
}

/* Klick auf eine Zeile der Tafel oder eine Bewegung öffnet den Kanal. */
function bindUebersicht(scope){
  const ov = scope.querySelector(".ov");
  if(!ov) return;
  ov.addEventListener("click", function(e){
    const b = e.target.closest("[data-go]");
    if(b && KANAELE[b.dataset.go]){ wechsle(b.dataset.go); return; }
    const kw = e.target.closest("[data-ovkanal]");
    if(kw){ state.ovKanal = kw.dataset.ovkanal; ovErsetzen(".ov-verlauf", ovVerlauf(ovInfos())); return; }
    const mw = e.target.closest("[data-ovmetrik]");
    if(mw){ state.ovMetrik = mw.dataset.ovmetrik; ovErsetzen(".ov-verlauf", ovVerlauf(ovInfos())); return; }
    if(e.target.closest('[data-aktion="neu"]')) refreshData();
  });
}

/* Beim Umschalten wird nur die Diagramm-Kachel ausgetauscht. Würde hier
   render() laufen, bauten sich alle Kacheln neu auf und liefen noch
   einmal durch ihre Aufbau-Animation. */
function bindChartSwitch(scope){
  const k = kanalInfo();
  if(!k || !k.chart) return;
  const sw = scope.querySelector("#chart-switch");
  if(!sw) return;
  sw.addEventListener("click", function(e){
    const b = e.target.closest("button");
    if(!b) return;

    const host = document.getElementById("views");
    const alt  = host.querySelector(".chart");

    const neu = temp.querySelector(".chart");
    if(alt && neu){
      alt.replaceWith(neu);
      animate(neu);
      bindChartSwitch(host);
    }

}

/* ---------- Laden ----------
   Ein Kanal, ein Weg: Daten holen, Monat prüfen, Zwischenspeicher
   schreiben, Statuszeile setzen. Die Shell weiß dabei nicht, ob sie
   gerade ein PDF, eine Excel oder eine CSV gelesen hat. */
function kanalLaden(id, modus){
  const k = kanal(id);
  if(!k || !k.holen) return Promise.resolve();
  const vorher = Object.keys(k.daten());
  setStatus("loading", "Daten werden geladen …", id);
  const melde = function(text){ setStatus("loading", text, id); };

  return Promise.resolve().then(function(){ return k.holen(melde); }).then(function(bilanz){
    const b = bilanz || {gelesen:0};
    b.neu = Object.keys(k.daten()).filter(x => vorher.indexOf(x) === -1).length;
    monatPruefen(id);
    cacheSchreiben(id);
    GELADEN[id] = {zeit: Date.now(), quelle: "live"};
    setStatus("live", ladeMeldung(id, b), id);
    if(state.view === id || state.view === "overview") render(state.view === "overview");
  }).catch(function(err){
    /* Beim Öffnen genügt der Hinweis, dass noch nichts im Ordner liegt.
       Erst wenn jemand bewusst auf Aktualisieren geklickt hat, gehört
       die Ursache angezeigt. */
    if(modus === "start") setStatus("local", k.leerStatus, id);
    else                  setStatus("error", k.fehlerText + err.message, id);
    if(state.view === id || state.view === "overview") render(state.view === "overview");
  });
}

/* Die Sperre gilt je Kanal, nicht für das ganze Dashboard. */
const laufend = {};
function knopfPruefen(){
  if(Object.keys(laufend).length) return;
  refreshBtn.classList.remove("is-loading");
  if(state.view === "overview") ovErsetzen(".ov-ring", ovRing(ovInfos()));
}
function ladenStarten(ids, modus){
  const offen = ids.filter(function(id){ return KANAELE[id] && !laufend[id]; });
  if(!offen.length) return Promise.resolve();
  offen.forEach(function(id){ laufend[id] = true; });
  refreshBtn.classList.add("is-loading");
  if(state.view === "overview") ovErsetzen(".ov-ring", ovRing(ovInfos()));
  return Promise.all(offen.map(function(id){
    return kanalLaden(id, modus).then(function(){ delete laufend[id]; knopfPruefen(); });
  })).then(knopfPruefen, knopfPruefen);
}

/* „Aktualisieren" lädt den Kanal neu, der gerade zu sehen ist — in der
   Übersicht alle — und umgeht dabei den Zwischenspeicher. */
function refreshData(){
  ladenStarten(state.view === "overview" ? kanalIds() : [state.view], "knopf");
}
