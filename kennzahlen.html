}

function appHolen(melde){
  melde("Excel-Datei wird gelesen …");
  return ladeXlsx().then(function(XLSX){
    return fetch(APP_SOURCE, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("Excel-Datei nicht gefunden · " + APP_SOURCE);
      return r.arrayBuffer();
    }).then(function(buf){
      const wb = XLSX.read(buf, {type:"array", cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:"", raw:true});
      const next = {};
      let uebersprungen = 0;
      rows.forEach(function(row){
        const key = appMonthKey(row["Monat"]);
        if(!key){ if(String(row["Monat"] || "").trim()) uebersprungen++; return; }
        const eventMap = {};
        APP_EVENTS.forEach(function(name){
          if(row[name] !== undefined && row[name] !== "") eventMap[name] = normalizeNumber(row[name]);
        });
        const events = Object.entries(eventMap).sort((a,b)=>b[1]-a[1]);
        /* Genau die Spalten aus APP_FELDER, nichts anderes. Fehlt eine
           Spalte in der Tabelle, bleibt der Wert leer statt 0 — sonst
           sähe eine fehlende Spalte wie ein echter Nullwert aus. */
        const kpi = {};
        Object.keys(APP_FELDER).forEach(function(feld){
          const zelle = row[APP_FELDER[feld]];
          kpi[feld] = (zelle === undefined || zelle === "") ? null : normalizeNumber(zelle);
        });
        next[key] = {label: monatsName(key), kpi:kpi, events:events, eventMap:eventMap};
      });
      if(!Object.keys(next).length) throw new Error("Keine gültigen Monatszeilen in der Excel-Datei");
      DATA_APP = next;
      return {gelesen: Object.keys(next).length, fehler: uebersprungen, fehlerNamen: []};
    });
  });
}

function blattApp(keys){
  const summen = {};
  keys.forEach(function(k){
    const m = DATA_APP[k].eventMap || {};
    Object.keys(m).forEach(function(n){ summen[n] = (summen[n] || 0) + m[n]; });
  });
  const namen = Object.keys(summen).sort(function(a,b){ return summen[b] - summen[a]; });
  /* Spaltenreihenfolge wie in APP_FELDER, damit Tabelle und Export
     dieselbe Sprache sprechen. */
  const kopf = ["Monat","Aktive Nutzer","Neuinstallationen","Deinstallationen","Abstürze",
                "Sessions","Bildschirmaufrufe (screen_view)","Interaktionen (user_engagement)",
                "Sitzungsstarts (session_start)","iOS","Android"].concat(namen);
  const zeilen = keys.map(function(k){
    const d = DATA_APP[k], kpi = d.kpi;
    const leer = function(v){ return hatWert(v) ? v : ""; };
    return [d.label, leer(kpi.activeUsers), leer(kpi.installs), leer(kpi.uninstalls),
            leer(kpi.crashes), leer(kpi.sessions), leer(kpi.screenViews),
            leer(kpi.engagement), leer(kpi.sessionStarts), leer(kpi.ios), leer(kpi.android)]
      .concat(namen.map(function(n){ return d.eventMap[n] === undefined ? "" : d.eventMap[n]; }));
  });
  return [kopf].concat(zeilen);
}

   Quelle: CleverReach-Versandberichte (CSV) im fileadmin.
   Eine Datei = ein Versand = ein Monatswert.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/newsletter/
   Im Code stehen bewusst keine Versandwerte.
   ============================================================ */
let DATA_NEWSLETTER = {};

const NEWSLETTER_QUELLE = {
  ordner:      "/fileadmin/user_upload/17_kennzahlen/newsletter/",
  maxDateien:  60,       /* Sicherheitsnetz gegen versehentlich volle Ordner */
  probeMonate: 24,       /* so viele Monate rückwärts suchen, wenn kein Listing */
  /* Falls der Server kein Verzeichnislisting erlaubt und die Dateien
     anders heißen als newsletter_<monat>_<jahr>.csv, können die Namen
     hier fest eingetragen werden. */
  dateien: []
};

/* Dateinamen im Ordner: newsletter_august_2025.csv. Groß-/Kleinschreibung
   ist auf dem Server relevant, und TYPO3 wandelt Umlaute beim Hochladen
   um („märz" kann als „maerz" liegen) — deshalb deckt die Liste beide
   Formen ab. Sobald ein Muster einmal getroffen hat, wird nur noch
   dieses verwendet. */
const NL_BASIS = ["newsletter","Newsletter"];
function nlFormen(monat){
  return {klein: monat.toLowerCase(), gross: monat,
          kleinOhne: ohneUmlaute(monat).toLowerCase(), grossOhne: ohneUmlaute(monat)};
}
function nlDatei(basis, form, jahr){
  return NEWSLETTER_QUELLE.ordner + encodeURIComponent(basis + "_" + form + "_" + jahr + ".csv");
}
function nlVarianten(monat, jahr){
  const formen = nlFormen(monat), out = [], gesehen = {};
  NL_BASIS.forEach(function(basis){
    Object.keys(formen).forEach(function(art){
      const url = nlDatei(basis, formen[art], jahr);
      if(gesehen[url]) return;
      gesehen[url] = 1;
      out.push({id: basis + "|" + art, url: url});
    });
  });
  return out;
}
function nlNachMuster(id, monat, jahr){
  const teile = id.split("|"), form = nlFormen(monat)[teile[1]];
  const urls = [nlDatei(teile[0], form, jahr)];
  const ohne = ohneUmlaute(form);
  if(ohne !== form) urls.push(nlDatei(teile[0], ohne, jahr));
  return urls;
}

  unsubscribeRate: {label:"Abmelderate",        csv:["Unsubscribers","Abmeldungen","Abmelder"],                     art:"pct", spalte:"prozent"},
  spam:            {label:"Spam-Meldungen",     csv:["Spam Complaints","Spam-Beschwerden","Spam"],                  art:"num"},
  spamRate:        {label:"Spam-Rate",          csv:["Spam Complaints","Spam-Beschwerden","Spam"],                  art:"pct", spalte:"prozent"}
};

/* Textfelder aus dem CSV-Kopf */
const NEWSLETTER_TEXTE = {
  name:    ["Name","Mailing","Mailingname"],
  subject: ["Subject","Betreff"],
  date:    ["Delivery Date/Time","Delivery Date","Versanddatum","Versendet am","Datum"]
};

/* Beschriftungen vergleichbar machen: ohne Doppelpunkt, Leerzeichen
   und Groß-/Kleinschreibung. So ist es gleich, ob in der Datei
   "Total Recipients:" oder "Total recipients" steht. */
function nlSchluessel(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/\u00a0/g," ").toLowerCase().replace(/[\s:.\-_]/g,"");
}

/* CleverReach exportiert in zwei Dialekten. Der eine schreibt saubere
   Felder:
       "Bounces:","1.391","4,54%"
   der andere legt Anführungszeichen um die ganze Zeile und verdoppelt
   die inneren:
       "Bounces:,""890"",""3,03%"""
   Unbehandelt wird daraus ein einziges Feld — die Datei liest sich dann
   ohne einen einzigen Wert ein. Deshalb wird der zweite Dialekt vor dem
   Zerlegen wieder ausgepackt. Umgestellt wird nur, wenn die Mehrheit
   der Zeilen so aussieht; eine normale CSV mit einem escapten
   Anführungszeichen im Betreff bleibt unangetastet. */
function csvVorbereiten(text){
  const zeilen = String(text).split(/\r?\n/);
  let umschlossen = 0, gesamt = 0;
  zeilen.forEach(function(z){
    const t = z.trim();
    if(!t) return;
    gesamt++;
    if(/^".*"$/.test(t) && t.indexOf('""') > -1) umschlossen++;
  });
  if(!gesamt || umschlossen / gesamt < 0.5) return text;
  return zeilen.map(function(z){
    const t = z.trim();
    if(!/^".*"$/.test(t) || t.indexOf('""') === -1) return z;
    return t.slice(1, -1).replace(/""/g, '"');
  }).join("\n");
}

/* CleverReach schreibt CSV mit Kommas als Trenner und Werten in
   Anführungszeichen; je nach Konto kann es auch ein Semikolon sein.
   Der Trenner wird deshalb aus dem Dateikopf abgeleitet. */
function csvTrenner(text){
  const kopf = text.split("\n").slice(0,15).join("\n");
  const zaehl = z => (kopf.match(new RegExp("\\" + z, "g")) || []).length;
  const komma = zaehl(","), semi = zaehl(";"), tab = (kopf.match(/\t/g) || []).length;
  if(semi > komma && semi >= tab) return ";";
  if(tab > komma && tab > semi) return "\t";
  return ",";
}
function csvZeilen(text, trenner){
  const zeilen = [], reihe = [];
  let feld = "", drinnen = false;
  function feldRaus(){ reihe.push(feld); feld = ""; }
  function zeileRaus(){ feldRaus(); zeilen.push(reihe.slice()); reihe.length = 0; }
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(drinnen){
      if(c === '"' && text[i+1] === '"'){ feld += '"'; i++; continue; }
      if(c === '"'){ drinnen = false; continue; }
      feld += c;
    }else{
      if(c === '"'){ drinnen = true; continue; }
      if(c === trenner){ feldRaus(); continue; }
      if(c === '\n'){ zeileRaus(); continue; }
      if(c === '\r') continue;
      feld += c;
    }
  }
  if(feld.length || reihe.length) zeileRaus();
  return zeilen;
}

/* Zahl aus einer CSV-Zelle. Erkennt deutsches und englisches Format:
   "29.314" und "29,314" werden zu 29314, "1,45%" und "1.45%" zu 1.45.
   Leere Zellen ergeben null, nicht 0. */
function csvZahl(v){
  if(v === undefined || v === null) return null;
  let s = String(v).replace(/\u00a0/g," ").trim();
  if(!s || !/\d/.test(s)) return null;
  const negativ = /^\s*-/.test(s);
  s = s.replace(/[^\d.,]/g,"");
  const komma = s.lastIndexOf(","), punkt = s.lastIndexOf(".");
  if(komma > -1 && punkt > -1){
    /* Der hintere der beiden Trenner ist das Dezimalzeichen. */
    if(komma > punkt) s = s.replace(/\./g,"").replace(",",".");
    else s = s.replace(/,/g,"");
  }else if(komma > -1){
    s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,"") : s.replace(",",".");
  }else if(punkt > -1){
    if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  }
  const n = parseFloat(s);
  if(!isFinite(n)) return null;
  return negativ ? -n : n;
}

/* "05.03.2026 12:43:35" · "2026-03-05" · "03/05/2026" → "2026-03" */
function csvMonatsSchluessel(datum){
  const s = String(datum || "").trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return m[1] + "-" + String(+m[2]).padStart(2,"0");
  m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s);
  if(m) return m[3] + "-" + String(+m[2]).padStart(2,"0");
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);      /* CleverReach englisch: MM/TT/JJJJ */
  if(m) return m[3] + "-" + String(+m[1]).padStart(2,"0");
  return null;
}
/* Sortierwert eines Versanddatums, damit bei zwei Versänden im selben
   Monat der jüngere gewinnt. */
function csvDatumWert(datum){
  const s = String(datum || "").trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return +(m[1] + String(+m[2]).padStart(2,"0") + String(+m[3]).padStart(2,"0"));
  m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s);
  if(m) return +(m[3] + String(+m[2]).padStart(2,"0") + String(+m[1]).padStart(2,"0"));
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
  if(m) return +(m[3] + String(+m[1]).padStart(2,"0") + String(+m[2]).padStart(2,"0"));
  return 0;
}
/* Notnagel: Monat aus dem Dateinamen, wenn im Kopf kein Datum steht. */
function monatAusDateiname(url){
  const name = decodeURIComponent(String(url || "").split("/").pop());
  let m = /(\d{4})[-_.](\d{2})/.exec(name);
  if(m && +m[2] >= 1 && +m[2] <= 12) return m[1] + "-" + m[2];
  m = /([A-Za-zÄÖÜäöü]+)[-_ ](\d{4})/.exec(name);
  if(m){
    const nr = MONAT_SUCHE[monatsSchluessel(m[1])];
    if(nr) return m[2] + "-" + String(nr).padStart(2,"0");
  }
  return null;
}

/* ---------- Zeitverlauf aus der CSV ----------
   CleverReach legt unter dem Kopf einen Zeitverlauf der Öffnungen und
   Klicks ab. Je nach Bericht steht dort eine Zeile pro Tag oder – bei der
   24-Stunden-Auswertung – eine Zeile pro Stunde. Die alte Tabelle zeigte
   einfach die ersten sieben Zeilen; bei Stundenwerten waren das sieben
   Stunden desselben Tages. Deshalb werden die Zeilen jetzt gelesen,
   erkannt (Tag, Uhrzeit) und zu Tagen, Tageszeiten und Wochentagen
   zusammengefasst. */

/* Wie nlSchluessel, zusätzlich ohne Umlaut-Zeichen: „Öffnungen" → „offnungen". */
function nlNorm(s){
  return nlSchluessel(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
}
/* Abschnittsüberschriften erkennen */
function nlAbschnitt(erst){
  const n = String(erst || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
  if(/^(daily|hourly)overview$|^(tages|stunden)(ubersicht|verlauf)$|^24stunden|performance$|^zeitverlauf$/.test(n)) return "tage";
  if(/^links?(overview)?$|^linkubersicht$|^linksubersicht$/.test(n)) return "links";
  return null;
}
/* Spalten der Zeitreihe aus der Kopfzeile. Ohne erkennbaren Kopf gilt die
   bekannte Reihenfolge Datum · Öffnungen unique · gesamt · Klicks unique · gesamt. */
const NL_STANDARD = {datum:0, uOpen:1, tOpen:2, uClick:3, tClick:4};
function nlSpalten(kopf){
  const sp = Object.assign({}, NL_STANDARD);
  let erkannt = 0;
  kopf.forEach(function(zelle, i){
    const n = nlNorm(zelle);
    if(!n) return;
    if(/^(date|datum|day|tag|zeitpunkt|period|zeitraum)/.test(n)){ sp.datum = i; erkannt++; }
    else if(/^(time|uhrzeit|zeit|hour|stunde)/.test(n)){ sp.zeit = i; erkannt++; }
    else if(/(unique|eindeutig).*(open|offn)|(open|offn).*(unique|eindeutig)/.test(n)){ sp.uOpen = i; erkannt++; }
    else if(/(unique|eindeutig).*(click|klick)|(click|klick).*(unique|eindeutig)/.test(n)){ sp.uClick = i; erkannt++; }
    else if(/(total|gesamt).*(open|offn)|(open|offn).*(total|gesamt)|^(opens|offnungen)$/.test(n)){ sp.tOpen = i; erkannt++; }
    else if(/(total|gesamt).*(click|klick)|(click|klick).*(total|gesamt)|^(clicks|klicks)$/.test(n)){ sp.tClick = i; erkannt++; }
  });
  return erkannt ? sp : Object.assign({}, NL_STANDARD);
}
/* „05.08.2025 10:00" · „2025-08-05 10:00:00" · „08/05/2025 10:00 AM" ·
   „05.08.2025" · „10:00" → {tag:"2025-08-05" oder null, stunde:10 oder null} */
function nlZeitpunkt(wert){
  const s = String(wert == null ? "" : wert).trim();
  let tag = null, rest = s, m;
  if((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))){
    tag = [m[1], m[2], m[3]]; rest = s.slice(m[0].length);
  }else if((m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec(s))){
    tag = [m[3].length === 2 ? "20" + m[3] : m[3], m[2], m[1]]; rest = s.slice(m[0].length);
  }else if((m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s))){       /* englisch: Monat zuerst */
    tag = [m[3].length === 2 ? "20" + m[3] : m[3], m[1], m[2]]; rest = s.slice(m[0].length);
  }
  return {
    tag: tag ? tag[0] + "-" + String(+tag[1]).padStart(2,"0") + "-" + String(+tag[2]).padStart(2,"0") : null,
    stunde: nlStunde(rest)
  };
}
function nlStunde(wert){
  const s = String(wert == null ? "" : wert).trim();
  const m = /(?:^|[\sT,])?(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i.exec(s) ||
            /^(\d{1,2})(?:\s*(?:Uhr|h))?$/i.exec(s);
  if(!m) return null;
  let h = +m[1];
  const suffix = (m[3] || "").toUpperCase();
  if(suffix === "PM" && h < 12) h += 12;
  if(suffix === "AM" && h === 12) h = 0;
  return h >= 0 && h < 24 ? h : null;
}
function tagPlus(tag, n){
  const d = new Date(tag + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/* Zeilen → Tagesverlauf, Tageszeit (0–23 Uhr) und Wochentage (Mo–So).
   Gezählt werden die Unique-Öffnungen; Klicks laufen für die Tooltips mit. */
function nlZeitverlauf(zeilen, versandDatum){
  const versand = nlZeitpunkt(versandDatum);
  /* Zeilen ohne Datum (nur Uhrzeit) hängen am Versandtag; springt die
     Uhrzeit zurück, ist Mitternacht vorbei. */
  let basis = versand.tag, letzte = -1;
  zeilen.forEach(function(z){
    if(z.tag){ basis = z.tag; letzte = z.stunde === null ? -1 : z.stunde; return; }
    if(!basis) return;
    if(z.stunde !== null && z.stunde < letzte) basis = tagPlus(basis, 1);
    z.tag = basis;
    if(z.stunde !== null) letzte = z.stunde;
  });

  const jeTag = {};
  const stunden = new Array(24).fill(0), stundenKlicks = new Array(24).fill(0);
  let mitStunde = 0;
  zeilen.forEach(function(z){
    const o = z.uOpen || 0, c = z.uClick || 0;
    if(z.tag){
      const t = jeTag[z.tag] || (jeTag[z.tag] = {tag:z.tag, uOpen:0, tOpen:0, uClick:0, tClick:0});
      t.uOpen += o; t.tOpen += z.tOpen || 0; t.uClick += c; t.tClick += z.tClick || 0;
    }
    if(z.stunde !== null){ stunden[z.stunde] += o; stundenKlicks[z.stunde] += c; mitStunde++; }
  });
  const verlauf = Object.keys(jeTag).sort().map(function(k){ return jeTag[k]; });
  /* Wochentage nur, wenn der Verlauf mindestens eine Woche umfasst —
     sonst stünde fast alles auf dem Versandtag. */
  let wochentage = null;
  if(verlauf.length >= 7){
    wochentage = new Array(7).fill(0);
    verlauf.forEach(function(t){ wochentage[(new Date(t.tag + "T12:00:00").getDay() + 6) % 7] += t.uOpen; });
  }
  return {
    verlauf: verlauf,
    stunden: mitStunde ? stunden : null,
    stundenKlicks: mitStunde ? stundenKlicks : null,
    wochentage: wochentage,
    versandTag: versand.tag,
    versandStunde: versand.stunde
  };
}

/* Themen eines Versands aus den geklickten Links: aus
   „…/tickets/deutschlandticket" wird „Deutschlandticket". Abmelde-,
   Profil- und CleverReach-Links sind kein Thema und fallen heraus. */
const NL_KLEIN = ["im","in","und","der","die","das","den","dem","des","für","mit","von","vom","zu","zum","zur",
                  "am","an","auf","bei","ab","aus","ohne","oder","nach","über","unter","im","ins"];
const NL_SOCIAL = /(^|\.)(facebook|instagram|twitter|x|linkedin|youtube|tiktok|xing|threads|whatsapp)\.com$/;
function nlThema(url){
  let u;
  try{ u = new URL(String(url || "").trim()); }catch(e){ return null; }
  if(!/^https?:$/.test(u.protocol)) return null;
  const host = u.hostname.replace(/^www\./, "");
  if(/cleverreach|sendcockpit|crsend|unsubscribe|abmeld|newsletter-profil|profile/i.test(host + u.pathname)) return null;
  if(NL_SOCIAL.test(host)) return "Social Media";
  const teile = u.pathname.split("/").filter(Boolean)
    .map(function(t){ try{ return decodeURIComponent(t); }catch(e){ return t; } })
    .map(function(t){ return t.replace(/\.(html?|php|aspx?|pdf)$/i, ""); })
    .filter(function(t){ return t && !/^\d+$/.test(t) && !/^(de|en|index|home|start|startseite)$/i.test(t); });
  if(!teile.length) return "Startseite " + host;
  return teile[teile.length - 1].replace(/[-_+]+/g, " ").replace(/\s+/g, " ").trim().split(" ")
    .map(function(w, i){
      const klein = w.toLowerCase();
      if(i > 0 && NL_KLEIN.indexOf(klein) > -1) return klein;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
}
function nlThemen(links){
  const summe = {}, reihenfolge = [];
  let gesamt = 0;
  (links || []).forEach(function(l){
    const t = nlThema(l.url), k = l.klicks || 0;
    if(!t || !(k > 0)) return;
    if(summe[t] === undefined){ summe[t] = 0; reihenfolge.push(t); }
    summe[t] += k; gesamt += k;
  });
  return reihenfolge.map(function(t){ return {thema:t, klicks:summe[t], anteil: gesamt ? summe[t] / gesamt * 100 : 0}; })
    .sort(function(a,b){ return b.klicks - a.klicks; });
}

/* Liest eine CleverReach-CSV und liefert {key, wert} oder null.
   Die Datei ist in Blöcke gegliedert (Kopf / Zeitverlauf / Links),
   getrennt durch Leerzeilen; wir laufen einmal durch und tragen die
   Zeilen in den richtigen Topf. */
function parseNewsletter(text, url){
  const roh = csvVorbereiten(text);
  const zeilen = csvZeilen(roh, csvTrenner(roh));
  const kopf = {}, tage = [], links = [];
  let abschnitt = "kopf", spalten = null;

  zeilen.forEach(function(r){
    if(!r.length || (r.length === 1 && !String(r[0]).trim())) return;
    const erst = nlSchluessel(r[0]);
    const neu = nlAbschnitt(erst);
    if(neu){ abschnitt = neu; spalten = null; return; }

    if(abschnitt === "kopf"){
      if(!erst) return;
      kopf[erst] = {wert: r[1], prozent: r[2]};
    }else if(abschnitt === "tage"){
      const z = r.map(function(c){ return String(c == null ? "" : c).trim(); });
      if(!spalten){
        /* Erste Zeile des Blocks: Kopfzeile, sofern sie nicht mit einer Ziffer beginnt. */
        if(!/^\d/.test(z[0])){ spalten = nlSpalten(z); return; }
        spalten = Object.assign({}, NL_STANDARD);
      }
      const dz = z[spalten.datum] || "";
      if(!/^\d/.test(dz)) return;                   /* Summen- und Zwischenzeilen */
      const zp = nlZeitpunkt(dz);
      if(zp.stunde === null && spalten.zeit !== undefined) zp.stunde = nlStunde(z[spalten.zeit]);
      tage.push({tag:zp.tag, stunde:zp.stunde,
                 uOpen:csvZahl(z[spalten.uOpen]), tOpen:csvZahl(z[spalten.tOpen]),
                 uClick:csvZahl(z[spalten.uClick]), tClick:csvZahl(z[spalten.tClick])});
    }else if(abschnitt === "links"){
      if(erst === "pos" || erst === "position" || erst === "url") return;
      if(!String(r[1] || "").trim()) return;
      links.push({pos:r[0], url:r[1], klicks:csvZahl(r[2]), anteil:String(r[3] || "").trim()});
    }
  });

  /* Textfelder aus dem Kopf holen — erste passende Beschriftung gewinnt. */
  const text_ = {};
  Object.keys(NEWSLETTER_TEXTE).forEach(function(feld){
    const treffer = NEWSLETTER_TEXTE[feld].map(nlSchluessel).find(s => kopf[s]);
    text_[feld] = treffer ? String(kopf[treffer].wert || "").trim() : "";
  });

  /* Der Dateiname bestimmt den Monat: so steht der Versand dort, wo ihn
     auch der Ordner einsortiert. Fehlt im Namen ein Monat, springt das
     Versanddatum aus dem Kopf ein. */
  const key = monatAusDateiname(url) || csvMonatsSchluessel(text_.date);
  if(!key) return null;

  const kpi = {};
  Object.keys(NEWSLETTER_FELDER).forEach(function(feld){
    const f = NEWSLETTER_FELDER[feld];
    if(f.abgeleitet){ kpi[feld] = null; return; }
    const treffer = f.csv.map(nlSchluessel).find(s => kopf[s]);
    if(!treffer){ kpi[feld] = null; return; }
    const zelle = kopf[treffer];
    kpi[feld] = csvZahl(f.spalte === "prozent" ? zelle.prozent : zelle.wert);
  });
  /* Klickrate ein zweites Mal — diesmal auf die zugestellten Mails. */
  kpi.clickRateDeliv = (hatWert(kpi.uniqueClicks) && kpi.delivered > 0)
    ? Math.round(kpi.uniqueClicks / kpi.delivered * 1000) / 10
    : null;

  const zv = nlZeitverlauf(tage, text_.date);
  return {key: key, wert: {
    label:   monatsName(key),
    name:    text_.name,
    subject: text_.subject,
    date:    text_.date,
    sort:    csvDatumWert(text_.date),
    kpi:     kpi,
    verlauf: zv.verlauf,
    stunden: zv.stunden,
    stundenKlicks: zv.stundenKlicks,
    wochentage: zv.wochentage,
    versandTag: zv.versandTag,
    versandStunde: zv.versandStunde,
    links:   links,
    themen:  nlThemen(links).slice(0, 6)
  }};
}

/* „2026-07-07" → „Di, 07.07.2026" */
function nlTagText(tag, mitWochentag){
  if(!tag) return "";
  return new Date(tag + "T12:00:00").toLocaleDateString("de-DE",
    mitWochentag === false ? {day:"2-digit", month:"2-digit", year:"numeric"}
                           : {weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"});
}

/* Kopf der Newsletter-Ansicht: Worum ging es in diesem Versand? Der
   Betreff ist der übergeordnete Titel; die Themen ergeben sich aus den
   Links, auf die tatsächlich geklickt wurde. */
function newsletterThema(cur){
  const titel = cur.subject || cur.name || ("Newsletter " + cur.label);
  const wann = [];
  if(cur.versandTag) wann.push("Versand am " + nlTagText(cur.versandTag));
  else if(cur.date) wann.push("Versand am " + cur.date);
  if(cur.versandStunde !== null && cur.versandStunde !== undefined) wann.push(String(cur.versandStunde).padStart(2,"0") + " Uhr");
  if(cur.name && cur.subject) wann.push("Mailing „" + cur.name + "“");
  const themen = (cur.themen || []).slice(0, 5);
  const chips = themen.map(function(t){
    return '<span class="nl-chip" title="' + esc(fmt(t.klicks)) + ' Klicks">' + esc(t.thema) +
           '<b>' + esc(pct(t.anteil)) + '</b></span>';
  }).join("");
  return '<div class="card nl-thema bmk-full">' +
    '<span class="nl-icon" aria-hidden="true">' + iconSvg("news") + '</span>' +
    '<div class="nl-inhalt">' +
      '<span class="nl-kicker">' + esc(wann.join(" · ") || cur.label) + '</span>' +
      '<p class="nl-betreff">' + esc(titel) + '</p>' +
      (chips
        ? '<div class="nl-themen"><span class="nl-label">Meistgeklickte Themen</span>' + chips + '</div>'
        : '<div class="nl-themen"><span class="nl-label">Für diesen Versand sind keine Link-Klicks im Bericht enthalten.</span></div>') +
    '</div>' +
  '</div>';
}

/* Versand als Trichter: Empfänger → zugestellt → geöffnet → geklickt.
   Neben jeder Stufe steht der Anteil an der Stufe davor — genau so
   rechnet CleverReach seine Raten, damit sind die Bezugsgrößen auf
   einen Blick klar. */
function newsletterVersandkarte(cur){
  const k = cur.kpi;
  const stufen = [
    {name:"Empfänger",  wert:k.recipients,   text:"Empfänger gesamt"},
    {name:"Zugestellt", wert:k.delivered,    text: hatWert(k.delivered) && k.recipients > 0 ? pct(k.delivered / k.recipients * 100) + " der Empfänger" : ""},
    {name:"Geöffnet",   wert:k.uniqueOpens,  text: hatWert(k.openRate) ? pct(k.openRate) + " der Zugestellten" : ""},
    {name:"Geklickt",   wert:k.uniqueClicks, text: hatWert(k.clickRate) ? pct(k.clickRate) + " der Öffner" : ""}
  ].filter(function(st){ return hatWert(st.wert); });
  const basis = maxOf(stufen.map(function(st){ return st.wert; }));
  const trichter = stufen.map(function(st, i){
    return '<div class="tr-stufe s' + i + '">' +
      '<span class="tr-name">' + esc(st.name) + '</span>' +
      '<span class="tr-bahn"><span data-w="' + Math.max(1.5, st.wert / basis * 100) + '"></span></span>' +
      '<span class="tr-wert"><b>' + fmt(st.wert) + '</b><em>' + esc(st.text) + '</em></span>' +
    '</div>';
  }).join("");
  const zeile = function(name, wert){
    return '<div><span class="lname">' + esc(name) + '</span><span class="lval">' + esc(wert || "—") + '</span></div>';
  };
  return '<div class="card split right nl-versand">' +
    '<div class="card-head"><h2>Versand</h2><span class="card-note">Angaben aus CleverReach</span></div>' +
    (trichter ? '<div class="trichter">' + trichter + '</div>' : '') +
    '<div class="legend nl-meta">' +
      zeile("Mailing", cur.name) +
      zeile("Versanddatum", cur.date) +
    '</div>' +
    '<p class="hint">Jede Stufe bezieht sich auf die davor: Öffnungsrate auf die zugestellten Mails, Klickrate auf die Öffner' +
      (hatWert(k.clickRateDeliv) ? ' – auf alle Zugestellten gerechnet sind es ' + pct(k.clickRateDeliv) : '') +
      '. Die Bounce-Rate bezieht CleverReach auf alle Empfänger.</p>' +
  '</div>';
}

/* Zeitverlauf nach dem Versand: je Tag, je Stunde, je Wochentag — so weit
   der Bericht es hergibt. Aufbau wie beim Liniennetzplan: der Verlauf über
   die volle Breite, darunter Tageszeit und Wochentage nebeneinander. */
function newsletterZeitverlauf(cur){
  const verlauf = cur.verlauf || [];
  const stunden = cur.stunden;
  const summeStunden = stunden ? stunden.reduce(function(a,b){ return a + b; }, 0) : 0;
  const hatVerlauf = verlauf.length >= 3;
  const hatStunden = !!stunden && summeStunden > 0;
  const hatWochen  = !!cur.wochentage;
  const out = [];

  if(hatVerlauf){
    const spitze = verlauf.reduce(function(a,t){ return t.uOpen > a.uOpen ? t : a; }, verlauf[0]);
    const summe = verlauf.reduce(function(a,t){ return a + t.uOpen; }, 0);
    const ersteZwei = verlauf.slice(0, 2).reduce(function(a,t){ return a + t.uOpen; }, 0);
    out.push(balkenReihe({
      klasse:"full", titel:"Öffnungen im Monatsverlauf", note: verlauf.length + " Tage ab Versand",
      einheit:"Öffnungen",
      punkte: verlauf.map(function(t){
        return {label: String(+t.tag.slice(8,10)), wert: t.uOpen, aktiv: t.tag === cur.versandTag,
                tipp: nlTagText(t.tag), zusatz: fmt(t.uClick) + " Klicks"};
      }),
      hinweis: "Unique-Öffnungen je Tag laut CleverReach-Bericht, blau beschriftet der Versandtag. Stärkster Tag: " +
               nlTagText(spitze.tag) + " mit " + fmt(spitze.uOpen) + " Öffnungen" +
               (summe > 0 ? " – die ersten beiden Tage bringen " + pct(ersteZwei / summe * 100) + " aller Öffnungen." : ".")
    }));
  }

  /* Tageszeit und Wochentage teilen sich eine Zeile; steht nur eins von
     beiden im Bericht, nimmt es die volle Breite. */
  const paar = hatStunden && hatWochen;
  if(hatStunden){
    const spitzeH = stunden.indexOf(Math.max.apply(null, stunden));
    out.push(balkenReihe({
      klasse: paar ? "" : "full", titel:"Tageszeit", note:"Unique-Öffnungen je Stunde",
      einheit:"Öffnungen",
      punkte: stunden.map(function(v, h){
        return {label: String(h).padStart(2,"0"), wert: v, aktiv: h === cur.versandStunde,
                tipp: String(h).padStart(2,"0") + ":00–" + String(h).padStart(2,"0") + ":59 Uhr",
                zusatz: fmt((cur.stundenKlicks || [])[h] || 0) + " Klicks"};
      }),
      hinweis: "Stärkste Stunde: " + String(spitzeH).padStart(2,"0") + " Uhr mit " +
               pct(stunden[spitzeH] / summeStunden * 100) + " der Öffnungen" +
               (hatWert(cur.versandStunde) ? ", blau beschriftet die Versandstunde" : "") + "."
    }));
  }
  if(hatWochen){
    const summeW = cur.wochentage.reduce(function(a,b){ return a + b; }, 0);
    const versandWt = cur.versandTag ? (new Date(cur.versandTag + "T12:00:00").getDay() + 6) % 7 : -1;
    out.push(balkenReihe({
      klasse: paar ? "rechts" : "full", titel:"Wochentage", note:"Unique-Öffnungen je Wochentag",
      einheit:"Öffnungen",
      punkte: cur.wochentage.map(function(v, i){
        return {label: WOCHENTAGE[i], wert: v, aktiv: i === versandWt, tipp: WOCHENTAGE[i]};
      }),
      hinweis: "Summe über den ganzen Verlauf" + (versandWt > -1 ? ", blau beschriftet der Versandtag" : "") + "." +
               (summeW > 0 ? " Samstag und Sonntag zusammen: " + pct((cur.wochentage[5] + cur.wochentage[6]) / summeW * 100) + "." : "")
    }));
  }

  if(!out.length){
    return leereKachel("chart full", "Zeitverlauf",
      "Dieser Versandbericht enthält keinen auswertbaren Zeitverlauf der Öffnungen.");
  }
  /* Was der Bericht nicht hergibt, wird benannt statt stillschweigend weggelassen. */
  let fehlt = "";
  if(!hatVerlauf && hatStunden){
    fehlt = "Dieser Bericht enthält nur die ersten 24 Stunden nach dem Versand. Einen Verlauf über mehrere Tage " +
            "und die Wochentage zeigt das Dashboard, sobald CleverReach Tageswerte mitliefert.";
  }else if(hatVerlauf && !hatStunden){
    fehlt = "Dieser Bericht enthält Tageswerte ohne Uhrzeit – eine Auswertung nach Tageszeit ist deshalb nicht möglich.";
  }else if(hatVerlauf && !hatWochen){
    fehlt = "Für die Wochentage reicht der Verlauf nicht aus (weniger als sieben Tage).";
  }
  return out.join("") + (fehlt ? '<p class="nl-fehlt bmk-full">' + esc(fehlt) + '</p>' : '');
}

function renderNewsletter(){
  const cur = DATA_NEWSLETTER[state.monthNews];
  const v = vergleich("news"), cmp = v.cmp, cmpLabel = v.label;

  /* Meistgeklickte Links — rechts neben den KPI-Kacheln und genauso

    legende:"Balken = relativ zum meistgeklickten Link. Der Anteil bezieht sich auf alle Klicks des Versands.",
    leerText:"Für diesen Versand sind keine Links im Bericht enthalten.",

      ranking +
      jahresChart("news") +

      auffaelligkeiten("news", cur, cmp, cmpLabel) +

    '</div>';
}

/* Holt eine CSV — oder null, wenn es die Datei nicht gibt. TYPO3
   beantwortet fehlende Dateien teils mit einer HTML-Fehlerseite und
   Status 200; die wird hier ebenfalls als „nicht vorhanden" gewertet. */
function holeText(url){
  return fetch(url, {cache:"no-store"})
    .then(function(res){
      if(!res.ok) return null;
      const typ = res.headers.get("content-type") || "";
      if(typ.indexOf("html") > -1) return null;
      return res.text();
    })
    .then(function(text){
      if(!text) return null;
      return /^\s*</.test(text) ? null : text;
    })
    .catch(function(){ return null; });
}

function newsletterHolen(melde){
  melde("Ordner wird durchsucht …");
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[], hinweise:[]};
  const next = {};
  let doppelt = 0;

  function uebernehmen(text, url){
    let r = null;
    try{ r = parseNewsletter(text, url); }catch(e){ r = null; }
    if(!r){
      bilanz.fehler++;
      if(bilanz.fehlerNamen.length < 4){
        try{ bilanz.fehlerNamen.push(decodeURIComponent(url.split("/").pop())); }
        catch(e){ bilanz.fehlerNamen.push(url); }
      }
      return;
    }
    bilanz.gelesen++;
    /* Zwei Versände im selben Monat: der jüngere gewinnt. */
    if(next[r.key]){
      doppelt++;
      if((r.wert.sort || 0) < (next[r.key].sort || 0)) return;
    }
    next[r.key] = r.wert;
    melde(r.wert.label + " gelesen …");
  }

  const fest = NEWSLETTER_QUELLE.dateien.map(function(n){
    return NEWSLETTER_QUELLE.ordner + encodeURIComponent(n);
  });
  const suche = fest.length ? Promise.resolve(fest)
                            : ordnerListing(NEWSLETTER_QUELLE.ordner, "csv");

  return suche.then(function(urls){

    /* Weg A: Der Server listet den Ordner auf – dann kennen wir die Namen genau. */
    if(urls.length){
      let kette = Promise.resolve();
      const genutzt = urls.slice(0, NEWSLETTER_QUELLE.maxDateien);
      genutzt.forEach(function(url, i){
        kette = kette.then(function(){
          melde("Versand " + (i+1) + " von " + genutzt.length + " wird gelesen …");
          return holeText(url).then(function(text){ if(text) uebernehmen(text, url); });
        });
      });
      return kette;
    }

    /* Weg B: Kein Listing – newsletter_<monat>_<jahr>.csv durchprobieren
       und das gefundene Muster für die übrigen Monate merken. */
    const monate = letzteMonate(NEWSLETTER_QUELLE.probeMonate);
    let muster = null;
    let kette = Promise.resolve();

    monate.forEach(function(m){
      kette = kette.then(function(){
        if(bilanz.gelesen >= NEWSLETTER_QUELLE.maxDateien) return;
        melde("Suche " + m.monat + " " + m.jahr + " …");

        if(muster){                                   /* Muster bekannt: ein Versuch genügt */
          const urls = nlNachMuster(muster, m.monat, m.jahr);
          let versuch = Promise.resolve(null);
          urls.forEach(function(url){
            versuch = versuch.then(function(t){
              if(t) return t;
              return holeText(url).then(function(x){ return x ? {text:x, url:url} : null; });
            });
          });
          return versuch.then(function(t){ if(t) uebernehmen(t.text, t.url); });
        }
        /* Muster unbekannt: alle Varianten gleichzeitig anfragen */
        const varianten = nlVarianten(m.monat, m.jahr);
        return Promise.all(varianten.map(function(v){
          return holeText(v.url).then(function(t){ return {v:v, t:t}; });
        })).then(function(ergebnisse){
          const treffer = ergebnisse.find(function(e){ return e.t; });
          if(!treffer) return;
          muster = treffer.v.id;
          uebernehmen(treffer.t, treffer.v.url);
        });
      });
    });
    return kette;

  }).then(function(){
    if(!Object.keys(next).length){
      throw new Error("Keine auswertbare CleverReach-CSV gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. newsletter_august_2025.csv");
    }
    DATA_NEWSLETTER = next;
    if(doppelt) bilanz.hinweise.push(doppelt + (doppelt === 1 ? " Versand" : " Versände") +
                                     " im selben Monat ersetzt");
    return bilanz;
  });
}

function blattNewsletter(keys){
  /* Der Kopf spiegelt NEWSLETTER_FELDER, ergänzt um die drei Textfelder
     aus dem CleverReach-Kopf. So landen auch die Kennzahlen im Export,
     die im Dashboard nicht als eigene Kachel auftauchen. */
  const felder = Object.keys(NEWSLETTER_FELDER);
  const kopf = ["Monat","Name","Betreff","Versanddatum","Meistgeklickte Themen"].concat(
    felder.map(function(f){
      const n = NEWSLETTER_FELDER[f];
      return n.exportLabel || (n.label + (n.art === "pct" ? " (%)" : ""));
    })
  );
  const zeilen = keys.map(function(k){
    const d = DATA_NEWSLETTER[k];
    const leer = function(v){ return hatWert(v) ? v : ""; };
    const themen = (d.themen || []).slice(0, 3).map(function(t){ return t.thema; }).join(", ");
    return [d.label, d.name || "", d.subject || "", d.date || "", themen]
      .concat(felder.map(function(f){ return leer(d.kpi[f]); }));
  });
  return [kopf].concat(zeilen);
}

   9. KANAL Interaktiver Liniennetzplan
   Quelle: AWStats-Monatsberichte (PDF) im fileadmin.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/ilnp/
   Dateiname:    statistik_fuer_netzplan-dortmund.de_01.26.pdf
   Im Code stehen bewusst keine Monatswerte.
   ============================================================ */
let DATA_NETZ = {};

const NETZ_QUELLE = {
  ordner:      "/fileadmin/user_upload/17_kennzahlen/ilnp/",
  basis:       "statistik_fuer_netzplan-dortmund.de_",
  maxBerichte: 30,
  probeMonate: 24
};
function netzDatei(mm, jahr){
  return NETZ_QUELLE.ordner + encodeURIComponent(
    NETZ_QUELLE.basis + mm + "." + String(jahr).slice(2) + ".pdf");
}
/* „…_01.26.pdf" → „2026-01" */
function netzMonatAusName(url){
  const m = /_(\d{2})\.(\d{2})\.pdf$/i.exec(decodeURIComponent(String(url || "")));
  return m ? "20" + m[2] + "-" + m[1] : null;
}

/* AWStats mischt zwei Zahlenformate: Anzahlen mit Tausendpunkt
   („109.622") und Verhältnisse mit Dezimalpunkt („15.91"). Genau drei
   Ziffern hinter dem letzten Punkt heißen Tausender. */
function awZahl(s){
  const t = String(s === undefined || s === null ? "" : s).trim();
  if(!t) return null;
  if(/^\d{1,3}(\.\d{3})+$/.test(t)) return parseInt(t.replace(/\./g,""), 10);
  const n = parseFloat(t.replace(",", "."));
  return isFinite(n) ? n : null;
}
const BYTE_FAKTOR = {bytes:1/1048576, kb:1/1024, mb:1, gb:1024, tb:1048576};
function awMB(wert, einheit){
  const n = awZahl(wert);
  if(n === null) return null;
  return n * (BYTE_FAKTOR[String(einheit || "mb").toLowerCase()] || 1);
}

/* Abschnitte des Berichts. Die Überschrift wird nicht verworfen: In
   manchen PDFs klebt die erste Datenzeile daran. */
const AW_ABSCHNITTE = [
  ["historie",   "Monatliche Historie"],
  ["tage",       "Tage im Monat"],
  ["wochentage", "Wochentage"],
  ["stunden",    "Stunden (Serverzeit)"],
  ["domains",    "Domains/Länder"],
  ["rechner",    "Rechner (Top"],
  ["robots",     "Robots/Spiders"],
  ["dauer",      "Aufenthaltsdauer"],
  ["dateitypen", "Datei-Typen"],
  ["downloads",  "Downloads (Top"],
  ["os",         "Betriebssysteme (Top"],
  ["browser",    "Browser (Top"],
  ["herkunft",   "Woher die Besucher kamen"],
  ["suche",      "Suchausdrücke"],
  ["begriffe",   "Suchbegriffe (Top"],
  ["sonstiges",  "Verschiedenes"]
];
function awAbschnitte(zeilen){
  const out = {};
  let aktuell = null;
  zeilen.forEach(function(roh){
    const z = String(roh || "").trim();
    if(!z) return;
    for(let i = 0; i < AW_ABSCHNITTE.length; i++){
      if(z.indexOf(AW_ABSCHNITTE[i][1]) === 0){
        aktuell = AW_ABSCHNITTE[i][0];
        if(!out[aktuell]) out[aktuell] = [];
        out[aktuell].push(z.slice(AW_ABSCHNITTE[i][1].length));
        return;
      }
    }
    if(aktuell) out[aktuell].push(z);
  });
  const text = {};
  Object.keys(out).forEach(function(k){ text[k] = out[k].join(" ").replace(/\s+/g," "); });
  return text;
}

/* Fehlt ein Abschnitt, weil die Überschrift im Textlayer anders
   aussieht als erwartet, wird ersatzweise der ganze Bericht durchsucht.
   Die Muster sind eng genug, dass das in der Regel trägt. */
function awQuelle(ab, name, alles){ return ab[name] || alles; }

/* Alle Treffer eines globalen Ausdrucks einsammeln */
function awTreffer(text, re){
  const out = [];
  let m;
  re.lastIndex = 0;
  while((m = re.exec(text || ""))) out.push(m);
  return out;
}

/* Betriebssysteme und Browser stehen in AWStats als feste Namensliste.
   Kommt ein neuer dazu, wird er hier ergänzt — sonst würde die
   Kopfzeile der Tabelle als Name gelesen. Längere Namen zuerst, damit
   „Windows Phone" nicht als „Windows" durchgeht. */
const NETZ_OS = ["Unknown Unix system","Windows Phone","Chrome OS","Macintosh","Windows",
                 "Android","Symbian","Linux","iOS","BSD","Unbekannt"];
const NETZ_BROWSER = ["IPhone (PDA/Phone browser)","Internet Explorer","Samsung Internet",
                      "Google Chrome","Microsoft Edge","Netscape","Firefox","Safari","Mozilla",
                      "Opera","Edge","Unbekannt"];
function reEscape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function awListe(text, namen, mitGrabber){
  const muster = new RegExp("(" + namen.map(reEscape).join("|") + ")" +
    (mitGrabber ? "(?:\\s+(?:Nein|Ja|\\?))?" : "") +
    "\\s+([\\d.]+)\\s+([\\d.,]+)\\s*%", "g");
  const out = [], gesehen = {};
  awTreffer(text, muster).forEach(function(m){
    if(gesehen[m[1]]) return;
    gesehen[m[1]] = 1;
    const wert = awZahl(m[2]);
    if(wert === null || wert <= 0) return;
    out.push([m[1], wert]);
  });
  return out.sort(function(a,b){ return b[1] - a[1]; });
}

const AW_MONATE = ["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];
const AW_KURZ = {};
MONATSNAMEN.forEach(function(n,i){ AW_KURZ[monatsSchluessel(n).slice(0,3)] = i+1; });
/* „März" steht im Textlayer je nach Schrift als März, Marz oder Maerz */
function awMonatMuster(nr){ return reEscape(AW_MONATE[nr-1]).replace(/ä/g, "[äa]e?"); }

const AW_DAUER = ["0s-30s","30s-2mn","2mn-5mn","5mn-15mn","15mn-30mn","30mn-1h","1h+","Unbekannt"];
const AW_WOCHENTAGE = ["Mo","Di","Mi","Do","Fr","Sa","So"];

function parseNetzBericht(zeilen, url){
  const ab = awAbschnitte(zeilen);
  const alles = zeilen.join(" ").replace(/\s+/g," ");

  /* Der Dateiname bestimmt den Monat; steht darin keiner, springt die
     Zeitspanne aus dem Kopf des Berichts ein. */
  let key = netzMonatAusName(url);
  if(!key){
    const m = /Zeitraum[:\s]+(?:Monthly\s+)?([A-Za-zÄÖÜäöü]{3,10})\.?\s+(\d{4})/.exec(alles);
    const nr = m ? AW_KURZ[monatsSchluessel(m[1]).slice(0,3)] : null;
    if(nr) key = m[2] + "-" + String(nr).padStart(2,"0");
  }
  if(!key) throw new Error("Zeitraum nicht erkannt");

  const jahr = key.slice(0,4), nr = +key.slice(5,7);

  /* Sicherster Anker sind die Jahreszeilen der „Monatlichen Historie":
     Monat, Besucher, Besuche, Seiten, Zugriffe, Bytes. */
  const hist = new RegExp(awMonatMuster(nr) + "\\s+" + jahr +
    "\\s+([\\d.]+)\\s+([\\d.]+)\\s+([\\d.]+)\\s+([\\d.]+)\\s+([\\d.,]+)\\s*(Bytes|KB|MB|GB|TB)")
    .exec(alles);

  /* Ersatzweise die Summenzeile der Tagestabelle und die Kopfzeile der
     Aufenthaltsdauer. */
  const summe = /Total\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/.exec(awQuelle(ab, "tage", alles) || "");
  const dauerKopf = /Anzahl der Besuche:\s*([\d.]+)\s*-\s*Durchschnitt:\s*([\d.,]+)\s*s/.exec(alles);
  const besucherRoh = /([\d.]+)\s+Unterschiedliche Besucher/.exec(alles);
  const bpb = /\(([\d.,]+)\s*Besuche\/Besucher\)/.exec(alles);
  const spb = /\(([\d.,]+)\s*Seiten\/Besuch\)/.exec(alles);

  const kpi = {
    visitors: hist ? awZahl(hist[1]) : (besucherRoh ? awZahl(besucherRoh[1]) : null),
    visits:   hist ? awZahl(hist[2]) : (summe ? awZahl(summe[1]) : (dauerKopf ? awZahl(dauerKopf[1]) : null)),
    pages:    hist ? awZahl(hist[3]) : (summe ? awZahl(summe[2]) : null),
    hits:     hist ? awZahl(hist[4]) : (summe ? awZahl(summe[3]) : null),
    bytes:    hist ? awMB(hist[5], hist[6]) : (summe ? awMB(summe[4], summe[5]) : null),
    avgTime:  dauerKopf ? awZahl(dauerKopf[2]) : null
  };
  if(!kpi.visits) throw new Error("Keine Besuche im Bericht");

  kpi.pagesPerVisit  = spb ? awZahl(spb[1]) : (kpi.pages && kpi.visits ? kpi.pages / kpi.visits : null);
  kpi.visitsPerUser  = bpb ? awZahl(bpb[1]) : (kpi.visits && kpi.visitors ? kpi.visits / kpi.visitors : null);

  /* Tage: Datum, Besuche, Seiten, Zugriffe, Bytes */
  const tage = awTreffer(awQuelle(ab, "tage", alles),
    /(\d{2})\.(\d{2})\.(\d{4})\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/g)
    .map(function(m){
      return {tag:m[1], datum:m[1] + "." + m[2] + ".", besuche:awZahl(m[4]),
              seiten:awZahl(m[5]), bytes:awMB(m[7], m[8])};
    });

  /* Stunden: 00–23, Seiten und Zugriffe */
  const stunden = [];
  const gesehen = {};
  awTreffer(awQuelle(ab, "stunden", alles), /(?:^|\s)([01]\d|2[0-3])\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/g)
    .forEach(function(m){
      if(gesehen[m[1]]) return;
      gesehen[m[1]] = 1;
      stunden.push({stunde:m[1], seiten:awZahl(m[2])});
    });
  stunden.sort(function(a,b){ return a.stunde < b.stunde ? -1 : 1; });

  /* Wochentage: Seiten je Tag */
  const wochenRoh = {};
  awTreffer(awQuelle(ab, "wochentage", alles), /(?:^|\s)(Mo|Di|Mi|Do|Fr|Sa|So)\s+([\d.]+)\s+([\d.]+)\s+([\d.,]+)\s*(Bytes|KB|MB|GB|TB)/g)
    .forEach(function(m){ if(wochenRoh[m[1]] === undefined) wochenRoh[m[1]] = awZahl(m[2]); });
  const wochentage = AW_WOCHENTAGE.map(function(t){ return {tag:t, seiten: wochenRoh[t] === undefined ? null : wochenRoh[t]}; });

  /* Aufenthaltsdauer je Klasse */
  const dauerRoh = {};
  awTreffer(awQuelle(ab, "dauer", alles), new RegExp("(" + AW_DAUER.map(reEscape).join("|") + ")\\s+([\\d.]+)\\s+([\\d.,]+)\\s*%", "g"))
    .forEach(function(m){ if(dauerRoh[m[1]] === undefined) dauerRoh[m[1]] = awZahl(m[2]); });
  const dauer = AW_DAUER.filter(function(d){ return dauerRoh[d] > 0; })
                        .map(function(d){ return [d, dauerRoh[d]]; });

  return {key:key, monat:{
    label: monatsName(key),
    kpi: kpi,
    os: awListe(awQuelle(ab, "os", alles), NETZ_OS, false),
    browser: awListe(awQuelle(ab, "browser", alles), NETZ_BROWSER, true),
    tage: tage, stunden: stunden, wochentage: wochentage,
    dauer: dauer
  }};
}

function renderNetz(){
  const cur = DATA_NETZ[state.monthNetz];
  const v = vergleich("netz"), cmp = v.cmp, cmpLabel = v.label;

  /* AWStats listet auch Systeme mit einer Handvoll Aufrufen. In der
     Legende stünden die mit „0 %" und lenken vom Wesentlichen ab —
     deshalb die fünf größten, der Rest wandert in „Sonstige". */
  function topFuenf(liste){
    const alle = liste || [];
    if(alle.length <= 6) return alle;
    const rest = alle.slice(5).reduce(function(a,e){ return a + e[1]; }, 0);
    return alle.slice(0,5).concat(rest > 0 ? [["Sonstige", rest]] : []);
  }

  const osHTML = verteilung({
    klasse:"split first", titel:"Betriebssysteme", note:"Anteil der Seitenaufrufe",
    eintraege: topFuenf(cur.os), farben: CH_COLORS,
    leerText:"Dieser Bericht enthält keine Aufschlüsselung nach Betriebssystemen."
  });
  const browserHTML = verteilung({
    klasse:"split", titel:"Browser", note:"Anteil der Seitenaufrufe",
    eintraege: topFuenf(cur.browser), farben: DEV_COLORS,
    leerText:"Dieser Bericht enthält keine Aufschlüsselung nach Browsern."
  });
  const dauerHTML = verteilung({
    klasse:"split", titel:"Aufenthaltsdauer", note:"Besuche je Zeitspanne",
    eintraege: cur.dauer, farben: CH_COLORS,
    hinweis: hatWert(cur.kpi.avgTime)
      ? "Im Schnitt " + dur(cur.kpi.avgTime) + " je Besuch."
      : "",
    leerText:"Dieser Bericht enthält keine Verteilung der Aufenthaltsdauer."
  });

  const tageHTML = balkenReihe({
    klasse:"full", titel:"Besuche im Monatsverlauf", note:(cur.tage || []).length + " Tage",
    punkte:(cur.tage || []).map(function(t){
      return {label:t.tag, wert:t.besuche, tipp:t.datum};
    }),
    hinweis:"Anzahl der Besuche je Tag. Der Balken zeigt den Abstand zum stärksten Tag des Monats.",
    leerText:"Dieser Bericht enthält keine Tagestabelle."
  });

  const stundenHTML = balkenReihe({
    titel:"Tageszeit", note:"Seitenaufrufe je Stunde",
    punkte:(cur.stunden || []).map(function(h){
      return {label:h.stunde, wert:h.seiten, tipp:h.stunde + " Uhr"};
    }),
    hinweis:"Serverzeit. Zeigt, wann der Netzplan tatsächlich benutzt wird.",
    leerText:"Dieser Bericht enthält keine Stundentabelle."
  });

  const wochenHTML = balkenReihe({
    klasse:"rechts", titel:"Wochentage", note:"Seitenaufrufe je Wochentag",
    punkte:(cur.wochentage || []).map(function(w){
      return {label:w.tag, wert:w.seiten, tipp:w.tag};
    }),
    hinweis:"Summe über alle Wochen des Monats.",
    leerText:"Dieser Bericht enthält keine Wochentagstabelle."
  });

  /* Reihenfolge bestimmt die Rasterplatzierung: oben KPI-Kacheln und
     Jahresverlauf nebeneinander, dann die drei Verteilungen, der
     Monatsverlauf über die volle Breite, unten Tageszeit und
     Wochentage nebeneinander. */
  return '<div class="grid">' +
    kpiRaster("netz", cur, cmp, cmpLabel) + jahresChart("netz") +
    auffaelligkeiten("netz", cur, cmp, cmpLabel) +
    osHTML + browserHTML + dauerHTML +
    tageHTML + stundenHTML + wochenHTML +
  '</div>';
}

function netzHolen(melde){
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[]};
  const next = {};

  function dateiname(url){
    try{ return decodeURIComponent(String(url).split("/").pop()); }catch(e){ return String(url); }
  }
  function uebernehmen(lib, puffer, url){
    return pdfAuswerten(lib, puffer, function(zeilen){ return parseNetzBericht(zeilen, url); })
      .then(function(r){
        next[r.key] = r.monat;
        bilanz.gelesen++;
        melde(r.monat.label + " gelesen …");
      }).catch(function(){
        bilanz.fehler++;
        if(bilanz.fehlerNamen.length < 4) bilanz.fehlerNamen.push(dateiname(url));
      });
  }

  melde("Ordner wird durchsucht …");
  return ladePdfJs().then(function(lib){
    return ordnerListing(NETZ_QUELLE.ordner, "pdf").then(function(urls){

      /* Weg A: Der Server listet den Ordner auf. */
      if(urls.length){
        let kette = Promise.resolve();
        const genutzt = urls.slice(0, NETZ_QUELLE.maxBerichte);
        genutzt.forEach(function(url, i){
          kette = kette.then(function(){
            melde("Bericht " + (i+1) + " von " + genutzt.length + " wird gelesen …");
            return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
          });
        });
        return kette;
      }

      /* Weg B: Kein Listing – der Dateiname steht fest, also direkt
         Monat für Monat anfragen. */
      let kette = Promise.resolve();
      letzteMonate(NETZ_QUELLE.probeMonate).forEach(function(m){
        kette = kette.then(function(){
          if(bilanz.gelesen >= NETZ_QUELLE.maxBerichte) return;
          melde("Suche " + m.monat + " " + m.jahr + " …");
          const url = netzDatei(m.mm, m.jahr);
          return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
        });
      });
      return kette;
    });
  }).then(function(){
    if(!Object.keys(next).length){
      throw new Error("Kein Bericht gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. " + NETZ_QUELLE.basis + "01.26.pdf");
    }
    DATA_NETZ = next;
    return bilanz;
  });
}

function blattNetz(keys){
  const os      = ["Windows","Android","Macintosh","iOS","Linux"];
  const browser = ["Google Chrome","Safari","Firefox","Opera"];
  const kopf = ["Monat","Unterschiedliche Besucher","Anzahl der Besuche","Seitenaufrufe","Zugriffe",
                "Datenvolumen (MB)","Ø Aufenthaltsdauer (Sek.)","Seiten pro Besuch","Besuche pro Besucher"]
    .concat(os.map(function(n){ return n + " (%)"; }))
    .concat(browser.map(function(n){ return n + " (%)"; }))
    .concat(AW_DAUER.slice(0,7).map(function(n){ return "Besuche " + n; }));

  const zeilen = keys.map(function(k){
    const d = DATA_NETZ[k], kpi = d.kpi;
    const leer = function(x){ return hatWert(x) ? x : ""; };
    const anteilAus = function(liste){
      const summe = liste.reduce(function(a,e){ return a + e[1]; }, 0);
      return function(name){
        const t = liste.find(function(e){ return e[0] === name; });
        return (t && summe > 0) ? Math.round(t[1] / summe * 1000) / 10 : "";
      };
    };
    const osAnteil = anteilAus(d.os || []), brAnteil = anteilAus(d.browser || []);
    const dauerMap = {};
    (d.dauer || []).forEach(function(e){ dauerMap[e[0]] = e[1]; });

    return [d.label, leer(kpi.visitors), leer(kpi.visits), leer(kpi.pages), leer(kpi.hits),
            hatWert(kpi.bytes) ? Math.round(kpi.bytes * 100) / 100 : "",
            leer(kpi.avgTime),
            hatWert(kpi.pagesPerVisit) ? Math.round(kpi.pagesPerVisit * 100) / 100 : "",
            hatWert(kpi.visitsPerUser) ? Math.round(kpi.visitsPerUser * 100) / 100 : ""]
      .concat(os.map(osAnteil))
      .concat(browser.map(brAnteil))
      .concat(AW_DAUER.slice(0,7).map(function(n){ return dauerMap[n] === undefined ? "" : dauerMap[n]; }));
  });
  return [kopf].concat(zeilen);
}

/* ============================================================
   10. KANÄLE Bus-WLAN und WLAN-City
   Quelle: Monatsberichte des Fahrgast-WLAN (PDF) im fileadmin.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/bus-wlan/
                 fileadmin/user_upload/17_kennzahlen/wlan-city/
   Dateiname:    2025-08_fahrgastwlan_bericht_mit_nutzungsstatistiken.pdf

   Beide Berichte sind gleich aufgebaut. Deshalb gibt es die Logik nur
   einmal (wlanKanal unten); jeder Kanal bringt nur seinen Ordner, seine
   Texte und seine Felder im Zustand mit. Ein weiteres WLAN-Angebot
   braucht nur einen weiteren wlanKanal({…})-Aufruf.

   Besonderheit: Der Bericht besteht fast nur aus Grafiken. Zahlen
   stehen im Fließtext über den Grafiken und in zwei Tabellen. Alles,
   was ausschließlich als Kurve gezeichnet ist — etwa die
   durchschnittliche Sitzungsdauer — lässt sich aus dem PDF nicht
   auslesen und taucht deshalb hier nicht auf.
   ============================================================ */
const WLAN_DATEN = {};                 /* Kanal-ID → {Monat → Auswertung} */
const WLAN_ENDUNG = "_fahrgastwlan_bericht_mit_nutzungsstatistiken.pdf";

/* „2025-08_fahrgastwlan…pdf" → „2025-08" */
function wlanMonatAusName(url){
  const m = /(\d{4})-(\d{2})_/.exec(decodeURIComponent(String(url || "")).split("/").pop());
  return m ? m[1] + "-" + m[2] : null;
}

/* Zeilen der beiden Tabellen: Label, Wert, Prozentsatz.
   Die Label sind nicht immer Wörter („1click", „bus9383"), deshalb
   wird alles ohne Leerzeichen als Label akzeptiert und rein
   numerisches hinterher aussortiert. */
function wlanTabelle(text){
  const out = [], gesehen = {};
  awTreffer(text, /([^\s]+)\s+(\d[\d.]*)\s+([\d.,]+)\s*%/g).forEach(function(m){
    const name = m[1];
    if(/^[\d.,]+$/.test(name) || gesehen[name]) return;
    const wert = awZahl(m[2]);
    if(!hatWert(wert) || wert <= 0) return;
    gesehen[name] = 1;
    out.push([name, wert, awZahl(m[3])]);
  });
  return out.sort(function(a,b){ return b[1] - a[1]; });
}

/* Eine Anzahl im Fließtext: „2.375" oder „150". Der Satzpunkt direkt
   dahinter („beträgt 2.375.") gehört nicht zur Zahl — ein schlichtes
   [\d.]* hätte ihn mitgenommen, und aus 2.375 wäre 2,375 geworden. */
const WLAN_ZAHL = "(\\d{1,3}(?:\\.\\d{3})+|\\d+)";

function parseWlanBericht(zeilen, url){
  const alles = zeilen.join(" ").replace(/\s+/g," ");

  /* Der Bericht enthält denselben Aufbau zweimal: erst den Monat, dann
     die letzten zwölf Monate. Alles ab der Jahresübersicht wird
     abgeschnitten, sonst mischen sich Monats- und Jahreszahlen. */
  const schnitt = alles.indexOf("Die letzten 12 Monate");
  const monatText = schnitt > -1 ? alles.slice(0, schnitt) : alles;

  let key = wlanMonatAusName(url);
  if(!key){
    const m = /Der Monat\s+([A-Za-zÄÖÜäöü]+)\s+(\d{4})/.exec(monatText);
    const nr = m ? AW_KURZ[monatsSchluessel(m[1]).slice(0,3)] : null;
    if(nr) key = m[2] + "-" + String(nr).padStart(2,"0");
  }
  if(!key) throw new Error("Zeitraum nicht erkannt");

  /* Kennzahlen aus den Erläuterungen über den Grafiken */
  const gleich  = new RegExp("gleichzeitig verbundener Geräte[^.]*?beträgt\\s*" + WLAN_ZAHL).exec(monatText);
  const lizenz  = new RegExp("Dies sind\\s*([\\d.,]+)\\s*%\\s*der installierten Lizenz\\s*\\(\\s*" + WLAN_ZAHL).exec(monatText);
  const aktiv   = new RegExp("Maximum aktiver Sitzungen[^.]*?beträgt\\s*" + WLAN_ZAHL).exec(monatText);
  const geraete = new RegExp("Geräte in dieser Zeit ist\\s*" + WLAN_ZAHL + "\\s*\\(MAC[^)]*\\)\\s*et\\s*" + WLAN_ZAHL).exec(monatText);

  /* Die beiden Tabellen: Sitzungen je Benutzerprofil und je Eingangssubnetz
     (im Bus-WLAN ist das ein Fahrzeug) */
  const pStart = monatText.indexOf("Sitzungen nach Profil");
  const sStart = monatText.indexOf("Sitzungen nach Eingangssubnetz");
  const profile = pStart > -1
    ? wlanTabelle(monatText.slice(pStart, sStart > pStart ? sStart : undefined)) : [];
  const fahrzeuge = sStart > -1 ? wlanTabelle(monatText.slice(sStart)) : [];

  /* Die Gesamtzahl der Sitzungen steht nirgends als eine Zahl — sie
     ergibt sich aus der Aufteilung nach Profil, die den ganzen Monat
     abdeckt. */
  const sessions = profile.reduce(function(a,p){ return a + p[1]; }, 0);
  const devices  = geraete ? awZahl(geraete[1]) : null;
  if(!sessions) throw new Error("Keine Sitzungen im Bericht");

  const kpi = {
    sessions:      sessions,
    logins:        geraete ? awZahl(geraete[2]) : null,
    devices:       devices,
    maxConcurrent: gleich ? awZahl(gleich[1]) : null,
    maxActive:     aktiv ? awZahl(aktiv[1]) : null,
    licensePct:    lizenz ? awZahl(lizenz[1]) : null,
    sessionsPerDevice: (devices > 0) ? sessions / devices : null
  };

  return {key:key, monat:{
    label: monatsName(key),
    kpi: kpi,
    lizenz: lizenz ? awZahl(lizenz[2]) : null,
    profile: profile,
    fahrzeuge: fahrzeuge
  }};
}

/* Bekannte Benutzerprofile. Erklärt wird nur, was im Bericht auch
   vorkommt — ein anderes WLAN-Angebot kann andere Profile haben. */
const WLAN_PROFILE = {
  "1click":     "1click ist die Anmeldung ohne Konto",
  "DSW-MOPADS": "DSW-MOPADS die dienstliche Nutzung"
};
function wlanProfilHinweis(profile){
  const saetze = (profile || []).map(function(p){ return WLAN_PROFILE[p[0]]; }).filter(Boolean);
  if(!saetze.length) return "Aufteilung aller Sitzungen des Monats nach Benutzerprofil.";
  return saetze.join(", ") + ".";
}

/* Spitzenlast gegen die installierte Lizenz — als Messbalken unter den
   Profilen. Die Füllung wird ab 80 % gelb, ab 95 % rot. */
function wlanLizenzBalken(cur){
  const kpi = cur.kpi || {};
  if(!hatWert(kpi.maxConcurrent) || !hatWert(kpi.licensePct)) return "";
  const w = Math.max(0, Math.min(100, kpi.licensePct));
  const stufe = w >= 95 ? " kritisch" : w >= 80 ? " knapp" : "";
  return '<div class="lizenz">' +
    '<div class="lizenz-kopf"><span>Spitzenlast gegenüber der Lizenz</span><b>' + pct(kpi.licensePct) + '</b></div>' +
    '<div class="lizenz-bahn' + stufe + '"><span data-w="' + w + '"></span></div>' +
    '<p class="hint">Höchstens ' + fmt(kpi.maxConcurrent) + ' Geräte gleichzeitig' +
      (hatWert(cur.lizenz) ? ' bei einer Lizenz für ' + fmt(cur.lizenz) + ' Nutzer' : '') + '.</p>' +
  '</div>';
}

function wlanKanal(cfg){
  const id = cfg.id;
  WLAN_DATEN[id] = {};
  const daten = function(){ return WLAN_DATEN[id]; };
  const datei = function(jahr, mm){ return cfg.ordner + encodeURIComponent(jahr + "-" + mm + WLAN_ENDUNG); };

  function zeichnen(){
    const cur = daten()[state[cfg.monatFeld]];
    const v = vergleich(id), cmp = v.cmp, cmpLabel = v.label;

    const profilHTML = verteilung({
      klasse:"split wide", titel:"Sitzungen nach Benutzerprofil",
      note: fmt(cur.kpi.sessions) + " Sitzungen",
      eintraege: (cur.profile || []).map(function(p){ return [p[0], p[1]]; }),
      farben: CH_COLORS, nachkomma: true,   /* „intern" liegt unter 1 % und wäre sonst 0 % */
      hinweis: wlanProfilHinweis(cur.profile),
      nachsatz: wlanLizenzBalken(cur),
      leerText:"Dieser Bericht enthält keine Aufteilung nach Profilen."
    });

    const top = (cur.fahrzeuge || []).slice(0,8);
    const fzMax = maxOf(top.map(function(f){ return f[1]; }));
    const rangHTML = rangKachel({
      klasse:"rank", titel: cfg.rang.titel, note: cfg.rang.note, legende: cfg.rang.legende,
      leerText: cfg.rang.leer,
      zeilen: top.map(function(f){
        return {name:f[0], text:fmt(f[1]), anteil:f[1] / fzMax * 100,
                meta: hatWert(f[2]) ? pct(f[2]) + " der Sitzungen" : ""};
      })
    });

    /* Reihenfolge bestimmt die Rasterplatzierung: oben KPI-Kacheln und
       Jahresverlauf nebeneinander, darunter Profile und Rangliste. */
    return '<div class="grid">' +
      kpiRaster(id, cur, cmp, cmpLabel) + jahresChart(id) +
      auffaelligkeiten(id, cur, cmp, cmpLabel) +
      profilHTML + rangHTML +
    '</div>';
  }

  function holen(melde){
    const bilanz = {gelesen:0, fehler:0, fehlerNamen:[]};
    const next = {};

    function dateiname(url){
      try{ return decodeURIComponent(String(url).split("/").pop()); }catch(e){ return String(url); }
    }
    function uebernehmen(lib, puffer, url){
      return pdfAuswerten(lib, puffer, function(zeilen){ return parseWlanBericht(zeilen, url); })
        .then(function(r){
          next[r.key] = r.monat;
          bilanz.gelesen++;
          melde(r.monat.label + " gelesen …");
        }).catch(function(){
          bilanz.fehler++;
          if(bilanz.fehlerNamen.length < 4) bilanz.fehlerNamen.push(dateiname(url));
        });
    }

    melde("Ordner wird durchsucht …");
    return ladePdfJs().then(function(lib){
      return ordnerListing(cfg.ordner, "pdf").then(function(urls){

        /* Weg A: Der Server listet den Ordner auf. */
        if(urls.length){
          let kette = Promise.resolve();
          const genutzt = urls.slice(0, 30);
          genutzt.forEach(function(url, i){
            kette = kette.then(function(){
              melde("Bericht " + (i+1) + " von " + genutzt.length + " wird gelesen …");
              return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
            });
          });
          return kette;
        }

        /* Weg B: Kein Listing – der Dateiname steht fest. */
        let kette = Promise.resolve();
        letzteMonate(24).forEach(function(m){
          kette = kette.then(function(){
            if(bilanz.gelesen >= 30) return;
            melde("Suche " + m.monat + " " + m.jahr + " …");
            const url = datei(m.jahr, m.mm);
            return holePdf(url).then(function(p){ return p ? uebernehmen(lib, p, url) : null; });
          });
        });
        return kette;
      });
    }).then(function(){
      if(!Object.keys(next).length){
        throw new Error("Kein Bericht gefunden · Ordner und Dateiname prüfen · " +
                        "erwartet wird z. B. 2025-08" + WLAN_ENDUNG);
      }
      WLAN_DATEN[id] = next;
      return bilanz;
    });
  }

  function blatt(keys){
    /* Profilspalten aus allen gewählten Monaten, stärkstes zuerst. */
    const summen = {};
    keys.forEach(function(k){
      (daten()[k].profile || []).forEach(function(p){ summen[p[0]] = (summen[p[0]] || 0) + p[1]; });
    });
    const namen = Object.keys(summen).sort(function(a,b){ return summen[b] - summen[a]; });
    const kopf = ["Monat","Sitzungen","Eindeutige Logins","Verschiedene Geräte (MAC)",
                  "Max. gleichzeitige Nutzer","Max. aktive Sitzungen","Auslastung der Lizenz (%)",
                  "Sitzungen je Gerät"]
      .concat(namen.map(function(n){ return "Profil " + n; }));

    const zeilen = keys.map(function(k){
      const d = daten()[k], kpi = d.kpi;
      const leer = function(x){ return hatWert(x) ? x : ""; };
      const profil = {};
      (d.profile || []).forEach(function(p){ profil[p[0]] = p[1]; });
      return [d.label, leer(kpi.sessions), leer(kpi.logins), leer(kpi.devices),
              leer(kpi.maxConcurrent), leer(kpi.maxActive), leer(kpi.licensePct),
              hatWert(kpi.sessionsPerDevice) ? Math.round(kpi.sessionsPerDevice * 100) / 100 : ""]
        .concat(namen.map(function(n){ return profil[n] === undefined ? "" : profil[n]; }));
    });
    return [kopf].concat(zeilen);
  }

  const ordnerText = cfg.ordner.replace(/^\//, "");
  KANAELE[id] = {
    titel: cfg.titel,
    untertitel: cfg.untertitel,
    monatFeld: cfg.monatFeld,
    einheit: ["Bericht","Berichte"],
    fehltText: "Im Bericht nicht enthalten",
    infoGruppe: "wlan",                  /* Erklärtexte der Kacheln teilen sich beide */
    daten:   daten,
    ordnung: function(){ return Object.keys(daten()).sort(); },
    /* Drei Größenordnungen, die sich leicht verwechseln lassen und
       deshalb nebeneinander stehen: Sitzungen im ganzen Monat, Sitzungen
       am stärksten Tag und die höchste Gleichzeitigkeit. Die Auslastung
       der Lizenz ergibt sich aus der letzten Zahl und steht als
       Messbalken unter den Profilen. */
    kpis: [
      {key:"sessions",          label:"Sitzungen im Monat",        kind:"num"},
      {key:"maxActive",         label:"Sitzungen am stärksten Tag",kind:"num"},
      {key:"logins",            label:"Eindeutige Logins",         kind:"num"},
      {key:"devices",           label:"Verschiedene Geräte",       kind:"num"},
      {key:"maxConcurrent",     label:"Max. gleichzeitige Nutzer", kind:"num"},
      {key:"sessionsPerDevice", label:"Sitzungen je Gerät",        kind:"dec"}
    ],
    leitKpis: ["sessions","devices","maxConcurrent"],
    chart: {
      feld: cfg.chartFeld,
      klasse: "rechts",
      metriken: {sessions:"Sitzungen", logins:"Eindeutige Logins", devices:"Geräte"},
      hinweis: function(label){
        return "Gefüllte Balken = Monate mit hinterlegtem Bericht (" + label + "). " +
               "Schraffierte Monate warten noch auf ihren Bericht.";
      }
    },
    zeichnen: zeichnen,
    holen: holen,
    leerTitel: cfg.titel + " — keine Berichte gefunden",
    leerText: "Die Kennzahlen stammen aus den Monatsberichten im Ordner " + ordnerText +
              ". Sobald dort ein Bericht als PDF liegt, erscheinen die Werte hier.",
    leerStatus: "Keine Berichte gefunden · Bericht als PDF im fileadmin ablegen " +
                "und auf Aktualisieren klicken",
    fehlerText: cfg.titel + "-Berichte nicht geladen: ",
    packen:    function(){ return {daten:daten()}; },
    auspacken: function(o){ WLAN_DATEN[id] = o.daten || {}; },
    exportName: cfg.titel,
    exportSub:  cfg.exportSub,
    exportBlatt: blatt
  };
}

/* ============================================================
   11. KANAL Chatbot
   Quelle: Excel-Datei im fileadmin.
   Ablage: fileadmin/user_upload/17_kennzahlen/chatbot/chatbot.xlsx
   Gelesen werden zwei Blaetter: "nur Anfragen" (Anfrage x Kategorie-
   Treffer) und "ohne ID-Duplikate" (eine Zeile je Konversation).
   Die beiden Pivot-Blaetter bleiben bewusst unberuehrt: alles daraus
   wird hier selbst gerechnet, damit ein Umbau der Pivots den Kanal
   nicht bricht. Im Code stehen bewusst keine Monatswerte.
   ============================================================ */
let DATA_CHAT = {};

const CHAT_QUELLE = {
  datei: "/fileadmin/user_upload/17_kennzahlen/chatbot/chatbot.xlsx",
  /* Blattnamen werden tolerant gesucht: Reihenfolge = Priorität. */
  blattAnfragen:     ["nur anfragen", "anfragen"],
  blattKonversation: ["ohne id-duplikate", "ohne id duplikate", "konversationen"],
  beispiele: 8,             /* so viele Beispielanfragen je Monat */
  beispielMinZeichen: 30    /* kürzere Zeilen sind meist Tests oder Floskeln */
};

const WOCHENTAGE = ["Mo","Di","Mi","Do","Fr","Sa","So"];

/* Blatt anhand seines Namens finden — unabhängig von Groß- und
   Kleinschreibung und von Bindestrich oder Leerzeichen. */
function chatBlatt(wb, kandidaten){
  const norm = function(s){ return String(s||"").toLowerCase().replace(/[\s\-_]+/g," ").trim(); };
  for(let i = 0; i < kandidaten.length; i++){
    const treffer = wb.SheetNames.find(function(n){ return norm(n) === norm(kandidaten[i]); });
    if(treffer) return wb.Sheets[treffer];
  }
  return null;
}

/* Datumsspalte: Date-Objekt, "20.05.2026" oder "5/20/26". */
function chatDatum(value){
  if(value instanceof Date && !isNaN(value)) return value;
  const s = String(value || "").trim();
  if(!s) return null;
  let m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/.exec(s);
  if(m){
    const jahr = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    return new Date(jahr, m[2] - 1, +m[1], 12);
  }
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s);
  if(m){
    const jahr = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    return new Date(jahr, m[1] - 1, +m[2], 12);   /* US-Schreibweise: Monat zuerst */
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* Stunde aus der Zeitspalte. Excel liefert Uhrzeiten je nach Zelle als
   Date (mit Ersatzdatum 1899), als Bruchteil eines Tages oder als Text.
   Angabe ist Ortszeit und wird deshalb nicht umgerechnet. */
function chatStunde(value){
  if(value instanceof Date && !isNaN(value)) return value.getHours();
  if(typeof value === "number" && value >= 0 && value < 1) return Math.floor(value * 24);
  const m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i.exec(String(value || "").trim());
  if(!m) return null;
  let h = +m[1];
  const suffix = (m[4] || "").toUpperCase();
  if(suffix === "PM" && h < 12) h += 12;
  if(suffix === "AM" && h === 12) h = 0;
  return h >= 0 && h < 24 ? h : null;
}

const chatKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const chatTag = d => chatKey(d) + "-" + String(d.getDate()).padStart(2, "0");

/* Leere Kategoriezellen heißen im Pivot „(Leer)" — hier ausgeschrieben,
   damit in der Rangliste keine namenlose Zeile steht. */
const CHAT_OHNE = "Ohne Unterkategorie";

/* ---------- Auswertung eines Monats aufbauen ---------- */
function chatMonatLeer(key){
  return {
    label: monatsName(key),
    kpi: {anfragen:0, konversationen:null, proKonversation:null,
          proTag:null, peakTag:null, themen:0},
    /* Hauptthema = erster Kategorie-Treffer einer Anfrage. Die weiteren
       Treffer derselben Anfrage sind nachrangige Vorschläge und werden
       getrennt gezählt, damit beide Sichten lesbar bleiben. */
    primaer: {},        /* Kategorie -> Anfragen mit dieser Erstzuordnung */
    treffer: {},        /* Kategorie -> alle Treffer */
    unter:   {},        /* Kategorie -> {Unterkategorie -> Treffer} */
    stunden: new Array(24).fill(0),
    wochentage: new Array(7).fill(0),
    tage: {},           /* Tagesschlüssel -> Anfragen */
    beispiele: [],
    peakLabel: null
  };
}

function chatZaehl(obj, name, wert){
  if(!name) return;
  obj[name] = (obj[name] || 0) + (wert === undefined ? 1 : wert);
}

/* Aus den Rohzeilen die Monate rechnen. */
function chatAuswerten(zeilenAnfragen, zeilenKonversationen){
  const monate = {};
  const hol = function(key){
    if(!monate[key]) monate[key] = chatMonatLeer(key);
    return monate[key];
  };

  /* 1. Blatt „nur Anfragen": je Anfrage mehrere Kategorie-Treffer.
        Gruppiert wird über System ID + Anfragetext + Zeitpunkt. */
  const gesehen = {};
  zeilenAnfragen.forEach(function(row){
    const datum = chatDatum(row["Datum"]);
    if(!datum) return;
    const key = chatKey(datum), m = hol(key);
    const text = String(row["Anfrage"] || "").trim();
    /* Leere Kategoriezeilen werden wie im Pivot als eigene Kategorie
       „(Leer)" geführt, damit die Summe exakt dem Gesamtergebnis des
       Blatts „Nutzung Kategorien" entspricht. */
    const kategorie = String(row["Kategorie"] || "").trim() || "(Leer)";
    const unter = String(row["Unterkategorie"] || "").trim() || CHAT_OHNE;
    const stunde = chatStunde(row["Zeit"]);
    const id = String(row["System ID"] || "") + "|" + text + "|" +
               chatTag(datum) + "|" + String(row["Zeit"] || "");

    chatZaehl(m.treffer, kategorie);
    if(kategorie){
      if(!m.unter[kategorie]) m.unter[kategorie] = {};
      chatZaehl(m.unter[kategorie], unter);
    }

    /* Erste Zeile einer Anfrage: sie zählt als die Anfrage selbst. */
    if(gesehen[id]) return;
    gesehen[id] = true;
    m.kpi.anfragen++;
    chatZaehl(m.primaer, kategorie);
    chatZaehl(m.tage, chatTag(datum));
    if(stunde !== null) m.stunden[stunde]++;
    m.wochentage[(datum.getDay() + 6) % 7]++;
    if(text.length >= CHAT_QUELLE.beispielMinZeichen) m.beispiele.push({text:text, tag:datum});
  });

  /* 2. Blatt „ohne ID-Duplikate": Konversationen je Monat. */
  const konvIds = {};
  (zeilenKonversationen || []).forEach(function(row){
    const datum = chatDatum(row["Datum"]);
    if(!datum) return;
    const key = chatKey(datum);
    if(!konvIds[key]) konvIds[key] = {};
    konvIds[key][String(row["System ID"] || "") + "|" + String(row["Zeit"] || "")] = true;
  });

  /* 3. Abgeleitete Kennzahlen. */
  Object.keys(monate).forEach(function(key){
    const m = monate[key];
    const konv = konvIds[key] ? Object.keys(konvIds[key]).length : null;
    m.kpi.konversationen = konv;
    m.kpi.proKonversation = (konv && konv > 0) ? m.kpi.anfragen / konv : null;

    const tage = Object.keys(m.tage);
    m.kpi.proTag = tage.length ? m.kpi.anfragen / tage.length : null;
    const stärkster = tage.sort(function(a,b){ return m.tage[b] - m.tage[a]; })[0];
    m.kpi.peakTag = stärkster ? m.tage[stärkster] : null;
    m.peakLabel = stärkster
      ? new Date(stärkster + "T12:00:00").toLocaleDateString("de-DE",
          {weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"})
      : null;

    /* Anzahl verschiedener Kategorien wie im Pivot; „(Leer)" ist eine
       eigene Kategorie und wird mitgezählt, wenn sie vorhanden ist. */
    m.kpi.themen = Object.keys(m.treffer).length;

    /* Beispiele gleichmäßig über den Monat streuen statt die ersten
       Zeilen zu nehmen — sonst zeigt die Liste immer den Monatsanfang. */
    const alle = m.beispiele;
    const anzahl = Math.min(CHAT_QUELLE.beispiele, alle.length);
    const schritt = anzahl ? alle.length / anzahl : 0;
    const auswahl = [];
    for(let i = 0; i < anzahl; i++){
      const b = alle[Math.floor(i * schritt)];
      auswahl.push({text: b.text, datum: b.tag.toLocaleDateString("de-DE")});
    }
    m.beispiele = auswahl;
  });

  return monate;
}

/* ---------- Kacheln ---------- */

/* Rangliste der Themen in der Zählweise des Blatts „Nutzung Kategorien". */
function chatThemen(cur, cmp, cmpLabel){
  /* Diese Zählung folgt exakt dem Blatt „Nutzung Kategorien": Jede
     Zeile aus „nur Anfragen" zählt als eine Kategorie-Zuordnung.
     Mehrere gleichlautende Zeilen derselben Anfrage werden deshalb
     nicht dedupliziert. */
  const namen = Object.keys(cur.treffer).sort(function(a,b){ return cur.treffer[b] - cur.treffer[a]; });
  const top = namen.slice(0, 10);
  const max = maxOf(top.map(function(n){ return cur.treffer[n]; }));
  return rangKachel({
    klasse: "rank pages-rank", titel: "Häufigste Themen", note: "Kategorie-Zuordnungen",
    legende: "Zählung wie im Blatt Nutzung Kategorien: Jede Kategorie-Zeile aus nur Anfragen zählt.",
    leerText: "Für diesen Monat enthält das Blatt nur Anfragen keine Kategorien.",
    zeilen: top.map(function(n){
      const wert = cur.treffer[n] || 0;
      return {
        name: n,
        text: fmt(wert),
        anteil: wert / max * 100,
        hover: n + " — " + fmt(wert) + " Kategorie-Zuordnungen",
        meta: (cmp && cmp.treffer && cmp.treffer[n] !== undefined)
                ? deltaHTML("themen", wert, cmp.treffer[n], cmpLabel)
                : '<span class="delta flat"><em>kein Vergleich</em></span>'
      };
    })
  });
}

/* Tagesverlauf über 24 Stunden. */
function chatStundenKachel(cur){
  const summe = cur.stunden.reduce(function(a,b){ return a + b; }, 0);
  if(!summe) return leereKachel("chart full", "Tagesverlauf",
    "Für diesen Monat enthält die Spalte Zeit keine auswertbaren Uhrzeiten.");
  const spitze = cur.stunden.indexOf(maxOf(cur.stunden));
  return balkenReihe({
    klasse: "full", titel: "Tagesverlauf", note: "Anfragen je Stunde",
    punkte: cur.stunden.map(function(v, h){
      return {label: String(h), wert: v, tipp: String(h).padStart(2,"0") + ":00 bis " +
              String(h).padStart(2,"0") + ":59 Uhr"};
    }),
    hinweis: "Ortszeit. Stärkste Stunde: " + String(spitze).padStart(2,"0") + ":00 Uhr mit " +
             fmt(cur.stunden[spitze]) + " Anfragen — das sind " +
             pct(cur.stunden[spitze] / summe * 100) + " des Monats."
  });
}

/* Wochentage als Balkenreihe: Werktag und Wochenende sind hier die
   eigentliche Aussage, deshalb steht der Vergleich im Hinweis. */
function chatWochentage(cur){
  const summe = cur.wochentage.reduce(function(a,b){ return a + b; }, 0);
  if(!summe) return leereKachel("chart", "Wochentage",
    "Für diesen Monat liegen keine datierten Anfragen vor.");
  const wochenende = cur.wochentage[5] + cur.wochentage[6];
  return balkenReihe({
    klasse: "", titel: "Wochentage", note: "Anfragen je Wochentag",
    punkte: cur.wochentage.map(function(v, i){
      return {label: WOCHENTAGE[i], wert: v, tipp: WOCHENTAGE[i]};
    }),
    hinweis: "Samstag und Sonntag zusammen: " + fmt(wochenende) + " Anfragen, " +
             pct(wochenende / summe * 100) + " des Monats."
  });
}

/* Beispielanfragen. Bewusst als ruhige Liste ohne Balken: hier zählt
   der Wortlaut, nicht die Größe. */
function chatBeispiele(cur){
  if(!cur.beispiele.length){
    return leereKachel("split right", "Beispielanfragen",
      "Für diesen Monat enthält das Blatt keine Anfragen mit ausreichend Text.");
  }
  const zeilen = cur.beispiele.map(function(b){
    return '<div><span class="lname" title="' + esc(b.text) + '">' + esc(b.text) + '</span>' +
           '<span class="lpct">' + esc(b.datum) + '</span></div>';
  }).join("");
  return '<div class="card split right">' +
    '<div class="card-head"><h2>Beispielanfragen</h2>' +
    '<span class="card-note">Stichprobe über den Monat</span></div>' +
    '<div class="legend">' + zeilen + '</div>' +
    '<p class="hint">Wortlaut aus dem Bericht, gleichmäßig über den Monat gezogen. ' +
    'Personenbezogene Angaben sind in der Quelle bereits durch # ersetzt.</p></div>';
}

/* Detailtabelle in derselben Zählweise wie „Nutzung Kategorien":
   Kategoriezeilen und Unterkategoriezeilen aus „nur Anfragen". */
function chatTabelle(cur){
  const namen = Object.keys(cur.treffer).filter(function(n){ return n; })
    .sort(function(a,b){ return cur.treffer[b] - cur.treffer[a]; });
  if(!namen.length){
    return leereKachel("detail-card full", "Themen im Detail",
      "Für diesen Monat enthält das Blatt nur Anfragen keine Kategorien.");
  }
  const max = maxOf(namen.map(function(n){ return cur.treffer[n]; }));
  const summe = namen.reduce(function(a,n){ return a + cur.treffer[n]; }, 0);

  const zeilen = namen.map(function(n, i){
    const unter = cur.unter[n] || {};
    const unterNamen = Object.keys(unter).sort(function(a,b){ return unter[b] - unter[a]; });
    const stärkste = unterNamen[0];
    const kürzel = n.replace(/[^A-Za-zÄÖÜäöü]/g, "").slice(0, 2);
    return '<tr>' +
      '<td><div class="cell-name"><span class="rankno">' + (i+1) + '</span>' +
        '<span class="favchip">' + esc(kürzel) + '</span>' +
        '<span class="tname" title="' + esc(n) + '">' + esc(n) + '</span></div></td>' +
      '<td><div class="cell-num"><b>' + fmt(cur.treffer[n]) + '</b>' +
        '<span class="minibar"><span data-w="' + (cur.treffer[n] / max * 100) + '"></span></span></div></td>' +
      '<td><span class="pill' + (cur.treffer[n] / summe >= 0.15 ? " blue" : "") + '">' +
        pct(cur.treffer[n] / summe * 100) + '</span></td>' +
      '<td style="text-align:left">' + (stärkste
          ? esc(stärkste) + ' <span class="pill">' + fmt(unter[stärkste]) + '</span>'
          : '—') + '</td>' +
    '</tr>';
  }).join("");

  return '<div class="card detail-card full">' +
      '<div class="card-head"><h2>Themen im Detail</h2>' +
      '<span class="card-note">Beide Zählweisen je Kategorie</span></div>' +
      '<div class="tablewrap"><table><thead><tr>' +
        '<th>Kategorie</th><th>Kategorie-Zuordnungen</th>' +
        '<th>Anteil</th><th style="text-align:left">Stärkste Unterkategorie</th>' +
      '</tr></thead><tbody>' + zeilen + '</tbody></table></div>' +
      '<p class="tfoot-note">Die Werte entsprechen dem Blatt „Nutzung Kategorien": Jede Kategorie-Zeile aus „nur Anfragen" zählt einmal. Die Summe aller Kategorie-Zuordnungen kann deshalb über der Zahl der Anfragen liegen.</p>' +
    '</div>';
}
