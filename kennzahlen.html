#bmk-export .body{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px}
#bmk-export .body::-webkit-scrollbar{width:8px}
#bmk-export .body::-webkit-scrollbar-thumb{background:#e2e5ee;border-radius:20px}
#bmk-export .seclabel{
  display:flex;align-items:center;margin:20px 0 7px;
  font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);
}
#bmk-export .toggle{
  margin-left:auto;border:0;background:none;font:inherit;font-size:11.5px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--blue);cursor:pointer;
  padding:3px 7px;border-radius:7px;transition:background .14s;
}
#bmk-export .toggle:hover{background:var(--blue-faint)}
#bmk-export .opt{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  padding:12px 13px;border:1px solid transparent;border-radius:15px;cursor:pointer;
  transition:background .14s,border-color .14s;
}
#bmk-export .opt + .opt{margin-top:4px}
#bmk-export .opt:hover{background:#f5f6f9}
#bmk-export .opt.sel{background:var(--blue-faint);border-color:rgba(27,89,248,.18)}
#bmk-export .opt.off{cursor:default;opacity:.5}
#bmk-export .opt.off:hover{background:none}
#bmk-export .opt input{position:absolute;opacity:0;width:1px;height:1px}
#bmk-export .box{
  width:21px;height:21px;border-radius:7px;border:1.8px solid #d3d7e3;background:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s,border-color .14s;
}
#bmk-export .box svg{width:13px;height:13px;opacity:0;transform:scale(.6);transition:opacity .14s,transform .14s}
#bmk-export .opt.sel .box{background:var(--blue);border-color:var(--blue)}
#bmk-export .opt.sel .box svg{opacity:1;transform:none}
#bmk-export .opt input:focus-visible + .box{outline:2px solid var(--blue);outline-offset:2px}
#bmk-export .txt b{display:block;font-size:14px;font-weight:600;line-height:1.3;color:var(--ink)}
#bmk-export .txt span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
#bmk-export .tag{
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
  color:var(--ink-3);background:#f0f1f4;padding:3px 7px;border-radius:6px;
}
#bmk-export .tag.on{color:var(--blue);background:var(--blue-soft)}
#bmk-export .seg{display:flex;gap:2px;background:#f2f3f6;padding:3px;border-radius:11px}
#bmk-export .seg button{
  flex:1;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);
  padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .16s,color .16s;
}
#bmk-export .seg button:hover{color:var(--ink-2)}
#bmk-export .seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 2px rgba(14,21,36,.08)}
#bmk-export .note{font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.5}
#bmk-export .note.err{color:var(--down);font-weight:500}
#bmk-export .foot{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
}
#bmk-export .foot .grow{margin-left:auto}
#bmk-export .abtn{
  display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  cursor:pointer;transition:border-color .16s,color .16s,transform .16s,box-shadow .16s;
}
#bmk-export .abtn:hover{border-color:#c9cfdb;color:var(--ink);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.07)}
#bmk-export .abtn:active{transform:translateY(0)}
#bmk-export .abtn.go{color:#fff;background:var(--blue);border-color:var(--blue)}
#bmk-export .abtn.go:hover{color:#fff;box-shadow:0 10px 24px rgba(27,89,248,.30)}
#bmk-export .abtn[disabled]{opacity:.45;pointer-events:none}
#bmk-export .abtn .sp{display:none}
#bmk-export .abtn.busy .sp{display:block;animation:bmk-ex-spin .9s linear infinite}
#bmk-export .abtn.busy .ic{display:none}
#bmk-export :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
@keyframes bmk-ex-fade{from{opacity:0}to{opacity:1}}
@keyframes bmk-ex-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bmk-ex-spin{to{transform:rotate(360deg)}}
@media (max-width:520px){
  #bmk-export{padding:14px;align-items:flex-end}
  #bmk-export .sheet{max-width:none;border-radius:24px;padding:22px 20px 16px}
}
@media (prefers-reduced-motion:reduce){
  #bmk-export,#bmk-export .sheet{animation:none}
  #bmk-export *{transition:none!important}
}

/* ============================================================
   Erklärfenster zum (i) in den Kacheln. Liegt wie der Export-Dialog
   am <body>, deshalb eigene Variablen.
   ============================================================ */
#bmk-info{
  --blue:#1b59f8;--blue-soft:rgba(27,89,248,.10);--blue-faint:#f2f7ff;
  --ink:#151e23;--ink-2:#4d4d4d;--ink-3:#838383;--line:#eff0f6;--card:#ffffff;
  position:fixed;z-index:9998;box-sizing:border-box;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 60px rgba(14,24,52,.20),0 3px 10px rgba(14,24,52,.06);
  padding:14px 16px 13px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:13px;line-height:1.5;color:var(--ink-2);-webkit-font-smoothing:antialiased;
  transform-origin:var(--pfeil,90%) 0;
}
#bmk-info.oben{transform-origin:var(--pfeil,90%) 100%}
#bmk-info[hidden]{display:none}
#bmk-info *{box-sizing:border-box;margin:0;padding:0}
#bmk-info.rein{animation:bmk-info-rein .18s cubic-bezier(.2,.7,.3,1)}
@keyframes bmk-info-rein{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
#bmk-info::before{
  content:"";position:absolute;top:-6px;left:calc(var(--pfeil,90%) - 6px);width:12px;height:12px;
  background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);
}
#bmk-info.oben::before{top:auto;bottom:-6px;transform:rotate(225deg)}
#bmk-info .i-kopf{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#bmk-info .i-kanal{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}
#bmk-info .i-zu{
  margin-left:auto;width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--ink-3);
  cursor:pointer;display:grid;place-items:center;transition:background .14s,color .14s;
}
#bmk-info .i-zu:hover{background:#f2f4f8;color:var(--ink)}
#bmk-info .i-zu svg{width:14px;height:14px}
#bmk-info h3{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--ink);margin-bottom:8px;line-height:1.3}
#bmk-info .i-text{color:var(--ink-2)}
#bmk-info .i-text + .i-zitat{margin-top:8px}
#bmk-info .i-zitat{
  border-left:3px solid var(--blue);background:var(--blue-faint);border-radius:0 10px 10px 0;
  padding:8px 11px;color:var(--ink);font-style:normal;
}
#bmk-info .i-aktuell{margin-top:9px;font-weight:600;color:var(--ink)}
#bmk-info .i-hinweis{margin-top:10px;font-size:12.5px}
#bmk-info .i-hinweis b{color:var(--ink);font-weight:600}
#bmk-info .i-quelle{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
#bmk-info .i-quelle a{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}
#bmk-info .i-quelle a:hover{text-decoration:underline}
#bmk-info :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media print{ #bmk-info{display:none!important} }
@media (prefers-reduced-motion:reduce){ #bmk-info.rein{animation:none} }
</style>

<script>
(function(){
"use strict";

/* ============================================================
   0. GRUNDLAGEN
   Formatierung, kleine Helfer, gemeinsame Bausteine. Alles, was
   mehr als ein Kanal braucht, steht hier — und nur hier.
   ============================================================ */

const MONTH_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

const nf = new Intl.NumberFormat("de-DE");
const fmt = n => nf.format(Math.round(n));
/* Prozente auf ganze Zahl, sofern ohnehin (fast) ganzzahlig — sonst
   eine Nachkommastelle. Bounce-Rate 63 bleibt „63 %“, Öffnungsrate
   29,14 wird „29,1 %“. */
const pct = n => (Math.abs(n - Math.round(n)) < 0.05
                    ? nf.format(Math.round(n))
                    : nf.format(Math.round(n * 10) / 10)) + " %";
const dur = s => { s = Math.round(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0") + " min"; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec1 = n => nf.format(Math.round(n*10)/10);

/* Datenmenge in MB, ab 1024 MB in GB — sonst stehen fünfstellige
   Megabyte in der Kachel. */
const mb = n => (n >= 1024 ? dec1(n/1024) + " GB" : nf.format(Math.round(n)) + " MB");
const FORMATTERS = {num:fmt, pct:pct, dur:dur, dec:function(n){ return dec1(n); }, mb:mb};

/* Math.max(...[]) liefert -Infinity und ist wahr - deshalb ein eigener Helfer,
   der bei leeren Listen zuverlaessig 1 zurueckgibt (Divisionen bleiben heil). */
function maxOf(werte){
  let m = 0;
  (werte||[]).forEach(function(v){ if(isFinite(v) && v > m) m = v; });
  return m > 0 ? m : 1;
}
const anteil = (teil, ganzes) => (ganzes > 0 ? Math.round(teil / ganzes * 100) : 0);
const hatWert = v => v !== null && v !== undefined && isFinite(v);

function prevKey(key, mode){
  if(!key) return null;
  const [y,m] = key.split("-").map(Number);
  if(mode === "year") return (y-1) + "-" + String(m).padStart(2,"0");
  const d = m === 1 ? [y-1,12] : [y,m-1];
  return d[0] + "-" + String(d[1]).padStart(2,"0");
}
/* „2026-08“ um n Monate zurück */
function monatMinus(key, n){
  const d = new Date(+key.slice(0,4), +key.slice(5,7) - 1 - n, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0");
}

/* „2026-07“ → „Juli 2026“. Einheitlich für alle Kanäle. */
function monatsName(key){
  if(!key) return "—";
  return new Date(key + "-01T12:00:00").toLocaleDateString("de-DE", {month:"long", year:"numeric"});
}
/* „2026-07“ → „Jul 2026“ für enge Stellen */
function kurzMonat(key){
  if(!key) return "—";
  return MONTH_SHORT[+key.slice(5,7) - 1] + " " + key.slice(0,4);
}
function uhrzeit(zeit){
  return new Date(zeit || Date.now()).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) + " Uhr";
}

/* Kennzahlen, bei denen ein niedrigerer Wert das bessere Ergebnis ist */
const LOWER_IS_BETTER = new Set(["bounce","bounceRate","uninstalls","unsubscribes",
                                 "unsubscribeRate","crashes","spam","spamRate"]);

function deltaHTML(key, now, before, compareLabel){
  if(!hatWert(before) || before === 0 || !hatWert(now)){
    return '<span class="delta flat"><em>Kein Vergleichswert</em></span>';
  }
  const diff = ((now - before) / before) * 100;
  const rounded = Math.round(diff * 10) / 10;
  if(Math.abs(rounded) < 0.05){
    return '<span class="delta flat"><em>unverändert vs. ' + esc(compareLabel) + '</em></span>';
  }
  const rising = rounded > 0;
  const good = LOWER_IS_BETTER.has(key) ? !rising : rising;
  const cls = good ? "up" : "down";
  const tri = rising ? "▲" : "▼";
  const val = nf.format(Math.abs(rounded)) + " %";
  return '<span class="delta ' + cls + '"><span class="tri">' + tri + '</span><span class="dv">' + val + '</span>' +
         ' <em>vs. ' + esc(compareLabel) + '</em></span>';
}

/* Zahlen zählen beim Aufbau hoch */
function countUp(el){
  const target = parseFloat(el.dataset.count);
  const out = FORMATTERS[el.dataset.kind || "num"] || fmt;
  if(!isFinite(target)) return;
  if(REDUCED){ el.textContent = out(target); return; }
  const span = 800, t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t - t0) / span);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = out(target * eased);
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = out(target);
  }
  el.textContent = out(0);
  requestAnimationFrame(step);
}

/* Ruhige Ansicht, wenn ein Kanal (noch) keine Daten hat. */
function leerHinweis(titel, text){
  return '<div class="grid"><div class="card placeholder">' +
    '<b>' + esc(titel) + '</b><p>' + esc(text) + '</p></div></div>';
}
/* Ruhige Ersatzkachel, wenn ein Bericht einen einzelnen Abschnitt nicht enthält. */
function leereKachel(klasse, titel, text){
  return '<div class="card ' + klasse + '">' +
    '<div class="card-head"><h2>' + esc(titel) + '</h2><span class="card-note">ohne Daten</span></div>' +
    '<p class="hint" style="margin-top:2px">' + esc(text) + '</p></div>';
}

/* ============================================================
   1. ZUSTAND UND KANAL-REGISTER

   Die Shell (Filter, Statuszeile, Aktualisieren, Export, Cache)
   kennt keinen Kanal namentlich. Jeder Kanal trägt sich unten in
   KANAELE ein und liefert dabei alles mit, was die Shell braucht:
   wo seine Daten liegen, wie er sich zeichnet, wie er lädt und wie
   er sich für den Zwischenspeicher verpackt.

   Ein neuer Kanal braucht deshalb genau einen Block wie die drei
   unten — an der Shell ist nichts zu ändern.
   ============================================================ */
/* bus-und-bahn.de: Matomo zählt Besuche und Eindeutige Besucher derzeit
   fast gleich hoch. Solange das intern geprüft wird, zeigt das Dashboard
   für die Website nur die Eindeutigen Besucher — in Kacheln, Diagrammen,
   Übersicht, Auffälligkeiten und Export. Aufteilungen, die Matomo nur je
   Besuch liefert (Herkunft, Geräte, Suchmaschinen …), stehen dann als
   Anteile statt als Besuchszahlen da. Auf false setzen, sobald die
   Zählung wieder stimmt: Dann erscheint alles wieder wie vorher. */
const WEB_NUR_BESUCHER = true;

const state = {
  view: "overview",
  month: null,          /* bus-und-bahn.de */
  monthApp: null,       /* DSW21-App */
  monthNews: null,      /* Newsletter */
  monthNetz: null,      /* Interaktiver Liniennetzplan */
  monthWlan: null,      /* Bus-WLAN */
  monthWlanCity: null,  /* WLAN-City */
  monthChat: null,      /* Chatbot */
  compare: {},          /* je Kanal die gewählte Vergleichsart */
  chartMetric: WEB_NUR_BESUCHER ? "visitors" : "visits",
  chartMetricApp: "activeUsers",
  chartMetricNews: "recipients",
  chartMetricNetz: "visits",
  chartMetricWlan: "sessions",
  chartMetricWlanCity: "sessions",
  chartMetricChat: "anfragen",
  ovKanal: null,        /* Übersicht: Kanal im Jahresvergleich */
  ovMetrik: null        /* Übersicht: Kennzahl im Jahresvergleich */
};

const KANAELE = {};
const kanalIds = () => Object.keys(KANAELE);
/* Reihenfolge wie in der Seitenleiste */
const KANAL_ORDNUNG = ["web","app","news","netz","wlan","wlancity","chat"];
function kanalListe(){
  const ids = kanalIds();
  return KANAL_ORDNUNG.filter(function(id){ return ids.indexOf(id) > -1; })
    .concat(ids.filter(function(id){ return KANAL_ORDNUNG.indexOf(id) === -1; }));
}
function kanal(id){ return KANAELE[id || state.view] || null; }
function kanalInfo(){ return kanal(state.view); }
function datensatz(id){ const k = kanal(id); return k ? k.daten() : {}; }
function ordnung(id){ const k = kanal(id); return k ? k.ordnung() : []; }
function aktMonat(id){ const k = kanal(id); return k ? state[k.monatFeld] : null; }
function setzeMonat(v){ const k = kanalInfo(); if(k) state[k.monatFeld] = v; }

/* Nach jedem Laden: gewählten Monat prüfen und notfalls auf den
   jüngsten vorhandenen setzen. */
function monatPruefen(id){
  const k = kanal(id);
  if(!k) return;
  const d = k.daten(), ord = k.ordnung();
  if(!state[k.monatFeld] || !d[state[k.monatFeld]]) state[k.monatFeld] = ord[ord.length-1] || null;
}

/* Vergleichsmonat — welche Vergleiche es gibt, sagt der Kanal. Für
   Website und App ist das der Vor- bzw. Vorjahresmonat; ein Newsletter
   geht unregelmäßig raus, dort ist der vorherige Versand gemeint. Die
   Auswahl wird je Kanal gemerkt. */
const STANDARD_VERGLEICH = [
  {v:"prev", t:"Vormonat",        kurz:"Vormonat"},
  {v:"year", t:"Vorjahresmonat",  kurz:"Vorjahr"},
  {v:"none", t:"Kein Vergleich",  kurz:""}
];
function vergleichArten(id){
  const k = kanal(id);
  return (k && k.vergleichArten) || STANDARD_VERGLEICH;
}
function vergleichArt(id){
  const arten = vergleichArten(id);
  return arten.find(a => a.v === state.compare[id]) || arten[0];
}
function vergleich(id){
  const k = kanal(id), d = k.daten(), monat = state[k.monatFeld];
  const art = vergleichArt(id);
  let cmp = null;
  if(art.v !== "none"){
    const key = k.vergleichsMonat ? k.vergleichsMonat(monat, art.v) : prevKey(monat, art.v);
    cmp = (key && d[key]) || null;
  }
  return {cmp: cmp, label: k.vergleichLabel ? k.vergleichLabel(cmp, art) : art.kurz};
}

/* ============================================================
   2. ZWISCHENSPEICHER (localStorage)

   Einmal gelesene Kennzahlen bleiben im Browser liegen. F5 zeigt
   sie sofort wieder an, ohne den fileadmin-Ordner erneut zu lesen.
   Neu geladen wird in drei Fällen:
     · Klick auf „Aktualisieren"
     · harter Neuladen (Strg+F5) oder geleerter Browsercache
     · abgelaufener Zwischenspeicher (SPEICHER.frist)
   Im Code selbst steht weiterhin kein einziger Monatswert.
   ============================================================ */
const SPEICHER = {
  schluessel: "bmk-kennzahlen",
  version: 5,                        /* hochzählen, wenn sich die Datenstruktur ändert */
  frist: 12 * 60 * 60 * 1000         /* nach einem halben Tag wird ohnehin neu gelesen */
};

/* localStorage ist im privaten Modus mancher Browser gesperrt —
   dann läuft das Dashboard ohne Zwischenspeicher weiter. */
const LS = (function(){
  try{
    const s = window.localStorage;
    s.setItem(SPEICHER.schluessel + ".test", "1");
    s.removeItem(SPEICHER.schluessel + ".test");
    return s;
  }catch(e){ return null; }
})();
const cacheName = id => SPEICHER.schluessel + "." + id;

function cacheLesen(id){
  if(!LS) return null;
  try{
    const roh = LS.getItem(cacheName(id));
    if(!roh) return null;
    const obj = JSON.parse(roh);
    if(!obj || obj.v !== SPEICHER.version) return null;
    if(!obj.t || Date.now() - obj.t > SPEICHER.frist) return null;
    return obj;
  }catch(e){ return null; }
}
function cacheSchreiben(id){
  if(!LS) return;
  const k = kanal(id);
  if(!k || !k.packen) return;
  try{
    LS.setItem(cacheName(id), JSON.stringify({v:SPEICHER.version, t:Date.now(), inhalt:k.packen()}));
  }catch(e){
    /* Speicher voll: lieber ohne Zwischenspeicher weiterlaufen als
       mit einem halb geschriebenen Eintrag. */
    try{ LS.removeItem(cacheName(id)); }catch(e2){}
  }
}
function cacheLeeren(){
  if(!LS) return;
  kanalIds().forEach(function(id){ try{ LS.removeItem(cacheName(id)); }catch(e){} });
}

/* Strg+F5 lässt sich nicht direkt abfragen. Der Unterschied ist aber
   messbar: Beim normalen F5 holt der Browser Bilder und Skripte aus
   seinem Cache (transferSize 0), beim harten Neuladen überträgt er
   alles neu. Geprüft wird erst nach dem load-Ereignis, weil vorher
   noch keine Messwerte vorliegen. Im Zweifel gilt: kein hartes
   Neuladen — die Daten kommen dann aus dem Zwischenspeicher und der
   Knopf „Aktualisieren" bleibt der verlässliche Weg. */
function hartNeuGeladen(){
  try{
    const nav = (performance.getEntriesByType("navigation") || [])[0];
    if(!nav || nav.type !== "reload") return false;
    const eigene = performance.getEntriesByType("resource").filter(function(r){
      return r.name.indexOf(location.origin) === 0 &&
             ["img","link","script","css"].indexOf(r.initiatorType) > -1;
    });
    if(!eigene.length) return false;
    return eigene.every(function(r){ return r.transferSize > 0; });
  }catch(e){ return false; }
}
function nachDemLaden(fn){
  const spaeter = function(){ setTimeout(fn, 300); };
  if(document.readyState === "complete") spaeter();
  else window.addEventListener("load", spaeter, {once:true});
}

/* ============================================================
   3. STATUSZEILE

   Ein Satzbau für alle Kanäle:
     Daten bis Juli 2026 · 12 Berichte gelesen · 3 neu · 09:37 Uhr
     Daten bis Juli 2026 · 12 Monate aus dem Zwischenspeicher · Stand 09:12 Uhr
   ============================================================ */
const statusBox  = document.getElementById("data-status");
const statusText = document.getElementById("data-status-text");
const refreshBtn = document.getElementById("refresh-btn");
const STATUS = {};

function setStatus(kind, text, id){
  const ziel = id || state.view;
  if(!KANAELE[ziel]) return;
  STATUS[ziel] = {kind:kind, text:text};
  zeigeStatus();
}
function zeigeStatus(){
  const st = state.view === "overview" ? null : STATUS[state.view];
  statusBox.style.display = st ? "" : "none";
  if(!st) return;
  statusBox.className = "src " + st.kind;
  statusText.textContent = st.text;
}
function einheit(id, anzahl){
  const e = kanal(id).einheit;
  return anzahl === 1 ? e[0] : e[1];
}
function datenBis(id){
  const ord = ordnung(id);
  return "Daten bis " + monatsName(ord[ord.length-1]);
}
/* Meldung nach dem Lesen aus dem fileadmin */
function ladeMeldung(id, b){
  const teile = [datenBis(id), b.gelesen + " " + einheit(id, b.gelesen) + " gelesen"];
  teile.push(b.neu ? b.neu + " neu" : "keine neuen");
  if(b.fehler){
    teile.push(b.fehler + " nicht auswertbar" +
      (b.fehlerNamen && b.fehlerNamen.length ? " (" + b.fehlerNamen.join(", ") + ")" : ""));
  }
  (b.hinweise || []).forEach(function(h){ teile.push(h); });
  teile.push(uhrzeit());
  return teile.join(" · ");
}
/* Meldung, wenn die Werte aus dem Zwischenspeicher kommen */
function cacheMeldung(id, stand){
  const anzahl = ordnung(id).length;
  const alt = new Date(stand), heute = new Date();
  const gleicherTag = alt.toDateString() === heute.toDateString();
  return [datenBis(id),
          anzahl + " " + einheit(id, anzahl) + " aus dem Zwischenspeicher",
          "Stand " + (gleicherTag ? "" : alt.toLocaleDateString("de-DE") + ", ") + uhrzeit(stand)
         ].join(" · ");
}

/* ============================================================
   4. AUSWAHLFELDER (eigene Dropdowns)
   ============================================================ */
const COMBOS = [];
function closeAllCombos(){ COMBOS.forEach(c => c.close()); }
document.addEventListener("click", closeAllCombos);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeAllCombos(); });

function createCombo(host, cfg){
  host.className = "combo";
  host.innerHTML =
    '<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="combo-label">' + esc(cfg.label) + '</span>' +
      '<span class="combo-val"></span>' +
      '<span class="combo-caret" aria-hidden="true"></span>' +
    '</button>' +
    '<div class="combo-panel" role="listbox" aria-label="' + esc(cfg.label) + '" hidden></div>';

  const btn   = host.querySelector(".combo-btn");
  const panel = host.querySelector(".combo-panel");
  const valEl = host.querySelector(".combo-val");
  let value = cfg.value;

  function paint(){
    /* Ohne Daten gibt es keine Optionen — dann bleibt das Feld leer,
       statt beim Zugriff auf den ersten Eintrag abzustürzen. */
    const sel = cfg.options.find(o => o.v === value) || cfg.options[0];
    valEl.textContent = sel ? sel.t : "—";
    panel.innerHTML = cfg.options.map(o =>
      '<button type="button" class="combo-opt" role="option" data-v="' + esc(o.v) + '" ' +
      'aria-selected="' + (o.v === value) + '">' + esc(o.t) + '</button>').join("");
  }
  function close(){
    host.classList.remove("open");
    panel.hidden = true;
    btn.setAttribute("aria-expanded","false");
  }
  function open(){
    closeAllCombos();
    host.classList.add("open");
    panel.hidden = false;
    btn.setAttribute("aria-expanded","true");
  }

  btn.addEventListener("click", e => {
    e.stopPropagation();
    host.classList.contains("open") ? close() : open();
  });
  panel.addEventListener("click", e => {
    e.stopPropagation();
    const opt = e.target.closest(".combo-opt");
    if(!opt) return;
    value = opt.dataset.v;
    paint();
    close();
    btn.focus();
    cfg.onChange(value);
  });

  paint();
  close();
  const api = {
    close: close,
    setOptions: function(options, newValue){
      cfg.options = options || [];
      if(newValue !== undefined) value = newValue;
      /* Leere Liste ist erlaubt: dann steht „—" im Feld. */
      if(cfg.options.length && !cfg.options.some(o => o.v === value)) value = cfg.options[0].v;
      paint();
    }
  };
  COMBOS.push(api);
  return api;
}

/* Jahre und Monate aus den Daten des aktuellen Kanals ableiten */
function jahreListe(){
  const j = {};
  ordnung().forEach(k => { j[k.slice(0,4)] = 1; });
  return Object.keys(j).sort().reverse();
}
function monateImJahr(jahr){
  return ordnung().filter(k => k.slice(0,4) === jahr).sort().reverse();
}
function monatsLabel(k){
  const d = datensatz();
  return d[k] ? String(d[k].label).replace(/\s+\d{4}$/, "") : k;
}

let yearCombo, monthCombo, compareCombo;   /* werden beim Start erzeugt (siehe Abschnitt 15) */

/* ============================================================
   5. GEMEINSAME BAUSTEINE FÜR ALLE KANÄLE
   Sparkline, KPI-Raster, Jahresverlauf, Rangliste, Verteilung.
   Jeder Kanal beschreibt nur noch, was er zeigen will.
   ============================================================ */

/* Rollierender Trend der letzten zwölf Monate als Linie; Punkte zeigen
   den Wert beim Hovern. Monate ohne Wert werden übersprungen, sonst
   zöge die Linie auf null. Gilt für jeden Kanal gleichermaßen, weil
   alle über kpiRaster() zeichnen. */
const SPARK_MONATE = 12;
function spark(id, metric, kind){
  const k = kanal(id), d = k.daten(), ord = k.ordnung(), monat = state[k.monatFeld];
  const idx = ord.indexOf(monat);
  const keys = ord.slice(Math.max(0, idx - (SPARK_MONATE - 1)), idx + 1)
                  .filter(x => d[x] && d[x].kpi && hatWert(d[x].kpi[metric]));
  if(!keys.length) return "";

  const out  = FORMATTERS[kind || "num"] || fmt;
  const vals = keys.map(x => d[x].kpi[metric]);
  const max  = maxOf(vals);
  const n    = keys.length;

  const px = i => n === 1 ? 50 : (i / (n - 1)) * 100;
  const py = v => 26 - (v / max) * 22;          /* 0 → 26, Maximum → 4 */

  /* Bei nur einem Monat eine waagerechte Linie über die volle Breite */
  const path = (n === 1)
    ? [[0, py(vals[0])], [100, py(vals[0])]]
    : vals.map((v,i) => [px(i), py(v)]);

  const line = "M" + path.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L");
  const area = line + " L " + path[path.length-1][0].toFixed(2) + " 28 L " + path[0][0].toFixed(2) + " 28 Z";

  const dots = keys.map(function(x,i){
    const top = (py(vals[i]) / 28) * 100;
    return '<span class="sd' + (x === monat ? " cur" : "") + '" style="left:' + px(i).toFixed(2) + '%">' +
             '<i style="top:' + top.toFixed(2) + '%"></i>' +
             '<span class="tip">' + MONTH_SHORT[+x.slice(5,7) - 1] + ': ' + out(vals[i]) + '</span>' +
           '</span>';
  }).join("");

  const label = n > 1
    ? "Trend über " + n + " Monate: " + d[keys[0]].label + " bis " + d[keys[n-1]].label
    : d[keys[0]].label;

  return '<div class="spark">' +
      '<svg class="kpi-spark" viewBox="0 0 100 28" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
        '<path class="area" d="' + area + '"></path>' +
        '<path class="line" d="' + line + '" vector-effect="non-scaling-stroke"></path>' +
      '</svg>' +
      '<div class="dots">' + dots + '</div>' +
    '</div>';
}

/* Sechs KPI-Kacheln. Fehlt eine Kennzahl in der Quelle, steht ein
   Strich statt einer 0 — sonst läse sich eine Lücke wie ein
   gemessener Nullwert. */
function kpiRaster(id, cur, cmp, cmpLabel){
  const k = kanal(id);
  return '<div class="kpi-grid">' + k.kpis.map(function(def){
    const kind = def.kind || "num";
    const wert = cur.kpi ? cur.kpi[def.key] : null;
    const out  = FORMATTERS[kind];
    /* Kennzahlen mit hinterlegter Erklärung bekommen oben rechts ein (i). */
    const kopf = '<div class="card kpi"><h2 class="label">' + esc(def.label) + '</h2>' +
                 infoKnopf(id, def.key, def.label);
    if(!hatWert(wert)){
      return kopf + '<div class="val">—</div>' +
             '<span class="delta flat"><em>' + esc(k.fehltText) + '</em></span></div>';
    }
    return kopf +
      '<div class="val" data-count="' + wert + '" data-kind="' + kind + '">' + out(wert) + '</div>' +
      spark(id, def.key, kind) +
      deltaHTML(def.key, wert, cmp && cmp.kpi ? cmp.kpi[def.key] : null, cmpLabel) +
    '</div>';
  }).join("") + '</div>';
}

/* Jahresverlauf als Balken mit Umschalter. Welche Kennzahlen zur
   Auswahl stehen, sagt der Kanal über chart.metriken. */
function jahresChart(id){
  const k = kanal(id), d = k.daten(), monat = state[k.monatFeld];
  /* Gemerkte Kennzahl, die der Kanal nicht (mehr) anbietet: erste nehmen. */
  if(!k.chart.metriken[state[k.chart.feld]]) state[k.chart.feld] = Object.keys(k.chart.metriken)[0];
  const aktiv = state[k.chart.feld];
  const art   = (k.chart.art && k.chart.art[aktiv]) || "num";
  const out   = FORMATTERS[art] || fmt;
  const jahr  = monat.slice(0,4);

  const werte = MONTH_SHORT.map(function(kurz, i){
    const key = jahr + "-" + String(i+1).padStart(2,"0");
    const v = d[key] && d[key].kpi ? d[key].kpi[aktiv] : null;
    return {kurz:kurz, key:key, val: hatWert(v) ? v : null};
  });
  const max = maxOf(werte.map(x => x.val || 0));

  const knoepfe = Object.keys(k.chart.metriken).map(function(m){
    return '<button data-m="' + m + '" aria-pressed="' + (aktiv === m) + '">' +
           esc(k.chart.metriken[m]) + '</button>';
  }).join("");

  const balken = werte.map(function(x){
    const hat = x.val !== null;
    return '<div class="bar' + (hat ? "" : " empty") + (x.key === monat ? " active" : "") + '">' +
      '<div class="track">' +
        (hat ? '<div class="tip">' + x.kurz + ': ' + out(x.val) + '</div>' : '') +
        '<div class="fill" data-h="' + (hat ? Math.max(4, x.val / max * 100) : 0) + '"></div>' +
      '</div><div class="mlabel">' + x.kurz + '</div></div>';
  }).join("");

  return '<div class="card chart ' + (k.chart.klasse || "") + '">' +
      '<div class="card-head"><h2>Jahresverlauf ' + jahr + '</h2>' +
        '<div class="segmented" id="chart-switch">' + knoepfe + '</div></div>' +
      '<div class="bars">' + balken + '</div>' +
      '<p class="hint">' + esc(k.chart.hinweis(k.chart.metriken[aktiv])) + '</p>' +
    '</div>';
}

/* Freie Balkenreihe — gleiche Optik wie der Jahresverlauf, aber mit
   beliebigen Punkten (Tage, Stunden, Wochentage).
   punkte: {label, wert, tipp, zusatz, aktiv} · o.einheit hinter dem Wert im Tooltip */
function balkenReihe(o){
  const punkte = (o.punkte || []).filter(function(p){ return p; });
  if(!punkte.length) return leereKachel("chart " + (o.klasse || ""), o.titel, o.leerText ||
    "Dieser Bericht enthält dazu keine Werte.");
  const max = maxOf(punkte.map(function(p){ return p.wert || 0; }));
  const out = FORMATTERS[o.kind || "num"] || fmt;
  const balken = punkte.map(function(p){
    const hat = hatWert(p.wert);
    return '<div class="bar' + (hat ? "" : " empty") + (p.aktiv ? " active" : "") + '">' +
      '<div class="track">' +
        (hat ? '<div class="tip">' + esc(p.tipp || p.label) + ': ' + out(p.wert) + (o.einheit ? ' ' + esc(o.einheit) : '') +
               (p.zusatz ? ' · ' + esc(p.zusatz) : '') + '</div>' : '') +
        '<div class="fill" data-h="' + (hat ? Math.max(2, p.wert / max * 100) : 0) + '"></div>' +
      '</div><div class="mlabel">' + esc(p.label) + '</div></div>';
  }).join("");
  return '<div class="card chart ' + (o.klasse || "") + '">' +
    '<div class="card-head"><h2>' + esc(o.titel) + '</h2>' +
    '<span class="card-note">' + esc(o.note || "") + '</span></div>' +
    '<div class="bars' + (punkte.length > 12 ? " dense" : "") + '">' + balken + '</div>' +
    (o.hinweis ? '<p class="hint">' + esc(o.hinweis) + '</p>' : '') +
  '</div>';
}

/* Rangliste. zeilen: {name, tag, text, anteil, meta, klasse} */
function rangKachel(o){
  if(!o.zeilen || !o.zeilen.length){
    return leereKachel(o.klasse || "rank", o.titel,
      o.leerText || "Für diesen Monat sind dazu keine Werte enthalten.");
  }
  const items = o.zeilen.map(function(z){
    return '<li class="' + (z.klasse || "") + '">' +
      '<span class="name"><span class="txt" title="' + esc(z.hover || z.name) + '">' + esc(z.name) + '</span>' +
        (z.raw ? '<span class="event-raw" title="' + esc(z.raw) + '">' + esc(z.raw) + '</span>' : '') +
        (z.tag ? '<span class="tagf">' + esc(z.tag) + '</span>' : '') + '</span>' +
      '<span class="num">' + (z.text || "—") + '</span>' +
      '<span class="barline"><span data-w="' + (z.anteil || 0) + '"></span></span>' +
      '<span class="meta">' + (z.meta || "") + '</span>' +
    '</li>';
  }).join("");
  return '<div class="card ' + (o.klasse || "rank") + '">' +
    '<div class="card-head"><h2>' + esc(o.titel) + '</h2>' +
    '<span class="card-note">' + esc(o.note || "") + '</span></div>' +
    (o.legende ? '<div class="rank-legend">' + esc(o.legende) + '</div>' : '') +
    '<ol>' + items + '</ol></div>';
}

const CH_COLORS  = ["#3b6ef6","#7aa0fa","#a9c2fc","#cfdcfe","#e6ecfe"];
const DEV_COLORS = ["#3b6ef6","#8ab0fb","#bed0fd","#e2e9fe"];

/* Gestapelter Balken mit Legende. eintraege: [[name, wert], …]
   nurAnteil: Legende ohne absolute Zahlen, nur mit Anteilen. */
function verteilung(o){
  const eintraege = (o.eintraege || []).filter(e => hatWert(e[1]) && e[1] > 0);
  if(!eintraege.length) return leereKachel(o.klasse, o.titel, o.leerText);
  const summe  = eintraege.reduce((a,e) => a + e[1], 0);
  const farben = o.farben || CH_COLORS;
  const stack = eintraege.map((e,i) =>
    '<span style="flex-grow:' + e[1] + ';background:' + farben[i % farben.length] + '"></span>').join("");
  const legende = eintraege.map((e,i) =>
    '<div><span class="dot" style="background:' + farben[i % farben.length] + '"></span>' +
    '<span class="lname">' + esc(e[0]) + '</span>' +
    (o.nurAnteil ? '' : '<span class="lval">' + fmt(e[1]) + '</span>') +
    '<span class="lpct' + (o.nurAnteil ? ' allein' : '') + '">' +
      (o.nachkomma ? dec1(e[1]/summe*100) : anteil(e[1], summe)) + ' %</span></div>').join("");
  return '<div class="card ' + o.klasse + '">' +
    '<div class="card-head"><h2>' + esc(o.titel) + '</h2>' +
    '<span class="card-note">' + esc(o.note || "") + '</span></div>' +
    '<div class="stack">' + stack + '</div>' +
    '<div class="legend">' + legende + '</div>' +
    (o.hinweis ? '<p class="hint">' + esc(o.hinweis) + '</p>' : '') +
    (o.nachsatz || '') +
  '</div>';
}

function kpiInfo(id, key){
  const k = KANAELE[id];
  const gruppe = KPI_INFO[(k && k.infoGruppe) || id];
  return gruppe ? gruppe[key] || null : null;
}
const INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" ' +
  'aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v5"/><circle cx="12" cy="7.9" r=".6" ' +
  'fill="currentColor" stroke-width="1.4"/></svg>';
function infoKnopf(id, key, label){
  if(!kpiInfo(id, key)) return "";
  return '<button type="button" class="kpi-i" data-info="' + esc(id + "|" + key) + '" aria-haspopup="dialog" ' +
    'aria-expanded="false" aria-label="Was bedeutet ' + esc(label) + '?" title="Was bedeutet das?">' + INFO_ICON + '</button>';
}

/* Das Fenster liegt am <body> (wie der Export-Dialog), damit es weder
   vom abgerundeten Dashboard noch von einer schwebenden Kachel
   abgeschnitten wird. Es gibt immer nur eines. */
const infoFenster = (function(){
  let el = null, knopf = null;

  function bauen(){
    el = document.createElement("div");
    el.id = "bmk-info";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-labelledby", "bmk-info-titel");
    el.hidden = true;
    document.body.appendChild(el);
    el.addEventListener("click", function(e){
      e.stopPropagation();
      if(e.target.closest(".i-zu")) schliessen(true);
    });
  }

  function inhalt(id, key){
    const k = KANAELE[id], info = kpiInfo(id, key);
    const def = k.kpis.find(function(d){ return d.key === key; }) || {label:key};
    const cur = k.daten()[state[k.monatFeld]];
    const aktuell = (info.aktuell && cur) ? info.aktuell(cur) : "";
    const q = info.quelle || {};
    return '<div class="i-kopf"><span class="i-kanal">' + esc(kurzName(id)) + ' · ' + esc(q.name || "") + '</span>' +
        '<button type="button" class="i-zu" aria-label="Erklärung schließen">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' +
        '</button></div>' +
      '<h3 id="bmk-info-titel">' + esc(def.label) + '</h3>' +
      (info.text ? '<p class="i-text">' + esc(info.text) + '</p>' : '') +
      (info.zitat ? '<blockquote class="i-zitat">„' + esc(info.zitat) + '“</blockquote>' : '') +
      (aktuell ? '<p class="i-aktuell">' + esc(aktuell) + '</p>' : '') +
      (info.hinweis ? '<p class="i-hinweis"><b>Gut zu wissen:</b> ' + esc(info.hinweis) + '</p>' : '') +
      '<p class="i-quelle">Quelle: ' + esc(q.name || "—") + (q.art ? ' · ' + esc(q.art) : '') +
        (q.url ? ' · <a href="' + esc(q.url) + '" target="_blank" rel="noopener">zur Quelle ↗</a>' : '') + '</p>';
  }

  function setzen(){
    if(!el || el.hidden || !knopf) return;
    const r = knopf.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const breite = Math.min(360, vw - 24);
    el.style.width = breite + "px";
    const hoch = el.offsetHeight;
    let left = r.right + 8 - breite;
    left = Math.max(12, Math.min(left, vw - breite - 12));
    let top = r.bottom + 10, oben = false;
    if(top + hoch > vh - 12 && r.top - hoch - 10 > 12){ top = r.top - hoch - 10; oben = true; }
    top = Math.max(12, Math.min(top, vh - hoch - 12));
    el.style.left = left + "px";
    el.style.top = top + "px";
    el.classList.toggle("oben", oben);
    el.style.setProperty("--pfeil", Math.max(18, Math.min(breite - 18, r.left + r.width / 2 - left)) + "px");
  }

  function oeffnen(btn){
    if(!el) bauen();
    const teile = String(btn.dataset.info || "").split("|");
    if(!KANAELE[teile[0]] || !kpiInfo(teile[0], teile[1])) return;
    if(knopf === btn && !el.hidden){ schliessen(true); return; }
    schliessen(false);
    knopf = btn;
    el.innerHTML = inhalt(teile[0], teile[1]);
    el.hidden = false;
    el.classList.remove("rein");
    setzen();
    void el.offsetWidth;
    el.classList.add("rein");
    btn.setAttribute("aria-expanded", "true");
    btn.classList.add("offen");
    const zu = el.querySelector(".i-zu");
    if(zu) zu.focus({preventScroll:true});
  }

  function schliessen(fokusZurueck){
    if(!el || el.hidden) return;
    el.hidden = true;
    if(knopf){
      knopf.setAttribute("aria-expanded", "false");
      knopf.classList.remove("offen");
      if(fokusZurueck && document.contains(knopf)) knopf.focus({preventScroll:true});
    }
    knopf = null;
  }

  document.addEventListener("click", function(e){
    const btn = e.target.closest && e.target.closest(".kpi-i");
    if(btn){ e.preventDefault(); e.stopPropagation(); oeffnen(btn); return; }
    if(el && !el.hidden && !el.contains(e.target)) schliessen(false);
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") schliessen(true); });
  window.addEventListener("resize", function(){ schliessen(false); });
  /* Beim Scrollen im Inhaltsbereich wandert das Fenster mit seiner Kachel mit. */
  document.addEventListener("scroll", function(){ setzen(); }, true);

  return {schliessen: function(){ schliessen(false); }};
})();

/* ============================================================
   6. KANAL bus-und-bahn.de
   Quelle: Matomo-Monatsberichte (PDF) im fileadmin.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/bus-und-bahn.de/
   Im Code stehen bewusst keine Monatswerte.
   ============================================================ */
let DATA = {};
let FOCUS_DATA = {};

const WEB_QUELLE = {
  ordner: "/fileadmin/user_upload/17_kennzahlen/bus-und-bahn.de/",
  pdfjs:  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  worker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  maxBerichte: 30,          /* Sicherheitsnetz gegen versehentlich volle Ordner */
  probeMonate: 24           /* so viele Monate rückwärts suchen, wenn kein Listing */
};

/* Fokusseiten: werden immer angezeigt, auch außerhalb der Top 8. */
const FOCUS_PAGES = ["Digitales Fahrplanbuch","Digitales Fundbüro"];

/* ---------- Seitentitel aufräumen ----------
   Startseite umbenennen, Verkehrsmeldungen inkl. iframe addieren,
   Präfix "DSW21:" entfernen.                                        */
const TITLE_MAP = {};
function cleanTitle(t){
  if(TITLE_MAP[t]) return TITLE_MAP[t];
  if(/^DSW21\s*[-–—]\s*Dein Weg/i.test(t)) return "Startseite";
  if(/^(DSW21\s*:\s*)?Verkehrsmeldungen(\s*\(iframe\))?$/i.test(t)) return "Verkehrsmeldungen";
  return t.replace(/^DSW21\s*:\s*/, "");
}
function preparePages(rows){
  const out = [], seen = {};
  rows.forEach(r=>{
    const name = cleanTitle(r[0]);
    if(seen[name] !== undefined){
      const e = out[seen[name]];
      const sum = e[1] + r[1];
      e[2] = Math.round((e[2]*e[1] + r[2]*r[1]) / sum);   /* gewichtete Absprungrate */
      e[1] = sum;
    }else{
      seen[name] = out.length;
      out.push([name, r[1], r[2]]);
    }
  });
  return out.sort((a,b)=>b[1]-a[1]);
}
function lastKnownFocus(name, monthKey){
  const ord = Object.keys(DATA).sort();
  const idx = ord.indexOf(monthKey);
  for(let i = idx - 1; i >= 0; i--){
    const f = FOCUS_DATA[ord[i]];
    if(f && f[name]) return {key:ord[i], val:f[name][0]};
  }
  return null;
}

function chipText(name){ return String(name).replace(/^www\./,"").slice(0,2); }
function bounceClass(v){
  if(v <= 45) return "pill good";
  if(v >= 60) return "pill warn";
  return "pill";
}

function renderWebsite(){
  const cur = DATA[state.month];
  const v = vergleich("web"), cmp = v.cmp, cmpLabel = v.label;

  /* --- KPI-Kacheln + Jahresverlauf --- */
  const kpiHTML   = kpiRaster("web", cur, cmp, cmpLabel);
  const chartHTML = jahresChart("web");

  /* --- Meistbesuchte Seiten (mit Fokusseiten) --- */
  const pages = preparePages(cur.pages || []);
  const top   = pages.slice(0,8);
  const pgMax = maxOf(top.map(r=>r[1]));
  const inTop = top.map(r=>r[0]);

  const pageRows = top.map(r=>({
    name:r[0], val:r[1], bounce:r[2], focus:FOCUS_PAGES.indexOf(r[0]) > -1, sep:false
  }));

  FOCUS_PAGES.forEach(function(name){
    if(inTop.indexOf(name) > -1) return;
    const hit = pages.find(r=>r[0] === name);
    const rep = (FOCUS_DATA[state.month] || {})[name];
    const row = {name:name, focus:true, sep:false, val:null, bounce:null, hint:""};
    if(hit){ row.val = hit[1]; row.bounce = hit[2]; }
    else if(rep){ row.val = rep[0]; row.bounce = rep[1]; }
    else {
      const last = lastKnownFocus(name, state.month);
      row.hint = last
        ? "im Bericht nicht ausgewiesen — zuletzt " + MONTH_SHORT[+last.key.slice(5,7)-1] + ": " + fmt(last.val)
        : "im Monatsbericht nicht ausgewiesen";
    }
    pageRows.push(row);
  });
  const firstExtra = pageRows.findIndex(r=>r.focus && inTop.indexOf(r.name) === -1);
  if(firstExtra > -1) pageRows[firstExtra].sep = true;

  const pagesHTML = rangKachel({
    klasse:"rank pages-rank", titel:"Meistbesuchte Seiten", note:"Eindeutige Seitenansichten",
    legende:"Balken = relativ zum Spitzenwert. Verkehrsmeldungen inkl. iframe. " +
            "Fokusseiten stehen unabhängig von ihrer Platzierung immer mit dabei.",
    leerText:"Dieser Monatsbericht enthält keine Seitentitel.",
    zeilen: pageRows.map(function(r){
      return {
        name:  r.name,
        tag:   r.focus ? "Fokus" : null,
        text:  r.val === null ? "—" : fmt(r.val),
        anteil:r.val === null ? 0 : (r.val / pgMax) * 100,
        meta:  r.val === null ? esc(r.hint) : r.bounce + " % Absprung",
        klasse:(r.sep ? "sep " : "") + (r.val === null ? "nodata" : "")
      };
    })
  });

  /* --- Interne Suchbegriffe --- */
  const suchen = cur.searchTerms || [];
  const suchMax = maxOf(suchen.map(r=>r[1]));
  const searchHTML = rangKachel({
    klasse:"rank", titel:"Interne Suchbegriffe", note:"Was Besucher nicht finden",
    legende:"Balken = relativ zum Spitzenwert, nicht Anteil aller Nutzer",
    leerText:"Für diesen Monat sind dazu keine Werte im Bericht enthalten.",
    zeilen: suchen.map(function(r){
      return {name:r[0], text: fmt(r[1]) + ' <i>Suchen</i>',
              anteil:(r[1]/suchMax)*100, meta: r[2] + " % Ausstieg"};
    })
  });

  /* Matomo liefert Herkunft, Geräte, Suchmaschinen, Verweise und
     Kampagnen nur je Besuch. Mit WEB_NUR_BESUCHER stehen dort statt
     Besuchszahlen Anteile am gesamten Website-Traffic. */
  const traffic = cur.kpi.visits > 0 ? cur.kpi.visits : null;
  const menge = function(v, summe){
    if(!WEB_NUR_BESUCHER) return fmt(v);
    const basis = traffic || summe;
    return basis > 0 ? pct(v / basis * 100) : "—";
  };
  const mengeKopf = WEB_NUR_BESUCHER ? "Anteil" : "Besuche";

  /* --- Herkunft und Geräte --- */
  const chEntries = Object.entries(cur.channels || {});
  const channelsHTML = verteilung({
    klasse:"split first", titel: WEB_NUR_BESUCHER ? "Herkunft" : "Herkunft der Besuche",
    note: WEB_NUR_BESUCHER ? "Anteile nach Kanaltyp" : fmt(chEntries.reduce((a,e)=>a+e[1],0)) + " Besuche",
    eintraege: chEntries, farben: CH_COLORS, nurAnteil: WEB_NUR_BESUCHER,
    leerText:"Dieser Monatsbericht enthält keine Aufschlüsselung nach Kanälen."
  });

  const devEntries = Object.entries(cur.devices || {});
  const devTotal = devEntries.reduce((a,e)=>a+e[1],0);
  const dd = cur.deviceDetail || {};
  /* Der Vergleichssatz steht nur, wenn beide Gerätetypen im Bericht auftauchen. */
  const devHint = (dd.Desktop && dd.Smartphone)
    ? 'Desktop liefert ' + dec1(dd.Desktop.apv) + ' Aktionen pro Besuch gegenüber ' +
      dec1(dd.Smartphone.apv) + ' auf dem Smartphone — bei nur ' + anteil(dd.Desktop.visits, devTotal) +
      (WEB_NUR_BESUCHER ? ' % des Website-Traffics.' : ' % der Besuche.')
    : (WEB_NUR_BESUCHER ? 'Anteile der Gerätetypen am Website-Traffic des Monats.'
                        : 'Anteile der Gerätetypen an allen Besuchen des Monats.');
  const devicesHTML = verteilung({
    klasse:"split", titel:"Gerätetypen",
    note: WEB_NUR_BESUCHER ? "Anteile" : fmt(devTotal) + " Besuche",
    eintraege: devEntries, farben: DEV_COLORS, hinweis: devHint, nurAnteil: WEB_NUR_BESUCHER,
    leerText:"Dieser Monatsbericht enthält keine Aufschlüsselung nach Gerätetypen."
  });

  /* --- KI-Kachel --- */
  const ai = cur.ai || {total:0, sources:{}};
  const aiBefore = (cmp && cmp.ai) ? cmp.ai.total : null;
  const aiEntries = Object.entries(ai.sources || {}).sort((a,b)=>b[1]-a[1]);
  const aiSources = aiEntries.map(e=>'<div>' + esc(e[0]) + '<b>' + fmt(e[1]) + '</b></div>').join("");
  const aiShare = cur.kpi.visits > 0 ? (ai.total / cur.kpi.visits * 100).toFixed(2).replace(".",",") : "0,00";
  /* Stärkste Quelle wird gelesen statt fest genannt – das kann sich ändern. */
  const aiTop = (aiEntries[0] && aiEntries[0][1] > 0) ? aiEntries[0][0] : null;
  const aiHTML =
    '<div class="card ai">' +
      '<div class="card-head"><h2>Verweise aus KI-Assistenten</h2></div>' +
      '<div class="val" data-count="' + ai.total + '" data-kind="num">' + fmt(ai.total) + '</div>' +
      deltaHTML("ai", ai.total, aiBefore, cmpLabel) +
      '<div class="srcs">' + (aiSources || '<div>Keine Quellen im Bericht<b>—</b></div>') + '</div>' +
      '<p class="foot">' + aiShare + (WEB_NUR_BESUCHER ? ' % des gesamten Website-Traffics.' : ' % aller Besuche.') +
      (aiTop ? ' ' + esc(aiTop) + ' ist die stärkste dieser Quellen.' : '') + '</p>' +
    '</div>';

  /* --- Detailtabellen --- */
  const engines = cur.engines || [];
  const engMax = maxOf(engines.map(e=>e[1]));
  const engSumme = engines.reduce((a,e)=>a+e[1],0);
  const engRows = engines.map(e=>
    '<tr>' +
      '<td><div class="cell-name"><span class="favchip">' + esc(chipText(e[0])) + '</span>' +
      '<span class="tname" title="' + esc(e[0]) + '">' + esc(e[0]) + '</span></div></td>' +
      '<td><div class="cell-num"><span class="minibar"><span data-w="' + (e[1]/engMax*100) + '"></span></span>' +
      '<b>' + menge(e[1], engSumme) + '</b></div></td>' +
      '<td><span class="' + bounceClass(e[2]) + '">' + e[2] + ' %</span></td>' +
    '</tr>').join("");

  const engineDetailHTML = !engines.length
    ? leereKachel("detail-card", "Suchmaschinen im Detail",
        "Dieser Monatsbericht weist keine einzelnen Suchmaschinen aus.")
    : '<div class="card detail-card">' +
      '<div class="card-head"><h2>Suchmaschinen im Detail</h2>' +
      '<span class="card-note">' + engines.length + ' Quellen</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Suchmaschine</th><th>' + mengeKopf + '</th><th>Absprung</th></tr></thead>' +
      '<tbody>' + engRows + '</tbody></table></div>' +
      '<p class="tfoot-note">Grün = unterdurchschnittliche Absprungrate, Rot = über 60 %.' +
      (WEB_NUR_BESUCHER ? ' Anteil = am gesamten Website-Traffic des Monats.' : '') + '</p>' +
    '</div>';

  const referrers = cur.referrers || [];
  const refMax = maxOf(referrers.map(r=>r[1]));
  const refSumme = referrers.reduce((a,r)=>a+r[1],0);
  const refRows = referrers.map((r,i)=>
    '<tr>' +
      '<td><div class="cell-name"><span class="rankno">' + (i+1) + '</span>' +
      '<span class="favchip">' + esc(chipText(r[0])) + '</span>' +
      '<span class="tname" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span></div></td>' +
      '<td><div class="cell-num"><span class="minibar"><span data-w="' + (r[1]/refMax*100) + '"></span></span>' +
      '<b>' + menge(r[1], refSumme) + '</b></div></td>' +
    '</tr>').join("");

  const referrerDetailHTML = !referrers.length
    ? leereKachel("detail-card", "Verweisende Seiten im Detail",
        "Dieser Monatsbericht weist keine verweisenden Seiten aus.")
    : '<div class="card detail-card">' +
      '<div class="card-head"><h2>Verweisende Seiten im Detail</h2>' +
      '<span class="card-note">Top ' + referrers.length + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Quelle</th><th>' + mengeKopf + '</th></tr></thead>' +
      '<tbody>' + refRows + '</tbody></table></div>' +
      '<p class="tfoot-note">Balken zeigen den Abstand zur stärksten Quelle des Monats.' +
      (WEB_NUR_BESUCHER ? ' Anteil = am gesamten Website-Traffic.' : '') + '</p>' +
    '</div>';

  const camp = cur.campaigns || [];
  const campMax = maxOf(camp.map(c=>c[1]));
  const campSumme = camp.reduce((a,c)=>a+c[1],0);
  const campRows = camp.map(c=>
    '<tr>' +
      '<td><div class="cell-name"><span class="favchip">' + esc(chipText(c[0])) + '</span>' +
      '<span class="tname" title="' + esc(c[0]) + '">' + esc(c[0]) + '</span></div></td>' +
      '<td><div class="cell-num"><span class="minibar"><span data-w="' + (c[1]/campMax*100) + '"></span></span>' +
      '<b>' + menge(c[1], campSumme) + '</b></div></td>' +
      '<td>' + fmt(c[2]) + '</td>' +
      '<td><span class="pill blue">' + (c[1] > 0 ? dec1(c[2]/c[1]) : "—") + '</span></td>' +
    '</tr>').join("");

  const campaignHTML = !camp.length
    ? leereKachel("detail-card", "Kampagnen im Detail",
        "Für diesen Monat sind keine Kampagnen im Bericht enthalten.")
    : '<div class="card detail-card">' +
      '<div class="card-head"><h2>Kampagnen im Detail</h2><span class="card-note">Top ' + camp.length + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Kampagne</th><th>' + mengeKopf + '</th><th>Aktionen</th><th>Akt./Besuch</th></tr></thead>' +
      '<tbody>' + campRows + '</tbody></table></div>' +
      '<p class="tfoot-note">Aktionen pro Besuch zeigen, wie tief eine Kampagne ins Angebot führt.</p>' +
    '</div>';

  /* Reihenfolge bestimmt die Rasterplatzierung – bitte so lassen. */
  return '<div class="grid">' +
    kpiHTML + chartHTML +
    auffaelligkeiten("web", cur, cmp, cmpLabel) +
    pagesHTML +
    channelsHTML + devicesHTML + aiHTML +
    searchHTML + engineDetailHTML +
    referrerDetailHTML + campaignHTML +
  '</div>';
}

/* ---------- Auswertung eines Matomo-Monatsberichts ---------- */
const MONATE = {Januar:1,Februar:2,"März":3,April:4,Mai:5,Juni:6,Juli:7,
                August:8,September:9,Oktober:10,November:11,Dezember:12};
const MONATSNAMEN = ["Januar","Februar","März","April","Mai","Juni","Juli",
                     "August","September","Oktober","November","Dezember"];
const ABSCHNITTE = ["Besucherüberblick","Gerätetyp","Aktionen - Kernmetriken","Seitentitel",
  "Suchbegriffe (interne Suche)","Besuche nach Besuchsanzahl","Wiederkehrende Besuche",
  "Übersicht Verweise","Kanaltyp","Alle Kanäle","Suchmaschinen","Kampagnennamen",
  "Kampagnensuchbegriffe","Kampagnen Herkunftsseiten"];
const MUELL = /^(bus-und-bahn\.de \| Zeitspanne|Powered by TCPDF|Name\s*Name|Wert$|Durchschnittsze|it auf der|Webseite$|Durchschnittszeit$|pro Seite$|Besuch$|Seitenansichten$)/;
const RE_KANAL = /^(.+?)\s+([\d.]+)\s+([\d.]+)\s+(\d+)\s+(\d{2}:\d{2}:\d{2})\s+(\d+)\s*%/;
const RE_SEITE = /^(.+?)\s+([\d.]+)\s+([\d.]+)\s+(\d{2}:\d{2}:\d{2})\s+(\d+)\s*%\s+(\d+)\s*%\s*$/;
const RE_SUCHE = /^(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s*%\s*$/;
const RE_WERT  = /^(.+?)\s+([\d.]+|\d{2}:\d{2}:\d{2}|\d+\s*%)\s*$/;
const KI_QUELLEN = ["chatgpt.com","copilot.com","perplexity"];

const zahl = s => parseInt(String(s).replace(/\./g,""), 10);
const sek  = function(t){
  const roh = String(t == null ? "" : t).trim();
  if(roh.indexOf(":") === -1) return parseInt(roh.replace(/\./g,""), 10) || 0;
  const p = roh.split(":").map(Number);
  while(p.length < 3) p.unshift(0);
  return p[0]*3600 + p[1]*60 + p[2];
};

function kuerzeTitel(name){
  name = name.trim();
  const teil = name.split(/\s+–\s+/)[0].trim();
  if(teil.length >= 6) name = teil;
  return name.replace(/\s*&a$/,"").trim();
}

/* pdf.js liefert Textfragmente mit Koordinaten; hier zu Zeilen zusammensetzen */
function itemsZuZeilen(items){
  const zeilen = [];
  items.forEach(it=>{
    if(!it.str || !it.str.trim()) return;
    const y = Math.round(it.transform[5] * 2) / 2;
    let z = null;
    for(let i = 0; i < zeilen.length; i++){ if(Math.abs(zeilen[i].y - y) < 3){ z = zeilen[i]; break; } }
    if(!z){ z = {y:y, teile:[]}; zeilen.push(z); }
    z.teile.push({x:it.transform[4], txt:it.str});
  });
  zeilen.sort((a,b)=> b.y - a.y);
  return zeilen.map(z=>{
    z.teile.sort((a,b)=> a.x - b.x);
    let out = "", ende = null;
    z.teile.forEach(t=>{
      if(out && !/\s$/.test(out) && !/^\s/.test(t.txt) && ende !== null && t.x - ende > 1) out += " ";
      out += t.txt;
      ende = t.x + t.txt.length * 4;
    });
    return out.replace(/\s+/g," ").trim();
  });
}

function inAbschnitte(zeilen){
  const out = {};
  let aktuell = null;
  zeilen.forEach(z=>{
    if(!z || MUELL.test(z)) return;
    if(ABSCHNITTE.indexOf(z) > -1){ aktuell = z; if(!out[aktuell]) out[aktuell] = []; return; }
    if(aktuell) out[aktuell].push(z);
  });
  return out;
}
function wertePaare(zeilen){
  const out = {};
  (zeilen||[]).forEach(z=>{ const m = RE_WERT.exec(z); if(m) out[m[1].trim()] = m[2].trim(); });
  return out;
}
function kanalZeilen(zeilen){
  const out = [];
  (zeilen||[]).forEach(z=>{
    const m = RE_KANAL.exec(z);
    if(m) out.push({name:m[1].trim(), besuche:zahl(m[2]), aktionen:zahl(m[3]),
                    apb:parseInt(m[4],10), zeit:m[5], bounce:parseInt(m[6],10)});
  });
  return out;
}

/* Vergleichsform eines Monatsnamens: ohne Umlaute, ohne Gross-/
   Kleinschreibung. Im Textlayer eines PDFs steht „März" mal mit ä, mal
   als a + Trema in zwei Zeichen, mal als „Maerz" oder „Marz" — je nach
   Schriftart und Erzeuger. */
function monatsSchluessel(s){
  return String(s)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   /* ä → a */
    .toLowerCase()
    .replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u")
    .replace(/[^a-z]/g,"");
}
const MONAT_SUCHE = {};
Object.keys(MONATE).forEach(function(name){ MONAT_SUCHE[monatsSchluessel(name)] = MONATE[name]; });

function parseBericht(zeilen){
  const mz = /Zeitspanne:\s*([^\s\d]+)\s+(\d{4})/.exec(zeilen.join("\n"));
  const nr = mz ? MONAT_SUCHE[monatsSchluessel(mz[1])] : null;
  if(!nr) throw new Error("Zeitspanne nicht erkannt");
  const key = mz[2] + "-" + String(nr).padStart(2,"0");

  const ab   = inAbschnitte(zeilen);
  const ueb  = wertePaare(ab["Besucherüberblick"]);
  const kern = wertePaare(ab["Aktionen - Kernmetriken"]);
  if(!ueb["Besuche"] || !kern["Seitenansichten"]) throw new Error("Kennzahlen fehlen");

  const kpi = {
    visitors: zahl(ueb["Eindeutige Besucher"]),
    visits: zahl(ueb["Besuche"]),
    pageviews: zahl(kern["Seitenansichten"]),
    actions: zahl(ueb["Aktionen"]),
    avgTime: sek(ueb["Durchschn. Besuchszeit (in Sekunden)"]),
    bounce: parseInt(ueb["Absprungsrate"],10),
    actionsPerVisit: zahl(ueb["Aktionen pro Besuch"]),
    uniquePageviews: zahl(kern["Eindeutige Seitenansichten"]),
    downloads: zahl(kern["Downloads"]),
    outlinks: zahl(kern["Ausgehende Verweise"]),
    searches: zahl(kern["Suchanfragen"])
  };

  const devices = {}, deviceDetail = {};
  let sonstige = 0;
  kanalZeilen(ab["Gerätetyp"]).forEach(g=>{
    if(["Smartphone","Desktop","Tablet"].indexOf(g.name) > -1){
      devices[g.name] = g.besuche;
      deviceDetail[g.name] = {visits:g.besuche, actions:g.aktionen, apv:g.apb, time:g.zeit, bounce:g.bounce};
    }else sonstige += g.besuche;
  });
  devices.Sonstige = sonstige;

  const rohKanal = {};
  kanalZeilen(ab["Kanaltyp"]).forEach(k=>{ rohKanal[k.name] = k.besuche; });
  const channels = {};
  ["Suchmaschinen","Direkte Zugriffe","Webseiten","Kampagnen","Soziale Netzwerke"]
    .forEach(n=>{ if(rohKanal[n] !== undefined) channels[n] = rohKanal[n]; });

  const seiten = [];
  (ab["Seitentitel"]||[]).forEach(z=>{
    const m = RE_SEITE.exec(z);
    if(!m) return;
    const name = kuerzeTitel(m[1]);
    if(name === "Andere" || name === "Seitenname nicht definiert") return;
    seiten.push([name, zahl(m[3]), parseInt(m[5],10)]);
  });
  seiten.sort((a,b)=> b[1]-a[1]);

  const begriffe = [];
  (ab["Suchbegriffe (interne Suche)"]||[]).forEach(z=>{
    const m = RE_SUCHE.exec(z);
    if(!m) return;
    const name = m[1].trim();
    if(name === "Andere" || name === "Suchbegriff") return;
    begriffe.push([name, parseInt(m[2],10), parseInt(m[4],10)]);
  });
  begriffe.sort((a,b)=> b[1]-a[1]);

  const maschinen = [], gesehen = {};
  kanalZeilen(ab["Suchmaschinen"]).forEach(e=>{
    const name = e.name.split(" - ")[0].trim();
    if(gesehen[name] || name === "Andere") return;
    gesehen[name] = 1;
    maschinen.push([name, e.besuche, e.bounce]);
  });
  maschinen.sort((a,b)=> b[1]-a[1]);

  const kampRoh = kanalZeilen(ab["Kampagnennamen"]).filter(k=>k.name.trim() !== "Andere");
  const kampNamen = {};
  kampRoh.forEach(k=>{ kampNamen[k.name.split(" - ")[0].trim().toLowerCase()] = 1; });

  const verweise = [];
  kanalZeilen(ab["Alle Kanäle"]).forEach(e=>{
    const name = e.name.trim();
    if(kampNamen[name.toLowerCase()] || name === "Andere" || /^Suchbegriff nicht/.test(name)) return;
    verweise.push([name, e.besuche]);
  });
  verweise.sort((a,b)=> b[1]-a[1]);

  const quellen = {};
  kanalZeilen(ab["Kampagnen Herkunftsseiten"]).forEach(e=>{
    const n = e.name.trim().toLowerCase();
    if(KI_QUELLEN.indexOf(n) > -1) quellen[n] = e.besuche;
  });
  KI_QUELLEN.forEach(n=>{ if(quellen[n] === undefined) quellen[n] = 0; });
  const sortiert = {};
  let aiTotal = 0;
  Object.keys(quellen).sort((a,b)=> quellen[b]-quellen[a]).forEach(n=>{ sortiert[n] = quellen[n]; aiTotal += quellen[n]; });

  const fokus = {};
  FOCUS_PAGES.forEach(f=>{
    const treffer = seiten.find(p=>p[0].indexOf(f) === 0);
    if(treffer) fokus[f] = [treffer[1], treffer[2]];
  });

  return {key:key, fokus:fokus, monat:{
    label: monatsName(key),
    kpi:kpi, devices:devices, deviceDetail:deviceDetail, channels:channels,
    ai:{total:aiTotal, sources:sortiert},
    pages:seiten.slice(0,12), searchTerms:begriffe.slice(0,8),
    engines:maschinen.slice(0,6), referrers:verweise.slice(0,5), campaigns:kampRoh
      .map(k=>[k.name.trim(), k.besuche, k.aktionen]).sort((a,b)=> b[1]-a[1]).slice(0,10)
  }};
}

/* ---------- pdf.js bei Bedarf nachladen ---------- */
let pdfLibPromise = null;
function ladePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = new Promise(function(ok, fehler){
    const s = document.createElement("script");
    s.src = WEB_QUELLE.pdfjs;
    s.onload = function(){
      if(!window.pdfjsLib) return fehler(new Error("pdf.js nicht verfügbar"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = WEB_QUELLE.worker;
      ok(window.pdfjsLib);
    };
    s.onerror = function(){ fehler(new Error("pdf.js konnte nicht geladen werden")); };
    document.head.appendChild(s);
  });
  return pdfLibPromise;
}

/* ---------- Dateien im Ordner finden ----------
   Zuerst das Verzeichnislisting des Servers. Ist das abgeschaltet,
   werden Dateinamen durchprobiert. Groß-/Kleinschreibung ist auf dem
   Server relevant, deshalb decken die Muster beide Formen ab. Sobald
   ein Muster einmal getroffen hat, wird nur noch dieses verwendet.  */
const NAME_BASIS  = ["bus-und-bahn.de", "bus-und-bahn_de"];
const NAME_ENDUNG = ["monatsbericht", "Monatsbericht"];

function ohneUmlaute(s){
  return s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
          .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue");
}
function monatsFormen(monat){
  const formen = [monat.toLowerCase(), monat];
  const ohne = ohneUmlaute(monat);
  if(ohne !== monat) formen.push(ohne.toLowerCase(), ohne);
  return formen;
}
function namensVarianten(monat, jahr, mm){
  const out = [];
  monatsFormen(monat).forEach(function(mf){
    NAME_BASIS.forEach(function(basis){
      NAME_ENDUNG.forEach(function(endung){
        out.push({id: basis + "|" + endung + "|" + mf,
                  name: basis + "_-_" + mf + "_" + jahr + "_-_" + endung + ".pdf"});
      });
    });
  });
  out.push({id:"kurz|klein|" + monat.toLowerCase(), name: monat.toLowerCase() + "_" + jahr + ".pdf"});
  out.push({id:"iso|-|-", name: jahr + "-" + mm + ".pdf"});
  return out.map(function(v){
    return {id:v.id, url: WEB_QUELLE.ordner + encodeURIComponent(v.name), name:v.name};
  });
}
function varianteNachMuster(id, monat, jahr, mm){
  const teile = id.split("|");
  if(teile[0] === "iso") return WEB_QUELLE.ordner + encodeURIComponent(jahr + "-" + mm + ".pdf");
  const gross = teile[2][0] === teile[2][0].toUpperCase();
  let mf = gross ? monat : monat.toLowerCase();
  if(teile[2].indexOf("ae") > -1 || teile[2].indexOf("oe") > -1 || teile[2].indexOf("ue") > -1) mf = ohneUmlaute(mf);
  if(teile[0] === "kurz") return WEB_QUELLE.ordner + encodeURIComponent(mf + "_" + jahr + ".pdf");
  return WEB_QUELLE.ordner + encodeURIComponent(teile[0] + "_-_" + mf + "_" + jahr + "_-_" + teile[1] + ".pdf");
}

function letzteMonate(anzahl){
  const heute = new Date(), liste = [];
  for(let i = 0; i < anzahl; i++){
    const d = new Date(heute.getFullYear(), heute.getMonth() - i, 1);
    const mm = String(d.getMonth() + 1).padStart(2,"0");
    liste.push({key: d.getFullYear() + "-" + mm, monat: MONATSNAMEN[d.getMonth()],
                jahr: d.getFullYear(), mm: mm});
  }
  return liste;
}

/* Verzeichnislisting eines Ordners auslesen — für PDF und CSV gleich. */
function ordnerListing(ordner, endung){
  return fetch(ordner, {cache:"no-store"})
    .then(res => res.ok ? res.text() : "")
    .then(function(html){
      /* new URL(a, b) verlangt eine absolute Basis — der reine
         fileadmin-Pfad reicht dafür nicht, document.baseURI schon. */
      const basis = new URL(ordner, document.baseURI).href;
      const treffer = {};
      const re = new RegExp('href\\s*=\\s*["\']([^"\']+\\.' + endung + ')["\']', "gi");
      let m;
      while((m = re.exec(html))){
        try{ treffer[new URL(m[1], basis).href] = 1; }catch(e){}
      }
      return Object.keys(treffer);
    })
    .catch(() => []);
}

/* Lädt eine URL und gibt den PDF-Inhalt zurück – oder null, wenn es die Datei nicht gibt */
function holePdf(url){
  return fetch(url, {cache:"no-store"})
    .then(res=>{
      if(!res.ok) return null;
      const typ = res.headers.get("content-type") || "";
      if(typ.indexOf("html") > -1) return null;      /* Fehlerseite statt PDF */
      return res.arrayBuffer();
    })
    .then(puffer => (puffer && puffer.byteLength > 1000) ? puffer : null)
    .catch(()=> null);
}

/* Liest ein PDF und übergibt die Textzeilen an den Parser des Kanals.
   Matomo und AWStats bauen ihre Berichte völlig verschieden auf; der
   Weg vom PDF zu den Zeilen ist aber für beide derselbe. */
function pdfAuswerten(lib, puffer, parser){
  return lib.getDocument({data:new Uint8Array(puffer), verbosity:0}).promise.then(doc=>{
    let kette = Promise.resolve([]);
    for(let p = 1; p <= doc.numPages; p++){
      kette = kette.then(zeilen =>
        doc.getPage(p).then(seite => seite.getTextContent())
           .then(inhalt => zeilen.concat(itemsZuZeilen(inhalt.items))));
    }
    return kette.then(parser || parseBericht);
  });
}

/* Liest die Monatsberichte aus dem fileadmin und füllt DATA und
   FOCUS_DATA. Meldet den Fortschritt über melde() und liefert die
   Bilanz zurück; die Statuszeile baut die Shell daraus. */
function webHolen(melde){
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[]};

  function dateiname(url){
    try{ return decodeURIComponent(String(url).split("/").pop()); }catch(e){ return String(url); }
  }

  /* Das gemerkte Namensmuster stammt von einem Monat ohne Umlaut. Für
     „März" muss deshalb auch „maerz" probiert werden: TYPO3 wandelt
     Umlaute beim Hochladen um. Alle übrigen Monate bleiben bei einer
     einzigen Anfrage. */
  function nachMuster(id, m){
    const urls = [varianteNachMuster(id, m.monat, m.jahr, m.mm)];
    const ohne = ohneUmlaute(m.monat);
    if(ohne !== m.monat){
      const zweite = varianteNachMuster(id, ohne, m.jahr, m.mm);
      if(urls.indexOf(zweite) === -1) urls.push(zweite);
    }
    let kette = Promise.resolve(null);
    urls.forEach(function(url){
      kette = kette.then(function(t){
        if(t) return t;
        return holePdf(url).then(function(p){ return p ? {puffer:p, url:url} : null; });
      });
    });
    return kette;
  }

  function uebernehmen(lib, puffer, url){
    return pdfAuswerten(lib, puffer).then(function(r){
      DATA[r.key] = r.monat;
      FOCUS_DATA[r.key] = r.fokus;
      bilanz.gelesen++;
      melde(r.monat.label + " gelesen …");
    }).catch(function(){
      /* Nicht nur zählen, sondern den Dateinamen merken — sonst bleibt
         unklar, welcher Monat fehlt und warum. */
      bilanz.fehler++;
      if(bilanz.fehlerNamen.length < 4) bilanz.fehlerNamen.push(dateiname(url));
    });
  }

  melde("Ordner wird durchsucht …");
  return ladePdfJs().then(function(lib){
    return ordnerListing(WEB_QUELLE.ordner, "pdf").then(function(urls){

      /* Weg A: Der Server listet den Ordner auf – dann kennen wir die Namen genau. */
      if(urls.length){
        let kette = Promise.resolve();
        urls.slice(0, WEB_QUELLE.maxBerichte).forEach(function(url, i){
          kette = kette.then(function(){
            melde("Bericht " + (i+1) + " von " + urls.length + " wird gelesen …");
            return holePdf(url).then(p => p ? uebernehmen(lib, p, url) : null);
          });
        });
        return kette;
      }

      /* Weg B: Kein Listing – Namen durchprobieren, Muster merken. */
      const monate = letzteMonate(WEB_QUELLE.probeMonate);
      let muster = null;
      let kette = Promise.resolve();

      monate.forEach(function(m){
        kette = kette.then(function(){
          if(bilanz.gelesen >= WEB_QUELLE.maxBerichte) return;
          melde("Suche " + m.monat + " " + m.jahr + " …");

          if(muster){                                   /* Muster bekannt: ein Versuch genügt */
            return nachMuster(muster, m).then(t => t ? uebernehmen(lib, t.puffer, t.url) : null);
          }
          /* Muster unbekannt: alle Varianten gleichzeitig anfragen */
          const varianten = namensVarianten(m.monat, m.jahr, m.mm);
          return Promise.all(varianten.map(v => holePdf(v.url).then(p => ({v:v, p:p}))))
            .then(function(ergebnisse){
              const treffer = ergebnisse.find(e => e.p);
              if(!treffer) return null;
              muster = treffer.v.id;
              return uebernehmen(lib, treffer.p, treffer.v.url);
            });
        });
      });
      return kette;
    });
  }).then(function(){
    if(!bilanz.gelesen){
      throw new Error("Kein Bericht gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. bus-und-bahn.de_-_dezember_2025_-_monatsbericht.pdf");
    }
    return bilanz;
  });
}

/* Fokusseiten stehen mal im Bericht, mal nur in der Nachpflege. */
function fokusWert(key, name){
  const nachgepflegt = (FOCUS_DATA[key] || {})[name];
  if(nachgepflegt) return nachgepflegt[0];
  const treffer = (DATA[key].pages || []).find(p => String(p[0]).indexOf(name) === 0);
  return treffer ? treffer[1] : "";
}
function mmss(sekunden){
  const s = Math.max(0, Math.round(sekunden || 0));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function blattWeb(keys){
  const geraete = ["Smartphone","Desktop","Tablet","Sonstige"];
  const kanaele = ["Suchmaschinen","Direkte Zugriffe","Webseiten","Kampagnen","Soziale Netzwerke"];
  /* Mit WEB_NUR_BESUCHER fehlt die Spalte „Besuche“, und die Herkunft
     steht wie die Geräte als Anteil statt als Besuchszahl. */
  const kopf = ["Monat","Eindeutige Besucher"]
    .concat(WEB_NUR_BESUCHER ? [] : ["Besuche"])
    .concat(["Seitenansichten","Eindeutige Seitenansichten",
             "Aktionen","Aktionen pro Besuch","Ø Besuchszeit","Ø Besuchszeit (Sek.)","Absprungrate (%)",
             "Downloads","Ausgehende Verweise","Interne Suchanfragen"])
    .concat(geraete.map(g => g + " (%)"))
    .concat(kanaele.map(c => c + (WEB_NUR_BESUCHER ? " (%)" : " (Besuche)")))
    .concat(["Verweise aus KI-Assistenten"])
    .concat(FOCUS_PAGES);

  const zeilen = keys.map(function(k){
    const d = DATA[k], kpi = d.kpi;
    const devSumme = Object.values(d.devices || {}).reduce((a,b)=>a+b, 0);
    const kanSumme = Object.values(d.channels || {}).reduce((a,b)=>a+b, 0);
    const zeile = [d.label, kpi.visitors]
      .concat(WEB_NUR_BESUCHER ? [] : [kpi.visits])
      .concat([kpi.pageviews, kpi.uniquePageviews,
               kpi.actions, kpi.actionsPerVisit, mmss(kpi.avgTime), kpi.avgTime, kpi.bounce,
               kpi.downloads, kpi.outlinks, kpi.searches]);
    /* Geräte bewusst als Anteil: absolute Zahlen sind zwischen Monaten nicht vergleichbar. */
    geraete.forEach(function(g){
      const v = (d.devices || {})[g];
      zeile.push(devSumme > 0 && v !== undefined ? Math.round(v / devSumme * 1000) / 10 : "");
    });
    kanaele.forEach(function(c){
      const v = (d.channels || {})[c];
      if(WEB_NUR_BESUCHER) zeile.push(v === undefined || !kanSumme ? "" : Math.round(v / kanSumme * 1000) / 10);
      else                 zeile.push(v === undefined ? "" : v);
    });
    zeile.push(d.ai ? d.ai.total : "");
    FOCUS_PAGES.forEach(function(f){ zeile.push(fokusWert(k, f)); });
    return zeile;
  });
  return [kopf].concat(zeilen);
}

KANAELE.web = {
  titel: "bus-und-bahn.de",
  untertitel: "Websitekennzahlen aus Matomo",
  leitKpis: WEB_NUR_BESUCHER ? ["visitors","pageviews","bounce"] : ["visits","visitors","bounce"],
  monatFeld: "month",
  einheit: ["Bericht","Berichte"],

function normalizeNumber(value){
  if(typeof value === "number") return value;
  const s = String(value === undefined || value === null ? "" : value)
    .replace(/\u00a0/g,"").replace(/\s/g,"").replace(/\./g,"").replace(/,/g,".");
  const n = Number(s);
  return isFinite(n) ? n : 0;
}
/* Monatsspalte der Excel: Datum, "Jul 2026", "Juli 2026" oder "2026-07" */
function appMonthKey(value){
  if(value instanceof Date && !isNaN(value)) return value.getFullYear() + "-" + String(value.getMonth()+1).padStart(2,"0");
  const s = String(value || "").trim();
  const iso = /^(\d{4})-(\d{2})$/.exec(s);
  if(iso) return s;
  const m = /^([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})$/.exec(s);
  if(!m) return null;
  const kurz = monatsSchluessel(m[1]).slice(0,3);
  const tabelle = {jan:1,feb:2,mar:3,apr:4,may:5,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
  const nr = tabelle[kurz];
  return nr ? m[2] + "-" + String(nr).padStart(2,"0") : null;
}

/* SheetJS wird erst bei Bedarf geholt: sonst blockiert ein hängendes CDN
   den Aufbau der ganzen Seite. Nach der Frist gibt es eine klare Meldung. */
const EXPORT = {
  xlsx:  "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  frist: 9000
};
let xlsxPromise = null;
function ladeXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise(function(ok, fehler){
    let erledigt = false;
    const fertig = function(fn, arg){ if(!erledigt){ erledigt = true; fn(arg); } };
    const el = document.createElement("script");
    el.src = EXPORT.xlsx;
    el.onload = function(){ window.XLSX ? fertig(ok, window.XLSX) : fertig(fehler, new Error("Excel-Bibliothek unvollständig")); };
    el.onerror = function(){ fertig(fehler, new Error("Excel-Bibliothek nicht erreichbar")); };
    setTimeout(function(){ fertig(fehler, new Error("Zeitüberschreitung beim Laden der Excel-Bibliothek")); }, EXPORT.frist);
    document.head.appendChild(el);
  }).catch(function(err){ xlsxPromise = null; throw err; });
  return xlsxPromise;
}

/* Aufteilung auf die Betriebssysteme. iOS und Android sind aktive Nutzer
   je System und ergeben zusammen ungefähr die aktiven Nutzer insgesamt. */
function appPlattformen(cur, cmp, cmpLabel){
  const ios = cur.kpi.ios, android = cur.kpi.android;
  if(!hatWert(ios) || !hatWert(android) || (ios + android) <= 0){
    return leereKachel("split wide", "Plattformen",
      "Für diesen Monat stehen in den Spalten iOS und Android keine Werte.");
  }
  const summe = ios + android, iosAnteil = ios / summe * 100;

  /* Verschiebung zwischen den Systemen in Prozentpunkten — ein Prozentwert
     vom Prozentwert wäre hier irreführend. */
  let bewegung = "";
  const vorSumme = cmp ? (cmp.kpi.ios + cmp.kpi.android) : 0;
  if(cmp && hatWert(cmp.kpi.ios) && hatWert(cmp.kpi.android) && vorSumme > 0){
    const diff = Math.round((iosAnteil - cmp.kpi.ios / vorSumme * 100) * 10) / 10;
    bewegung = Math.abs(diff) < 0.05
      ? " · iOS-Anteil unverändert vs. " + cmpLabel
      : " · iOS-Anteil " + (diff > 0 ? "+" : "−") + dec1(Math.abs(diff)) +
        " Prozentpunkte vs. " + cmpLabel;
  }

  return verteilung({
    klasse:"split wide", titel:"Plattformen", note:"Aktive Nutzer je System",
    eintraege: [["iOS", ios], ["Android", android]],
    farben: ["#3b6ef6","#a9c2fc"], nachkomma: true,
    hinweis: "iOS und Android zusammen entsprechen ungefähr den aktiven Nutzern" + bewegung + "."
  });
}

/* Warum viele Neuinstallationen die aktiven Nutzer kaum erhöhen — mit den
   Zahlen der zwölf Monate bis zum gewählten Monat. Die Begründung folgt
   den Definitionen hinter dem (i) von „Aktive Nutzer" und
   „Neuinstallationen". */
function appEinordnung(){
  const monat = state.monthApp, titel = "Neuinstallationen einordnen";
  const keys = [];
  for(let n = 11; n >= 0; n--){ const k = monatMinus(monat, n); if(DATA_APP[k]) keys.push(k); }
  const reihe = function(feld){
    return keys.map(function(k){ return DATA_APP[k].kpi[feld]; }).filter(hatWert);
  };
  const summe = function(liste){ return liste.reduce(function(a,b){ return a + b; }, 0); };
  const inst = reihe("installs"), akt = reihe("activeUsers"), deinst = reihe("uninstalls");
  if(!inst.length || !akt.length){
    return leereKachel("split right", titel,
      "Für diesen Zeitraum fehlen Neuinstallationen oder aktive Nutzer in der Excel-Datei.");
  }
  const cur = DATA_APP[monat].kpi;

  /* Veränderung der aktiven Nutzer: zum Vorjahresmonat, sonst zum
     ersten Monat im Zeitfenster. */
  let aenderung = null, bezug = "";
  const vj = DATA_APP[prevKey(monat, "year")];
  if(vj && vj.kpi.activeUsers > 0 && hatWert(cur.activeUsers)){
    aenderung = (cur.activeUsers - vj.kpi.activeUsers) / vj.kpi.activeUsers * 100;
    bezug = "zum Vorjahresmonat";
  }else if(keys.length > 1 && DATA_APP[keys[0]].kpi.activeUsers > 0 && hatWert(cur.activeUsers)){
    aenderung = (cur.activeUsers - DATA_APP[keys[0]].kpi.activeUsers) / DATA_APP[keys[0]].kpi.activeUsers * 100;
    bezug = "seit " + kurzMonat(keys[0]);
  }
  const rund = aenderung === null ? null : Math.round(aenderung * 10) / 10;
  const klasse = rund === null || Math.abs(rund) < 0.05 ? "flat" : rund > 0 ? "up" : "down";

  const zahl = function(wert, text, extra){
    return '<div><b' + (extra ? ' class="' + extra + '"' : '') + '>' + wert + '</b><span>' + esc(text) + '</span></div>';
  };
  const jeHundert = (hatWert(cur.installs) && cur.activeUsers > 0)
    ? Math.round(cur.installs / cur.activeUsers * 100) : null;

  return '<div class="card split right einordnung">' +
    '<div class="card-head"><h2>' + titel + '</h2><span class="card-note">' +
      (keys.length > 1 ? kurzMonat(keys[0]) + " – " : "") + kurzMonat(keys[keys.length - 1]) + '</span></div>' +
    '<div class="eo-zahlen">' +
      zahl(fmt(summe(inst)), "Neuinstallationen (first_open)") +
      zahl(fmt(summe(akt) / akt.length), "Ø aktive Nutzer je Monat") +
      (rund === null ? zahl("—", "aktive Nutzer, kein Vergleichsmonat")
                     : zahl((rund > 0 ? "+" : rund < 0 ? "−" : "±") + nf.format(Math.abs(rund)) + " %",
                            "aktive Nutzer " + bezug, klasse)) +
    '</div>' +
    '<ul class="eo-liste">' +
      '<li><b>Kein Bestand.</b> Aktive Nutzer zählt, wer die App im Monat genutzt hat – nicht, wer sie installiert hat. ' +
        'Neue Nutzer tauchen in den Folgemonaten nur auf, wenn sie wiederkommen.</li>' +
      '<li><b>Nicht nur neue Menschen.</b> first_open fällt auch an, wenn bestehende Nutzer das Gerät wechseln ' +
        'oder die App neu installieren.</li>' +
      '<li><b>Deinstallationen nur für Android.</b> ' +
        (deinst.length ? fmt(summe(deinst)) + ' im selben Zeitraum; ' : '') +
        'für iPhones erfasst Firebase keine – der Abgang ist also größer, als die Zahl zeigt.</li>' +
    '</ul>' +
    '<p class="hint">' + (jeHundert !== null
      ? 'Im ' + esc(monatsName(monat)) + ' kamen auf 100 aktive Nutzer ' + jeHundert + ' Neuinstallationen. '
      : '') +
      'Ob neue Nutzer bleiben, zeigt der Bericht „Nutzerbindung“ in Firebase – diese Werte stehen nicht in der Excel.</p>' +
  '</div>';
}
