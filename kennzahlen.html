/* ============================================================
   15. EXPORT
   Ein Tabellenblatt je Kanal, Monate chronologisch untereinander,
   Kennzahlen in den Spalten daneben. Der Dialog fragt vorher ab,
   welche Kanäle und welcher Zeitraum gewünscht sind.
   ============================================================ */
/* Alle Kanäle sind angebunden — die Liste bleibt für künftige Kanäle bestehen. */
const EXPORT_GEPLANT = [];
function exportKanaele(){
  const angebunden = kanalIds().map(function(id){
    const k = KANAELE[id];
    return {id:id, name:k.exportName, sub:k.exportSub, angebunden:true, keys:k.ordnung().slice()};
  });
  return angebunden.concat(EXPORT_GEPLANT.map(function(p){
    return {id:p.id, name:p.name, sub:p.sub, angebunden:false, keys:[]};
  }));
}
function exportZeilen(id, keys){
  const k = KANAELE[id];
  if(!k || !k.exportBlatt) return null;
  return k.exportBlatt(keys);
}

function speichern(blob, dateiname){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function exportDatei(auswahl, zeitraum){
  return ladeXlsx().then(function(XLSX){
    const wb = XLSX.utils.book_new();
    exportKanaele().forEach(function(k){
      if(auswahl.indexOf(k.id) === -1 || !k.keys.length) return;
      const keys = k.keys.filter(function(x){ return zeitraum === "alle" || x.slice(0,4) === zeitraum; }).sort();
      const aoa = exportZeilen(k.id, keys);
      if(!aoa || aoa.length < 2) return;
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = aoa[0].map(function(titel, i){
        return {wch: i === 0 ? 18 : Math.min(30, Math.max(11, String(titel).length + 2))};
      });
      XLSX.utils.book_append_sheet(wb, ws, k.name.slice(0,31));
    });
    if(!wb.SheetNames.length) throw new Error("Für diese Auswahl liegen keine Monatswerte vor.");
    const puffer = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const stand = new Date();
    const datum = stand.getFullYear() + "-" +
                  String(stand.getMonth()+1).padStart(2,"0") + "-" +
                  String(stand.getDate()).padStart(2,"0");
    speichern(new Blob([puffer], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),
              "kennzahlen-bmk-" + datum + ".xlsx");
    return wb.SheetNames.length;
  });
}

/* ---------- Dialog ---------- */
const HAKEN = '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" ' +
  'stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="m5 12.5 4.6 4.6L19 7.4"/></svg></span>';

function openExportDialog(){
  if(document.getElementById("bmk-export")) return;

  const kanaele = exportKanaele();
  const mitDaten = kanaele.filter(function(k){ return k.keys.length > 0; });
  const jahre = {};
  mitDaten.forEach(function(k){ k.keys.forEach(function(x){ jahre[x.slice(0,4)] = 1; }); });
  const jahrListe = Object.keys(jahre).sort().reverse().slice(0,3);

  let zeitraum = "alle";
  const zurueck = document.activeElement;

  const optionen = kanaele.map(function(k){
    const hat = k.keys.length > 0;
    return '<label class="opt' + (hat ? " sel" : " off") + '">' +
      '<input type="checkbox" value="' + esc(k.id) + '"' + (hat ? " checked" : " disabled") + '>' +
      HAKEN +
      '<span class="txt"><b>' + esc(k.name) + '</b><span>' + esc(k.sub) + '</span></span>' +
      '<span class="tag' + (hat ? " on" : "") + '">' +
        (hat ? k.keys.length + (k.keys.length === 1 ? " Monat" : " Monate")
             : (k.angebunden ? "Noch nicht geladen" : "Geplant")) +
      '</span></label>';
  }).join("");

  const zeitHTML = '<div class="seg" id="bmk-ex-zeit">' +
    [{v:"alle", t:"Alle Monate"}].concat(jahrListe.map(function(j){ return {v:j, t:j}; }))
      .map(function(o){
        return '<button type="button" data-v="' + esc(o.v) + '" aria-pressed="' +
               (o.v === zeitraum) + '">' + esc(o.t) + '</button>';
      }).join("") + '</div>';

  const ov = document.createElement("div");
  ov.id = "bmk-export";
  ov.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bmk-ex-title">' +
      '<h2 id="bmk-ex-title">Kennzahlen exportieren</h2>' +
      '<p class="lead">Jeder ausgewählte Kanal wird zu einem eigenen Tabellenblatt. ' +
        'In der ersten Spalte stehen die Monate, daneben die Kennzahlen aus dem Dashboard.</p>' +
      '<div class="body">' +
        '<div class="seclabel">Kanäle' +
          '<button type="button" class="toggle" id="bmk-ex-all">Auswahl aufheben</button></div>' +
        optionen +
        (jahrListe.length > 1 ? '<div class="seclabel">Zeitraum</div>' + zeitHTML : '') +
        '<p class="note" id="bmk-ex-note"></p>' +
      '</div>' +
      '<div class="foot">' +
        '<button type="button" class="abtn grow" id="bmk-ex-cancel">Abbrechen</button>' +
        '<button type="button" class="abtn go" id="bmk-ex-go">' +
          '<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/>' +
            '<path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>' +
          '<svg class="sp" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="2" stroke-linecap="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/></svg>' +
          '<span>Excel-Datei erstellen</span>' +
        '</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(ov);
  const scrollVorher = document.body.style.overflow;
  document.body.style.overflow = "hidden";

  const note   = ov.querySelector("#bmk-ex-note");
  const goBtn  = ov.querySelector("#bmk-ex-go");
  const allBtn = ov.querySelector("#bmk-ex-all");

  function gewaehlt(){
    return Array.prototype.slice.call(ov.querySelectorAll("input:checked")).map(function(i){ return i.value; });
  }
  function monatsZahl(ids){
    return kanaele.reduce(function(summe, k){
      if(ids.indexOf(k.id) === -1) return summe;
      return summe + k.keys.filter(function(x){ return zeitraum === "alle" || x.slice(0,4) === zeitraum; }).length;
    }, 0);
  }
  function male(){
    Array.prototype.forEach.call(ov.querySelectorAll(".opt"), function(el){
      const inp = el.querySelector("input");
      el.classList.toggle("sel", inp.checked && !inp.disabled);
    });
    Array.prototype.forEach.call(ov.querySelectorAll("#bmk-ex-zeit button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.v === zeitraum));
    });
    const ids = gewaehlt(), zeilen = monatsZahl(ids);
    /* Nur Kanäle zählen, die im gewählten Zeitraum wirklich Monate haben. */
    const blaetter = kanaele.filter(function(k){
      return ids.indexOf(k.id) > -1 && k.keys.some(function(x){
        return zeitraum === "alle" || x.slice(0,4) === zeitraum;
      });
    }).length;
    const alleAn = ids.length === mitDaten.length;
    allBtn.textContent = alleAn ? "Auswahl aufheben" : "Alle auswählen";
    note.classList.remove("err");
    if(!ids.length){
      note.textContent = "Bitte mindestens einen Kanal auswählen.";
      note.classList.add("err");
    }else if(!zeilen){
      note.textContent = "Für diesen Zeitraum liegen in der Auswahl keine Monate vor.";
      note.classList.add("err");
    }else{
      note.textContent = blaetter + (blaetter === 1 ? " Tabellenblatt" : " Tabellenblätter") +
        " · " + zeilen + (zeilen === 1 ? " Monatszeile" : " Monatszeilen") +
        " · Datei: kennzahlen-bmk-<Datum>.xlsx";
    }
    goBtn.disabled = !ids.length || !zeilen;
  }

  function close(){
    document.removeEventListener("keydown", tasten, true);
    document.body.style.overflow = scrollVorher;
    ov.remove();
    if(zurueck && zurueck.focus) zurueck.focus();
  }
  function tasten(e){
    if(e.key === "Escape"){ e.stopPropagation(); close(); }
  }
  document.addEventListener("keydown", tasten, true);

  ov.addEventListener("change", male);
  ov.addEventListener("click", function(e){
    if(e.target === ov){ close(); return; }
    const seg = e.target.closest("#bmk-ex-zeit button");
    if(seg){ zeitraum = seg.dataset.v; male(); return; }
    if(e.target.closest("#bmk-ex-all")){
      const alleAn = gewaehlt().length === mitDaten.length;
      Array.prototype.forEach.call(ov.querySelectorAll("input:not([disabled])"), function(i){ i.checked = !alleAn; });
      male();
      return;
    }
    if(e.target.closest("#bmk-ex-cancel")){ close(); return; }
    if(e.target.closest("#bmk-ex-go")){
      goBtn.classList.add("busy");
      goBtn.disabled = true;
      note.classList.remove("err");
      note.textContent = "Datei wird erstellt …";
      exportDatei(gewaehlt(), zeitraum).then(function(){
        close();
      }).catch(function(err){
        goBtn.classList.remove("busy");
        goBtn.disabled = false;
        note.classList.add("err");
        note.textContent = "Export nicht möglich: " + err.message;
      });
    }
  });

  male();
  const erste = ov.querySelector("input:not([disabled])");
  if(erste) erste.focus(); else ov.querySelector("#bmk-ex-cancel").focus();
}

/* ============================================================
   16. START

   Reihenfolge beim Öffnen der Seite:
     1. Adresszeile aufräumen (siehe unten)
     2. Filterfelder erzeugen
     3. Zwischenspeicher lesen — was dort liegt, ist sofort sichtbar
     4. alles Übrige aus dem fileadmin nachladen
     5. nach dem Laden prüfen, ob mit Strg+F5 geöffnet wurde; dann
        werden auch die zwischengespeicherten Kanäle neu gelesen

   Das Dashboard schreibt nichts in die Adresszeile: dort steht immer
   nur /kennzahlen. Lesezeichen aus der Zeit mit ?view=…&monat=…
   werden beim Öffnen auf die schlichte Adresse zurückgesetzt; andere
   Parameter von TYPO3 bleiben unangetastet.
   ============================================================ */
(function(){
  try{
    if(!window.location.search || !window.history || !window.history.replaceState) return;
    const q = new URLSearchParams(window.location.search);
    let geaendert = false;
    ["view","monat","vergleich"].forEach(function(n){
      if(q.has(n)){ q.delete(n); geaendert = true; }
    });
    if(!geaendert) return;
    const rest = q.toString();
    window.history.replaceState(null, "",
      window.location.pathname + (rest ? "?" + rest : "") + window.location.hash);
  }catch(e){}
})();

    monthCombo.setOptions(verfuegbar.map(k => ({v:k, t:monatsLabel(k)})), aktMonat());
    render();
  }
});

/* ---------- Illustration freistellen ----------
   Läuft nur, wenn Bild und Seite auf derselben Domain liegen (in TYPO3
   der Fall). Dann werden nahezu weiße Pixel transparent gesetzt.
   Andernfalls greift der CSS-Fallback mix-blend-mode: multiply.      */
(function(){
  const img = document.getElementById("side-illustration");
  if(!img) return;
  let done = false;
  function key(){
    if(done) return;
    done = true;
    try{
      const w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h) return;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, w, h);   // wirft bei fremder Domain
      const p = data.data;
      for(let i = 0; i < p.length; i += 4){
        const min = Math.min(p[i], p[i+1], p[i+2]);
        if(min >= 246) p[i+3] = 0;
        else if(min > 230) p[i+3] = Math.round(p[i+3] * (246 - min) / 16);
      }
      ctx.putImageData(data, 0, 0);
      img.src = c.toDataURL("image/png");
      img.classList.add("is-keyed");
    }catch(err){ /* Fallback bleibt aktiv */ }
  }
  if(img.complete) key(); else img.addEventListener("load", key, {once:true});
})();

/* ---------- Angemeldeter Name ----------
   TYPO3 setzt den Namen später über ein data-Attribut am Container,
   z. B.  <div id="bmk-dash" data-user="Vorname Nachname">           */
(function(){
  const host = document.getElementById("bmk-dash");
  const name = host.dataset.user;
  if(!name) return;
  const initials = name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  ["side-name","top-name"].forEach(id=>{ document.getElementById(id).textContent = name; });
  ["side-initials","top-initials"].forEach(id=>{ document.getElementById(id).textContent = initials; });
})();

/* ============================================================
   17. ZUGANG

   Vor dem Dashboard steht eine Passwortabfrage. Im Code steht nicht
   das Passwort selbst, sondern nur seine SHA-256-Prüfsumme. Wer das
   Passwort ändern will, erzeugt die neue Prüfsumme zum Beispiel mit
       echo -n "neues-passwort" | sha256sum
   und trägt sie unten bei „pruefsumme" ein.

   Wichtig: Das ist ein Sichtschutz, keine Sicherheitsgrenze. Die
   Seite liegt vollständig im Browser; wer den Quelltext liest, kommt
   auch ohne Passwort an den Aufbau. Wirklich geschützt ist die Seite
   nur über die Zugriffsrechte in TYPO3.

   Nach dem Entsperren merkt sich der Browser das für die laufende
   Sitzung (sessionStorage). Wird der Tab oder Browser geschlossen,
   fragt das Dashboard beim nächsten Mal wieder.
   ============================================================ */
const ZUGANG = {
  pruefsumme: "75c50edc7082b9fc248cdf6a0f64847c86148654246c3aa617072684bb13825c",
  schluessel: "bmk-zugang",
  pruefzeit:  450,      /* kurze Denkpause, damit das Prüfen sichtbar wird */
  oeffnenNach: 750      /* so lange steht die Erfolgsanimation, bevor das Dashboard erscheint */
};

/* SHA-256 über die Web-Crypto-Schnittstelle des Browsers. Auf Seiten
   ohne HTTPS gibt es die nicht — dann rechnet die kleine Fassung
   darunter dasselbe Ergebnis aus. */
function sha256(text){
  try{
    if(window.crypto && window.crypto.subtle && window.TextEncoder && window.isSecureContext){
      return window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){
          return b.toString(16).padStart(2,"0");
        }).join("");
      }).catch(function(){ return sha256Js(text); });
    }
  }catch(e){}
  return Promise.resolve(sha256Js(text));
}
function sha256Js(text){
  const roh = unescape(encodeURIComponent(text));
  const K = [], H = [];
  const istPrim = function(z){ for(let t = 2; t * t <= z; t++){ if(z % t === 0) return false; } return true; };
  const bruch = function(x){ return ((x - Math.floor(x)) * 4294967296) | 0; };
  for(let z = 2, n = 0; n < 64; z++){
    if(!istPrim(z)) continue;
    if(n < 8) H[n] = bruch(Math.pow(z, 1/2));
    K[n] = bruch(Math.pow(z, 1/3));
    n++;
  }
  const bytes = [];
  for(let i = 0; i < roh.length; i++) bytes.push(roh.charCodeAt(i));
  const bits = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  const hoch = Math.floor(bits / 4294967296);
  for(let i = 3; i >= 0; i--) bytes.push((hoch >>> (i * 8)) & 255);
  for(let i = 3; i >= 0; i--) bytes.push((bits >>> (i * 8)) & 255);
  const rotr = function(v, n){ return (v >>> n) | (v << (32 - n)); };
  const W = new Array(64);
  for(let off = 0; off < bytes.length; off += 64){
    for(let i = 0; i < 16; i++){
      const j = off + i * 4;
      W[i] = (bytes[j] << 24) | (bytes[j+1] << 16) | (bytes[j+2] << 8) | bytes[j+3];
    }
    for(let i = 16; i < 64; i++){
      const s0 = rotr(W[i-15], 7) ^ rotr(W[i-15], 18) ^ (W[i-15] >>> 3);
      const s1 = rotr(W[i-2], 17) ^ rotr(W[i-2], 19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for(let i = 0; i < 64; i++){
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(function(v){ return (v >>> 0).toString(16).padStart(8,"0"); }).join("");
}

(function(){
  const dash   = document.getElementById("bmk-dash");
  const tor    = document.getElementById("bmk-tor");
  const karte  = document.getElementById("tor-karte");
  const form   = document.getElementById("tor-form");
  const feld   = document.getElementById("tor-pw");
  const auge   = document.getElementById("tor-auge");
  const meldung= document.getElementById("tor-meldung");
  const losTxt = document.getElementById("tor-los-text");
  const warte  = function(ms){ return new Promise(function(ok){ setTimeout(ok, REDUCED ? 0 : ms); }); };

  function freigeben(sofort){
    if(tor && tor.parentNode){
      if(sofort) tor.remove();
      else{
        tor.classList.add("weg");
        setTimeout(function(){ tor.remove(); }, REDUCED ? 0 : 560);
      }
    }
    if(!sofort){
      dash.classList.add("oeffnet");
      setTimeout(function(){ dash.classList.remove("oeffnet"); }, REDUCED ? 0 : 900);
    }
    dash.classList.remove("gesperrt");
    starten();
  }

  /* Schon in dieser Sitzung entsperrt? Dann direkt weiter. */
  let gemerkt = null;
  try{ gemerkt = window.sessionStorage.getItem(ZUGANG.schluessel); }catch(e){}
  if(gemerkt === ZUGANG.pruefsumme || !tor){ freigeben(true); return; }

  function fehler(text){
    karte.classList.remove("falsch");
    void karte.offsetWidth;                /* Animation neu starten */
    karte.classList.add("falsch");
    meldung.textContent = text;
    meldung.classList.add("an");
    feld.setAttribute("aria-invalid", "true");
    feld.focus();
    feld.select();
  }
  function zuruecksetzen(){
    if(!karte.classList.contains("falsch") && !meldung.classList.contains("an")) return;
    karte.classList.remove("falsch");
    meldung.classList.remove("an");
    feld.removeAttribute("aria-invalid");
  }

  feld.addEventListener("input", zuruecksetzen);
  auge.addEventListener("click", function(){
    const zeigen = feld.type === "password";
    feld.type = zeigen ? "text" : "password";
    auge.setAttribute("aria-pressed", String(zeigen));
    auge.setAttribute("aria-label", zeigen ? "Passwort verbergen" : "Passwort anzeigen");
    feld.focus();
  });

  let laeuft = false;
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(laeuft) return;
    const wert = feld.value;
    if(!wert){ fehler("Bitte das Passwort eingeben."); return; }
    laeuft = true;
    zuruecksetzen();
    karte.classList.add("prueft");
    Promise.all([sha256(wert), warte(ZUGANG.pruefzeit)]).then(function(erg){
      karte.classList.remove("prueft");
      if(erg[0] !== ZUGANG.pruefsumme){
        laeuft = false;
        fehler("Das Passwort stimmt nicht. Bitte noch einmal versuchen.");
        return;
      }
      try{ window.sessionStorage.setItem(ZUGANG.schluessel, ZUGANG.pruefsumme); }catch(err){}
      karte.classList.add("richtig");
      losTxt.textContent = "Entsperrt";
      feld.blur();
      warte(ZUGANG.oeffnenNach).then(function(){ freigeben(false); });
    });
  });

  setTimeout(function(){ feld.focus(); }, 60);
})();

})();
</script>
</body>
</html>
