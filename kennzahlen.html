/* Rollierender Trend der letzten zwölf Monate als Linie; Punkte zeigen
   den Wert beim Hovern. Monate ohne Wert werden übersprungen, sonst
   zöge die Linie auf null. Gilt für jeden Kanal gleichermaßen, weil
   alle über kpiRaster() zeichnen. */
const SPARK_MONATE = 12;
function spark(id, metric, kind){
  const k = kanal(id), d = k.daten(), ord = k.ordnung(), monat = state[k.monatFeld];
  const idx = ord.indexOf(monat);
  const keys = ord.slice(Math.max(0, idx - (SPARK_MONATE - 1)), idx + 1)
                  .filter(x => d[x] && d[x].kpi && hatWert(d[x].kpi[metric]));
  if(!keys.length) return "";

  const out  = FORMATTERS[kind || "num"] || fmt;
  const vals = keys.map(x => d[x].kpi[metric]);
  const max  = maxOf(vals);
  const n    = keys.length;

  const px = i => n === 1 ? 50 : (i / (n - 1)) * 100;
  const py = v => 26 - (v / max) * 22;          /* 0 → 26, Maximum → 4 */

  /* Bei nur einem Monat eine waagerechte Linie über die volle Breite */
  const path = (n === 1)
    ? [[0, py(vals[0])], [100, py(vals[0])]]
    : vals.map((v,i) => [px(i), py(v)]);

  const line = "M" + path.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L");
  const area = line + " L " + path[path.length-1][0].toFixed(2) + " 28 L " + path[0][0].toFixed(2) + " 28 Z";

  const dots = keys.map(function(x,i){
    const top = (py(vals[i]) / 28) * 100;
    return '<span class="sd' + (x === monat ? " cur" : "") + '" style="left:' + px(i).toFixed(2) + '%">' +
             '<i style="top:' + top.toFixed(2) + '%"></i>' +
             '<span class="tip">' + MONTH_SHORT[+x.slice(5,7) - 1] + ': ' + out(vals[i]) + '</span>' +
           '</span>';
  }).join("");

  const label = n > 1
    ? "Trend über " + n + " Monate: " + d[keys[0]].label + " bis " + d[keys[n-1]].label
    : d[keys[0]].label;

  return '<div class="spark">' +
      '<svg class="kpi-spark" viewBox="0 0 100 28" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
        '<path class="area" d="' + area + '"></path>' +
        '<path class="line" d="' + line + '" vector-effect="non-scaling-stroke"></path>' +
      '</svg>' +
      '<div class="dots">' + dots + '</div>' +
    '</div>';
}

/* Sechs KPI-Kacheln. Fehlt eine Kennzahl in der Quelle, steht ein
   Strich statt einer 0 — sonst läse sich eine Lücke wie ein
   gemessener Nullwert. */
function kpiRaster(id, cur, cmp, cmpLabel){
  const k = kanal(id);
  return '<div class="kpi-grid">' + k.kpis.map(function(def){
    const kind = def.kind || "num";
    const wert = cur.kpi ? cur.kpi[def.key] : null;
    const out  = FORMATTERS[kind];
    const kopf = '<div class="card kpi"><h2 class="label">' + esc(def.label) + '</h2>';
    if(!hatWert(wert)){
      return kopf + '<div class="val">—</div>' +
             '<span class="delta flat"><em>' + esc(k.fehltText) + '</em></span></div>';
    }
    return kopf +
      '<div class="val" data-count="' + wert + '" data-kind="' + kind + '">' + out(wert) + '</div>' +
      spark(id, def.key, kind) +
      deltaHTML(def.key, wert, cmp && cmp.kpi ? cmp.kpi[def.key] : null, cmpLabel) +
    '</div>';
  }).join("") + '</div>';
}

/* Jahresverlauf als Balken mit Umschalter. Welche Kennzahlen zur
   Auswahl stehen, sagt der Kanal über chart.metriken. */
function jahresChart(id){
  const k = kanal(id), d = k.daten(), monat = state[k.monatFeld];
  const aktiv = state[k.chart.feld];
  const art   = (k.chart.art && k.chart.art[aktiv]) || "num";
  const out   = FORMATTERS[art] || fmt;
  const jahr  = monat.slice(0,4);

  const werte = MONTH_SHORT.map(function(kurz, i){
    const key = jahr + "-" + String(i+1).padStart(2,"0");
    const v = d[key] && d[key].kpi ? d[key].kpi[aktiv] : null;
    return {kurz:kurz, key:key, val: hatWert(v) ? v : null};
  });
  const max = maxOf(werte.map(x => x.val || 0));

  const knoepfe = Object.keys(k.chart.metriken).map(function(m){
    return '<button data-m="' + m + '" aria-pressed="' + (aktiv === m) + '">' +
           esc(k.chart.metriken[m]) + '</button>';
  }).join("");

  const balken = werte.map(function(x){
    const hat = x.val !== null;
    return '<div class="bar' + (hat ? "" : " empty") + (x.key === monat ? " active" : "") + '">' +
      '<div class="track">' +
        (hat ? '<div class="tip">' + x.kurz + ': ' + out(x.val) + '</div>' : '') +
        '<div class="fill" data-h="' + (hat ? Math.max(4, x.val / max * 100) : 0) + '"></div>' +
      '</div><div class="mlabel">' + x.kurz + '</div></div>';
  }).join("");

  return '<div class="card chart ' + (k.chart.klasse || "") + '">' +
      '<div class="card-head"><h2>Jahresverlauf ' + jahr + '</h2>' +
        '<div class="segmented" id="chart-switch">' + knoepfe + '</div></div>' +
      '<div class="bars">' + balken + '</div>' +
      '<p class="hint">' + esc(k.chart.hinweis(k.chart.metriken[aktiv])) + '</p>' +
    '</div>';
}

/* Freie Balkenreihe — gleiche Optik wie der Jahresverlauf, aber mit
   beliebigen Punkten (Tage, Stunden, Wochentage).
   punkte: {label, wert, tipp} */
function balkenReihe(o){
  const punkte = (o.punkte || []).filter(function(p){ return p; });
  if(!punkte.length) return leereKachel("chart " + (o.klasse || ""), o.titel, o.leerText ||
    "Dieser Bericht enthält dazu keine Werte.");
  const max = maxOf(punkte.map(function(p){ return p.wert || 0; }));
  const out = FORMATTERS[o.kind || "num"] || fmt;
  const balken = punkte.map(function(p){
    const hat = hatWert(p.wert);
    return '<div class="bar' + (hat ? "" : " empty") + '">' +
      '<div class="track">' +
        (hat ? '<div class="tip">' + esc(p.tipp || p.label) + ': ' + out(p.wert) + '</div>' : '') +
        '<div class="fill" data-h="' + (hat ? Math.max(2, p.wert / max * 100) : 0) + '"></div>' +
      '</div><div class="mlabel">' + esc(p.label) + '</div></div>';
  }).join("");
  return '<div class="card chart ' + (o.klasse || "") + '">' +
    '<div class="card-head"><h2>' + esc(o.titel) + '</h2>' +
    '<span class="card-note">' + esc(o.note || "") + '</span></div>' +
    '<div class="bars' + (punkte.length > 12 ? " dense" : "") + '">' + balken + '</div>' +
    (o.hinweis ? '<p class="hint">' + esc(o.hinweis) + '</p>' : '') +
  '</div>';
}

/* Rangliste. zeilen: {name, tag, text, anteil, meta, klasse} */
function rangKachel(o){
  if(!o.zeilen || !o.zeilen.length){
    return leereKachel(o.klasse || "rank", o.titel,
      o.leerText || "Für diesen Monat sind dazu keine Werte enthalten.");
  }
  const items = o.zeilen.map(function(z){
    return '<li class="' + (z.klasse || "") + '">' +
      '<span class="name"><span class="txt" title="' + esc(z.hover || z.name) + '">' + esc(z.name) + '</span>' +
        (z.raw ? '<span class="event-raw" title="' + esc(z.raw) + '">' + esc(z.raw) + '</span>' : '') +
        (z.tag ? '<span class="tagf">' + esc(z.tag) + '</span>' : '') + '</span>' +
      '<span class="num">' + (z.text || "—") + '</span>' +
      '<span class="barline"><span data-w="' + (z.anteil || 0) + '"></span></span>' +
      '<span class="meta">' + (z.meta || "") + '</span>' +
    '</li>';
  }).join("");
  return '<div class="card ' + (o.klasse || "rank") + '">' +
    '<div class="card-head"><h2>' + esc(o.titel) + '</h2>' +
    '<span class="card-note">' + esc(o.note || "") + '</span></div>' +
    (o.legende ? '<div class="rank-legend">' + esc(o.legende) + '</div>' : '') +
    '<ol>' + items + '</ol></div>';
}

const CH_COLORS  = ["#3b6ef6","#7aa0fa","#a9c2fc","#cfdcfe","#e6ecfe"];
const DEV_COLORS = ["#3b6ef6","#8ab0fb","#bed0fd","#e2e9fe"];

/* Gestapelter Balken mit Legende. eintraege: [[name, wert], …] */
function verteilung(o){
  const eintraege = (o.eintraege || []).filter(e => hatWert(e[1]) && e[1] > 0);
  if(!eintraege.length) return leereKachel(o.klasse, o.titel, o.leerText);
  const summe  = eintraege.reduce((a,e) => a + e[1], 0);
  const farben = o.farben || CH_COLORS;
  const stack = eintraege.map((e,i) =>
    '<span style="flex-grow:' + e[1] + ';background:' + farben[i % farben.length] + '"></span>').join("");
  const legende = eintraege.map((e,i) =>
    '<div><span class="dot" style="background:' + farben[i % farben.length] + '"></span>' +
    '<span class="lname">' + esc(e[0]) + '</span>' +
    '<span class="lval">' + fmt(e[1]) + '</span>' +
    '<span class="lpct">' + (o.nachkomma ? dec1(e[1]/summe*100) : anteil(e[1], summe)) + ' %</span></div>').join("");
  return '<div class="card ' + o.klasse + '">' +
    '<div class="card-head"><h2>' + esc(o.titel) + '</h2>' +
    '<span class="card-note">' + esc(o.note || "") + '</span></div>' +
    '<div class="stack">' + stack + '</div>' +
    '<div class="legend">' + legende + '</div>' +
    (o.hinweis ? '<p class="hint">' + esc(o.hinweis) + '</p>' : '') +
  '</div>';
}

/* ============================================================
   6. KANAL bus-und-bahn.de
   Quelle: Matomo-Monatsberichte (PDF) im fileadmin.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/bus-und-bahn.de/
   Im Code stehen bewusst keine Monatswerte.
   ============================================================ */
let DATA = {};
let FOCUS_DATA = {};

const WEB_QUELLE = {
  ordner: "/fileadmin/user_upload/17_kennzahlen/bus-und-bahn.de/",
  pdfjs:  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  worker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  maxBerichte: 30,          /* Sicherheitsnetz gegen versehentlich volle Ordner */
  probeMonate: 24           /* so viele Monate rückwärts suchen, wenn kein Listing */
};

/* Fokusseiten: werden immer angezeigt, auch außerhalb der Top 8. */
const FOCUS_PAGES = ["Digitales Fahrplanbuch","Digitales Fundbüro"];

/* ---------- Seitentitel aufräumen ----------
   Startseite umbenennen, Verkehrsmeldungen inkl. iframe addieren,
   Präfix "DSW21:" entfernen.                                        */
const TITLE_MAP = {};
function cleanTitle(t){
  if(TITLE_MAP[t]) return TITLE_MAP[t];
  if(/^DSW21\s*[-–—]\s*Dein Weg/i.test(t)) return "Startseite";
  if(/^(DSW21\s*:\s*)?Verkehrsmeldungen(\s*\(iframe\))?$/i.test(t)) return "Verkehrsmeldungen";
  return t.replace(/^DSW21\s*:\s*/, "");
}
function preparePages(rows){
  const out = [], seen = {};
  rows.forEach(r=>{
    const name = cleanTitle(r[0]);
    if(seen[name] !== undefined){
      const e = out[seen[name]];
      const sum = e[1] + r[1];
      e[2] = Math.round((e[2]*e[1] + r[2]*r[1]) / sum);   /* gewichtete Absprungrate */
      e[1] = sum;
    }else{
      seen[name] = out.length;
      out.push([name, r[1], r[2]]);
    }
  });
  return out.sort((a,b)=>b[1]-a[1]);
}
function lastKnownFocus(name, monthKey){
  const ord = Object.keys(DATA).sort();
  const idx = ord.indexOf(monthKey);
  for(let i = idx - 1; i >= 0; i--){
    const f = FOCUS_DATA[ord[i]];
    if(f && f[name]) return {key:ord[i], val:f[name][0]};
  }
  return null;
}

function chipText(name){ return String(name).replace(/^www\./,"").slice(0,2); }
function bounceClass(v){
  if(v <= 45) return "pill good";
  if(v >= 60) return "pill warn";
  return "pill";
}

function renderWebsite(){
  const cur = DATA[state.month];
  const v = vergleich("web"), cmp = v.cmp, cmpLabel = v.label;

  /* --- KPI-Kacheln + Jahresverlauf --- */
  const kpiHTML   = kpiRaster("web", cur, cmp, cmpLabel);
  const chartHTML = jahresChart("web");

  /* --- Meistbesuchte Seiten (mit Fokusseiten) --- */
  const pages = preparePages(cur.pages || []);
  const top   = pages.slice(0,8);
  const pgMax = maxOf(top.map(r=>r[1]));
  const inTop = top.map(r=>r[0]);

  const pageRows = top.map(r=>({
    name:r[0], val:r[1], bounce:r[2], focus:FOCUS_PAGES.indexOf(r[0]) > -1, sep:false
  }));

  FOCUS_PAGES.forEach(function(name){
    if(inTop.indexOf(name) > -1) return;
    const hit = pages.find(r=>r[0] === name);
    const rep = (FOCUS_DATA[state.month] || {})[name];
    const row = {name:name, focus:true, sep:false, val:null, bounce:null, hint:""};
    if(hit){ row.val = hit[1]; row.bounce = hit[2]; }
    else if(rep){ row.val = rep[0]; row.bounce = rep[1]; }
    else {
      const last = lastKnownFocus(name, state.month);
      row.hint = last
        ? "im Bericht nicht ausgewiesen — zuletzt " + MONTH_SHORT[+last.key.slice(5,7)-1] + ": " + fmt(last.val)
        : "im Monatsbericht nicht ausgewiesen";
    }
    pageRows.push(row);
  });
  const firstExtra = pageRows.findIndex(r=>r.focus && inTop.indexOf(r.name) === -1);
  if(firstExtra > -1) pageRows[firstExtra].sep = true;

  const pagesHTML = rangKachel({
    klasse:"rank pages-rank", titel:"Meistbesuchte Seiten", note:"Eindeutige Seitenansichten",
    legende:"Balken = relativ zum Spitzenwert. Verkehrsmeldungen inkl. iframe. " +
            "Fokusseiten stehen unabhängig von ihrer Platzierung immer mit dabei.",
    leerText:"Dieser Monatsbericht enthält keine Seitentitel.",
    zeilen: pageRows.map(function(r){
      return {
        name:  r.name,
        tag:   r.focus ? "Fokus" : null,
        text:  r.val === null ? "—" : fmt(r.val),
        anteil:r.val === null ? 0 : (r.val / pgMax) * 100,
        meta:  r.val === null ? esc(r.hint) : r.bounce + " % Absprung",
        klasse:(r.sep ? "sep " : "") + (r.val === null ? "nodata" : "")
      };
    })
  });

  /* --- Interne Suchbegriffe --- */
  const suchen = cur.searchTerms || [];
  const suchMax = maxOf(suchen.map(r=>r[1]));
  const searchHTML = rangKachel({
    klasse:"rank", titel:"Interne Suchbegriffe", note:"Was Besucher nicht finden",
    legende:"Balken = relativ zum Spitzenwert, nicht Anteil aller Nutzer",
    leerText:"Für diesen Monat sind dazu keine Werte im Bericht enthalten.",
    zeilen: suchen.map(function(r){
      return {name:r[0], text: fmt(r[1]) + ' <i>Suchen</i>',
              anteil:(r[1]/suchMax)*100, meta: r[2] + " % Ausstieg"};
    })
  });

  /* --- Herkunft und Geräte --- */
  const chEntries = Object.entries(cur.channels || {});
  const channelsHTML = verteilung({
    klasse:"split first", titel:"Herkunft der Besuche",
    note: fmt(chEntries.reduce((a,e)=>a+e[1],0)) + " Besuche",
    eintraege: chEntries, farben: CH_COLORS,
    leerText:"Dieser Monatsbericht enthält keine Aufschlüsselung nach Kanälen."
  });

  const devEntries = Object.entries(cur.devices || {});
  const devTotal = devEntries.reduce((a,e)=>a+e[1],0);
  const dd = cur.deviceDetail || {};
  /* Der Vergleichssatz steht nur, wenn beide Gerätetypen im Bericht auftauchen. */
  const devHint = (dd.Desktop && dd.Smartphone)
    ? 'Desktop liefert ' + dec1(dd.Desktop.apv) + ' Aktionen pro Besuch gegenüber ' +
      dec1(dd.Smartphone.apv) + ' auf dem Smartphone — bei nur ' + anteil(dd.Desktop.visits, devTotal) + ' % der Besuche.'
    : 'Anteile der Gerätetypen an allen Besuchen des Monats.';
  const devicesHTML = verteilung({
    klasse:"split", titel:"Gerätetypen", note: fmt(devTotal) + " Besuche",
    eintraege: devEntries, farben: DEV_COLORS, hinweis: devHint,
    leerText:"Dieser Monatsbericht enthält keine Aufschlüsselung nach Gerätetypen."
  });

  /* --- KI-Kachel --- */
  const ai = cur.ai || {total:0, sources:{}};
  const aiBefore = (cmp && cmp.ai) ? cmp.ai.total : null;
  const aiEntries = Object.entries(ai.sources || {}).sort((a,b)=>b[1]-a[1]);
  const aiSources = aiEntries.map(e=>'<div>' + esc(e[0]) + '<b>' + fmt(e[1]) + '</b></div>').join("");
  const aiShare = cur.kpi.visits > 0 ? (ai.total / cur.kpi.visits * 100).toFixed(2).replace(".",",") : "0,00";
  /* Stärkste Quelle wird gelesen statt fest genannt – das kann sich ändern. */
  const aiTop = (aiEntries[0] && aiEntries[0][1] > 0) ? aiEntries[0][0] : null;
  const aiHTML =
    '<div class="card ai">' +
      '<div class="card-head"><h2>Verweise aus KI-Assistenten</h2></div>' +
      '<div class="val" data-count="' + ai.total + '" data-kind="num">' + fmt(ai.total) + '</div>' +
      deltaHTML("ai", ai.total, aiBefore, cmpLabel) +
      '<div class="srcs">' + (aiSources || '<div>Keine Quellen im Bericht<b>—</b></div>') + '</div>' +
      '<p class="foot">' + aiShare + ' % aller Besuche.' +
      (aiTop ? ' ' + esc(aiTop) + ' ist die stärkste dieser Quellen.' : '') + '</p>' +
    '</div>';

  /* --- Detailtabellen --- */
  const engines = cur.engines || [];
  const engMax = maxOf(engines.map(e=>e[1]));
  const engRows = engines.map(e=>
    '<tr>' +
      '<td><div class="cell-name"><span class="favchip">' + esc(chipText(e[0])) + '</span>' +
      '<span class="tname" title="' + esc(e[0]) + '">' + esc(e[0]) + '</span></div></td>' +
      '<td><div class="cell-num"><span class="minibar"><span data-w="' + (e[1]/engMax*100) + '"></span></span>' +
      '<b>' + fmt(e[1]) + '</b></div></td>' +
      '<td><span class="' + bounceClass(e[2]) + '">' + e[2] + ' %</span></td>' +
    '</tr>').join("");

  const engineDetailHTML = !engines.length
    ? leereKachel("detail-card", "Suchmaschinen im Detail",
        "Dieser Monatsbericht weist keine einzelnen Suchmaschinen aus.")
    : '<div class="card detail-card">' +
      '<div class="card-head"><h2>Suchmaschinen im Detail</h2>' +
      '<span class="card-note">' + engines.length + ' Quellen</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Suchmaschine</th><th>Besuche</th><th>Absprung</th></tr></thead>' +
      '<tbody>' + engRows + '</tbody></table></div>' +
      '<p class="tfoot-note">Grün = unterdurchschnittliche Absprungrate, Rot = über 60 %.</p>' +
    '</div>';

  const referrers = cur.referrers || [];
  const refMax = maxOf(referrers.map(r=>r[1]));
  const refRows = referrers.map((r,i)=>
    '<tr>' +
      '<td><div class="cell-name"><span class="rankno">' + (i+1) + '</span>' +
      '<span class="favchip">' + esc(chipText(r[0])) + '</span>' +
      '<span class="tname" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span></div></td>' +
      '<td><div class="cell-num"><span class="minibar"><span data-w="' + (r[1]/refMax*100) + '"></span></span>' +
      '<b>' + fmt(r[1]) + '</b></div></td>' +
    '</tr>').join("");

  const referrerDetailHTML = !referrers.length
    ? leereKachel("detail-card", "Verweisende Seiten im Detail",
        "Dieser Monatsbericht weist keine verweisenden Seiten aus.")
    : '<div class="card detail-card">' +
      '<div class="card-head"><h2>Verweisende Seiten im Detail</h2>' +
      '<span class="card-note">Top ' + referrers.length + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Quelle</th><th>Besuche</th></tr></thead>' +
      '<tbody>' + refRows + '</tbody></table></div>' +
      '<p class="tfoot-note">Balken zeigen den Abstand zur stärksten Quelle des Monats.</p>' +
    '</div>';

  const camp = cur.campaigns || [];
  const campMax = maxOf(camp.map(c=>c[1]));
  const campRows = camp.map(c=>
    '<tr>' +
      '<td><div class="cell-name"><span class="favchip">' + esc(chipText(c[0])) + '</span>' +
      '<span class="tname" title="' + esc(c[0]) + '">' + esc(c[0]) + '</span></div></td>' +
      '<td><div class="cell-num"><span class="minibar"><span data-w="' + (c[1]/campMax*100) + '"></span></span>' +
      '<b>' + fmt(c[1]) + '</b></div></td>' +
      '<td>' + fmt(c[2]) + '</td>' +
      '<td><span class="pill blue">' + (c[1] > 0 ? dec1(c[2]/c[1]) : "—") + '</span></td>' +
    '</tr>').join("");

  const campaignHTML = !camp.length
    ? leereKachel("detail-card", "Kampagnen im Detail",
        "Für diesen Monat sind keine Kampagnen im Bericht enthalten.")
    : '<div class="card detail-card">' +
      '<div class="card-head"><h2>Kampagnen im Detail</h2><span class="card-note">Top ' + camp.length + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Kampagne</th><th>Besuche</th><th>Aktionen</th><th>Akt./Besuch</th></tr></thead>' +
      '<tbody>' + campRows + '</tbody></table></div>' +
      '<p class="tfoot-note">Aktionen pro Besuch zeigen, wie tief eine Kampagne ins Angebot führt.</p>' +
    '</div>';

  /* Reihenfolge bestimmt die Rasterplatzierung – bitte so lassen. */
  return '<div class="grid">' +
    kpiHTML + chartHTML +
    auffaelligkeiten("web", cur, cmp, cmpLabel) +
    pagesHTML +
    channelsHTML + devicesHTML + aiHTML +
    searchHTML + engineDetailHTML +
    referrerDetailHTML + campaignHTML +
  '</div>';
}

/* ---------- Auswertung eines Matomo-Monatsberichts ---------- */
const MONATE = {Januar:1,Februar:2,"März":3,April:4,Mai:5,Juni:6,Juli:7,
                August:8,September:9,Oktober:10,November:11,Dezember:12};
const MONATSNAMEN = ["Januar","Februar","März","April","Mai","Juni","Juli",
                     "August","September","Oktober","November","Dezember"];
const ABSCHNITTE = ["Besucherüberblick","Gerätetyp","Aktionen - Kernmetriken","Seitentitel",
  "Suchbegriffe (interne Suche)","Besuche nach Besuchsanzahl","Wiederkehrende Besuche",
  "Übersicht Verweise","Kanaltyp","Alle Kanäle","Suchmaschinen","Kampagnennamen",
  "Kampagnensuchbegriffe","Kampagnen Herkunftsseiten"];
const MUELL = /^(bus-und-bahn\.de \| Zeitspanne|Powered by TCPDF|Name\s*Name|Wert$|Durchschnittsze|it auf der|Webseite$|Durchschnittszeit$|pro Seite$|Besuch$|Seitenansichten$)/;
const RE_KANAL = /^(.+?)\s+([\d.]+)\s+([\d.]+)\s+(\d+)\s+(\d{2}:\d{2}:\d{2})\s+(\d+)\s*%/;
const RE_SEITE = /^(.+?)\s+([\d.]+)\s+([\d.]+)\s+(\d{2}:\d{2}:\d{2})\s+(\d+)\s*%\s+(\d+)\s*%\s*$/;
const RE_SUCHE = /^(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s*%\s*$/;
const RE_WERT  = /^(.+?)\s+([\d.]+|\d{2}:\d{2}:\d{2}|\d+\s*%)\s*$/;
const KI_QUELLEN = ["chatgpt.com","copilot.com","perplexity"];

const zahl = s => parseInt(String(s).replace(/\./g,""), 10);
const sek  = function(t){
  const roh = String(t == null ? "" : t).trim();
  if(roh.indexOf(":") === -1) return parseInt(roh.replace(/\./g,""), 10) || 0;
  const p = roh.split(":").map(Number);
  while(p.length < 3) p.unshift(0);
  return p[0]*3600 + p[1]*60 + p[2];
};

function kuerzeTitel(name){
  name = name.trim();
  const teil = name.split(/\s+–\s+/)[0].trim();
  if(teil.length >= 6) name = teil;
  return name.replace(/\s*&a$/,"").trim();
}

/* pdf.js liefert Textfragmente mit Koordinaten; hier zu Zeilen zusammensetzen */
function itemsZuZeilen(items){
  const zeilen = [];
  items.forEach(it=>{
    if(!it.str || !it.str.trim()) return;
    const y = Math.round(it.transform[5] * 2) / 2;
    let z = null;
    for(let i = 0; i < zeilen.length; i++){ if(Math.abs(zeilen[i].y - y) < 3){ z = zeilen[i]; break; } }
    if(!z){ z = {y:y, teile:[]}; zeilen.push(z); }
    z.teile.push({x:it.transform[4], txt:it.str});
  });
  zeilen.sort((a,b)=> b.y - a.y);
  return zeilen.map(z=>{
    z.teile.sort((a,b)=> a.x - b.x);
    let out = "", ende = null;
    z.teile.forEach(t=>{
      if(out && !/\s$/.test(out) && !/^\s/.test(t.txt) && ende !== null && t.x - ende > 1) out += " ";
      out += t.txt;
      ende = t.x + t.txt.length * 4;
    });
    return out.replace(/\s+/g," ").trim();
  });
}

function inAbschnitte(zeilen){
  const out = {};
  let aktuell = null;
  zeilen.forEach(z=>{
    if(!z || MUELL.test(z)) return;
    if(ABSCHNITTE.indexOf(z) > -1){ aktuell = z; if(!out[aktuell]) out[aktuell] = []; return; }
    if(aktuell) out[aktuell].push(z);
  });
  return out;
}
function wertePaare(zeilen){
  const out = {};
  (zeilen||[]).forEach(z=>{ const m = RE_WERT.exec(z); if(m) out[m[1].trim()] = m[2].trim(); });
  return out;
}
function kanalZeilen(zeilen){
  const out = [];
  (zeilen||[]).forEach(z=>{
    const m = RE_KANAL.exec(z);
    if(m) out.push({name:m[1].trim(), besuche:zahl(m[2]), aktionen:zahl(m[3]),
                    apb:parseInt(m[4],10), zeit:m[5], bounce:parseInt(m[6],10)});
  });
  return out;
}

/* Vergleichsform eines Monatsnamens: ohne Umlaute, ohne Gross-/
   Kleinschreibung. Im Textlayer eines PDFs steht „März" mal mit ä, mal
   als a + Trema in zwei Zeichen, mal als „Maerz" oder „Marz" — je nach
   Schriftart und Erzeuger. */
function monatsSchluessel(s){
  return String(s)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   /* ä → a */
    .toLowerCase()
    .replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u")
    .replace(/[^a-z]/g,"");
}
const MONAT_SUCHE = {};
Object.keys(MONATE).forEach(function(name){ MONAT_SUCHE[monatsSchluessel(name)] = MONATE[name]; });

function parseBericht(zeilen){
  const mz = /Zeitspanne:\s*([^\s\d]+)\s+(\d{4})/.exec(zeilen.join("\n"));
  const nr = mz ? MONAT_SUCHE[monatsSchluessel(mz[1])] : null;
  if(!nr) throw new Error("Zeitspanne nicht erkannt");
  const key = mz[2] + "-" + String(nr).padStart(2,"0");

  const ab   = inAbschnitte(zeilen);
  const ueb  = wertePaare(ab["Besucherüberblick"]);
  const kern = wertePaare(ab["Aktionen - Kernmetriken"]);
  if(!ueb["Besuche"] || !kern["Seitenansichten"]) throw new Error("Kennzahlen fehlen");

  const kpi = {
    visitors: zahl(ueb["Eindeutige Besucher"]),
    visits: zahl(ueb["Besuche"]),
    pageviews: zahl(kern["Seitenansichten"]),
    actions: zahl(ueb["Aktionen"]),
    avgTime: sek(ueb["Durchschn. Besuchszeit (in Sekunden)"]),
    bounce: parseInt(ueb["Absprungsrate"],10),
    actionsPerVisit: zahl(ueb["Aktionen pro Besuch"]),
    uniquePageviews: zahl(kern["Eindeutige Seitenansichten"]),
    downloads: zahl(kern["Downloads"]),
    outlinks: zahl(kern["Ausgehende Verweise"]),
    searches: zahl(kern["Suchanfragen"])
  };

  const devices = {}, deviceDetail = {};
  let sonstige = 0;
  kanalZeilen(ab["Gerätetyp"]).forEach(g=>{
    if(["Smartphone","Desktop","Tablet"].indexOf(g.name) > -1){
      devices[g.name] = g.besuche;
      deviceDetail[g.name] = {visits:g.besuche, actions:g.aktionen, apv:g.apb, time:g.zeit, bounce:g.bounce};
    }else sonstige += g.besuche;
  });
  devices.Sonstige = sonstige;

  const rohKanal = {};
  kanalZeilen(ab["Kanaltyp"]).forEach(k=>{ rohKanal[k.name] = k.besuche; });
  const channels = {};
  ["Suchmaschinen","Direkte Zugriffe","Webseiten","Kampagnen","Soziale Netzwerke"]
    .forEach(n=>{ if(rohKanal[n] !== undefined) channels[n] = rohKanal[n]; });

  const seiten = [];
  (ab["Seitentitel"]||[]).forEach(z=>{
    const m = RE_SEITE.exec(z);
    if(!m) return;
    const name = kuerzeTitel(m[1]);
    if(name === "Andere" || name === "Seitenname nicht definiert") return;
    seiten.push([name, zahl(m[3]), parseInt(m[5],10)]);
  });
  seiten.sort((a,b)=> b[1]-a[1]);

  const begriffe = [];
  (ab["Suchbegriffe (interne Suche)"]||[]).forEach(z=>{
    const m = RE_SUCHE.exec(z);
    if(!m) return;
    const name = m[1].trim();
    if(name === "Andere" || name === "Suchbegriff") return;
    begriffe.push([name, parseInt(m[2],10), parseInt(m[4],10)]);
  });
  begriffe.sort((a,b)=> b[1]-a[1]);

  const maschinen = [], gesehen = {};
  kanalZeilen(ab["Suchmaschinen"]).forEach(e=>{
    const name = e.name.split(" - ")[0].trim();
    if(gesehen[name] || name === "Andere") return;
    gesehen[name] = 1;
    maschinen.push([name, e.besuche, e.bounce]);
  });
  maschinen.sort((a,b)=> b[1]-a[1]);

  const kampRoh = kanalZeilen(ab["Kampagnennamen"]).filter(k=>k.name.trim() !== "Andere");
  const kampNamen = {};
  kampRoh.forEach(k=>{ kampNamen[k.name.split(" - ")[0].trim().toLowerCase()] = 1; });

  const verweise = [];
  kanalZeilen(ab["Alle Kanäle"]).forEach(e=>{
    const name = e.name.trim();
    if(kampNamen[name.toLowerCase()] || name === "Andere" || /^Suchbegriff nicht/.test(name)) return;
    verweise.push([name, e.besuche]);
  });
  verweise.sort((a,b)=> b[1]-a[1]);

  const quellen = {};
  kanalZeilen(ab["Kampagnen Herkunftsseiten"]).forEach(e=>{
    const n = e.name.trim().toLowerCase();
    if(KI_QUELLEN.indexOf(n) > -1) quellen[n] = e.besuche;
  });
  KI_QUELLEN.forEach(n=>{ if(quellen[n] === undefined) quellen[n] = 0; });
  const sortiert = {};
  let aiTotal = 0;
  Object.keys(quellen).sort((a,b)=> quellen[b]-quellen[a]).forEach(n=>{ sortiert[n] = quellen[n]; aiTotal += quellen[n]; });

  const fokus = {};
  FOCUS_PAGES.forEach(f=>{
    const treffer = seiten.find(p=>p[0].indexOf(f) === 0);
    if(treffer) fokus[f] = [treffer[1], treffer[2]];
  });

  return {key:key, fokus:fokus, monat:{
    label: monatsName(key),
    kpi:kpi, devices:devices, deviceDetail:deviceDetail, channels:channels,
    ai:{total:aiTotal, sources:sortiert},
    pages:seiten.slice(0,12), searchTerms:begriffe.slice(0,8),
    engines:maschinen.slice(0,6), referrers:verweise.slice(0,5), campaigns:kampRoh
      .map(k=>[k.name.trim(), k.besuche, k.aktionen]).sort((a,b)=> b[1]-a[1]).slice(0,10)
  }};
}

/* ---------- pdf.js bei Bedarf nachladen ---------- */
let pdfLibPromise = null;
function ladePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfLibPromise) return pdfLibPromise;
  pdfLibPromise = new Promise(function(ok, fehler){
    const s = document.createElement("script");
    s.src = WEB_QUELLE.pdfjs;
    s.onload = function(){
      if(!window.pdfjsLib) return fehler(new Error("pdf.js nicht verfügbar"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = WEB_QUELLE.worker;
      ok(window.pdfjsLib);
    };
    s.onerror = function(){ fehler(new Error("pdf.js konnte nicht geladen werden")); };
    document.head.appendChild(s);
  });
  return pdfLibPromise;
}

/* ---------- Dateien im Ordner finden ----------
   Zuerst das Verzeichnislisting des Servers. Ist das abgeschaltet,
   werden Dateinamen durchprobiert. Groß-/Kleinschreibung ist auf dem
   Server relevant, deshalb decken die Muster beide Formen ab. Sobald
   ein Muster einmal getroffen hat, wird nur noch dieses verwendet.  */
const NAME_BASIS  = ["bus-und-bahn.de", "bus-und-bahn_de"];
const NAME_ENDUNG = ["monatsbericht", "Monatsbericht"];

function ohneUmlaute(s){
  return s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
          .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue");
}
function monatsFormen(monat){
  const formen = [monat.toLowerCase(), monat];
  const ohne = ohneUmlaute(monat);
  if(ohne !== monat) formen.push(ohne.toLowerCase(), ohne);
  return formen;
}
function namensVarianten(monat, jahr, mm){
  const out = [];
  monatsFormen(monat).forEach(function(mf){
    NAME_BASIS.forEach(function(basis){
      NAME_ENDUNG.forEach(function(endung){
        out.push({id: basis + "|" + endung + "|" + mf,
                  name: basis + "_-_" + mf + "_" + jahr + "_-_" + endung + ".pdf"});
      });
    });
  });
  out.push({id:"kurz|klein|" + monat.toLowerCase(), name: monat.toLowerCase() + "_" + jahr + ".pdf"});
  out.push({id:"iso|-|-", name: jahr + "-" + mm + ".pdf"});
  return out.map(function(v){
    return {id:v.id, url: WEB_QUELLE.ordner + encodeURIComponent(v.name), name:v.name};
  });
}
function varianteNachMuster(id, monat, jahr, mm){
  const teile = id.split("|");
  if(teile[0] === "iso") return WEB_QUELLE.ordner + encodeURIComponent(jahr + "-" + mm + ".pdf");
  const gross = teile[2][0] === teile[2][0].toUpperCase();
  let mf = gross ? monat : monat.toLowerCase();
  if(teile[2].indexOf("ae") > -1 || teile[2].indexOf("oe") > -1 || teile[2].indexOf("ue") > -1) mf = ohneUmlaute(mf);
  if(teile[0] === "kurz") return WEB_QUELLE.ordner + encodeURIComponent(mf + "_" + jahr + ".pdf");
  return WEB_QUELLE.ordner + encodeURIComponent(teile[0] + "_-_" + mf + "_" + jahr + "_-_" + teile[1] + ".pdf");
}

function letzteMonate(anzahl){
  const heute = new Date(), liste = [];
  for(let i = 0; i < anzahl; i++){
    const d = new Date(heute.getFullYear(), heute.getMonth() - i, 1);
    const mm = String(d.getMonth() + 1).padStart(2,"0");
    liste.push({key: d.getFullYear() + "-" + mm, monat: MONATSNAMEN[d.getMonth()],
                jahr: d.getFullYear(), mm: mm});
  }
  return liste;
}

/* Verzeichnislisting eines Ordners auslesen — für PDF und CSV gleich. */
function ordnerListing(ordner, endung){
  return fetch(ordner, {cache:"no-store"})
    .then(res => res.ok ? res.text() : "")
    .then(function(html){
      /* new URL(a, b) verlangt eine absolute Basis — der reine
         fileadmin-Pfad reicht dafür nicht, document.baseURI schon. */
      const basis = new URL(ordner, document.baseURI).href;
      const treffer = {};
      const re = new RegExp('href\\s*=\\s*["\']([^"\']+\\.' + endung + ')["\']', "gi");
      let m;
      while((m = re.exec(html))){
        try{ treffer[new URL(m[1], basis).href] = 1; }catch(e){}
      }
      return Object.keys(treffer);
    })
    .catch(() => []);
}

/* Lädt eine URL und gibt den PDF-Inhalt zurück – oder null, wenn es die Datei nicht gibt */
function holePdf(url){
  return fetch(url, {cache:"no-store"})
    .then(res=>{
      if(!res.ok) return null;
      const typ = res.headers.get("content-type") || "";
      if(typ.indexOf("html") > -1) return null;      /* Fehlerseite statt PDF */
      return res.arrayBuffer();
    })
    .then(puffer => (puffer && puffer.byteLength > 1000) ? puffer : null)
    .catch(()=> null);
}

/* Liest ein PDF und übergibt die Textzeilen an den Parser des Kanals.
   Matomo und AWStats bauen ihre Berichte völlig verschieden auf; der
   Weg vom PDF zu den Zeilen ist aber für beide derselbe. */
function pdfAuswerten(lib, puffer, parser){
  return lib.getDocument({data:new Uint8Array(puffer), verbosity:0}).promise.then(doc=>{
    let kette = Promise.resolve([]);
    for(let p = 1; p <= doc.numPages; p++){
      kette = kette.then(zeilen =>
        doc.getPage(p).then(seite => seite.getTextContent())
           .then(inhalt => zeilen.concat(itemsZuZeilen(inhalt.items))));
    }
    return kette.then(parser || parseBericht);
  });
}

/* Liest die Monatsberichte aus dem fileadmin und füllt DATA und
   FOCUS_DATA. Meldet den Fortschritt über melde() und liefert die
   Bilanz zurück; die Statuszeile baut die Shell daraus. */
function webHolen(melde){
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[]};

  function dateiname(url){
    try{ return decodeURIComponent(String(url).split("/").pop()); }catch(e){ return String(url); }
  }

  /* Das gemerkte Namensmuster stammt von einem Monat ohne Umlaut. Für
     „März" muss deshalb auch „maerz" probiert werden: TYPO3 wandelt
     Umlaute beim Hochladen um. Alle übrigen Monate bleiben bei einer
     einzigen Anfrage. */
  function nachMuster(id, m){
    const urls = [varianteNachMuster(id, m.monat, m.jahr, m.mm)];
    const ohne = ohneUmlaute(m.monat);
    if(ohne !== m.monat){
      const zweite = varianteNachMuster(id, ohne, m.jahr, m.mm);
      if(urls.indexOf(zweite) === -1) urls.push(zweite);
    }
    let kette = Promise.resolve(null);
    urls.forEach(function(url){
      kette = kette.then(function(t){
        if(t) return t;
        return holePdf(url).then(function(p){ return p ? {puffer:p, url:url} : null; });
      });
    });
    return kette;
  }

  function uebernehmen(lib, puffer, url){
    return pdfAuswerten(lib, puffer).then(function(r){
      DATA[r.key] = r.monat;
      FOCUS_DATA[r.key] = r.fokus;
      bilanz.gelesen++;
      melde(r.monat.label + " gelesen …");
    }).catch(function(){
      /* Nicht nur zählen, sondern den Dateinamen merken — sonst bleibt
         unklar, welcher Monat fehlt und warum. */
      bilanz.fehler++;
      if(bilanz.fehlerNamen.length < 4) bilanz.fehlerNamen.push(dateiname(url));
    });
  }

  melde("Ordner wird durchsucht …");
  return ladePdfJs().then(function(lib){
    return ordnerListing(WEB_QUELLE.ordner, "pdf").then(function(urls){

      /* Weg A: Der Server listet den Ordner auf – dann kennen wir die Namen genau. */
      if(urls.length){
        let kette = Promise.resolve();
        urls.slice(0, WEB_QUELLE.maxBerichte).forEach(function(url, i){
          kette = kette.then(function(){
            melde("Bericht " + (i+1) + " von " + urls.length + " wird gelesen …");
            return holePdf(url).then(p => p ? uebernehmen(lib, p, url) : null);
          });
        });
        return kette;
      }

      /* Weg B: Kein Listing – Namen durchprobieren, Muster merken. */
      const monate = letzteMonate(WEB_QUELLE.probeMonate);
      let muster = null;
      let kette = Promise.resolve();

      monate.forEach(function(m){
        kette = kette.then(function(){
          if(bilanz.gelesen >= WEB_QUELLE.maxBerichte) return;
          melde("Suche " + m.monat + " " + m.jahr + " …");

          if(muster){                                   /* Muster bekannt: ein Versuch genügt */
            return nachMuster(muster, m).then(t => t ? uebernehmen(lib, t.puffer, t.url) : null);
          }
          /* Muster unbekannt: alle Varianten gleichzeitig anfragen */
          const varianten = namensVarianten(m.monat, m.jahr, m.mm);
          return Promise.all(varianten.map(v => holePdf(v.url).then(p => ({v:v, p:p}))))
            .then(function(ergebnisse){
              const treffer = ergebnisse.find(e => e.p);
              if(!treffer) return null;
              muster = treffer.v.id;
              return uebernehmen(lib, treffer.p, treffer.v.url);
            });
        });
      });
      return kette;
    });
  }).then(function(){
    if(!bilanz.gelesen){
      throw new Error("Kein Bericht gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. bus-und-bahn.de_-_dezember_2025_-_monatsbericht.pdf");
    }
    return bilanz;
  });
}

/* Fokusseiten stehen mal im Bericht, mal nur in der Nachpflege. */
function fokusWert(key, name){
  const nachgepflegt = (FOCUS_DATA[key] || {})[name];
  if(nachgepflegt) return nachgepflegt[0];
  const treffer = (DATA[key].pages || []).find(p => String(p[0]).indexOf(name) === 0);
  return treffer ? treffer[1] : "";
}
function mmss(sekunden){
  const s = Math.max(0, Math.round(sekunden || 0));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function blattWeb(keys){
  const geraete = ["Smartphone","Desktop","Tablet","Sonstige"];
  const kanaele = ["Suchmaschinen","Direkte Zugriffe","Webseiten","Kampagnen","Soziale Netzwerke"];
  const kopf = ["Monat","Eindeutige Besucher","Besuche","Seitenansichten","Eindeutige Seitenansichten",
                "Aktionen","Aktionen pro Besuch","Ø Besuchszeit","Ø Besuchszeit (Sek.)","Absprungrate (%)",
                "Downloads","Ausgehende Verweise","Interne Suchanfragen"]
    .concat(geraete.map(g => g + " (%)"))
    .concat(kanaele.map(c => c + " (Besuche)"))
    .concat(["Verweise aus KI-Assistenten"])
    .concat(FOCUS_PAGES);

  const zeilen = keys.map(function(k){
    const d = DATA[k], kpi = d.kpi;
    const devSumme = Object.values(d.devices || {}).reduce((a,b)=>a+b, 0);
    const zeile = [d.label, kpi.visitors, kpi.visits, kpi.pageviews, kpi.uniquePageviews,
                   kpi.actions, kpi.actionsPerVisit, mmss(kpi.avgTime), kpi.avgTime, kpi.bounce,
                   kpi.downloads, kpi.outlinks, kpi.searches];
    /* Geräte bewusst als Anteil: absolute Zahlen sind zwischen Monaten nicht vergleichbar. */
    geraete.forEach(function(g){
      const v = (d.devices || {})[g];
      zeile.push(devSumme > 0 && v !== undefined ? Math.round(v / devSumme * 1000) / 10 : "");
    });
    kanaele.forEach(function(c){
      const v = (d.channels || {})[c];
      zeile.push(v === undefined ? "" : v);
    });
    zeile.push(d.ai ? d.ai.total : "");
    FOCUS_PAGES.forEach(function(f){ zeile.push(fokusWert(k, f)); });
    return zeile;
  });
  return [kopf].concat(zeilen);
}

function normalizeNumber(value){
  if(typeof value === "number") return value;
  const s = String(value === undefined || value === null ? "" : value)
    .replace(/\u00a0/g,"").replace(/\s/g,"").replace(/\./g,"").replace(/,/g,".");
  const n = Number(s);
  return isFinite(n) ? n : 0;
}
/* Monatsspalte der Excel: Datum, "Jul 2026", "Juli 2026" oder "2026-07" */
function appMonthKey(value){
  if(value instanceof Date && !isNaN(value)) return value.getFullYear() + "-" + String(value.getMonth()+1).padStart(2,"0");
  const s = String(value || "").trim();
  const iso = /^(\d{4})-(\d{2})$/.exec(s);
  if(iso) return s;
  const m = /^([A-Za-zÄÖÜäöü]+)\.?\s+(\d{4})$/.exec(s);
  if(!m) return null;
  const kurz = monatsSchluessel(m[1]).slice(0,3);
  const tabelle = {jan:1,feb:2,mar:3,apr:4,may:5,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
  const nr = tabelle[kurz];
  return nr ? m[2] + "-" + String(nr).padStart(2,"0") : null;
}

/* SheetJS wird erst bei Bedarf geholt: sonst blockiert ein hängendes CDN
   den Aufbau der ganzen Seite. Nach der Frist gibt es eine klare Meldung. */
const EXPORT = {
  xlsx:  "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  frist: 9000
};
let xlsxPromise = null;
function ladeXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise(function(ok, fehler){
    let erledigt = false;
    const fertig = function(fn, arg){ if(!erledigt){ erledigt = true; fn(arg); } };
    const el = document.createElement("script");
    el.src = EXPORT.xlsx;
    el.onload = function(){ window.XLSX ? fertig(ok, window.XLSX) : fertig(fehler, new Error("Excel-Bibliothek unvollständig")); };
    el.onerror = function(){ fertig(fehler, new Error("Excel-Bibliothek nicht erreichbar")); };
    setTimeout(function(){ fertig(fehler, new Error("Zeitüberschreitung beim Laden der Excel-Bibliothek")); }, EXPORT.frist);
    document.head.appendChild(el);
  }).catch(function(err){ xlsxPromise = null; throw err; });
  return xlsxPromise;
}

/* Aufteilung auf die Betriebssysteme. iOS und Android sind aktive Nutzer
   je System und ergeben zusammen ungefähr die aktiven Nutzer insgesamt. */
function appPlattformen(cur, cmp, cmpLabel){
  const ios = cur.kpi.ios, android = cur.kpi.android;
  if(!hatWert(ios) || !hatWert(android) || (ios + android) <= 0){
    return leereKachel("split wide", "Plattformen",
      "Für diesen Monat stehen in den Spalten iOS und Android keine Werte.");
  }
  const summe = ios + android, iosAnteil = ios / summe * 100;

  /* Verschiebung zwischen den Systemen in Prozentpunkten — ein Prozentwert
     vom Prozentwert wäre hier irreführend. */
  let bewegung = "";
  const vorSumme = cmp ? (cmp.kpi.ios + cmp.kpi.android) : 0;
  if(cmp && hatWert(cmp.kpi.ios) && hatWert(cmp.kpi.android) && vorSumme > 0){
    const diff = Math.round((iosAnteil - cmp.kpi.ios / vorSumme * 100) * 10) / 10;
    bewegung = Math.abs(diff) < 0.05
      ? " · iOS-Anteil unverändert vs. " + cmpLabel
      : " · iOS-Anteil " + (diff > 0 ? "+" : "−") + dec1(Math.abs(diff)) +
        " Prozentpunkte vs. " + cmpLabel;
  }

  return verteilung({
    klasse:"split wide", titel:"Plattformen", note:"Aktive Nutzer je System",
    eintraege: [["iOS", ios], ["Android", android]],
    farben: ["#3b6ef6","#a9c2fc"], nachkomma: true,
    hinweis: "iOS und Android zusammen entsprechen ungefähr den aktiven Nutzern" + bewegung + "."
  });
}

function appHolen(melde){
  melde("Excel-Datei wird gelesen …");
  return ladeXlsx().then(function(XLSX){
    return fetch(APP_SOURCE, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("Excel-Datei nicht gefunden · " + APP_SOURCE);
      return r.arrayBuffer();
    }).then(function(buf){
      const wb = XLSX.read(buf, {type:"array", cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:"", raw:true});
      const next = {};
      let uebersprungen = 0;
      rows.forEach(function(row){
        const key = appMonthKey(row["Monat"]);
        if(!key){ if(String(row["Monat"] || "").trim()) uebersprungen++; return; }
        const eventMap = {};
        APP_EVENTS.forEach(function(name){
          if(row[name] !== undefined && row[name] !== "") eventMap[name] = normalizeNumber(row[name]);
        });
        const events = Object.entries(eventMap).sort((a,b)=>b[1]-a[1]);
        /* Genau die Spalten aus APP_FELDER, nichts anderes. Fehlt eine
           Spalte in der Tabelle, bleibt der Wert leer statt 0 — sonst
           sähe eine fehlende Spalte wie ein echter Nullwert aus. */
        const kpi = {};
        Object.keys(APP_FELDER).forEach(function(feld){
          const zelle = row[APP_FELDER[feld]];
          kpi[feld] = (zelle === undefined || zelle === "") ? null : normalizeNumber(zelle);
        });
        next[key] = {label: monatsName(key), kpi:kpi, events:events, eventMap:eventMap};
      });
      if(!Object.keys(next).length) throw new Error("Keine gültigen Monatszeilen in der Excel-Datei");
      DATA_APP = next;
      return {gelesen: Object.keys(next).length, fehler: uebersprungen, fehlerNamen: []};
    });
  });
}

function blattApp(keys){
  const summen = {};
  keys.forEach(function(k){
    const m = DATA_APP[k].eventMap || {};
    Object.keys(m).forEach(function(n){ summen[n] = (summen[n] || 0) + m[n]; });
  });
  const namen = Object.keys(summen).sort(function(a,b){ return summen[b] - summen[a]; });
  /* Spaltenreihenfolge wie in APP_FELDER, damit Tabelle und Export
     dieselbe Sprache sprechen. */
  const kopf = ["Monat","Aktive Nutzer","Neuinstallationen","Deinstallationen","Abstürze",
                "Sessions","Bildschirmaufrufe (screen_view)","Interaktionen (user_engagement)",
                "Sitzungsstarts (session_start)","iOS","Android"].concat(namen);
  const zeilen = keys.map(function(k){
    const d = DATA_APP[k], kpi = d.kpi;
    const leer = function(v){ return hatWert(v) ? v : ""; };
    return [d.label, leer(kpi.activeUsers), leer(kpi.installs), leer(kpi.uninstalls),
            leer(kpi.crashes), leer(kpi.sessions), leer(kpi.screenViews),
            leer(kpi.engagement), leer(kpi.sessionStarts), leer(kpi.ios), leer(kpi.android)]
      .concat(namen.map(function(n){ return d.eventMap[n] === undefined ? "" : d.eventMap[n]; }));
  });
  return [kopf].concat(zeilen);
}

/* ============================================================
   8. KANAL Newsletter
   Quelle: CleverReach-Versandberichte (CSV) im fileadmin.
   Eine Datei = ein Versand = ein Monatswert.
   Ablageordner: fileadmin/user_upload/17_kennzahlen/newsletter/
   Im Code stehen bewusst keine Versandwerte.
   ============================================================ */
let DATA_NEWSLETTER = {};

const NEWSLETTER_QUELLE = {
  ordner:      "/fileadmin/user_upload/17_kennzahlen/newsletter/",
  maxDateien:  60,       /* Sicherheitsnetz gegen versehentlich volle Ordner */
  probeMonate: 24,       /* so viele Monate rückwärts suchen, wenn kein Listing */
  tageImDetail: 7,       /* so viele Zeilen zeigt die Tabelle „Tagesverlauf" */
  /* Falls der Server kein Verzeichnislisting erlaubt und die Dateien
     anders heißen als newsletter_<monat>_<jahr>.csv, können die Namen
     hier fest eingetragen werden. */
  dateien: []
};

/* Dateinamen im Ordner: newsletter_august_2025.csv. Groß-/Kleinschreibung
   ist auf dem Server relevant, und TYPO3 wandelt Umlaute beim Hochladen
   um („märz" kann als „maerz" liegen) — deshalb deckt die Liste beide
   Formen ab. Sobald ein Muster einmal getroffen hat, wird nur noch
   dieses verwendet. */
const NL_BASIS = ["newsletter","Newsletter"];
function nlFormen(monat){
  return {klein: monat.toLowerCase(), gross: monat,
          kleinOhne: ohneUmlaute(monat).toLowerCase(), grossOhne: ohneUmlaute(monat)};
}
function nlDatei(basis, form, jahr){
  return NEWSLETTER_QUELLE.ordner + encodeURIComponent(basis + "_" + form + "_" + jahr + ".csv");
}
function nlVarianten(monat, jahr){
  const formen = nlFormen(monat), out = [], gesehen = {};
  NL_BASIS.forEach(function(basis){
    Object.keys(formen).forEach(function(art){
      const url = nlDatei(basis, formen[art], jahr);
      if(gesehen[url]) return;
      gesehen[url] = 1;
      out.push({id: basis + "|" + art, url: url});
    });
  });
  return out;
}
function nlNachMuster(id, monat, jahr){
  const teile = id.split("|"), form = nlFormen(monat)[teile[1]];
  const urls = [nlDatei(teile[0], form, jahr)];
  const ohne = ohneUmlaute(form);
  if(ohne !== form) urls.push(nlDatei(teile[0], ohne, jahr));
  return urls;
}

/* Was aus einer CleverReach-CSV eine Kennzahl wird. Je Feld stehen
   mehrere mögliche Beschriftungen, weil CleverReach je nach
   Spracheinstellung des Kontos englisch oder deutsch exportiert.
   Kommt eine Zeile dazu, wird sie hier ergänzt — und taucht dann in
   Ansicht und Export automatisch mit auf. */
const NEWSLETTER_FELDER = {
  recipients:      {label:"Empfänger",          csv:["Total Recipients","Empfänger gesamt","Empfänger"],            art:"num"},
  delivered:       {label:"Zugestellt",         csv:["Deliveried","Delivered","Zugestellt"],                        art:"num"},
  bounces:         {label:"Bounces",            csv:["Bounces","Bounces gesamt"],                                   art:"num"},

  totalOpens:      {label:"Öffnungen (gesamt)", csv:["Total Opens","Öffnungen gesamt"],                             art:"num"},

  /* CleverReach rechnet die Klickrate auf die Öffner, nicht auf die

                    exportLabel:"Klickrate bezogen auf Öffner (%)"},
  clickRateDeliv:  {label:"Klickrate (Zugestellt)", csv:[], art:"pct", abgeleitet:true,
                    exportLabel:"Klickrate bezogen auf Zugestellte (%)"},

  unsubscribes:    {label:"Abmeldungen",        csv:["Unsubscribers","Abmeldungen","Abmelder"],                     art:"num"},
  unsubscribeRate: {label:"Abmelderate",        csv:["Unsubscribers","Abmeldungen","Abmelder"],                     art:"pct", spalte:"prozent"},
  spam:            {label:"Spam-Meldungen",     csv:["Spam Complaints","Spam-Beschwerden","Spam"],                  art:"num"},
  spamRate:        {label:"Spam-Rate",          csv:["Spam Complaints","Spam-Beschwerden","Spam"],                  art:"pct", spalte:"prozent"}

/* Textfelder aus dem CSV-Kopf */
const NEWSLETTER_TEXTE = {
  name:    ["Name","Mailing","Mailingname"],
  subject: ["Subject","Betreff"],
  date:    ["Delivery Date/Time","Delivery Date","Versanddatum","Versendet am","Datum"]
};

/* Beschriftungen vergleichbar machen: ohne Doppelpunkt, Leerzeichen
   und Groß-/Kleinschreibung. So ist es gleich, ob in der Datei
   "Total Recipients:" oder "Total recipients" steht. */
function nlSchluessel(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/\u00a0/g," ").toLowerCase().replace(/[\s:.\-_]/g,"");
}

/* CleverReach exportiert in zwei Dialekten. Der eine schreibt saubere
   Felder:
       "Bounces:","1.391","4,54%"
   der andere legt Anführungszeichen um die ganze Zeile und verdoppelt
   die inneren:
       "Bounces:,""890"",""3,03%"""
   Unbehandelt wird daraus ein einziges Feld — die Datei liest sich dann
   ohne einen einzigen Wert ein. Deshalb wird der zweite Dialekt vor dem
   Zerlegen wieder ausgepackt. Umgestellt wird nur, wenn die Mehrheit
   der Zeilen so aussieht; eine normale CSV mit einem escapten
   Anführungszeichen im Betreff bleibt unangetastet. */
function csvVorbereiten(text){
  const zeilen = String(text).split(/\r?\n/);
  let umschlossen = 0, gesamt = 0;
  zeilen.forEach(function(z){
    const t = z.trim();
    if(!t) return;
    gesamt++;
    if(/^".*"$/.test(t) && t.indexOf('""') > -1) umschlossen++;
  });
  if(!gesamt || umschlossen / gesamt < 0.5) return text;
  return zeilen.map(function(z){
    const t = z.trim();
    if(!/^".*"$/.test(t) || t.indexOf('""') === -1) return z;
    return t.slice(1, -1).replace(/""/g, '"');
  }).join("\n");
}

/* CleverReach schreibt CSV mit Kommas als Trenner und Werten in
   Anführungszeichen; je nach Konto kann es auch ein Semikolon sein.
   Der Trenner wird deshalb aus dem Dateikopf abgeleitet. */
function csvTrenner(text){
  const kopf = text.split("\n").slice(0,15).join("\n");
  const zaehl = z => (kopf.match(new RegExp("\\" + z, "g")) || []).length;
  const komma = zaehl(","), semi = zaehl(";"), tab = (kopf.match(/\t/g) || []).length;
  if(semi > komma && semi >= tab) return ";";
  if(tab > komma && tab > semi) return "\t";
  return ",";
}
function csvZeilen(text, trenner){
  const zeilen = [], reihe = [];
  let feld = "", drinnen = false;
  function feldRaus(){ reihe.push(feld); feld = ""; }
  function zeileRaus(){ feldRaus(); zeilen.push(reihe.slice()); reihe.length = 0; }
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(drinnen){
      if(c === '"' && text[i+1] === '"'){ feld += '"'; i++; continue; }
      if(c === '"'){ drinnen = false; continue; }
      feld += c;
    }else{
      if(c === '"'){ drinnen = true; continue; }
      if(c === trenner){ feldRaus(); continue; }
      if(c === '\n'){ zeileRaus(); continue; }
      if(c === '\r') continue;
      feld += c;
    }
  }
  if(feld.length || reihe.length) zeileRaus();
  return zeilen;
}

/* Zahl aus einer CSV-Zelle. Erkennt deutsches und englisches Format:
   "29.314" und "29,314" werden zu 29314, "1,45%" und "1.45%" zu 1.45.
   Leere Zellen ergeben null, nicht 0. */
function csvZahl(v){
  if(v === undefined || v === null) return null;
  let s = String(v).replace(/\u00a0/g," ").trim();
  if(!s || !/\d/.test(s)) return null;
  const negativ = /^\s*-/.test(s);
  s = s.replace(/[^\d.,]/g,"");
  const komma = s.lastIndexOf(","), punkt = s.lastIndexOf(".");
  if(komma > -1 && punkt > -1){
    /* Der hintere der beiden Trenner ist das Dezimalzeichen. */
    if(komma > punkt) s = s.replace(/\./g,"").replace(",",".");
    else s = s.replace(/,/g,"");
  }else if(komma > -1){
    s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,"") : s.replace(",",".");
  }else if(punkt > -1){
    if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  }
  const n = parseFloat(s);
  if(!isFinite(n)) return null;
  return negativ ? -n : n;
}

/* "05.03.2026 12:43:35" · "2026-03-05" · "03/05/2026" → "2026-03" */
function csvMonatsSchluessel(datum){
  const s = String(datum || "").trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return m[1] + "-" + String(+m[2]).padStart(2,"0");
  m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s);
  if(m) return m[3] + "-" + String(+m[2]).padStart(2,"0");
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);      /* CleverReach englisch: MM/TT/JJJJ */
  if(m) return m[3] + "-" + String(+m[1]).padStart(2,"0");
  return null;
}
/* Sortierwert eines Versanddatums, damit bei zwei Versänden im selben
   Monat der jüngere gewinnt. */
function csvDatumWert(datum){
  const s = String(datum || "").trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return +(m[1] + String(+m[2]).padStart(2,"0") + String(+m[3]).padStart(2,"0"));
  m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s);
  if(m) return +(m[3] + String(+m[2]).padStart(2,"0") + String(+m[1]).padStart(2,"0"));
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
  if(m) return +(m[3] + String(+m[1]).padStart(2,"0") + String(+m[2]).padStart(2,"0"));
  return 0;
}
/* Notnagel: Monat aus dem Dateinamen, wenn im Kopf kein Datum steht. */
function monatAusDateiname(url){
  const name = decodeURIComponent(String(url || "").split("/").pop());
  let m = /(\d{4})[-_.](\d{2})/.exec(name);
  if(m && +m[2] >= 1 && +m[2] <= 12) return m[1] + "-" + m[2];
  m = /([A-Za-zÄÖÜäöü]+)[-_ ](\d{4})/.exec(name);
  if(m){
    const nr = MONAT_SUCHE[monatsSchluessel(m[1])];
    if(nr) return m[2] + "-" + String(nr).padStart(2,"0");
  }
  return null;
}

/* Liest eine CleverReach-CSV und liefert {key, wert} oder null.
   Die Datei ist in Blöcke gegliedert (Kopf / "Daily Overview" /
   "Links Overview"), getrennt durch Leerzeilen; wir laufen einmal
   durch und tragen die Zeilen in den richtigen Topf. */
function parseNewsletter(text, url){
  const roh = csvVorbereiten(text);
  const zeilen = csvZeilen(roh, csvTrenner(roh));
  const kopf = {}, tage = [], links = [];
  let abschnitt = "kopf";

  zeilen.forEach(function(r){
    if(!r.length || (r.length === 1 && !String(r[0]).trim())) return;
    const erst = nlSchluessel(r[0]);
    if(erst === "dailyoverview" || erst === "tagesubersicht"){ abschnitt = "tage";  return; }
    if(erst === "linksoverview" || erst === "links"){          abschnitt = "links"; return; }

    if(abschnitt === "kopf"){
      if(!erst) return;
      kopf[erst] = {wert: r[1], prozent: r[2]};
    }else if(abschnitt === "tage"){
      /* Kopfzeile des Blocks überspringen — eine Datumszeile beginnt mit einer Ziffer. */
      if(!/^\d/.test(String(r[0]).trim())) return;
      tage.push({datum:r[0], uOpen:csvZahl(r[1]), tOpen:csvZahl(r[2]),
                 uClick:csvZahl(r[3]), tClick:csvZahl(r[4])});
    }else if(abschnitt === "links"){
      if(erst === "pos" || erst === "position" || erst === "url") return;
      if(!String(r[1] || "").trim()) return;
      links.push({pos:r[0], url:r[1], klicks:csvZahl(r[2]), anteil:String(r[3] || "").trim()});
    }
  });

  /* Textfelder aus dem Kopf holen — erste passende Beschriftung gewinnt. */
  const text_ = {};
  Object.keys(NEWSLETTER_TEXTE).forEach(function(feld){
    const treffer = NEWSLETTER_TEXTE[feld].map(nlSchluessel).find(s => kopf[s]);
    text_[feld] = treffer ? String(kopf[treffer].wert || "").trim() : "";
  });

  /* Der Dateiname bestimmt den Monat: so steht der Versand dort, wo ihn
     auch der Ordner einsortiert. Fehlt im Namen ein Monat, springt das
     Versanddatum aus dem Kopf ein. */
  const key = monatAusDateiname(url) || csvMonatsSchluessel(text_.date);
  if(!key) return null;

  const kpi = {};
  Object.keys(NEWSLETTER_FELDER).forEach(function(feld){
    const f = NEWSLETTER_FELDER[feld];
    if(f.abgeleitet){ kpi[feld] = null; return; }
    const treffer = f.csv.map(nlSchluessel).find(s => kopf[s]);
    if(!treffer){ kpi[feld] = null; return; }
    const zelle = kopf[treffer];
    kpi[feld] = csvZahl(f.spalte === "prozent" ? zelle.prozent : zelle.wert);
  });
  /* Klickrate ein zweites Mal — diesmal auf die zugestellten Mails. */
  kpi.clickRateDeliv = (hatWert(kpi.uniqueClicks) && kpi.delivered > 0)
    ? Math.round(kpi.uniqueClicks / kpi.delivered * 1000) / 10
    : null;

  return {key: key, wert: {
    label:   monatsName(key),
    name:    text_.name,
    subject: text_.subject,
    date:    text_.date,
    sort:    csvDatumWert(text_.date),
    kpi:     kpi,
    tage:    tage,
    links:   links
  }};
}

/* Kleine Info-Kachel: Name, Betreff, Versanddatum. Nutzt die Struktur
   der App-Kachel „Plattformen" (.split.wide + .legend), damit keine
   neuen Bauteile nötig sind. */
function newsletterVersandkarte(cur){
  const zeile = function(name, wert){
    return '<div><span class="lname">' + esc(name) + '</span>' +
           '<span class="lval">' + esc(wert || "—") + '</span></div>';
  };
  /* Die Prozentwerte von CleverReach haben unterschiedliche Bezugsgrößen.
     Das gehört dazugeschrieben, sonst vergleicht man Äpfel mit Birnen. */
  const k = cur.kpi;
  const bezug = "Bezugsgrößen aus CleverReach: Bounce-Rate auf alle Empfänger, " +
    "Öffnungs- und Abmelderate auf die zugestellten Mails, Klickrate auf die Öffner." +
    (hatWert(k.clickRateDeliv)
      ? " Auf die Zugestellten gerechnet liegt die Klickrate bei " + pct(k.clickRateDeliv) + "."
      : "");

  return '<div class="card split right">' +
    '<div class="card-head"><h2>Versand</h2><span class="card-note">Angaben aus CleverReach</span></div>' +
    '<div class="legend">' +
      zeile("Name",         cur.name) +
      zeile("Betreff",      cur.subject) +
      zeile("Versanddatum", cur.date) +
    '</div>' +
    '<p class="hint">' + esc(bezug) + '</p>' +
    '</div>';
}

function renderNewsletter(){
  const cur = DATA_NEWSLETTER[state.monthNews];
  const v = vergleich("news"), cmp = v.cmp, cmpLabel = v.label;

  /* Meistgeklickte Links — rechts neben den KPI-Kacheln und genauso
     hoch. Angezeigt wird die Adresse ohne Protokoll und www., die
     vollständige steht im Tooltip. */
  const links   = (cur.links || []).slice(0,5);
  const linkMax = maxOf(links.map(l => l.klicks || 0));
  const klickSumme = (cur.links || []).reduce(function(a,l){ return a + (l.klicks || 0); }, 0);
  const ranking = rangKachel({
    klasse:"rank side-rank", titel:"Meistgeklickte Links", note:"Top 5 · Klicks und Anteil",

    leerText:"Für diesen Versand sind keine Links im Bericht enthalten.",

      return {

        hover:  l.url,
        text:   fmt(l.klicks || 0),
        anteil: (l.klicks || 0) / linkMax * 100,
        meta:   esc(l.anteil || (klickSumme > 0 ? dec1((l.klicks || 0) / klickSumme * 100) + " %" : ""))
      };
    })
  });

  /* Tagesverlauf: eine Zeile pro Tag nach dem Versand. CleverReach
     liefert rund 30 Tage; die ersten Tage tragen die Bewegung, der Rest
     steht im Bericht selbst. */
  const alleTage = cur.tage || [];
  const tage = alleTage.slice(0, NEWSLETTER_QUELLE.tageImDetail);
  const tagesverlauf = tage.length
    ? '<div class="card detail-card full">' +
      '<div class="card-head"><h2>Tagesverlauf</h2><span class="card-note">' +
      (alleTage.length > tage.length
        ? "erste " + tage.length + " von " + alleTage.length + " Tagen"
        : tage.length + (tage.length === 1 ? " Tag" : " Tage") + " nach dem Versand") + '</span></div>' +
      '<div class="tablewrap"><table><thead><tr>' +
        '<th>Datum</th><th>Öffnungen (Unique)</th><th>Öffnungen (gesamt)</th>' +
        '<th>Klicks (Unique)</th><th>Klicks (gesamt)</th>' +
      '</tr></thead><tbody>' +
      tage.map(function(t){
        return '<tr>' +
          '<td>' + esc(t.datum) + '</td>' +
          '<td><div class="cell-num"><b>' + fmt(t.uOpen  || 0) + '</b></div></td>' +
          '<td><div class="cell-num"><b>' + fmt(t.tOpen  || 0) + '</b></div></td>' +
          '<td><div class="cell-num"><b>' + fmt(t.uClick || 0) + '</b></div></td>' +
          '<td><div class="cell-num"><b>' + fmt(t.tClick || 0) + '</b></div></td>' +
        '</tr>';
      }).join("") + '</tbody></table></div>' +
      '<p class="tfoot-note">Die Zeilen stammen unverändert aus dem CleverReach-Bericht' +
      (alleTage.length > tage.length ? ", der noch " + (alleTage.length - tage.length) +
        " weitere Tage mit auslaufenden Werten enthält" : "") + '.</p></div>'
    : leereKachel("detail-card full", "Tagesverlauf",
        "Dieser Versandbericht enthält keinen Tagesverlauf.");

  /* Reihenfolge bestimmt die Rasterplatzierung: oben KPI-Kacheln und
     Linkliste nebeneinander, darunter Jahresverlauf und Versandangaben,
     ganz unten der Tagesverlauf über die volle Breite. */
  return '<div class="grid">' +
    kpiRaster("news", cur, cmp, cmpLabel) +
    ranking +
    jahresChart("news") +
    auffaelligkeiten("news", cur, cmp, cmpLabel) +
    newsletterVersandkarte(cur) +
    tagesverlauf +
  '</div>';
}

/* Holt eine CSV — oder null, wenn es die Datei nicht gibt. TYPO3
   beantwortet fehlende Dateien teils mit einer HTML-Fehlerseite und
   Status 200; die wird hier ebenfalls als „nicht vorhanden" gewertet. */
function holeText(url){
  return fetch(url, {cache:"no-store"})
    .then(function(res){
      if(!res.ok) return null;
      const typ = res.headers.get("content-type") || "";
      if(typ.indexOf("html") > -1) return null;
      return res.text();
    })
    .then(function(text){
      if(!text) return null;
      return /^\s*</.test(text) ? null : text;
    })
    .catch(function(){ return null; });
}

function newsletterHolen(melde){
  melde("Ordner wird durchsucht …");
  const bilanz = {gelesen:0, fehler:0, fehlerNamen:[], hinweise:[]};
  const next = {};
  let doppelt = 0;

  function uebernehmen(text, url){
    let r = null;
    try{ r = parseNewsletter(text, url); }catch(e){ r = null; }
    if(!r){
      bilanz.fehler++;
      if(bilanz.fehlerNamen.length < 4){
        try{ bilanz.fehlerNamen.push(decodeURIComponent(url.split("/").pop())); }
        catch(e){ bilanz.fehlerNamen.push(url); }
      }
      return;
    }
    bilanz.gelesen++;
    /* Zwei Versände im selben Monat: der jüngere gewinnt. */
    if(next[r.key]){
      doppelt++;
      if((r.wert.sort || 0) < (next[r.key].sort || 0)) return;
    }
    next[r.key] = r.wert;
    melde(r.wert.label + " gelesen …");
  }

  const fest = NEWSLETTER_QUELLE.dateien.map(function(n){
    return NEWSLETTER_QUELLE.ordner + encodeURIComponent(n);
  });
  const suche = fest.length ? Promise.resolve(fest)
                            : ordnerListing(NEWSLETTER_QUELLE.ordner, "csv");

  return suche.then(function(urls){

    /* Weg A: Der Server listet den Ordner auf – dann kennen wir die Namen genau. */
    if(urls.length){
      let kette = Promise.resolve();
      const genutzt = urls.slice(0, NEWSLETTER_QUELLE.maxDateien);
      genutzt.forEach(function(url, i){
        kette = kette.then(function(){
          melde("Versand " + (i+1) + " von " + genutzt.length + " wird gelesen …");
          return holeText(url).then(function(text){ if(text) uebernehmen(text, url); });
        });
      });
      return kette;
    }

    /* Weg B: Kein Listing – newsletter_<monat>_<jahr>.csv durchprobieren
       und das gefundene Muster für die übrigen Monate merken. */
    const monate = letzteMonate(NEWSLETTER_QUELLE.probeMonate);
    let muster = null;
    let kette = Promise.resolve();

    monate.forEach(function(m){
      kette = kette.then(function(){
        if(bilanz.gelesen >= NEWSLETTER_QUELLE.maxDateien) return;
        melde("Suche " + m.monat + " " + m.jahr + " …");

        if(muster){                                   /* Muster bekannt: ein Versuch genügt */
          const urls = nlNachMuster(muster, m.monat, m.jahr);
          let versuch = Promise.resolve(null);
          urls.forEach(function(url){
            versuch = versuch.then(function(t){
              if(t) return t;
              return holeText(url).then(function(x){ return x ? {text:x, url:url} : null; });
            });
          });
          return versuch.then(function(t){ if(t) uebernehmen(t.text, t.url); });
        }
        /* Muster unbekannt: alle Varianten gleichzeitig anfragen */
        const varianten = nlVarianten(m.monat, m.jahr);
        return Promise.all(varianten.map(function(v){
          return holeText(v.url).then(function(t){ return {v:v, t:t}; });
        })).then(function(ergebnisse){
          const treffer = ergebnisse.find(function(e){ return e.t; });
          if(!treffer) return;
          muster = treffer.v.id;
          uebernehmen(treffer.t, treffer.v.url);
        });
      });
    });
    return kette;

  }).then(function(){
    if(!Object.keys(next).length){
      throw new Error("Keine auswertbare CleverReach-CSV gefunden · Ordner und Dateiname prüfen · " +
                      "erwartet wird z. B. newsletter_august_2025.csv");
    }
    DATA_NEWSLETTER = next;
    if(doppelt) bilanz.hinweise.push(doppelt + (doppelt === 1 ? " Versand" : " Versände") +
                                     " im selben Monat ersetzt");
    return bilanz;
  });
}

function blattNewsletter(keys){
  /* Der Kopf spiegelt NEWSLETTER_FELDER, ergänzt um die drei Textfelder
     aus dem CleverReach-Kopf. So landen auch die Kennzahlen im Export,
     die im Dashboard nicht als eigene Kachel auftauchen. */
  const felder = Object.keys(NEWSLETTER_FELDER);
  const kopf = ["Monat","Name","Betreff","Versanddatum"].concat(
    felder.map(function(f){
      const n = NEWSLETTER_FELDER[f];
      return n.exportLabel || (n.label + (n.art === "pct" ? " (%)" : ""));
    })
  );
  const zeilen = keys.map(function(k){
    const d = DATA_NEWSLETTER[k];
    const leer = function(v){ return hatWert(v) ? v : ""; };
    return [d.label, d.name || "", d.subject || "", d.date || ""]
      .concat(felder.map(function(f){ return leer(d.kpi[f]); }));
  });
  return [kopf].concat(zeilen);
}
