<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kennzahlen BMK</title>
<style>
/* ============================================================
   Kennzahlen-Dashboard BMK  –  Prototyp Gruppe "bus-und-bahn.de"
   Alles gekapselt unter #bmk-dash, damit nichts aus dem
   TYPO3-Seitenlayout überschrieben wird und umgekehrt.

   Höhe: --dash-h steuert die Gesamthöhe. In TYPO3 ggf. auf
   calc(100vh - 120px) o. ä. setzen, damit der Seitenkopf passt.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

#bmk-dash *{box-sizing:border-box;margin:0;padding:0}
#bmk-dash{
  --blue:#1b59f8;
  --blue-soft:rgba(27,89,248,.10);
  --blue-faint:#f2f7ff;
  --ink:#151e23;
  --ink-2:#4d4d4d;
  --ink-3:#838383;
  --line:#eff0f6;
  --bg:#f9f9f9;
  --card:#ffffff;
  --up:#1fe08f;
  --down:#ff3e13;
  --warn:#f5a300;
  --radius:20px;
  --dash-h:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  height:var(--dash-h);
  max-height:var(--dash-h);
  min-height:660px;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.45;
  border-radius:30px;
  box-shadow:0 0 50px rgba(0,0,0,.10);
  overflow:hidden;
}

/* ---------- Überschriften: immer neutral, nie aus dem CMS eingefärbt ---------- */
#bmk-dash h1,#bmk-dash h2,#bmk-dash h3,#bmk-dash h4{font-family:inherit;color:var(--ink)}
#bmk-dash .topbar h1{color:var(--ink)!important}

/* ---------- Sidebar (feste Höhe, scrollt nicht mit) ---------- */
#bmk-dash .side{
  width:250px;flex:0 0 250px;background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
  display:flex;flex-direction:column;padding:26px 0 0;
  height:100%;min-height:0;overflow:hidden;
}
#bmk-dash .brand{padding:0 24px 28px;display:flex;flex-direction:column;gap:9px;flex:0 0 auto}
#bmk-dash .brand img{display:block;width:148px;height:auto;max-height:42px;object-fit:contain;object-position:left center}
/* Schriftstil wie die Kachel-Notiz "Eindeutige Seitenansichten" */
#bmk-dash .brand b{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.1px;line-height:1.3}
#bmk-dash .brand span{display:none}
#bmk-dash .navlabel{
  padding:0 24px 10px;font-size:11px;font-weight:700;letter-spacing:.7px;
  text-transform:uppercase;color:var(--ink-3);flex:0 0 auto;
}
#bmk-dash .nav{display:flex;flex-direction:column;gap:8px;padding:0 14px;flex:0 0 auto}
#bmk-dash .navitem{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;border:0;background:none;border-radius:10px;
  font:inherit;font-size:14px;font-weight:500;color:var(--ink-2);
  cursor:pointer;text-align:left;
  transition:background .16s,color .16s,transform .16s;
}
#bmk-dash .navitem:hover{background:#f5f6f9;color:var(--ink);transform:translateX(2px)}
#bmk-dash .navitem[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
#bmk-dash .navitem svg{flex:0 0 18px;width:18px;height:18px;transition:transform .18s}
#bmk-dash .navitem:hover svg{transform:scale(1.08)}
#bmk-dash .navitem .soon{
  margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.4px;
  color:var(--ink-3);background:#f0f1f4;padding:2px 6px;border-radius:5px;
}
/* Illustration: füllt den freien Rest, bündig rechts und unten */
#bmk-dash .side-media{
  flex:1 1 auto;min-height:0;overflow:hidden;
  display:block;padding:12px 0 0 0;
}
#bmk-dash .side-media img{
  display:block;width:100%;height:100%;
  object-fit:contain;object-position:bottom right;
  mix-blend-mode:multiply;          /* weißer Hintergrund verschwindet auf weißer Sidebar */
}
#bmk-dash .side-media img.is-keyed{mix-blend-mode:normal}  /* echte Transparenz vorhanden */
#bmk-dash .side-foot{
  flex:0 0 auto;margin:0 0 0;padding:16px 24px 22px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:11px;background:var(--card);
}
#bmk-dash .avatar{
  width:36px;height:36px;border-radius:50%;flex:0 0 36px;
  background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;letter-spacing:.3px;
}
#bmk-dash .side-foot b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
#bmk-dash .side-foot span{font-size:11.5px;color:var(--ink-3)}

/* ---------- Main (einziger scrollender Bereich) ---------- */
#bmk-dash .main{
  flex:1;min-width:0;min-height:0;padding:26px 30px 40px;
  overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth;
}
#bmk-dash .main::-webkit-scrollbar{width:11px}
#bmk-dash .main::-webkit-scrollbar-track{background:transparent}
#bmk-dash .main::-webkit-scrollbar-thumb{background:#e2e5ee;border-radius:20px;border:3px solid var(--bg)}
#bmk-dash .main::-webkit-scrollbar-thumb:hover{background:#cfd4e0}
#bmk-dash .topbar{display:flex;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
#bmk-dash .topbar h1{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
#bmk-dash .topbar p{font-size:13px;color:var(--ink-3);margin-top:3px}
#bmk-dash .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
#bmk-dash .btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;
  border:1px solid var(--line);background:var(--card);border-radius:9px;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;
  transition:border-color .16s,color .16s,transform .16s,box-shadow .16s;
}
#bmk-dash .btn:hover{border-color:#c9cfdb;color:var(--ink);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.07)}
#bmk-dash .btn:active{transform:translateY(0)}
#bmk-dash .btn.is-loading{pointer-events:none;color:var(--blue);border-color:#c9d6f8}
#bmk-dash .btn.is-loading .ric{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bmk-dash .src{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);margin-top:6px}
#bmk-dash .sdot{width:7px;height:7px;border-radius:50%;background:#c9cfdb;flex:0 0 7px}
#bmk-dash .src.live .sdot{background:var(--up)}
/* Ring statt Punkt: aus dem Zwischenspeicher heißt „nichts frisch geholt" */
#bmk-dash .src.cache .sdot{background:var(--card);box-shadow:inset 0 0 0 2px #b9c0cf}
#bmk-dash .src.local .sdot{background:#f5b301}
#bmk-dash .src.error .sdot{background:var(--down)}
#bmk-dash .src.loading .sdot{background:var(--blue);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
#bmk-dash .whoami{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
#bmk-dash .whoami .avatar{width:32px;height:32px;flex-basis:32px;font-size:12px}
#bmk-dash .whoami b{font-size:13.5px;font-weight:600;display:block;line-height:1.25}
#bmk-dash .whoami span{font-size:11.5px;color:var(--ink-3)}

/* ---------- Filterleiste (eigene Auswahlfelder statt <select>) ---------- */
#bmk-dash .filters{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
  margin:20px 0 18px;width:62%;min-width:420px;
}
#bmk-dash .filters.aus{display:none!important}   /* gilt auch im Druck */
#bmk-dash .combo{position:relative;min-width:0}
#bmk-dash .combo-btn{
  position:relative;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:11px 42px 12px 16px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
  transition:border-color .16s,box-shadow .16s,transform .16s;
}
#bmk-dash .combo-btn:hover{border-color:#c9cfdb;transform:translateY(-1px)}
#bmk-dash .combo.open .combo-btn{transform:none}
#bmk-dash .combo-label{
  display:block;font-size:11px;font-weight:600;color:var(--ink-3);
  letter-spacing:.2px;margin-bottom:1px;
}
#bmk-dash .combo-val{
  display:block;font-size:14px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#bmk-dash .combo-caret{
  position:absolute;right:18px;top:50%;width:8px;height:8px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:translateY(-70%) rotate(45deg);transition:transform .2s;
}
#bmk-dash .combo.open .combo-caret{transform:translateY(-25%) rotate(-135deg)}
#bmk-dash .combo.open .combo-btn{
  border-bottom-left-radius:0;border-bottom-right-radius:0;
  border-bottom-color:transparent;
}
#bmk-dash .combo-panel{
  position:absolute;top:100%;left:0;right:0;z-index:40;
  background:var(--card);border:1px solid var(--line);border-top:0;
  border-radius:0 0 20px 20px;
  box-shadow:0 20px 44px rgba(0,0,0,.13);
  padding:0 7px 7px;
  transform-origin:top center;
  animation:combo-open .16s cubic-bezier(.2,.7,.3,1);
}
#bmk-dash .combo-panel::before{content:"";display:block;height:1px;background:var(--line);margin:0 9px 7px}
#bmk-dash .combo-opt{
  display:block;width:100%;text-align:left;font:inherit;font-size:14px;font-weight:500;
  color:var(--ink-2);background:none;border:0;border-radius:14px;
  padding:11px 13px;cursor:pointer;transition:background .12s,color .12s;
}
#bmk-dash .combo-opt:hover{background:#f5f6f9;color:var(--ink)}
#bmk-dash .combo-opt[aria-selected="true"]{background:var(--blue-faint);color:var(--ink);font-weight:600}
@keyframes combo-open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- Auffälligkeiten in den Kanälen ---------- */
#bmk-dash .bmk-full{grid-column:1 / span 12}

#bmk-dash .insight{background:linear-gradient(180deg,#fbfcff 0%,var(--card) 60%)}
#bmk-dash .insight ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:2px}
#bmk-dash .insight li{
  display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-2);line-height:1.45;
}
#bmk-dash .insight li .ico{
  flex:0 0 22px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  font-size:10px;font-weight:700;line-height:1;margin-top:1px;
}
#bmk-dash .insight li.pos .ico{background:rgba(31,224,143,.16);color:#0f9c62}
#bmk-dash .insight li.neg .ico{background:rgba(255,62,19,.12);color:var(--down)}
#bmk-dash .insight li b{color:var(--ink);font-weight:600}
#bmk-dash .insight li .zahl{font-variant-numeric:tabular-nums;font-weight:600}
#bmk-dash .insight li.pos .zahl{color:#0f9c62}
#bmk-dash .insight li.neg .zahl{color:var(--down)}
#bmk-dash .insight .ruhig{font-size:13px;color:var(--ink-3)}

/* ============================================================
   Übersicht „Alle Kanäle"
   Ein eigenes 12er-Raster aus ruhigen, weich gerundeten Kacheln.
   Blau trägt den aktuellen Zeitraum, Orange den Vorjahreszeitraum
   und Rückgänge — sonst bleibt alles zurückhaltend.
   ============================================================ */
#bmk-dash .ov{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:14px;--accent:#ff8a4c}
#bmk-dash .ov > .card{border-radius:24px;padding:20px 22px;animation:bmk-in .5s cubic-bezier(.2,.7,.3,1) backwards}
#bmk-dash .ov > .card:hover{transform:none;box-shadow:0 12px 30px rgba(27,89,248,.08);border-color:var(--line)}
#bmk-dash .ov > :nth-child(2){animation-delay:.05s}
#bmk-dash .ov > :nth-child(3){animation-delay:.10s}
#bmk-dash .ov > :nth-child(4){animation-delay:.15s}
#bmk-dash .ov > :nth-child(5){animation-delay:.20s}
#bmk-dash .ov > :nth-child(6){animation-delay:.25s}
#bmk-dash .ov > :nth-child(7){animation-delay:.30s}
/* Schriftskala der Übersicht — überall dieselben Stufen:
     Kacheltitel 15/600 · Werte groß 32/600 · Werte mittel 26/600
     Werte klein 15/600 · Text 13/500 · Nebentext 12/400 · Notiz 11.5/500 */
#bmk-dash .ov .card h2{color:var(--ink)!important;font-size:15px;font-weight:600;letter-spacing:-.1px}
#bmk-dash .ov .card-head{min-height:22px;margin-bottom:18px}
#bmk-dash .ov-oben{grid-column:span 4}
#bmk-dash .ov-s4{grid-column:span 4}
#bmk-dash .ov-s8{grid-column:span 8}
#bmk-dash .ov-s12{grid-column:span 12}
#bmk-dash .ov .ruhig{font-size:12px;color:var(--ink-3);line-height:1.5}
#bmk-dash .ov .ruhig.mehr{margin-top:12px}

/* Kanal-Icons: genau wie in der Seitenleiste — 18 px, grau, ohne Fläche */
#bmk-dash .kicon{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px;
  width:18px;height:18px;color:var(--ink-2);transition:color .16s;
}
#bmk-dash .kicon svg{width:18px;height:18px;display:block}
#bmk-dash .kicon.aus{color:#c3c9d5}

/* Stärkster Anstieg / Rückgang */
#bmk-dash .ov-extrem{display:flex;flex-direction:column}
#bmk-dash .ov-extrem .block{display:flex;flex-direction:column;gap:4px;flex:1 1 0}
#bmk-dash .ov-extrem .klein-titel{font-size:15px;font-weight:600;color:var(--ink)}
#bmk-dash .ov-extrem .gross{
  display:flex;align-items:center;gap:8px;font-size:32px;font-weight:600;letter-spacing:-1.1px;
  line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink);
}
#bmk-dash .ov-extrem .gross svg{width:24px;height:24px;flex:0 0 24px}
#bmk-dash .ov-extrem .auf svg{color:var(--blue)}
#bmk-dash .ov-extrem .ab svg{color:var(--accent)}
#bmk-dash .ov-extrem p{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:2px}
#bmk-dash .ov-extrem p b{color:var(--ink-2);font-weight:600}
#bmk-dash .ov-extrem .trenner{flex:0 0 1px;background:var(--line);margin:18px 0}

/* Niveau zum 12-Monats-Hoch */
#bmk-dash .ov-niveau ul{list-style:none;display:flex;flex-direction:column;gap:14px}
#bmk-dash .ov-niveau li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:6px 12px}
#bmk-dash .ov-niveau .kicon{grid-row:span 2}
#bmk-dash .ov-niveau .n{font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmk-dash .ov-niveau .p{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#bmk-dash .ov-niveau .bahn{grid-column:2 / span 2;height:7px;border-radius:20px;background:var(--blue-faint);overflow:hidden}
#bmk-dash .ov-niveau .bahn span{
  display:block;height:100%;width:0;border-radius:20px;
  background:linear-gradient(90deg,#9db8ff,var(--blue));transition:width .9s cubic-bezier(.2,.7,.3,1);
}
#bmk-dash .ov-niveau li.leer .p{color:var(--ink-3);font-weight:500}

/* Datenstand als Ring */
#bmk-dash .ov-ring{display:flex;flex-direction:column;align-items:center;text-align:center}
#bmk-dash .ov-ring .card-head{align-self:stretch}
#bmk-dash .ring{position:relative;width:132px;height:132px;margin:2px 0 12px}
#bmk-dash .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#bmk-dash .ring .bg{fill:none;stroke:#e9eefd;stroke-width:9}
#bmk-dash .ring .fg{fill:none;stroke:url(#bmk-ring-verlauf);stroke-width:9;stroke-linecap:round;
  animation:ring-in 1s cubic-bezier(.3,.7,.3,1) backwards}
@keyframes ring-in{from{stroke-dashoffset:var(--umfang)}}
#bmk-dash .ring .mitte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bmk-dash .ring .mitte b{font-size:32px;font-weight:600;letter-spacing:-1.1px;line-height:1.15;font-variant-numeric:tabular-nums}
#bmk-dash .ring .mitte span{font-size:11.5px;font-weight:500;color:var(--ink-3)}
#bmk-dash .ov-ring p{font-size:12px;color:var(--ink-3);line-height:1.5;max-width:280px;margin-bottom:18px}
#bmk-dash .ov-ring p b{color:var(--ink-2);font-weight:600}
#bmk-dash .ov-knopf{
  margin-top:auto;align-self:stretch;border:0;border-radius:14px;padding:11px 16px;
  background:var(--blue);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:box-shadow .16s,transform .16s;
}
#bmk-dash .ov-knopf:hover{box-shadow:0 10px 24px rgba(27,89,248,.28);transform:translateY(-1px)}
#bmk-dash .ov-knopf svg{width:15px;height:15px}
#bmk-dash .ov-knopf.laeuft{pointer-events:none;opacity:.75}
#bmk-dash .ov-knopf.laeuft svg{animation:spin .9s linear infinite}
/* Nach dem Nachladen wird still neu gezeichnet: keine zweite Aufbau-Animation */
#bmk-dash #views.still .ov > .card,#bmk-dash #views.still .ring .fg,#bmk-dash .still .ring .fg{animation:none}
#bmk-dash #views.still .bahn span,#bmk-dash .still .bahn span{transition:none}

/* Jahresvergleich */
#bmk-dash .ov-verlauf .card-head{margin-bottom:12px;flex-wrap:wrap}
#bmk-dash .kwahl{display:flex;gap:4px;background:#f2f3f6;padding:3px;border-radius:12px}
#bmk-dash .kwahl button{
  width:34px;height:30px;border:0;border-radius:9px;background:none;cursor:pointer;color:var(--ink-3);
  display:grid;place-items:center;transition:background .14s,color .14s;
}
#bmk-dash .kwahl button svg{width:16px;height:16px}
#bmk-dash .kwahl button:hover{color:var(--ink-2)}
#bmk-dash .kwahl button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 2px rgba(14,21,36,.08)}
#bmk-dash .kwahl button[disabled]{opacity:.35;pointer-events:none}
#bmk-dash .vl-zeile{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
#bmk-dash .vl-zeile .wer{font-size:13px;color:var(--ink-3)}
#bmk-dash .vl-zeile .wer b{color:var(--ink);font-weight:600}
#bmk-dash .vl{position:relative;height:230px;margin-left:58px;margin-bottom:26px}
#bmk-dash .vl-gitter{position:absolute;left:0;right:0;height:1px;background:#eef0f6}
#bmk-dash .vl-y{position:absolute;left:-58px;width:50px;text-align:right;transform:translateY(-50%);
  font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
#bmk-dash .vl-x{position:absolute;bottom:-22px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap}
#bmk-dash .vl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#bmk-dash .vl .l-akt{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round}
#bmk-dash .vl .l-vor{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round}
#bmk-dash .vl .f-akt{fill:url(#bmk-vl-flaeche)}
#bmk-dash .vp{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:2}
#bmk-dash .vp i{position:absolute;inset:4px;border-radius:50%;background:var(--card);border:2px solid var(--blue);transition:transform .16s}
#bmk-dash .vp.o i{border-color:var(--accent)}
#bmk-dash .vp.cur i{background:var(--blue)}
#bmk-dash .vp:hover{z-index:5}
#bmk-dash .vp:hover i{transform:scale(1.4)}
#bmk-dash .vp .tip,#bmk-dash .op .tip{
  position:absolute;left:50%;bottom:calc(100% + 4px);background:var(--ink);color:#fff;
  font-size:11px;font-weight:600;white-space:nowrap;padding:4px 8px;border-radius:6px;
  opacity:0;pointer-events:none;transform:translate(-50%,4px);transition:opacity .16s,transform .16s;
}
#bmk-dash .vp:hover .tip,#bmk-dash .op:hover .tip{opacity:1;transform:translate(-50%,0)}
/* Randpunkte: Beschriftung nach innen, damit sie nicht über den Rand ragt */
#bmk-dash .op.cur .tip,#bmk-dash .vp.rand-r .tip{left:auto;right:-2px;transform:translate(0,4px)}
#bmk-dash .op.erst .tip,#bmk-dash .vp.rand-l .tip{left:-2px;transform:translate(0,4px)}
#bmk-dash .op.cur:hover .tip,#bmk-dash .op.erst:hover .tip,
#bmk-dash .vp.rand-r:hover .tip,#bmk-dash .vp.rand-l:hover .tip{transform:translate(0,0)}
#bmk-dash .vl-legende{display:flex;gap:18px;font-size:12px;color:var(--ink-2)}
#bmk-dash .vl-legende span{display:inline-flex;align-items:center;gap:7px}
#bmk-dash .vl-legende i{width:18px;height:3px;border-radius:3px;background:var(--blue)}
#bmk-dash .vl-legende i.o{background:var(--accent)}
#bmk-dash .vl-legende{margin-top:2px}
#bmk-dash .vl-fazit{font-size:12px;color:var(--ink-3);margin-top:8px}
#bmk-dash .vl-fazit b{color:var(--ink);font-weight:600}
#bmk-dash .vl-fazit b.up{color:#0f9c62}
#bmk-dash .vl-fazit b.down{color:var(--down)}
#bmk-dash .vl-fazit b.flat{color:var(--ink-3)}

/* Deutliche Bewegungen */
#bmk-dash .ov-aus ul{list-style:none;display:flex;flex-direction:column}
#bmk-dash .ov-aus li + li{border-top:1px solid var(--line)}
#bmk-dash .ov-aus button{
  display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:12px;
  width:calc(100% + 16px);margin:0 -8px;padding:10px 8px;
  background:none;border:0;border-radius:12px;font:inherit;font-size:13px;color:var(--ink-2);
  text-align:left;cursor:pointer;transition:background .14s;
}
#bmk-dash .ov-aus button:hover{background:var(--blue-faint)}
#bmk-dash .ov-aus button:hover .kicon,#bmk-dash .ov-row:hover .kicon{color:var(--ink)}
#bmk-dash .ov-aus .satz{min-width:0}
#bmk-dash .ov-aus .satz b{display:block;font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmk-dash .ov-aus .satz span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmk-dash .ov-aus .wert{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#bmk-dash .ov-aus .pos .wert{color:#0f9c62}
#bmk-dash .ov-aus .neg .wert{color:var(--down)}

/* Kanäle im Vergleich */
/* Innenabstand so, dass Titel und Zeileninhalt genau auf der Linie
   der anderen Kacheln (22 px) stehen: 10 px Karte + 12 px Zeile */
#bmk-dash .ov > .card.ov-board{padding:20px 10px 8px}
#bmk-dash .ov-board > .card-head{padding:0 12px;margin-bottom:10px}
#bmk-dash .ov-kopf,#bmk-dash .ov-row{
  display:grid;align-items:center;gap:22px;padding-left:12px;padding-right:12px;
  grid-template-columns:minmax(200px,1.3fr) minmax(150px,1fr) minmax(170px,1.3fr)
                        minmax(115px,.85fr) minmax(115px,.85fr) 14px;
}
#bmk-dash .ov-kopf{font-size:11.5px;font-weight:500;color:var(--ink-3);padding-bottom:10px;border-bottom:1px solid var(--line)}
#bmk-dash .ov-row{
  width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;
  background:none;border:0;border-radius:16px;padding-top:18px;padding-bottom:18px;
  position:relative;transition:background .16s;
}
#bmk-dash .ov-row + .ov-row::before{
  content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--line);
}
#bmk-dash .ov-row:hover{background:var(--blue-faint)}
#bmk-dash .ov-row:hover::before,#bmk-dash .ov-row:hover + .ov-row::before{opacity:0}
#bmk-dash .ov-kanal{display:flex;align-items:center;gap:12px;min-width:0}
#bmk-dash .ov-kanal .t{min-width:0}
#bmk-dash .ov-kanal b{display:block;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmk-dash .ov-kanal small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmk-dash .ov-kanal small.warn{color:#c47f00}
#bmk-dash .ov-wert{min-width:0}
#bmk-dash .ov-wert .l{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmk-dash .ov-wert .v{display:block;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#bmk-dash .ov-lead .v{font-size:26px;letter-spacing:-.9px;line-height:1.2;transition:color .16s}
#bmk-dash .ov-row:hover .ov-lead .v{color:var(--blue)}
#bmk-dash .ov-neben .v{font-size:15px;letter-spacing:-.2px;line-height:1.4}
#bmk-dash .ov-wert .delta{margin-top:3px;font-size:11.5px;white-space:nowrap}
#bmk-dash .ov-spark{position:relative;height:46px;min-width:0}
#bmk-dash .ov-spark svg{display:block;width:100%;height:100%;overflow:visible}
#bmk-dash .ov-spark .area{fill:rgba(27,89,248,.09)}
#bmk-dash .ov-spark .line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#bmk-dash .op{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2}
#bmk-dash .op i{position:absolute;inset:3px;border-radius:50%;background:var(--card);border:2px solid var(--blue);transition:transform .16s}
#bmk-dash .op.cur i{background:var(--blue)}
#bmk-dash .op:hover{z-index:5}
#bmk-dash .op:hover i{transform:scale(1.4)}
#bmk-dash .ov-spark .kurz{position:absolute;inset:0;display:flex;align-items:center;font-size:11.5px;color:var(--ink-3)}
#bmk-dash .ov-pfeil{
  width:9px;height:9px;border-right:2px solid #c9cfdb;border-top:2px solid #c9cfdb;
  transform:rotate(45deg);transition:border-color .16s,transform .16s;
}
#bmk-dash .ov-row:hover .ov-pfeil{border-color:var(--blue);transform:translateX(3px) rotate(45deg)}
#bmk-dash .ov-leer{grid-column:2 / span 4;font-size:12px;color:var(--ink-3)}

/* ============================================================
   Zugang (Passwortabfrage vor dem Dashboard)
   Liegt als Ebene über dem Dashboard. Solange #bmk-dash die Klasse
   „gesperrt" trägt, sind Seitenleiste und Inhalt unsichtbar und
   nicht per Tastatur erreichbar.
   ============================================================ */
#bmk-dash{position:relative}
#bmk-dash.gesperrt{height:var(--dash-h);max-height:var(--dash-h);min-height:600px}
#bmk-dash.gesperrt > .side,#bmk-dash.gesperrt > .main{visibility:hidden}
#bmk-dash.oeffnet > .side,#bmk-dash.oeffnet > .main{animation:inhalt-rein .75s cubic-bezier(.2,.7,.3,1) backwards}
#bmk-dash.oeffnet > .main{animation-delay:.08s}
@keyframes inhalt-rein{from{opacity:0;filter:blur(8px);transform:scale(.985)}to{opacity:1;filter:none;transform:none}}

#bmk-dash .tor{
  position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:auto;
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(27,89,248,.13), transparent 62%),
    radial-gradient(700px 480px at -6% 108%, rgba(27,89,248,.09), transparent 60%),
    var(--bg);
}
#bmk-dash .tor.weg{animation:tor-raus .55s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes tor-raus{to{opacity:0}}
/* Liniennetz im Hintergrund — ruhig, nur als Andeutung */
#bmk-dash .tor-netz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bmk-dash .tor-netz path{fill:none;stroke:rgba(27,89,248,.10);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bmk-dash .tor-netz circle{fill:var(--bg);stroke:rgba(27,89,248,.16);stroke-width:2}
#bmk-dash .tor-netz .fahrt{stroke:rgba(27,89,248,.28);stroke-width:2.4;stroke-dasharray:36 1400;
  animation:tor-fahrt 9s linear infinite}
@keyframes tor-fahrt{from{stroke-dashoffset:1436}to{stroke-dashoffset:0}}

#bmk-dash .tor-karte{
  position:relative;width:100%;max-width:392px;background:var(--card);
  border:1px solid var(--line);border-radius:28px;padding:34px 34px 26px;
  box-shadow:0 30px 70px rgba(27,89,248,.13),0 4px 14px rgba(0,0,0,.04);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:tor-rein .6s cubic-bezier(.2,.7,.3,1) backwards;
}
@keyframes tor-rein{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
#bmk-dash .tor-karte img{display:block;width:124px;height:auto;max-height:36px;object-fit:contain;margin-bottom:26px}

#bmk-dash .tor-schloss{
  position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:var(--blue-soft);color:var(--blue);margin-bottom:18px;
  transition:background .3s,color .3s;
}
#bmk-dash .tor-schloss svg{width:26px;height:26px;overflow:visible}
#bmk-dash .tor-schloss .buegel{transform-box:view-box;transform-origin:16px 11px;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#bmk-dash .tor-schloss::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;
}

#bmk-dash .tor-karte h1{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.25;color:var(--ink)}
#bmk-dash .tor-karte .tor-text{font-size:13px;color:var(--ink-3);margin-top:6px;line-height:1.5}
#bmk-dash .tor-form{width:100%;margin-top:24px;text-align:left}
#bmk-dash .tor-label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 7px 2px}
#bmk-dash .tor-feld{position:relative}
#bmk-dash .tor-feld input{
  width:100%;height:50px;border:1.5px solid #e3e6ef;border-radius:15px;background:#fbfcfe;
  padding:0 50px 0 16px;font:inherit;font-size:15px;color:var(--ink);letter-spacing:.2px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
#bmk-dash .tor-feld input::placeholder{color:#b1b8c6;letter-spacing:0}
#bmk-dash .tor-feld input:focus{outline:none;border-color:var(--blue);background:var(--card);box-shadow:0 0 0 4px rgba(27,89,248,.12)}
#bmk-dash .tor-auge{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;
  border:0;border-radius:10px;background:none;color:var(--ink-3);cursor:pointer;
  display:grid;place-items:center;transition:background .15s,color .15s;
}
#bmk-dash .tor-auge:hover{background:#f2f4f8;color:var(--ink-2)}
#bmk-dash .tor-auge svg{width:18px;height:18px}
#bmk-dash .tor-auge .zu{display:none}
#bmk-dash .tor-auge[aria-pressed="true"] .auf{display:none}
#bmk-dash .tor-auge[aria-pressed="true"] .zu{display:block}
#bmk-dash .tor-meldung{
  min-height:20px;margin:9px 2px 0;font-size:12.5px;font-weight:500;color:var(--down);
  opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;
}
#bmk-dash .tor-meldung.an{opacity:1;transform:none}
#bmk-dash .tor-los{
  position:relative;width:100%;height:50px;margin-top:8px;border:0;border-radius:15px;
  background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;overflow:hidden;
  transition:background .3s,box-shadow .2s,transform .2s;
}
#bmk-dash .tor-los:hover{box-shadow:0 12px 26px rgba(27,89,248,.30);transform:translateY(-1px)}
#bmk-dash .tor-los:active{transform:translateY(0)}
#bmk-dash .tor-los svg{width:17px;height:17px;flex:0 0 17px}
#bmk-dash .tor-los .lade,#bmk-dash .tor-los .ok{display:none}
#bmk-dash .tor-fuss{font-size:11.5px;color:var(--ink-3);margin-top:20px}

/* Prüfen */
#bmk-dash .tor-karte.prueft .tor-los{pointer-events:none}
#bmk-dash .tor-karte.prueft .tor-los .pfeil{display:none}
#bmk-dash .tor-karte.prueft .tor-los .lade{display:block;animation:spin .8s linear infinite}

/* Falsch: Karte schüttelt, Schloss wackelt, Feld und Symbol werden rot */
#bmk-dash .tor-karte.falsch{animation:tor-schuetteln .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes tor-schuetteln{
  0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(8px)}
  45%{transform:translateX(-6px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}
}
#bmk-dash .tor-karte.falsch .tor-schloss{background:rgba(255,62,19,.10);color:var(--down)}
#bmk-dash .tor-karte.falsch .tor-schloss svg{animation:tor-wackeln .5s ease-in-out}
@keyframes tor-wackeln{20%{transform:rotate(-14deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(3deg)}}
#bmk-dash .tor-karte.falsch .tor-feld input{border-color:var(--down);box-shadow:0 0 0 4px rgba(255,62,19,.10)}

/* Richtig: Bügel springt auf, Ring pulsiert, Knopf wird grün */
#bmk-dash .tor-karte.richtig .tor-schloss{background:rgba(31,224,143,.16);color:#0f9c62}
#bmk-dash .tor-karte.richtig .tor-schloss .buegel{transform:translateY(-3px) rotate(-32deg)}
#bmk-dash .tor-karte.richtig .tor-schloss::after{animation:tor-puls .8s ease-out .15s}
@keyframes tor-puls{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
#bmk-dash .tor-karte.richtig .tor-feld input{border-color:#1fbf7a;box-shadow:0 0 0 4px rgba(31,224,143,.14)}
#bmk-dash .tor-karte.richtig .tor-los{background:#0f9c62;pointer-events:none;box-shadow:none}
#bmk-dash .tor-karte.richtig .tor-los .pfeil,#bmk-dash .tor-karte.richtig .tor-los .lade{display:none}
#bmk-dash .tor-karte.richtig .tor-los .ok{display:block}
#bmk-dash .tor-karte.richtig .tor-los .ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:tor-haken .4s ease-out .1s forwards}
@keyframes tor-haken{to{stroke-dashoffset:0}}
#bmk-dash .tor.weg .tor-karte{transition:transform .5s cubic-bezier(.4,0,.2,1);transform:translateY(-12px) scale(.97)}

@media (max-width:520px){
  #bmk-dash .tor{padding:16px}
  #bmk-dash .tor-karte{padding:28px 22px 22px;border-radius:24px}
}

/* ---------- Grid & Cards ---------- */
#bmk-dash .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}
#bmk-dash .card{
  position:relative;z-index:1;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;min-width:0;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
  transition:transform .24s cubic-bezier(.2,.7,.3,1),box-shadow .24s,border-color .24s;
}
#bmk-dash .card:hover{
  transform:translateY(-3px) scale(1.008);
  box-shadow:0 16px 34px rgba(18,28,60,.11);
  border-color:#e4e8f3;z-index:3;
}
/* Kachel-Überschriften: grau, ruhig, wie in der Referenz */
#bmk-dash .card h2{
  font-size:13.5px;font-weight:600;color:var(--ink-3)!important;letter-spacing:.1px;
  display:flex;align-items:center;gap:8px;line-height:1.35;
}
#bmk-dash .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
#bmk-dash .card-head h2{margin:0}
#bmk-dash .card-note{font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}

/* KPI */
#bmk-dash .kpi-grid{grid-column:1 / span 6;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#bmk-dash .kpi{display:flex;flex-direction:column;min-height:132px}
#bmk-dash .kpi-grid .card{box-shadow:0 5px 20px rgba(0,0,0,.05)}
/* gleiche Überschrift wie "Meistbesuchte Seiten" */
#bmk-dash .kpi h2.label{align-items:flex-start;min-height:34px}
#bmk-dash .kpi .val{
  font-size:27px;font-weight:700;letter-spacing:-1px;margin-top:2px;
  font-variant-numeric:tabular-nums;transition:color .2s;
}
#bmk-dash .kpi:hover .val{color:var(--blue)}
#bmk-dash .kpi .val small{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0}
#bmk-dash .delta{
  display:inline-flex;align-items:center;gap:6px;margin-top:auto;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
}
#bmk-dash .delta em{font-style:normal;color:var(--ink-3);font-weight:500}
#bmk-dash .delta.up{color:var(--up)}
#bmk-dash .delta.down{color:var(--down)}
#bmk-dash .delta.flat{color:var(--ink-3)}
#bmk-dash .delta .tri{font-size:9px;line-height:1}
#bmk-dash .spark{
  position:relative;height:34px;margin-top:9px;
  animation:spark-reveal .85s cubic-bezier(.3,.7,.3,1) backwards;
}
@keyframes spark-reveal{from{clip-path:inset(0 100% 0 -8px)}to{clip-path:inset(0 -8px 0 -8px)}}
#bmk-dash .kpi-spark{display:block;width:100%;height:100%;overflow:visible}
#bmk-dash .kpi-spark .area{fill:rgba(27,89,248,.10)}
#bmk-dash .kpi-spark .line{
  fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
#bmk-dash .spark .dots{position:absolute;inset:0}
#bmk-dash .sd{position:absolute;top:0;bottom:0;width:15px;transform:translateX(-50%)}
#bmk-dash .sd i{pointer-events:none}
#bmk-dash .sd i{
  position:absolute;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:var(--card);border:2px solid var(--blue);
  transition:transform .16s,background .16s;
}
#bmk-dash .sd.cur i{background:var(--blue)}
#bmk-dash .sd:hover i{transform:scale(1.35)}
#bmk-dash .sd .tip{
  position:absolute;left:50%;bottom:calc(100% + 5px);z-index:6;
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;white-space:nowrap;
  padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;
  transform:translate(-50%,4px);transition:opacity .16s,transform .16s;
}
#bmk-dash .sd:hover .tip{opacity:1;transform:translate(-50%,0)}
#bmk-dash .sd:first-child .tip{left:0;transform:translate(0,4px)}
#bmk-dash .sd:first-child:hover .tip{transform:translate(0,0)}
#bmk-dash .sd:last-child .tip{left:auto;right:0;transform:translate(0,4px)}
#bmk-dash .sd:last-child:hover .tip{transform:translate(0,0)}

/* Balkenchart */
#bmk-dash .chart{grid-column:1 / span 6}
#bmk-dash .chart .card-head{margin-bottom:12px}
#bmk-dash .segmented{display:flex;gap:2px;background:#f2f3f6;padding:3px;border-radius:9px}
#bmk-dash .segmented button{
  border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--ink-3);
  padding:5px 11px;border-radius:7px;cursor:pointer;transition:background .16s,color .16s;
}
#bmk-dash .segmented button:hover{color:var(--ink-2)}
#bmk-dash .segmented button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 2px rgba(14,21,36,.08)}
#bmk-dash .bars{display:flex;align-items:flex-end;gap:10px;height:248px;padding-top:6px}
/* Viele Balken (Tage, Stunden): enger gesetzt und flacher */
#bmk-dash .chart.full{grid-column:1 / span 12}
/* .chart steht fest in Spalte 1 — für zwei Diagramme nebeneinander
   braucht das zweite einen eigenen Startpunkt. */
#bmk-dash .chart.rechts{grid-column:7 / span 6}
#bmk-dash .bars.dense{gap:3px;height:186px}
#bmk-dash .bars.dense .bar{gap:6px}
#bmk-dash .bars.dense .track{max-width:none}
#bmk-dash .bars.dense .mlabel{font-size:9px;letter-spacing:0;text-transform:none}
#bmk-dash .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;height:100%;min-width:0}
#bmk-dash .bar .track{
  position:relative;width:100%;max-width:34px;flex:1;
  background:var(--blue-faint);border-radius:20px;display:flex;align-items:flex-end;
}
#bmk-dash .bar .fill{
  width:100%;background:linear-gradient(356deg,rgba(27,89,248,.9),rgba(27,89,248,.62));border-radius:20px;
  box-shadow:0 0 10px rgba(0,0,0,.10);
  height:0;transition:height .8s cubic-bezier(.2,.7,.3,1),filter .18s;
}
#bmk-dash .bar:hover .fill{filter:brightness(1.12) saturate(1.1)}
#bmk-dash .bar.empty .track{background:repeating-linear-gradient(135deg,#f4f5f8 0 5px,#eceef3 5px 10px)}
#bmk-dash .bar .mlabel{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.4px;text-transform:uppercase;transition:color .16s}
#bmk-dash .bar.active .mlabel{color:var(--blue)}
#bmk-dash .bar:hover .mlabel{color:var(--ink)}
#bmk-dash .bar .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;
  padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;
  transform:translate(-50%,4px);transition:opacity .16s,transform .16s;
}
#bmk-dash .bar:hover .tip{opacity:1;transform:translate(-50%,0)}

/* Ranking-Listen */
#bmk-dash .rank{grid-column:span 6}
#bmk-dash .pages-rank{grid-column:7 / span 6;grid-row:1 / span 2;display:flex;flex-direction:column}
#bmk-dash .pages-rank ol{flex:1;justify-content:space-between}
/* Rangliste rechts neben dem KPI-Raster — genauso hoch wie dessen
   sechs Kacheln zusammen, deshalb nur eine Rasterzeile hoch. */
#bmk-dash .rank.side-rank{grid-column:7 / span 6;grid-row:1;display:flex;flex-direction:column}
#bmk-dash .rank.side-rank ol{flex:1;justify-content:space-between;padding:2px 0}
#bmk-dash .split.right{grid-column:7 / span 6;display:flex;flex-direction:column}
#bmk-dash .split.right .legend{flex:1;justify-content:space-between}
#bmk-dash .detail-card.full{grid-column:1 / span 12}
#bmk-dash .rank ol{list-style:none;display:flex;flex-direction:column;gap:14px}
#bmk-dash .rank li{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline}
#bmk-dash .rank .name{
  display:flex;align-items:baseline;gap:7px;min-width:0;
  font-size:13.5px;font-weight:600;color:var(--ink);transition:color .16s;
}
#bmk-dash .rank .name .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* Technischer Firebase-Eventname als dezente Zusatzinformation in der App-Rangliste. */
#bmk-dash .rank .event-raw{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);line-height:1.35;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bmk-dash .rank .tagf{
  flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--blue);background:var(--blue-soft);padding:2px 6px;border-radius:5px;
}
#bmk-dash .rank li.sep{border-top:1px dashed #e2e5ee;padding-top:14px}
#bmk-dash .rank li.nodata .num{color:var(--ink-3)}
#bmk-dash .rank li.nodata .barline{background:repeating-linear-gradient(135deg,#f4f5f8 0 4px,#eceef3 4px 8px)}
#bmk-dash .rank li:hover .name{color:var(--blue)}
#bmk-dash .rank .num{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#bmk-dash .rank .num i{font-style:normal;font-weight:500;color:var(--ink-3);font-size:12px}
#bmk-dash .rank .barline{grid-column:1/2;height:7px;border-radius:20px;background:var(--blue-faint);overflow:hidden}
#bmk-dash .rank .barline span{
  display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,rgba(27,89,248,.62),rgba(27,89,248,.9));
  width:0;transition:width .8s cubic-bezier(.2,.7,.3,1),filter .18s;
}
#bmk-dash .rank li:hover .barline span{filter:brightness(1.1)}
#bmk-dash .rank .meta{grid-column:2/3;font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
/* Vergleichswert in der Rangliste sieht aus wie in den KPI-Kacheln */
#bmk-dash .rank .meta .delta{margin-top:0;font-size:11.5px}
#bmk-dash .rank-legend{font-size:10.5px;color:var(--ink-3);margin:-8px 0 14px}

/* Verteilung */
#bmk-dash .split{grid-column:span 4}
#bmk-dash .split.first{grid-column:1 / span 4}
#bmk-dash .split.wide{grid-column:1 / span 6}   /* halbe Breite, unter dem Diagramm */
#bmk-dash .stack{display:flex;height:11px;border-radius:20px;overflow:hidden;gap:2px;margin-bottom:18px}
#bmk-dash .stack span{transition:flex-grow .7s cubic-bezier(.2,.7,.3,1),filter .18s}
#bmk-dash .stack:hover span{filter:saturate(1.15)}
#bmk-dash .legend{display:flex;flex-direction:column;gap:11px}
#bmk-dash .legend div{
  display:flex;align-items:center;gap:9px;font-size:13px;
  border-radius:8px;padding:2px 6px;margin:-2px -6px;transition:background .16s;
}
#bmk-dash .legend div:hover{background:var(--blue-faint)}
#bmk-dash .legend .dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
#bmk-dash .legend .lname{font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bmk-dash .legend .lval{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
#bmk-dash .legend .lpct{width:42px;text-align:right;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}

/* KI-Kachel (Signature) */
#bmk-dash .ai{grid-column:span 4;background:linear-gradient(140deg,#3b6ef6 0%,#2f5be0 100%);border-color:transparent;color:#fff}
#bmk-dash .ai:hover{box-shadow:0 18px 38px rgba(27,89,248,.30);border-color:transparent}
#bmk-dash .ai h2{color:rgba(255,255,255,.82)!important}
#bmk-dash .ai .card-head{margin-bottom:0}
#bmk-dash .ai .val{font-size:34px;font-weight:700;letter-spacing:-1.2px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
#bmk-dash .ai .delta{color:#fff;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px;margin:0}
#bmk-dash .ai .delta em{color:rgba(255,255,255,.8)}
#bmk-dash .ai .srcs{display:flex;flex-direction:column;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
#bmk-dash .ai .srcs div{display:flex;font-size:12.5px;color:rgba(255,255,255,.85);transition:color .16s}
#bmk-dash .ai .srcs div:hover{color:#fff}
#bmk-dash .ai .srcs b{margin-left:auto;color:#fff;font-variant-numeric:tabular-nums}
#bmk-dash .ai .foot{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:16px;line-height:1.5}

/* Detailtabellen */
#bmk-dash .detail-card{grid-column:span 6;padding:18px 0 10px;overflow:hidden}
#bmk-dash .detail-card .card-head{padding:0 20px;margin-bottom:8px}
#bmk-dash .tablewrap{padding:0 12px;overflow-x:auto}
#bmk-dash table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
#bmk-dash th{
  text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
#bmk-dash th:first-child,#bmk-dash td:first-child{text-align:left}
#bmk-dash td{
  padding:9px 10px;border-bottom:1px solid #f5f6f9;text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .16s;
}
#bmk-dash td:first-child{font-weight:600;white-space:normal}
#bmk-dash tbody tr:last-child td{border-bottom:0}
#bmk-dash tbody tr:hover td{background:var(--blue-faint)}
#bmk-dash tbody tr td:first-child{border-radius:10px 0 0 10px}
#bmk-dash tbody tr td:last-child{border-radius:0 10px 10px 0}
#bmk-dash .cell-name{display:flex;align-items:center;gap:10px;min-width:0}
#bmk-dash .cell-name .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#bmk-dash .detail-card td:first-child{max-width:230px}
#bmk-dash .rankno{font-size:11px;font-weight:700;color:var(--ink-3);width:14px;flex:0 0 14px;text-align:right}
#bmk-dash .favchip{
  width:27px;height:27px;flex:0 0 27px;border-radius:9px;
  background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;
  transition:transform .18s,background .18s;
}
#bmk-dash tbody tr:hover .favchip{transform:scale(1.08);background:rgba(27,89,248,.16)}
#bmk-dash .cell-num{display:flex;align-items:center;justify-content:flex-end;gap:10px}
#bmk-dash .cell-num b{font-weight:700;font-size:13px}
#bmk-dash .minibar{width:64px;height:6px;flex:0 0 64px;border-radius:20px;background:var(--blue-faint);overflow:hidden}
#bmk-dash .minibar span{
  display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,rgba(27,89,248,.6),rgba(27,89,248,.92));
  width:0;transition:width .8s cubic-bezier(.2,.7,.3,1);
}
#bmk-dash .pill{
  display:inline-flex;align-items:center;justify-content:center;min-width:52px;
  padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;
  background:#f2f3f6;color:var(--ink-2);
}
#bmk-dash .pill.good{background:rgba(31,224,143,.16);color:#0f9a63}
#bmk-dash .pill.warn{background:rgba(255,62,19,.10);color:#d6390f}
#bmk-dash .pill.blue{background:var(--blue-soft);color:var(--blue)}
#bmk-dash .tfoot-note{font-size:11px;color:var(--ink-3);padding:10px 20px 2px}

/* Platzhalter-Seiten */
#bmk-dash .placeholder{
  grid-column:span 12;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:74px 30px;gap:8px;
}
#bmk-dash .placeholder:hover{transform:none;box-shadow:0 5px 20px rgba(0,0,0,.05)}
#bmk-dash .placeholder b{font-size:16px;font-weight:600}
#bmk-dash .placeholder p{font-size:13.5px;color:var(--ink-3);max-width:430px}
#bmk-dash .hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.6}

#bmk-dash :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* Auftritt der Kacheln */
@keyframes bmk-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#bmk-dash .grid > *,#bmk-dash .kpi-grid .card{
  animation:bmk-in .5s cubic-bezier(.2,.7,.3,1) backwards;
}
#bmk-dash .grid > *:nth-child(1),#bmk-dash .kpi-grid .card:nth-child(1){animation-delay:.02s}
#bmk-dash .grid > *:nth-child(2),#bmk-dash .kpi-grid .card:nth-child(2){animation-delay:.06s}
#bmk-dash .grid > *:nth-child(3),#bmk-dash .kpi-grid .card:nth-child(3){animation-delay:.10s}
#bmk-dash .grid > *:nth-child(4),#bmk-dash .kpi-grid .card:nth-child(4){animation-delay:.14s}
#bmk-dash .grid > *:nth-child(5),#bmk-dash .kpi-grid .card:nth-child(5){animation-delay:.18s}
#bmk-dash .grid > *:nth-child(6),#bmk-dash .kpi-grid .card:nth-child(6){animation-delay:.22s}
#bmk-dash .grid > *:nth-child(7){animation-delay:.26s}
#bmk-dash .grid > *:nth-child(8){animation-delay:.30s}
#bmk-dash .grid > *:nth-child(9){animation-delay:.34s}
#bmk-dash .grid > *:nth-child(10){animation-delay:.38s}

/* Responsive */
@media (max-width:1180px){
  #bmk-dash .kpi-grid{grid-column:1 / span 12}
  #bmk-dash .chart{grid-column:1 / span 12}
  #bmk-dash .chart.rechts{grid-column:1 / span 12}
  #bmk-dash .pages-rank{grid-column:1 / span 12;grid-row:auto}
  #bmk-dash .rank{grid-column:span 12}
  #bmk-dash .rank.side-rank{grid-column:1 / span 12;grid-row:auto}
  #bmk-dash .split.right{grid-column:1 / span 12}
  #bmk-dash .detail-card{grid-column:span 12}
  #bmk-dash .filters{width:65%}
  #bmk-dash .whoami > div{display:none}

  /* Übersicht: Anstieg und Datenstand nebeneinander, Niveau darunter
     zweispaltig, Tafel zweizeilig je Kanal */
  #bmk-dash .ov-oben{grid-column:span 6}
  #bmk-dash .ov-extrem{order:-2}
  #bmk-dash .ov-ring{order:-1}
  #bmk-dash .ov-niveau.ov-oben{grid-column:span 12}
  #bmk-dash .ov-niveau ul{display:grid;grid-template-columns:1fr 1fr;gap:14px 32px}
  #bmk-dash .ov-s4,#bmk-dash .ov-s8{grid-column:span 12}
  #bmk-dash .ov-kopf{display:none}
  #bmk-dash .ov-row{
    grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"kanal lead spark" "kanal k2 k3";
    row-gap:12px;
  }
  #bmk-dash .ov-kanal{grid-area:kanal}
  #bmk-dash .ov-lead{grid-area:lead}
  #bmk-dash .ov-spark{grid-area:spark}
  #bmk-dash .ov-neben.n2{grid-area:k2}
  #bmk-dash .ov-neben.n3{grid-area:k3}
  #bmk-dash .ov-pfeil{display:none}
  #bmk-dash .ov-leer{grid-column:2 / span 2}
}
@media (max-width:860px){
  #bmk-dash{flex-direction:column;height:auto;max-height:none;min-height:0}
  #bmk-dash.gesperrt{height:100vh;max-height:none;min-height:560px}
  #bmk-dash .side{width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 0}
  #bmk-dash .nav{flex-direction:row;overflow-x:auto;padding:0 14px 4px}
  #bmk-dash .navitem{white-space:nowrap}
  #bmk-dash .navitem .soon{display:none}
  #bmk-dash .side-media,#bmk-dash .side-foot{display:none}
  #bmk-dash .main{padding:20px 16px 32px;overflow:visible}
  #bmk-dash .filters{width:100%;min-width:0}
  #bmk-dash .kpi-grid{grid-template-columns:repeat(2,1fr)}
  #bmk-dash .split,#bmk-dash .split.first,#bmk-dash .split.right,#bmk-dash .ai{grid-column:span 12}
  #bmk-dash .topbar{flex-wrap:wrap}
  #bmk-dash .topbar-right{margin-left:0;flex-wrap:wrap;gap:10px}
  #bmk-dash .whoami{display:none}

  #bmk-dash .ov-oben,#bmk-dash .ov-niveau.ov-oben{grid-column:span 12}
  #bmk-dash .ov-niveau ul{display:flex}
  #bmk-dash .vl{margin-left:48px}
  #bmk-dash .vl-y{left:-48px;width:42px}
  #bmk-dash .vl-x.jeder2{display:none}
  #bmk-dash .ov-row{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"kanal kanal" "lead spark" "k2 k3";
  }
  #bmk-dash .ov-leer{grid-column:1 / span 2}
}
@media (prefers-reduced-motion:reduce){
  #bmk-dash *{transition:none!important;animation-duration:.001ms!important;animation-delay:0s!important}
  #bmk-dash .card:hover{transform:none}
}
@page{size:A4 landscape;margin:12mm}
@media print{
  #bmk-dash .tor{display:none}
  #bmk-dash{background:#fff;height:auto;max-height:none;min-height:0;display:block;
            border-radius:0;box-shadow:none;overflow:visible;font-size:11px}
  #bmk-dash .side,#bmk-dash .btn,#bmk-dash .combo-caret,#bmk-dash .whoami,
  #bmk-dash .segmented,#bmk-dash .ov-pfeil{display:none}
  #bmk-dash .main{overflow:visible;padding:0}
  #bmk-dash .topbar{border-bottom:1px solid #d5d8e0;padding-bottom:10px;margin-bottom:12px}
  #bmk-dash .topbar h1{font-size:19px}
  #bmk-dash .filters{display:flex!important;gap:18px;width:auto;margin-bottom:14px}
  #bmk-dash .combo-btn{border:0;padding:0;background:none;font-size:11px}
  #bmk-dash .card{break-inside:avoid;page-break-inside:avoid;border-color:#d5d8e0;
                  transform:none!important;box-shadow:none;animation:none!important}
  #bmk-dash .card:hover{transform:none;box-shadow:none}
  #bmk-dash .grid > *,#bmk-dash .ov > *{animation:none!important}
  #bmk-dash .ov-knopf,#bmk-dash .kwahl{display:none}
  #bmk-dash .kpi{min-height:0}
  #bmk-dash .kpi .val{font-size:20px}
  #bmk-dash .spark{height:26px}
  #bmk-dash .sd .tip,#bmk-dash .bar .tip{display:none}
  #bmk-dash .ov > .card{box-shadow:none!important;transform:none!important}
  #bmk-dash .ov-board{break-inside:auto;page-break-inside:auto}
  #bmk-dash .ov-row{break-inside:avoid;page-break-inside:avoid}
  #bmk-dash .pdf-stand{display:block!important}
}
#bmk-dash .pdf-stand{display:none;font-size:10.5px;color:var(--ink-3);margin-top:6px}
/* ============================================================
   Export-Dialog. Liegt bewusst am <body> und nicht in #bmk-dash,
   weil das Dashboard overflow:hidden und runde Ecken hat. Deshalb
   eigene Variablen statt der Kaskade von oben.
   ============================================================ */
#bmk-export{
  --blue:#1b59f8;
  --blue-soft:rgba(27,89,248,.10);
  --blue-faint:#f2f7ff;
  --ink:#151e23;
  --ink-2:#4d4d4d;
  --ink-3:#838383;
  --line:#eff0f6;
  --card:#ffffff;
  --down:#ff3e13;
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(16,22,38,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.45;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  animation:bmk-ex-fade .16s ease;
}
#bmk-export *{box-sizing:border-box;margin:0;padding:0}
#bmk-export .sheet{
  width:100%;max-width:480px;max-height:88vh;
  display:flex;flex-direction:column;
  background:var(--card);border-radius:26px;
  box-shadow:0 30px 80px rgba(10,18,40,.32);
  padding:26px 26px 20px;
  animation:bmk-ex-in .22s cubic-bezier(.2,.7,.3,1);
}
#bmk-export h2{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.25;color:var(--ink)}
#bmk-export .lead{font-size:13px;color:var(--ink-3);margin-top:5px}
#bmk-export .body{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px}
#bmk-export .body::-webkit-scrollbar{width:8px}
#bmk-export .body::-webkit-scrollbar-thumb{background:#e2e5ee;border-radius:20px}
#bmk-export .seclabel{
  display:flex;align-items:center;margin:20px 0 7px;
  font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);
}
#bmk-export .toggle{
  margin-left:auto;border:0;background:none;font:inherit;font-size:11.5px;font-weight:600;
  letter-spacing:0;text-transform:none;color:var(--blue);cursor:pointer;
  padding:3px 7px;border-radius:7px;transition:background .14s;
}
#bmk-export .toggle:hover{background:var(--blue-faint)}
#bmk-export .opt{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  padding:12px 13px;border:1px solid transparent;border-radius:15px;cursor:pointer;
  transition:background .14s,border-color .14s;
}
#bmk-export .opt + .opt{margin-top:4px}
#bmk-export .opt:hover{background:#f5f6f9}
#bmk-export .opt.sel{background:var(--blue-faint);border-color:rgba(27,89,248,.18)}
#bmk-export .opt.off{cursor:default;opacity:.5}
#bmk-export .opt.off:hover{background:none}
#bmk-export .opt input{position:absolute;opacity:0;width:1px;height:1px}
#bmk-export .box{
  width:21px;height:21px;border-radius:7px;border:1.8px solid #d3d7e3;background:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:background .14s,border-color .14s;
}
#bmk-export .box svg{width:13px;height:13px;opacity:0;transform:scale(.6);transition:opacity .14s,transform .14s}
#bmk-export .opt.sel .box{background:var(--blue);border-color:var(--blue)}
#bmk-export .opt.sel .box svg{opacity:1;transform:none}
#bmk-export .opt input:focus-visible + .box{outline:2px solid var(--blue);outline-offset:2px}
#bmk-export .txt b{display:block;font-size:14px;font-weight:600;line-height:1.3;color:var(--ink)}
#bmk-export .txt span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
#bmk-export .tag{
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
  color:var(--ink-3);background:#f0f1f4;padding:3px 7px;border-radius:6px;
}
#bmk-export .tag.on{color:var(--blue);background:var(--blue-soft)}
#bmk-export .seg{display:flex;gap:2px;background:#f2f3f6;padding:3px;border-radius:11px}
#bmk-export .seg button{
  flex:1;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-3);
  padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .16s,color .16s;
}
#bmk-export .seg button:hover{color:var(--ink-2)}
#bmk-export .seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 2px rgba(14,21,36,.08)}
#bmk-export .note{font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.5}
#bmk-export .note.err{color:var(--down);font-weight:500}
#bmk-export .foot{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
}
#bmk-export .foot .grow{margin-left:auto}
#bmk-export .abtn{
  display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  cursor:pointer;transition:border-color .16s,color .16s,transform .16s,box-shadow .16s;
}

<script>
(function(){
"use strict";

/* ============================================================
   0. GRUNDLAGEN
   Formatierung, kleine Helfer, gemeinsame Bausteine. Alles, was
   mehr als ein Kanal braucht, steht hier — und nur hier.
   ============================================================ */

const MONTH_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

const nf = new Intl.NumberFormat("de-DE");
const fmt = n => nf.format(Math.round(n));
/* Prozente auf ganze Zahl, sofern ohnehin (fast) ganzzahlig — sonst
   eine Nachkommastelle. Bounce-Rate 63 bleibt „63 %“, Öffnungsrate
   29,14 wird „29,1 %“. */
const pct = n => (Math.abs(n - Math.round(n)) < 0.05
                    ? nf.format(Math.round(n))
                    : nf.format(Math.round(n * 10) / 10)) + " %";
const dur = s => { s = Math.round(s); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0") + " min"; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec1 = n => nf.format(Math.round(n*10)/10);

/* Datenmenge in MB, ab 1024 MB in GB — sonst stehen fünfstellige
   Megabyte in der Kachel. */
const mb = n => (n >= 1024 ? dec1(n/1024) + " GB" : nf.format(Math.round(n)) + " MB");
const FORMATTERS = {num:fmt, pct:pct, dur:dur, dec:function(n){ return dec1(n); }, mb:mb};

/* Math.max(...[]) liefert -Infinity und ist wahr - deshalb ein eigener Helfer,
   der bei leeren Listen zuverlaessig 1 zurueckgibt (Divisionen bleiben heil). */
function maxOf(werte){
  let m = 0;
  (werte||[]).forEach(function(v){ if(isFinite(v) && v > m) m = v; });
  return m > 0 ? m : 1;
}
const anteil = (teil, ganzes) => (ganzes > 0 ? Math.round(teil / ganzes * 100) : 0);
const hatWert = v => v !== null && v !== undefined && isFinite(v);

function prevKey(key, mode){
  if(!key) return null;
  const [y,m] = key.split("-").map(Number);
  if(mode === "year") return (y-1) + "-" + String(m).padStart(2,"0");
  const d = m === 1 ? [y-1,12] : [y,m-1];
  return d[0] + "-" + String(d[1]).padStart(2,"0");
}
/* „2026-08“ um n Monate zurück */
function monatMinus(key, n){
  const d = new Date(+key.slice(0,4), +key.slice(5,7) - 1 - n, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0");
}

/* „2026-07“ → „Juli 2026“. Einheitlich für alle Kanäle. */
function monatsName(key){
  if(!key) return "—";
  return new Date(key + "-01T12:00:00").toLocaleDateString("de-DE", {month:"long", year:"numeric"});
}
/* „2026-07“ → „Jul 2026“ für enge Stellen */
function kurzMonat(key){
  if(!key) return "—";
  return MONTH_SHORT[+key.slice(5,7) - 1] + " " + key.slice(0,4);
}
function uhrzeit(zeit){
  return new Date(zeit || Date.now()).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) + " Uhr";
}

/* Kennzahlen, bei denen ein niedrigerer Wert das bessere Ergebnis ist */
const LOWER_IS_BETTER = new Set(["bounce","bounceRate","uninstalls","unsubscribes",
                                 "unsubscribeRate","crashes","spam","spamRate"]);

function deltaHTML(key, now, before, compareLabel){
  if(!hatWert(before) || before === 0 || !hatWert(now)){
    return '<span class="delta flat"><em>Kein Vergleichswert</em></span>';
  }
  const diff = ((now - before) / before) * 100;
  const rounded = Math.round(diff * 10) / 10;
  if(Math.abs(rounded) < 0.05){
    return '<span class="delta flat"><em>unverändert vs. ' + esc(compareLabel) + '</em></span>';
  }
  const rising = rounded > 0;
  const good = LOWER_IS_BETTER.has(key) ? !rising : rising;
  const cls = good ? "up" : "down";
  const tri = rising ? "▲" : "▼";
  const val = nf.format(Math.abs(rounded)) + " %";
  return '<span class="delta ' + cls + '"><span class="tri">' + tri + '</span>' + val +
         ' <em>vs. ' + esc(compareLabel) + '</em></span>';
}

/* Zahlen zählen beim Aufbau hoch */
function countUp(el){
  const target = parseFloat(el.dataset.count);
  const out = FORMATTERS[el.dataset.kind || "num"] || fmt;
  if(!isFinite(target)) return;
  if(REDUCED){ el.textContent = out(target); return; }
  const span = 800, t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t - t0) / span);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = out(target * eased);
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = out(target);
  }
  el.textContent = out(0);
  requestAnimationFrame(step);
}

/* Ruhige Ansicht, wenn ein Kanal (noch) keine Daten hat. */
function leerHinweis(titel, text){
  return '<div class="grid"><div class="card placeholder">' +
    '<b>' + esc(titel) + '</b><p>' + esc(text) + '</p></div></div>';
}
/* Ruhige Ersatzkachel, wenn ein Bericht einen einzelnen Abschnitt nicht enthält. */
function leereKachel(klasse, titel, text){
  return '<div class="card ' + klasse + '">' +
    '<div class="card-head"><h2>' + esc(titel) + '</h2><span class="card-note">ohne Daten</span></div>' +
    '<p class="hint" style="margin-top:2px">' + esc(text) + '</p></div>';
}

/* ============================================================
   1. ZUSTAND UND KANAL-REGISTER

   Die Shell (Filter, Statuszeile, Aktualisieren, Export, Cache)
   kennt keinen Kanal namentlich. Jeder Kanal trägt sich unten in
   KANAELE ein und liefert dabei alles mit, was die Shell braucht:
   wo seine Daten liegen, wie er sich zeichnet, wie er lädt und wie
   er sich für den Zwischenspeicher verpackt.

   Ein neuer Kanal braucht deshalb genau einen Block wie die drei
   unten — an der Shell ist nichts zu ändern.
   ============================================================ */
const state = {
  view: "overview",
  month: null,          /* bus-und-bahn.de */
  monthApp: null,       /* DSW21-App */
  monthNews: null,      /* Newsletter */
  monthNetz: null,      /* Interaktiver Liniennetzplan */
  monthWlan: null,      /* Bus-WLAN */
  monthChat: null,      /* Chatbot */
  compare: {},          /* je Kanal die gewählte Vergleichsart */
  chartMetric: "visits",
  chartMetricApp: "activeUsers",
  chartMetricNews: "recipients",
  chartMetricNetz: "visits",
  chartMetricWlan: "sessions",
  chartMetricChat: "anfragen",
  ovKanal: null,        /* Übersicht: Kanal im Jahresvergleich */
  ovMetrik: null        /* Übersicht: Kennzahl im Jahresvergleich */
};

const KANAELE = {};
const kanalIds = () => Object.keys(KANAELE);
/* Reihenfolge wie in der Seitenleiste */
const KANAL_ORDNUNG = ["web","app","news","netz","wlan","chat"];
function kanalListe(){
  const ids = kanalIds();
  return KANAL_ORDNUNG.filter(function(id){ return ids.indexOf(id) > -1; })
    .concat(ids.filter(function(id){ return KANAL_ORDNUNG.indexOf(id) === -1; }));
}
function kanal(id){ return KANAELE[id || state.view] || null; }
function kanalInfo(){ return kanal(state.view); }
function datensatz(id){ const k = kanal(id); return k ? k.daten() : {}; }
function ordnung(id){ const k = kanal(id); return k ? k.ordnung() : []; }
function aktMonat(id){ const k = kanal(id); return k ? state[k.monatFeld] : null; }
function setzeMonat(v){ const k = kanalInfo(); if(k) state[k.monatFeld] = v; }

/* Nach jedem Laden: gewählten Monat prüfen und notfalls auf den
   jüngsten vorhandenen setzen. */
function monatPruefen(id){
  const k = kanal(id);
  if(!k) return;
  const d = k.daten(), ord = k.ordnung();
  if(!state[k.monatFeld] || !d[state[k.monatFeld]]) state[k.monatFeld] = ord[ord.length-1] || null;
}

/* Vergleichsmonat — welche Vergleiche es gibt, sagt der Kanal. Für
   Website und App ist das der Vor- bzw. Vorjahresmonat; ein Newsletter
   geht unregelmäßig raus, dort ist der vorherige Versand gemeint. Die
   Auswahl wird je Kanal gemerkt. */
const STANDARD_VERGLEICH = [
  {v:"prev", t:"Vormonat",        kurz:"Vormonat"},
  {v:"year", t:"Vorjahresmonat",  kurz:"Vorjahr"},
  {v:"none", t:"Kein Vergleich",  kurz:""}
];
function vergleichArten(id){
  const k = kanal(id);
  return (k && k.vergleichArten) || STANDARD_VERGLEICH;
}
function vergleichArt(id){
  const arten = vergleichArten(id);
  return arten.find(a => a.v === state.compare[id]) || arten[0];
}
function vergleich(id){
  const k = kanal(id), d = k.daten(), monat = state[k.monatFeld];
  const art = vergleichArt(id);
  let cmp = null;
  if(art.v !== "none"){
    const key = k.vergleichsMonat ? k.vergleichsMonat(monat, art.v) : prevKey(monat, art.v);
    cmp = (key && d[key]) || null;
  }
  return {cmp: cmp, label: k.vergleichLabel ? k.vergleichLabel(cmp, art) : art.kurz};
}

/* ============================================================
   2. ZWISCHENSPEICHER (localStorage)

   Einmal gelesene Kennzahlen bleiben im Browser liegen. F5 zeigt
   sie sofort wieder an, ohne den fileadmin-Ordner erneut zu lesen.
   Neu geladen wird in drei Fällen:
     · Klick auf „Aktualisieren"
     · harter Neuladen (Strg+F5) oder geleerter Browsercache
     · abgelaufener Zwischenspeicher (SPEICHER.frist)
   Im Code selbst steht weiterhin kein einziger Monatswert.
   ============================================================ */
const SPEICHER = {
  schluessel: "bmk-kennzahlen",
  version: 4,                        /* hochzählen, wenn sich die Datenstruktur ändert */
  frist: 12 * 60 * 60 * 1000         /* nach einem halben Tag wird ohnehin neu gelesen */
};

/* localStorage ist im privaten Modus mancher Browser gesperrt —
   dann läuft das Dashboard ohne Zwischenspeicher weiter. */
const LS = (function(){
  try{
    const s = window.localStorage;
    s.setItem(SPEICHER.schluessel + ".test", "1");
    s.removeItem(SPEICHER.schluessel + ".test");
    return s;
  }catch(e){ return null; }
})();
const cacheName = id => SPEICHER.schluessel + "." + id;

function cacheLesen(id){
  if(!LS) return null;
  try{
    const roh = LS.getItem(cacheName(id));
    if(!roh) return null;
    const obj = JSON.parse(roh);
    if(!obj || obj.v !== SPEICHER.version) return null;
    if(!obj.t || Date.now() - obj.t > SPEICHER.frist) return null;
    return obj;
  }catch(e){ return null; }
}
function cacheSchreiben(id){
  if(!LS) return;
  const k = kanal(id);
  if(!k || !k.packen) return;
  try{
    LS.setItem(cacheName(id), JSON.stringify({v:SPEICHER.version, t:Date.now(), inhalt:k.packen()}));
  }catch(e){
    /* Speicher voll: lieber ohne Zwischenspeicher weiterlaufen als
       mit einem halb geschriebenen Eintrag. */
    try{ LS.removeItem(cacheName(id)); }catch(e2){}
  }
}
function cacheLeeren(){
  if(!LS) return;

/* Strg+F5 lässt sich nicht direkt abfragen. Der Unterschied ist aber
   messbar: Beim normalen F5 holt der Browser Bilder und Skripte aus
   seinem Cache (transferSize 0), beim harten Neuladen überträgt er
   alles neu. Geprüft wird erst nach dem load-Ereignis, weil vorher
   noch keine Messwerte vorliegen. Im Zweifel gilt: kein hartes
   Neuladen — die Daten kommen dann aus dem Zwischenspeicher und der
   Knopf „Aktualisieren" bleibt der verlässliche Weg. */
function hartNeuGeladen(){
  try{
    const nav = (performance.getEntriesByType("navigation") || [])[0];
    if(!nav || nav.type !== "reload") return false;
    const eigene = performance.getEntriesByType("resource").filter(function(r){
      return r.name.indexOf(location.origin) === 0 &&
             ["img","link","script","css"].indexOf(r.initiatorType) > -1;
    });
    if(!eigene.length) return false;
    return eigene.every(function(r){ return r.transferSize > 0; });
  }catch(e){ return false; }
}
function nachDemLaden(fn){
  const spaeter = function(){ setTimeout(fn, 300); };
  if(document.readyState === "complete") spaeter();
  else window.addEventListener("load", spaeter, {once:true});
}

const COMBOS = [];

function createCombo(host, cfg){
  host.className = "combo";
  host.innerHTML =
    '<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="combo-label">' + esc(cfg.label) + '</span>' +
      '<span class="combo-val"></span>' +
      '<span class="combo-caret" aria-hidden="true"></span>' +
    '</button>' +
    '<div class="combo-panel" role="listbox" aria-label="' + esc(cfg.label) + '" hidden></div>';

  const btn   = host.querySelector(".combo-btn");
  const panel = host.querySelector(".combo-panel");
  const valEl = host.querySelector(".combo-val");
  let value = cfg.value;

  function paint(){
    /* Ohne Daten gibt es keine Optionen — dann bleibt das Feld leer,
       statt beim Zugriff auf den ersten Eintrag abzustürzen. */
    const sel = cfg.options.find(o => o.v === value) || cfg.options[0];
    valEl.textContent = sel ? sel.t : "—";
    panel.innerHTML = cfg.options.map(o =>
      '<button type="button" class="combo-opt" role="option" data-v="' + esc(o.v) + '" ' +
      'aria-selected="' + (o.v === value) + '">' + esc(o.t) + '</button>').join("");
  }
  function close(){
    host.classList.remove("open");
    panel.hidden = true;
    btn.setAttribute("aria-expanded","false");
  }
  function open(){
    closeAllCombos();
    host.classList.add("open");
    panel.hidden = false;
    btn.setAttribute("aria-expanded","true");
  }

  btn.addEventListener("click", e => {
    e.stopPropagation();
    host.classList.contains("open") ? close() : open();
  });
  panel.addEventListener("click", e => {
    e.stopPropagation();
    const opt = e.target.closest(".combo-opt");
    if(!opt) return;
    value = opt.dataset.v;
    paint();
    close();
    btn.focus();
    cfg.onChange(value);
  });

  paint();
  close();
  const api = {
    close: close,
    setOptions: function(options, newValue){
      cfg.options = options || [];
      if(newValue !== undefined) value = newValue;
      /* Leere Liste ist erlaubt: dann steht „—" im Feld. */
      if(cfg.options.length && !cfg.options.some(o => o.v === value)) value = cfg.options[0].v;
      paint();
    }
  };
  COMBOS.push(api);
  return api;
}
